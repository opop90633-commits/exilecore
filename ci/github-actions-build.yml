# 每次 push 或 pull request 都自動建置並跑單元測試，產出的 jar 放在 Actions 的 Artifacts。
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: 設定 Gradle（含快取）
        uses: gradle/actions/setup-gradle@v4

      - name: 建置與測試
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: 上傳插件 jar
        uses: actions/upload-artifact@v4
        with:
          name: ExileCore
          path: build/libs/*.jar
