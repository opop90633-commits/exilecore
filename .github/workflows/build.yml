# 每次 push 或 pull request 都自動建置並跑單元測試，產出的 jar 放在 Actions 的 Artifacts。
# 2026-10：push 到 main、而且建置與測試都過了 → 自動把 jar 上傳到伺服器的 plugins/（不重開：下次重啟時生效，
#   例如管理網頁設的每天定時重啟）。連線資訊放在 GitHub 的 Secrets（Settings → Secrets and variables → Actions）：
#     DEPLOY_SFTP_HOST、DEPLOY_SFTP_PORT、DEPLOY_SFTP_USER、DEPLOY_SFTP_PASSWORD
#   沒設 DEPLOY_SFTP_HOST 的話上傳那一步會跳過（照舊只建置）。
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: 設定 Gradle（含快取）
        uses: gradle/actions/setup-gradle@v4

      - name: 建置與測試
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: 上傳插件 jar
        uses: actions/upload-artifact@v4
        with:
          name: ExileCore
          path: build/libs/*.jar

  deploy:
    # 只有 main 的 push（不含 pull request），而且上面的建置與測試都過了才上傳。
    # 2026-10：主機商擋國外連線（GitHub 的機器在美國，SFTP 連不上），所以這一步改在站長自己的電腦上跑
    #   （self-hosted runner：GitHub → Settings → Actions → Runners 加的那台）。電腦沒開時會排隊，開機後自動補上傳。
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    concurrency: deploy   # 連續 push 時一次只上傳一個，照順序
    env:
      PYTHONUTF8: "1"   # Windows 主控台預設 Big5：deploy.py 印的「▶」這類字會出錯
      DEPLOY_SFTP_HOST: ${{ secrets.DEPLOY_SFTP_HOST }}
      DEPLOY_SFTP_PORT: ${{ secrets.DEPLOY_SFTP_PORT }}
      DEPLOY_SFTP_USER: ${{ secrets.DEPLOY_SFTP_USER }}
      DEPLOY_SFTP_PASSWORD: ${{ secrets.DEPLOY_SFTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: 拿建置好的 jar
        uses: actions/download-artifact@v4
        with:
          name: ExileCore
          path: build/libs

      # 自己裝一份 Python 給上傳用（Windows 服務用系統帳號跑，看不到只裝在使用者帳號底下的 Python）
      - name: 準備 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 準備 paramiko
        run: |
          python --version
          python -m pip install --quiet paramiko

      - name: 寫連線設定（用 Secrets，不印出來）
        if: env.DEPLOY_SFTP_HOST != ''
        shell: python
        run: |
          import json, os
          config = {
              "sftp_host": os.environ["DEPLOY_SFTP_HOST"],
              "sftp_port": int(os.environ.get("DEPLOY_SFTP_PORT") or 22),
              "sftp_user": os.environ["DEPLOY_SFTP_USER"],
              "sftp_password": os.environ["DEPLOY_SFTP_PASSWORD"],
              "remote_plugins": "plugins",
          }
          with open(os.path.join("tools", "deploy.local.json"), "w", encoding="utf-8") as f:
              json.dump(config, f)

      - name: 上傳到伺服器（下次重啟生效）
        if: env.DEPLOY_SFTP_HOST != ''
        run: python tools/deploy.py --no-build --no-restart

      # 2026-10：清掉連線設定不靠 Python（前面裝 Python 失敗時這一步也要能跑，不然只會看到「python: command not found」，看不到真正的錯）
      - name: 刪掉連線設定（Windows）
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: Remove-Item -Force -ErrorAction SilentlyContinue tools\deploy.local.json

      - name: 刪掉連線設定（Linux、macOS）
        if: always() && runner.os != 'Windows'
        shell: bash
        run: rm -f tools/deploy.local.json

      - name: 沒設 Secrets：跳過上傳
        if: env.DEPLOY_SFTP_HOST == ''
        run: echo "沒有設定 DEPLOY_SFTP_HOST，只建置、不上傳（見 build.yml 開頭的說明）"
