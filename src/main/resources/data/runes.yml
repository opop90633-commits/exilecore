# 符文（2026-10，照 PoE2 的符文）：currencies.yml 裡 operation: RUNE 的通貨用在裝備上，嵌進一個空的符文孔。
# 符文孔：雙手武器 2、單手武器 1、胸甲 2、頭盔／褲子／鞋子／副手 1；飾品、地圖、珠寶沒有。孔滿了可以選一顆覆蓋（被換掉的會消失）。
# weapon：嵌在武器上的加成（local.physical／附加傷害這類本地的改武器自己的數值，跟詞綴一樣算進武器面板）；
# caster：嵌在法杖類（法杖、長杖、權杖）上的加成（沒寫照 weapon）；armour：嵌在防具、副手上的加成（護甲／閃避／能量護盾的增加是那件本地的）。
# 每條寫 text（顯示的字）與修飾器（寫法跟詞綴的 mods 一樣，數值固定；好幾個寫 mods: [ … ]）。level：需求等級（原作的 Requires Level，也是掉落等級）。
# 改完重新啟動或 /ec reload。
#
# 2026-10-26 照 PoE2 0.5：13 個家族 × 4 階（次級、普通 15 級、高階 30 級、完美 50 級）× 3 類（武器、法杖類、護甲），數值照原作。
#   原有 6 種的代號保留，換成對應家族的普通階：iron → 鐵（Iron）、ember → 沙漠（Desert）、frost → 冰川（Glacial）、
#   storm → 風暴（Storm）、mind → 心智（Mind）、swift → 精巧（Adept，+敏捷）。
#   這次之前：鐵骨 武器增加 15% 物理傷害／防具 +25 最大生命；焰紋、霜紋、雷紋 物理傷害 10% 額外附加為元素／防具 +12% 抗性；
#   慧光 增加 15% 法術傷害／+20 最大魔力；疾風 增加 6% 攻擊速度／+10 敏捷（只有武器、防具兩類）。
#   深淵之眼（Abyssal Eye）還沒做。2026-11-04：魂核（Soul Core，魂核符文・…）、偶像（Idol，魔偶符文・…）做了，在檔尾；
#     部位專屬寫 slots（head／chest／legs／feet／shield／buckler／focus／sceptre），martial_only 只能嵌軍用武器，limit 一個角色僅限幾顆。

runes:
  iron_lesser:   # Lesser Iron Rune
    name: 次級鐵骨符文
    level: 5
    weapon:
      - { text: "增加 14% 物理傷害", stat: local.physical, type: INCREASED, value: 14 }
    caster:
      - { text: "增加 20% 法術傷害", stat: damage, type: INCREASED, value: 20, tags: [spell] }
    armour:
      - { text: "增加 14% 護甲、閃避與能量護盾", mods: [ { stat: armour, type: INCREASED, value: 14 }, { stat: evasion, type: INCREASED, value: 14 }, { stat: es.max, type: INCREASED, value: 14 } ] }
    bonded:   # 2026-10-27 照 PoE2 0.5（RePoE augments.json 的 bonded_stats）：羈絆詞綴，只有昇華・聖賢智慧才有效果；法杖類的羈絆（法術暴擊時照物理傷害的 12% 破甲）還沒有這個機制，沒寫
      weapon:
        - { text: "增加 20% 完全破甲的效果", stat: armour.break_effect, type: INCREASED, value: 20 }
      armour:
        - { text: "+20 最大生命、+20 最大魔力", mods: [ { stat: life.max, type: FLAT, value: 20 }, { stat: mana.max, type: FLAT, value: 20 } ] }
