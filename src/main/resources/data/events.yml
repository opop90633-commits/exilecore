# 每月活動（沒有賽季重置的替代：每個月換一個主題，地圖跟著變，加上一組每月挑戰與限定稱號）。改完 /ec reload。
#
# 主題照月份輪替：1 月用第 1 個、2 月用第 2 個…（不夠 12 個就循環）。settings.force 可以指定（測試用）。
# 主題對地圖的影響（只在地圖世界；劇情區域、回響、試煉不變）：
#   quantity、rarity  地圖裡的怪物多掉幾 % 物品數量、稀有度（加在地圖本身的加成上）
#   rare_mod          地圖裡的稀有怪一定多一條這個詞綴（monsters.yml 的 mods；打倒這種怪算「主題擊殺」）
#   event_boost       地圖事件的權重加成（shrine、strongbox、breach、exile；數字直接加在 map_events.yml 的 weights 上）
#   ritual_chance、delirium_chance  這個月祭壇、幻霧出現的機率（不寫照 map_events.yml）
# 每月挑戰（整個帳號共用，哪個角色做都算；每月 1 日 0 點換新的，上個月沒做完的就沒了）：
#   kind   kill 擊殺、rare 擊殺稀有以上、boss 打倒 Boss（區域、地圖、回響、試煉都算）、maps 完成地圖、
#          events 完成地圖事件（開寶箱、碰神龕、打完裂隙、殺流寇、做完祭壇、幻霧結束）、themed 打倒帶 rare_mod 的稀有怪
#   count  要幾次；merits 完成給的功勳
#          2026-10：次數 ×4（以前擊殺 3000、稀有 150、主題 40、Boss 30、地圖 40、事件 60）——伺服器的紀錄裡常玩的人
#          進服兩天就全部做完；現在常玩的人大約一週、一般玩家兩三週。這個月已經做完的挑戰、拿到的稱號都不受影響
#   只算怪物（地圖）等級 ≥ 角色等級 − bounties.yml 的 level_gap 的（不能回新手區刷；84 級以上的角色當作 84 級）。
#   不算的時候會在聊天欄說明，/event 的「最近一次擊殺」也寫著；畫面右邊的任務追蹤有進度，標題最後的 Lv.74+ 是現在的下限
# 全部挑戰完成：給 title（限定稱號，只有這個月拿得到，拿到就是永久的；在軍需官那裡換著戴）與 bonus_merits。
#   title.stats：稱號的永久加成（擁有就有、不用戴，帳號裡每個角色都有；寫法跟 bounties.yml 的 shop.titles 一樣）

settings:
  enabled: true
  force: ""                  # 指定主題代號（測試用；空的照月份）
  announce: true             # 月初換主題時全服廣播；登入時提醒

