# 地圖事件（照 PoE 的 Shrine、Strongbox、Breach、Rogue Exile：神龕、寶箱、裂隙、流寇）：每張地圖開出來時隨機放幾個在普通房間的中央，走近才會現身。
# 改完 /ec reload：之後開的地圖照新的（已經開著的不變）。終局、每週回響、昇華試煉這些特別的實例不放事件。
#
# 四種事件：
#   shrine     神龕：地上一座發光的石柱，旁邊一群守衛。碰到它，附近 12 格內的人一起拿 duration 秒的增益（哪一種照石柱上寫的）。
#   strongbox  寶箱：點開會跳出一群怪（照這張圖的魔法／稀有群比例），殺光才打開；radius 格內的每個人各拿自己那份。
#   breach     裂隙：踩進去就打開，duration 秒內每 wave_seconds 秒從越來越大的邊緣湧出一波怪；裂隙的怪物品數量 +quantity_bonus%。
#   exile      流寇：穿著整套裝備的稀有怪，招式像 Boss（mods 裡的招式詞綴），生命是同等稀有怪的 life 倍；殺了照稀有怪掉，另外多掉 drops 件稀有裝備。
# 2026-10-18 新增兩種：
#   abyss      深淵裂縫：走近時地上裂開一條縫往地圖裡延伸，每段湧怪；有人跟著才繼續，沒人跟就合上（沒獎勵）；盡頭一隻小 Boss＋一個深淵寶箱。
#   safe       地圖保險箱：鐵塊、鐵門、箱子的小結構，一直都在；右鍵（身上要有劫盜合約：通貨袋、背包、倉庫都算），吃掉一張開始開鎖，開鎖時一波一波湧怪。
#              不在 weights 裡、不佔 per_map：每張地圖照 settings.safe_chance 另外放，最多一個。沒有專屬傳奇、沒有入場券。
#
# 機制的招牌通貨（照 PoE2，定義在 currencies.yml）：寶箱掉星魄（保證詞綴的改造）、裂隙的怪掉催化劑（飾品品質＝某一類詞綴的加成）、
# 流寇掉星籤（改下一顆通貨的規則）；祭壇的獎勵也以星籤為主、幻霧掉蒸餾情緒（注入項鍊）。
# 每種事件各有自己的專屬傳奇（uniques.yml 的 sources 寫 shrine、strongbox、breach、exile、ritual、delirium；2026-10-18 ＋abyss，保險箱沒有）：
#   神龕、寶箱、裂隙、流寇照各自的 unique_chance（1%，每個有份的人各擲一次：碰到神龕的人、開箱時在旁邊的人、
#   裂隙關上時在 30 格內的人、流寇有份的人）；祭壇與幻霧是獎勵裡的「傳奇」那一種（reward_weights 的 unique）。
#   2026-10：2% → 1%、祭壇與幻霧的 unique 權重 2 → 1（星圖天賦的「+50%」也改 +25%）。伺服器的紀錄裡事件專屬佔了新傳奇的一半，
#   點了寶箱天賦的人一天拿到 8 件千鎖；常見的傳奇重複得太快。
#
# 另外兩個 PoE2 的機制（最下面的 ritual、delirium）：跟上面的事件可以同時出現，各自照 chance 決定這張圖有沒有。
#
# 2026-10-18：事件巔峰的入場券——每種事件（保險箱除外）的 ticket: { currency, chance }：完成事件時「有份的人」（跟 unique_chance 同一群人）
#   各擲一次 chance 掉一張 currency（currencies.yml 的 ticket_*）；固定機率，不吃稀有度、星圖天賦、每月加成。
#   一張券在地圖裝置的「事件巔峰」開那隻 Boss 一次（maps.yml finals 底下 pinnacle.ticket）。沒寫照預設 ticket_<事件> 2%；chance 0 = 不掉。
#   2026-10-20：照事件出現的頻率調，7 種都約 60 張圖掉 1 張（神龕、寶匣 2.2%，裂隙、深淵 4.4%，祭壇、幻霧 5.6%，流寇 6.7%）；
#   以前全部 2%，流寇的券比神龕難拿 3 倍。

settings:
  per_map: [2, 3]                  # 每張地圖放幾個事件（最多一個房間一個，起點與 Boss 房不放）
  weights: { shrine: 30, strongbox: 30, breach: 15, exile: 10, abyss: 15 }   # 2026-10-18：35/35/15/15 → 30/30/15/10，＋深淵裂縫 15（總和還是 100）
  approach: 20                     # 玩家幾格內事件現身（守衛、流寇、深淵裂縫刷出來；寶箱、裂隙、保險箱一直都在）
  safe_chance: 0.35                # 2026-10-18：每張地圖有保險箱的機率（per_map 之外另外算，一張圖最多一個）

shrine:
  duration: 40                     # 增益幾秒
  guards: [3, 5]                   # 守衛幾隻（照地圖的怪物種類，一隻魔法怪帶一群普通怪）
  reach: 12                        # 啟動時幾格內的人一起拿
  unique_chance: 0.01              # 拿到增益的人各擲一次：掉神龕的專屬傳奇
  ticket: { currency: ticket_shrine, chance: 0.022 }       # 2026-10-18：事件巔峰的入場券（同一群人各擲一次；固定機率、不吃加成）
  # 種類：name 顯示名稱、color 顏色、mods 增益（stat 屬性鍵、type FLAT／INCREASED／MORE、value 數值；INCREASED／MORE 是百分比）
  kinds:
    acceleration:
      name: 疾速神龕
      color: "#7fd4ff"
      mods:
        - { stat: movement.speed, type: INCREASED, value: 30 }
        - { stat: attack.speed, type: INCREASED, value: 30 }
        - { stat: cast.speed, type: INCREASED, value: 30 }
    brutal:
      name: 兇猛神龕
      color: "#ff7070"
      mods:
        - { stat: damage, type: INCREASED, value: 40 }
    diamond:
      name: 金剛神龕
      color: "#9fe8c8"
      mods:
        - { stat: armour, type: INCREASED, value: 80 }
        - { stat: evasion, type: INCREASED, value: 80 }
        - { stat: es.max, type: INCREASED, value: 30 }
    regeneration:
      name: 再生神龕
      color: "#7fe07f"
      mods:
        - { stat: life.regen_percent, type: FLAT, value: 3 }
    lucky:
      name: 幸運神龕
      color: "#f5b942"
      mods:
        - { stat: drop.rarity, type: INCREASED, value: 50 }
        - { stat: drop.quantity, type: INCREASED, value: 25 }

strongbox:
  ambush: [6, 9]                   # 跳出幾隻
  radius: 20                       # 打開時幾格內的人有份
  unique_chance: 0.01              # 有份的人各擲一次：掉寶箱的專屬傳奇
  ticket: { currency: ticket_strongbox, chance: 0.022 }    # 2026-10-18：入場券
  # 2026-10-24（照市場報告：星魄每種每週 4 千、只用掉 1～5%）：下面 essences 擲出來的每一顆只有 40% 留下（約少 60%）
  essence_chance: 0.4
  # 種類：weight 出現權重；rolls 像殺幾隻稀有怪那樣擲掉落表（quantity_bonus／rarity_bonus 是百分比）；
  # currency 另外掉幾個通貨（照掉落權重抽、等級夠的才會）；maps 另外掉幾張地圖（照開箱的人的星圖）；
  # essences 掉幾顆星魄（currencies.yml 裡 operation: ESSENCE 的，隨機一種；星魄是寶箱的招牌）
  kinds:
    # 2026-10-22（照市場報告：星魄每種每週掉 4 千、只用掉 0～4%）：星魄 1 → 0–1、2–3 → 1–2（約少 45%）
    plain:        { name: 寶箱, weight: 60, rolls: 3, quantity_bonus: 50, rarity_bonus: 100, essences: [0, 1] }
    # 2026-10：匠心寶箱多給的通貨 3–6 → 2–4 顆（低階通貨的權重減半，抽到好通貨的機會變高；這樣好通貨的數量跟以前差不多，低階的少一半）
    artisan:      { name: 匠心寶箱, weight: 25, rolls: 1, quantity_bonus: 0, rarity_bonus: 50, currency: [2, 4], essences: [1, 2] }
    cartographer: { name: 星圖寶箱, weight: 15, rolls: 1, quantity_bonus: 0, rarity_bonus: 50, maps: [1, 2], essences: [0, 1] }

breach:
  duration: 25                     # 開幾秒
  wave_seconds: 2.5                # 幾秒一波
  wave: [3, 4]                     # 一波幾隻（照地圖的魔法群比例，有時整波是魔法怪）
  radius: [4, 14]                  # 邊緣從幾格長到幾格（怪從邊緣湧出）
  quantity_bonus: 50               # 裂隙怪的物品數量 +%
  catalyst_chance: 0.012           # 2026-10-22：0.06 → 0.03（催化劑每種每週 2 千、只用掉 1～16%）；2026-10-24：0.03 → 0.012（還是只用掉 3～17%）。每隻裂隙怪死掉時掉一顆催化劑（currencies.yml 裡 operation: CATALYST 的，隨機一種）的機率
  unique_chance: 0.01              # 裂隙關上時 30 格內的人各擲一次：掉裂隙的專屬傳奇
  ticket: { currency: ticket_breach, chance: 0.044 }       # 2026-10-18：入場券

exile:
  life: 4.0                        # 生命是同等級稀有怪的幾倍
  damage: 1.3                      # 傷害倍率
  mods: [slammer, charger, swift]  # 詞綴（招式詞綴給招式；見 monsters.yml 的 mods）
  drops: 2                         # 殺了另外掉幾件稀有裝備（物品等級 = 地圖等級）
  omens: [1, 1]                    # 殺了掉幾個星籤（currencies.yml 裡 operation: OMEN 的，隨機一種；有份的人各拿）
  unique_chance: 0.01              # 有份的人各擲一次：掉流寇的專屬傳奇
  ticket: { currency: ticket_exile, chance: 0.067 }        # 2026-10-18：入場券
  names: [伊薇特, 柯林, 瑞瓦, 托爾加, 安雅, 莫瑟, 迦南, 希爾達, 奧倫, 薇拉, 迪倫, 娜塔]

# ---- 深淵裂縫（2026-10-18）----
# 玩家走近（approach）時地上裂開一條黑紫色的縫（寬 2–3 格），從起點沿著房間的走道往地圖裡延伸：每 advance_seconds 秒延伸 advance 格，
# 總長 length 格（隨機；碰到牆就提早結束）。每段從縫裡湧 wave 隻怪（照地圖的怪物種類，每 3 段一隻魔法怪），縫裡的怪物品數量 +quantity_bonus%。
# 只要有人在縫尾端 follow 格內就繼續延伸；沒人跟著超過 stall_seconds 秒，縫就合上（怪留著、事件結束、沒獎勵）。
# 到長度上限冒出一隻小 Boss（稀有怪、生命 ×boss.life、詞綴 boss.mods）＋一個深淵寶箱；打倒小 Boss 寶箱才開：radius 格內的人各拿一份
# （掉落表 chest.rolls 次＋shards 顆 shard_currency 的通貨）、各擲 unique_chance 的專屬傳奇（uniques.yml 的 sources 寫 abyss）。
# 事件結束（或地圖關閉）linger 秒後把縫的方塊還原。
abyss:
  advance_seconds: 1.5
  advance: 3
  length: [30, 45]
  wave: [2, 3]
  quantity_bonus: 40
  follow: 8
  stall_seconds: 6
  boss: { life: 3.0, mods: [slammer, swift] }
  chest: { rolls: 3, quantity_bonus: 60, rarity_bonus: 80 }
  # 招牌通貨：設計上是「潮湧殘片 abyss_shard」，但 currencies.yml 還沒有這個通貨；天啟石（oracle_orb）一顆值 150000、一天掉一顆都嫌多，
  # 所以先用亂流石（turmoil_orb，4500）。加了 abyss_shard 之後把這裡改成 abyss_shard 就好；
  # 寫了 currencies.yml 沒有的代號會改成照掉落表的通貨池抽。
  shard_currency: turmoil_orb
  shards: [1, 1]               # 2026-10-18：擁有者決定先給 1 顆
  radius: 20
  unique_chance: 0.01              # 寶箱打開時 radius 內的人各擲一次：掉深淵裂縫的專屬傳奇
  ticket: { currency: ticket_abyss, chance: 0.044 }        # 2026-10-18：入場券
  linger: 20

# ---- 地圖保險箱（2026-10-18）----
# 右鍵保險箱（身上要有劫盜合約 heist_contract：通貨袋、背包、倉庫都算）：吃掉 1 張（流水帳記劫盜的消耗），開始開鎖 unlock_seconds 秒：
# 每 wave_seconds 秒從房間邊緣湧一波 wave 隻怪（照地圖怪物；每波一隻魔法怪，最後一波一隻稀有怪）。保險箱 radius 格內有人進度才走；
# 沒人就暫停，暫停超過 grace 秒就失敗（合約沒了）。打開：reward_radius 格內的人各拿 rolls 次掉落表（quantity_bonus／rarity_bonus 是百分比）
# ＋currency 顆通貨（照掉落表的通貨池抽，等級＝地圖等級：合約沒有階級）＋blueprint_chance 一張劫盜藍圖。
# 沒有專屬傳奇（unique_chance 固定 0）、沒有入場券。出現機率在 settings.safe_chance。
safe:
  unlock_seconds: 20
  wave_seconds: 4
  wave: [3, 5]
  radius: 6
  grace: 15
  rolls: [2, 3]
  quantity_bonus: 50
  rarity_bonus: 100
  currency: [2, 4]
  blueprint_chance: 0.2
  reward_radius: 20
  unique_chance: 0

# ---- 祭壇（PoE2 的 Ritual）----
# 地圖裡放 altars 座祭壇（哭泣黑曜石＋紅蠟燭，各在不同房間）。右鍵一座開始儀式：地上一個 radius 格的圓，怪一波一波在圓裡出現
# （照這張圖的怪物與魔法／稀有群比例），圓裡的人每殺一隻拿貢品（tribute；後面的祭壇多 altar_bonus）。
# 全部做完後右鍵任何一座祭壇：用貢品換獎勵（每個人各自一組 rewards 件，價格照 prices），可以花貢品重擲一整組（reroll）。
# 2026-10-27 照 PoE2 0.5：
#   - 獎勵只有傳奇與星籤（星圖天賦沒有改這個的節點）。傳奇大多是共通傳奇（map_boss 池），exclusive_chance 的機率是祭壇專屬傳奇
#     （價格照 exclusive_price）。一組 7 件、傳奇權重 35%、專屬 3%：平均一組 0.07 件專屬，跟以前（權重 1/99）一樣。
#     這次之前 reward_weights { omen 30, currency 25, rare 15, essence 10, jewel 8, map 6, catalyst 4, unique 1 }，
#     prices 另外有 currency 40–160、rare 140–260、essence 110–190、jewel 180–320、map 150–260、catalyst 120–200、unique 520–880。
#   - 剩下的貢品不再浪費：地圖關閉時（人要在線上）存進帳號（tribute_bank），滿 threshold 換一張祭壇之鑰（ticket 的 currency），
#     用它在地圖裝置的「事件巔峰」開祭壇的巔峰 Boss——原作剩下的貢品累積去見迷霧之王，這裡沒有那隻 Boss，換成我們自己的祭壇巔峰。
#     一場祭壇大約拿 1300 貢品（每波平均約 100、每座 3.5 波、三座 ×1／1.25／1.5；點滿貢品天賦約 2300），全部存起來約 7.5 場（4.3 場）一張；
#     平常買完剩 300 左右，大約 33 場一張。
#     所以祭壇做完時直接掉券的機率 0.056 → 0.03，兩個加起來一張圖的券跟以前差不多（約 0.06）。
#   - 重擲（reroll）照舊。
ritual:
  chance: 0.3
  altars: 3
  radius: 9
  waves: [3, 4]
  wave: [4, 6]
  wave_seconds: 12                  # 一波最多幾秒（殺光就直接下一波）
  timeout: 150                      # 一座祭壇最多幾秒（時間到剩下的怪消失、算完成）
  tribute: { normal: 12, magic: 35, rare: 120, unique: 300 }
  altar_bonus: 0.25                 # 第二座 +25%、第三座 +50%…
  rewards: 7
  reroll: { cost: 0.2, growth: 1.5 }   # 重擲花「總共拿到的貢品」的幾成，每次乘 growth
  reward_weights: { omen: 65, unique: 35 }   # 2026-10-27 照 PoE2 0.5：只有星籤與傳奇（上面寫了這次之前的）
  prices: { omen: [260, 420], unique: [280, 520] }   # 2026-10-27：unique 是共通傳奇的價格（這次之前 520–880，那時候全是專屬）
  exclusive_chance: 0.03            # 2026-10-27：傳奇獎勵是祭壇專屬傳奇的機率（其他是共通傳奇）
  exclusive_price: [520, 880]       # 2026-10-27：專屬傳奇的價格（跟以前的傳奇一樣）
  tribute_bank: { threshold: 10000 }   # 2026-10-27：剩下的貢品存進帳號，滿 10000 換一張祭壇之鑰（0 = 不存）
  ticket: { currency: ticket_ritual, chance: 0.03 }       # 2026-10-18：入場券（祭壇全部完成時，這張圖裡的每個人各擲一次）；2026-10-27：0.056 → 0.03（貢品存起來也換得到）

# ---- 幻霧（PoE2 的 Delirium）----
# 地圖裡放一面鏡子（染色玻璃）。走過去，霧就跟著這張圖裡的每個人 duration 秒：越久越難（之後刷出來的怪與幻霧怪的生命、傷害
# 在 ramp_seconds 秒內升到 +max_difficulty%），每 spawn_seconds 秒在每個人附近刷 spawn 隻幻霧怪。殺怪累積獎勵進度（progress），
# 時間到照進度掉獎勵：每個人 rewards 條獎勵（種類照 reward_weights 抽），進度過 thresholds 的第幾個就拿幾份。
# emotions 是蒸餾情緒的通貨代號、照階級排（注入離天賦樹中心越遠的核心，要越後面的）；emotion_weights 是獎勵掉哪一階的權重。
delirium:
  chance: 0.3
  duration: 30            # 2026-10：75 → 30 秒（常常 Boss 打完還在等霧結束）；刷怪改快、改多，總數跟以前差不多
  ramp_seconds: 25        # 60 → 25：照比例縮短
  max_difficulty: 60
  spawn_seconds: 2        # 4 → 2
  spawn: [3, 4]           # [2, 3] → [3, 4]
  progress: { normal: 1, magic: 3, rare: 10, unique: 25 }
  rewards: 2
  thresholds: [20, 50, 100, 170]
  reward_weights: { emotion: 40, currency: 25, essence: 10, jewel: 10, map: 10, catalyst: 5, unique: 1 }   # unique：幻霧的專屬傳奇（2026-10：2 → 1）
  # 2026-10-27 照 PoE2：十種蒸餾情緒（照 poe2db 的價值排序，便宜 → 稀有）；恐懼、苦難、孤寂照 currencies.yml 的 drop_level
  #   （69／73／77）只在夠高的地圖掉。權重 poe2db 沒有公開，照前四種的比例往下延伸（每一階約 ×0.6）。
  #   這次之前：emotions [distilled_ire, distilled_guilt, distilled_greed, distilled_paranoia]、emotion_weights [50, 30, 15, 5]
  emotions: [distilled_ire, distilled_guilt, distilled_greed, distilled_paranoia, distilled_envy, distilled_disgust, distilled_despair,
             distilled_fear, distilled_suffering, distilled_isolation, distilled_melancholy, distilled_ferocity, distilled_contempt]
  # 最後三種是強效情緒（塗油限定核心用，65 級起；poe2db 沒有權重，比孤寂再少一點）
  emotion_weights: [500, 300, 180, 108, 65, 39, 23, 14, 8, 5, 3, 3, 3]
  ticket: { currency: ticket_delirium, chance: 0.056 }     # 2026-10-18：入場券（幻霧結束時拿到獎勵的人各擲一次）

# 地圖變化（2026-10）：讓同一張圖每次打起來不一樣。每一種各自照機率出現，機率寫 0 就關掉。
# 只放在一般的地圖（回響、試煉、極境、巔峰不放）；終局 Boss 不會有 Boss 變體與 Boss 房干擾。/ec map 的狀態會列出這張圖有哪些變化。
twists:
  # 房間主題：沒有事件的房間各自照機率變成某種主題（走進去畫面中間會提示）
  #   elite 精英巢穴（只有 2～3 隻稀有怪）、swarm 怪物潮（普通怪 × swarm_size）、dark 黑暗房（看不清楚，魔法 ×1.5、稀有 ×3）、
  #   vault 寶庫（沒有怪群，只有一個寶箱）
  room_theme_chance: 0.3
  room_themes: { elite: 30, swarm: 30, dark: 25, vault: 15 }
  swarm_size: 2.5
  # 怪物混搭：照機率從別張地圖借一個族群，每一群照 mix_share 的機率用借來的
  mix_chance: 0.5
  mix_share: 0.35
  # 流浪精英：一隻生命 ×life、傷害 ×damage 的稀有怪在房間之間遊蕩，打倒牠物品數量 +quantity%
  wanderer_chance: 0.35
  wanderer: { life: 4.0, damage: 1.3, quantity: 200 }
  # 事件疊加：每個放好的事件照機率在同一個房間多放一個不同種類的
  stack_chance: 0.12
  # Boss 變體：empowered 強化（生命 ×1.5、傷害 ×1.25、掉落 +50%）、twin 雙生（開打多一隻分身，兩隻生命各 ×0.6，掉落 +25%）
  boss_variant_chance: 0.15
  boss_variants: { empowered: 60, twin: 40 }
  # Boss 房干擾（開打後）：meteors 墜星、hands 冥河之手、embers 流火（場地危害）、reinforce 援軍（每 20 秒一波魔法怪）、
  #   pillar 守護之柱（開打先張護盾：40 秒內打掉兩根柱子，不然回 25% 生命）
  boss_room_chance: 0.25
  boss_rooms: { meteors: 25, hands: 25, embers: 20, reinforce: 15, pillar: 15 }
  # 命運岔路：兩根石碑二選一——血路（之後的怪物群 +50%、物品數量 +30%）或王道（Boss 生命傷害 +30%、Boss 掉落 +50%）
  fork_chance: 0.25
  # 詛咒寶匣：接受馬上拿一份好東西，之後刷的怪生命與傷害 +cursed_power%（Boss 一半）；拒絕就消失
  cursed_chance: 0.2
  cursed_power: 25
  # 限時挑戰：第一次走進普通房間時照機率觸發（一張圖最多 2 次），房間的怪一次全出來，timed_seconds 秒內殺光有獎勵
  timed_chance: 0.15
  timed_seconds: 50
  # 隱藏房：一間死路房間的入口被裂開的牆封住，左鍵敲 6 下打破，裡面有精英與寶箱
  hidden_chance: 0.25
