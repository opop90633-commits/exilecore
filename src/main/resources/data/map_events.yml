# 地圖事件（照 PoE 的 Shrine、Strongbox、Breach、Rogue Exile：神龕、寶箱、裂隙、流寇）：每張地圖開出來時隨機放幾個在普通房間的中央，走近才會現身。
# 改完 /ec reload：之後開的地圖照新的（已經開著的不變）。終局、每週回響、昇華試煉這些特別的實例不放事件。
#
# 四種事件：
#   shrine     神龕：地上一座發光的石柱，旁邊一群守衛。碰到它，附近 12 格內的人一起拿 duration 秒的增益（哪一種照石柱上寫的）。
#   strongbox  寶箱：點開會跳出一群怪（照這張圖的魔法／稀有群比例），殺光才打開；radius 格內的每個人各拿自己那份。
#   breach     裂隙：踩進去就打開，每 wave_seconds 秒從越來越大的邊緣湧出一波怪，殺得越快擴得越快，到最大收縮吞掉剩下的怪（2026-11-12 照 PoE1，見下面 breach）；
#              裂隙的怪物品數量 +quantity_bonus%。（這次之前固定開 duration 秒）
#   exile      流寇：穿著整套裝備的稀有怪，招式像 Boss（mods 裡的招式詞綴），生命是同等稀有怪的 life 倍；殺了照稀有怪掉，另外多掉 drops 件稀有裝備。
# 2026-10-18 新增兩種：
#   abyss      深淵裂縫：走近時地上裂開一條縫往地圖裡延伸，每段湧怪；有人跟著才繼續，沒人跟就合上（沒獎勵）；盡頭一隻小 Boss＋一個深淵寶箱。
#   safe       地圖保險箱：鐵塊、鐵門、箱子的小結構，一直都在；右鍵（身上要有劫盜合約：通貨袋、背包、倉庫都算），吃掉一張開始開鎖，開鎖時一波一波湧怪。
#              不在 weights 裡、不佔 per_map：每張地圖照 settings.safe_chance 另外放，最多一個。沒有專屬傳奇、沒有入場券。
#
# 機制的招牌通貨（照 PoE2，定義在 currencies.yml）：寶箱掉星魄（保證詞綴的改造）、裂隙的怪掉催化劑（飾品品質＝某一類詞綴的加成）、
# 流寇掉星籤（改下一顆通貨的規則）；祭壇的獎勵也以星籤為主、幻霧掉蒸餾情緒（注入項鍊）。
# 每種事件各有自己的專屬傳奇（uniques.yml 的 sources 寫 shrine、strongbox、breach、exile、ritual、delirium；2026-10-18 ＋abyss，保險箱沒有）：
#   神龕、寶箱、裂隙、流寇照各自的 unique_chance（1%，每個有份的人各擲一次：碰到神龕的人、開箱時在旁邊的人、
#   裂隙關上時在 30 格內的人、流寇有份的人）；祭壇與幻霧是獎勵裡的「傳奇」那一種（reward_weights 的 unique）。
#   2026-10：2% → 1%、祭壇與幻霧的 unique 權重 2 → 1（星圖天賦的「+50%」也改 +25%）。伺服器的紀錄裡事件專屬佔了新傳奇的一半，
#   點了寶箱天賦的人一天拿到 8 件千鎖；常見的傳奇重複得太快。
#
# 另外兩個 PoE2 的機制（最下面的 ritual、delirium）：跟上面的事件可以同時出現，各自照 chance 決定這張圖有沒有。
#
# 2026-10-18：事件巔峰的入場券——每種事件（保險箱除外）的 ticket: { currency, chance }：完成事件時「有份的人」（跟 unique_chance 同一群人）
#   各擲一次 chance 掉一張 currency（currencies.yml 的 ticket_*）；固定機率，不吃稀有度、星圖天賦、每月加成。
#   一張券在地圖裝置的「事件巔峰」開那隻 Boss 一次（maps.yml finals 底下 pinnacle.ticket）。沒寫照預設 ticket_<事件> 2%；chance 0 = 不掉。
#   2026-10-20：照事件出現的頻率調，7 種都約 60 張圖掉 1 張（神龕、寶匣 2.2%，裂隙、深淵 4.4%，祭壇、幻霧 5.6%，流寇 6.7%）；
#   以前全部 2%，流寇的券比神龕難拿 3 倍。

settings:
  per_map: [2, 3]                  # 每張地圖放幾個事件（最多一個房間一個，起點與 Boss 房不放）
  weights: { shrine: 30, strongbox: 30, breach: 15, exile: 10, abyss: 15 }   # 2026-10-18：35/35/15/15 → 30/30/15/10，＋深淵裂縫 15（總和還是 100）
  approach: 20                     # 玩家幾格內事件現身（守衛、流寇、深淵裂縫刷出來；寶箱、裂隙、保險箱一直都在）
  safe_chance: 0.35                # 2026-10-18：每張地圖有保險箱的機率（per_map 之外另外算，一張圖最多一個）

shrine:
  duration: 40                     # 增益幾秒
  guards: [3, 5]                   # 守衛幾隻（照地圖的怪物種類，一隻魔法怪帶一群普通怪）
  reach: 12                        # 啟動時幾格內的人一起拿
  unique_chance: 0.01              # 拿到增益的人各擲一次：掉神龕的專屬傳奇
  ticket: { currency: ticket_shrine, chance: 0.022 }       # 2026-10-18：事件巔峰的入場券（同一群人各擲一次；固定機率、不吃加成）
  # 種類：name 顯示名稱、color 顏色、mods 增益（stat 屬性鍵、type FLAT／INCREASED／MORE、value 數值；INCREASED／MORE 是百分比）
  kinds:
    acceleration:
      name: 疾速神龕
      color: "#7fd4ff"
      mods:
        - { stat: movement.speed, type: INCREASED, value: 30 }
        - { stat: attack.speed, type: INCREASED, value: 30 }
        - { stat: cast.speed, type: INCREASED, value: 30 }
    brutal:
      name: 兇猛神龕
      color: "#ff7070"
      mods:
        - { stat: damage, type: INCREASED, value: 40 }
    diamond:
      name: 金剛神龕
      color: "#9fe8c8"
      mods:
        - { stat: armour, type: INCREASED, value: 80 }
        - { stat: evasion, type: INCREASED, value: 80 }
        - { stat: es.max, type: INCREASED, value: 30 }
    regeneration:
      name: 再生神龕
      color: "#7fe07f"
      mods:
        - { stat: life.regen_percent, type: FLAT, value: 3 }
    lucky:
      name: 幸運神龕
      color: "#f5b942"
      mods:
        - { stat: drop.rarity, type: INCREASED, value: 50 }
        - { stat: drop.quantity, type: INCREASED, value: 25 }

strongbox:
  ambush: [6, 9]                   # 跳出幾隻
  radius: 20                       # 打開時幾格內的人有份
  unique_chance: 0.01              # 有份的人各擲一次：掉寶箱的專屬傳奇
  ticket: { currency: ticket_strongbox, chance: 0.022 }    # 2026-10-18：入場券
  # 2026-10-24（照市場報告：星魄每種每週 4 千、只用掉 1～5%）：下面 essences 擲出來的每一顆只有 40% 留下（約少 60%）
  essence_chance: 0.4
  # 種類：weight 出現權重；rolls 像殺幾隻稀有怪那樣擲掉落表（quantity_bonus／rarity_bonus 是百分比）；
  # currency 另外掉幾個通貨（照掉落權重抽、等級夠的才會）；maps 另外掉幾張地圖（照開箱的人的星圖）；
  # essences 掉幾顆星魄（currencies.yml 裡 operation: ESSENCE 的，隨機一種；星魄是寶箱的招牌）
  kinds:
    # 2026-10-22（照市場報告：星魄每種每週掉 4 千、只用掉 0～4%）：星魄 1 → 0–1、2–3 → 1–2（約少 45%）
    plain:        { name: 寶箱, weight: 60, rolls: 3, quantity_bonus: 50, rarity_bonus: 100, essences: [0, 1] }
    # 2026-10：匠心寶箱多給的通貨 3–6 → 2–4 顆（低階通貨的權重減半，抽到好通貨的機會變高；這樣好通貨的數量跟以前差不多，低階的少一半）
    artisan:      { name: 匠心寶箱, weight: 25, rolls: 1, quantity_bonus: 0, rarity_bonus: 50, currency: [2, 4], essences: [1, 2] }
    cartographer: { name: 星圖寶箱, weight: 15, rolls: 1, quantity_bonus: 0, rarity_bonus: 50, maps: [1, 2], essences: [0, 1] }

# 2026-11-12 照站長「進度條，殺怪會延長；進度條滿 100% 變成穩定裂隙，分波冒稀有怪（每波 5 隻），首領是費許的元帥維倫，打完才崩解；
#   專屬的巢生怪；維倫只在穩定裂隙出」（PoE2 0.5 Breach；tw.exilecore.map.MapEventConfig.BreachFeel）：
#   踩進去打開，巢生怪（hiveborn）從邊緣湧出。timer：一開始 start 秒、每殺一隻加 kill 秒、最多累積 cap 秒；歸零就收縮
#   （collapse_seconds 秒內收到 0，圈外的怪被吞掉、沒有掉落），開了 max_seconds 秒也收。stabilise：每殺一隻加 kill 點，滿 need 點（100%）
#   變成穩定裂隙（圈跟著進度從 radius 的小長到大）。stable：不再湧一般的怪，起點分 waves 波、每波 wave_size 隻稀有的巢生怪
#   （殺光或過了 wave_seconds 秒出下一波），最後是 vruun；seconds 秒內全部打完才崩解：關閉獎勵＋每人 rolls 次稀有怪的掉落（物品數量 +quantity_bonus%），
#   沒打完就收縮（沒有穩定的獎勵）。全部殺光約 15 秒穩定（照每秒湧 5.6 隻算），每秒殺不到約 3.3 隻時間會一直掉。
#   這次之前（同一天稍早，PoE1 手感版）：圈每秒自己長、殺怪推，到最大就收縮；裂痕首領 30% 在擴張途中出現；怪是地圖本身的。
#   站長：先不做碎片、裂痕石、祝福、裂痕戒指加倍。
breach:
  wave_seconds: 1.25               # 幾秒一波；2026-11-02：2.5 → 1.25
  wave: [6, 8]                     # 一波幾隻（照地圖的魔法群比例，有時整波是魔法怪）；2026-10-30 照站長「裂痕增加怪物數量」：[3, 4] → [6, 8]（一次約 35 → 70 隻）
  radius: [4, 16]                  # 邊緣從幾格長到幾格（照穩定進度；怪從邊緣湧出）；2026-11-12：[4, 14] → [4, 16]
  timer:
    start: 8                       # 打開時有幾秒
    kill: { normal: 0.3, magic: 0.8, rare: 2.5 }   # 殺一隻加幾秒
    cap: 12                        # 最多累積到幾秒
    collapse_seconds: 2.0          # 收縮要幾秒
    max_seconds: 90                # 最多開幾秒（還沒穩定就收）
  stabilise:
    need: 80                       # 滿幾點變成穩定裂隙
    kill: { normal: 1, magic: 2.5, rare: 10 }   # 殺一隻加幾點
  stable: { waves: 3, wave_size: 5, wave_seconds: 15, seconds: 90, rolls: 2, quantity_bonus: 100 }   # 穩定裂隙（PoE2 0.5.5：稀有怪每波 5 隻）
  vruun: { name: 費許的元帥・維倫, life: 6.0, quantity_bonus: 300, mods: [slammer, charger] }   # 穩定裂隙的首領（稀有、生命 ×life，另外帶 mods）；只在穩定裂隙出
  hiveborn:                        # 專屬的巢生怪：原版生物 → 名字、權重（稀有的叫「巢生精英・名字」）
    ENDERMITE:   { name: 巢生幼蟲, weight: 30 }
    SILVERFISH:  { name: 巢生蠹蟲, weight: 20 }
    SPIDER:      { name: 巢生節肢, weight: 20 }
    CAVE_SPIDER: { name: 巢生刺蛛, weight: 15 }
    ENDERMAN:    { name: 巢生行者, weight: 15 }
  lords:                           # PoE1 的五個裂痕領主：weight 出現權重、mods 這個裂隙的怪都帶的詞綴（monsters.yml 的 mods）
    xoph:      { name: 索伏, weight: 100, color: "#ff7a2f", mods: [fiery] }       # 火焰
    tul:       { name: 圖爾, weight: 100, color: "#8fd8ff", mods: [frosty] }      # 冰冷
    esh:       { name: 艾許, weight: 100, color: "#ffe84a", mods: [shocking] }    # 閃電
    uul_netol: { name: 烏爾尼托, weight: 60, color: "#c9a27a", mods: [armoured] } # 物理
    chayula:   { name: 夏烏拉, weight: 30, color: "#b76bff", mods: [withering] }  # 混沌
  # 緊握之手：幾隻、radius 格內的人各拿 rolls 次稀有怪的掉落（PoE1 是碎片，我們沒有碎片）。
  #   2026-11-12 照站長「緊握之手 25% 刪掉」：catalyst_chance 0.25 → 0；同日「緊握之手刪除」：count [0, 2] → [0, 0]（不再出現）
  hands: { count: [0, 0], rolls: 2, quantity_bonus: 50, catalyst_chance: 0, radius: 12 }
  quantity_bonus: 50               # 裂隙怪的物品數量 +%
  catalyst_chance: 0.012           # 2026-10-22：0.06 → 0.03（催化劑每種每週 2 千、只用掉 1～16%）；2026-10-24：0.03 → 0.012（還是只用掉 3～17%）；2026-10-30 照站長：怪物多一倍、機率維持 0.012（每次裂隙的催化劑跟著變多）。每隻裂隙怪死掉時掉一顆催化劑（currencies.yml 裡 operation: CATALYST 的，隨機一種）的機率
  unique_chance: 0.01              # 裂隙關上時 30 格內的人各擲一次：掉裂隙的專屬傳奇
  ticket: { currency: ticket_breach, chance: 0.044 }       # 2026-10-18：入場券
  ring: { base: jring_breach, chance: 0.01 }   # 2026-11-04 照站長「裂隙指環放進裂痕掉落」「機率都先 1%」：裂隙關上時 30 格內的人各擲一次（吃物品稀有度），魔法或稀有、未鑑定；這次之前在劫盜掉

exile:
  life: 4.0                        # 生命是同等級稀有怪的幾倍
  damage: 1.3                      # 傷害倍率
  mods: [slammer, charger, swift]  # 詞綴（招式詞綴給招式；見 monsters.yml 的 mods）
  drops: 2                         # 殺了另外掉幾件稀有裝備（物品等級 = 地圖等級）
  omens: [1, 2]                    # 2026-10-29 照站長：1 → 1～2 張。殺了掉幾個星籤（currencies.yml 裡 operation: OMEN 的，隨機一種；有份的人各拿）
  unique_chance: 0.01              # 有份的人各擲一次：掉流寇的專屬傳奇
  ticket: { currency: ticket_exile, chance: 0.067 }        # 2026-10-18：入場券
  names: [伊薇特, 柯林, 瑞瓦, 托爾加, 安雅, 莫瑟, 迦南, 希爾達, 奧倫, 薇拉, 迪倫, 娜塔]

# ---- 深淵裂縫（2026-10-18）----
# 玩家走近（approach）時地上裂開一條黑紫色的縫（寬 2–3 格），從起點沿著房間的走道往地圖裡延伸：每 advance_seconds 秒延伸 advance 格，
# 總長 length 格（隨機；碰到牆就提早結束）。每段從縫裡湧 wave 隻怪（照地圖的怪物種類，每 3 段一隻魔法怪），縫裡的怪物品數量 +quantity_bonus%。
# 只要有人在縫尾端 follow 格內就繼續延伸；沒人跟著超過 stall_seconds 秒，縫就合上（怪留著、事件結束、沒獎勵）。
# 到長度上限冒出一隻小 Boss（稀有怪、生命 ×boss.life、詞綴 boss.mods）＋一個深淵寶箱；打倒小 Boss 寶箱才開：radius 格內的人各拿一份
# （掉落表 chest.rolls 次＋shards 顆 shard_currency 的通貨）、各擲 unique_chance 的專屬傳奇（uniques.yml 的 sources 寫 abyss）。
# 事件結束（或地圖關閉）linger 秒後把縫的方塊還原。
abyss:
  advance_seconds: 0.75          # 2026-11-04 照站長「深淵速度加倍」：1.5 → 0.75（每段長度、每段怪數、總長不變：怪物總數一樣、時間減半）
  advance: 3
  length: [30, 45]
  wave: [2, 3]
  quantity_bonus: 40
  follow: 8
  stall_seconds: 6
  boss: { life: 3.0, mods: [slammer, swift] }
  chest: { rolls: 3, quantity_bonus: 60, rarity_bonus: 80 }
  # 招牌通貨：設計上是「潮湧殘片 abyss_shard」，但 currencies.yml 還沒有這個通貨；天啟石（oracle_orb）一顆值 150000、一天掉一顆都嫌多，
  # 所以先用亂流石（turmoil_orb，4500）。加了 abyss_shard 之後把這裡改成 abyss_shard 就好；
  # 寫了 currencies.yml 沒有的代號會改成照掉落表的通貨池抽。
  shard_currency: turmoil_orb
  shards: [1, 1]               # 2026-10-18：擁有者決定先給 1 顆
  radius: 20
  unique_chance: 0.01              # 寶箱打開時 radius 內的人各擲一次：掉深淵裂縫的專屬傳奇
  ticket: { currency: ticket_abyss, chance: 0.044 }        # 2026-10-18：入場券
  ring: { base: jring_abyssal, chance: 0.01 }   # 2026-11-04 照站長「淵印指環放進深淵」「機率都先 1%」：寶箱打開時有份的人各擲一次（吃物品稀有度），魔法或稀有、未鑑定；這次之前在劫盜掉
  linger: 20

# ---- 地圖保險箱（2026-10-18）----
# 右鍵保險箱（身上要有劫盜合約 heist_contract：通貨袋、背包、倉庫都算）：吃掉 1 張（流水帳記劫盜的消耗），開始開鎖 unlock_seconds 秒：
# 每 wave_seconds 秒從房間邊緣湧一波 wave 隻怪（照地圖怪物；每波一隻魔法怪，最後一波一隻稀有怪）。保險箱 radius 格內有人進度才走；
# 沒人就暫停，暫停超過 grace 秒就失敗（合約沒了）。打開：reward_radius 格內的人各拿 rolls 次掉落表（quantity_bonus／rarity_bonus 是百分比）
# ＋currency 顆通貨（照掉落表的通貨池抽，等級＝地圖等級：合約沒有階級）＋blueprint_chance 一張劫盜藍圖。
# 沒有專屬傳奇（unique_chance 固定 0）、沒有入場券。出現機率在 settings.safe_chance。
safe:
  unlock_seconds: 20
  wave_seconds: 4
  wave: [3, 5]
  radius: 6
  grace: 15
  rolls: [2, 3]
  quantity_bonus: 50
  rarity_bonus: 100
  currency: [2, 4]
  blueprint_chance: 0.2
  reward_radius: 20
  unique_chance: 0

# ---- 祭壇（PoE2 的 Ritual）----
# 地圖裡放 altars 座祭壇（哭泣黑曜石＋紅蠟燭，各在不同房間）。右鍵一座開始儀式：地上一個 radius 格的圓，怪一波一波在圓裡出現
# （照這張圖的怪物與魔法／稀有群比例），圓裡的人每殺一隻拿貢品（tribute；後面的祭壇多 altar_bonus）。
# 全部做完後右鍵任何一座祭壇：用貢品換獎勵（每個人各自一組 rewards 件，價格照 prices），可以花貢品重擲一整組（reroll）。
# 2026-10-27 照 PoE2 0.5：
#   - 獎勵只有傳奇與星籤（星圖天賦沒有改這個的節點）。傳奇大多是共通傳奇（map_boss 池），exclusive_chance 的機率是祭壇專屬傳奇
#     （價格照 exclusive_price）。一組 7 件、傳奇權重 35%、專屬 3%：平均一組 0.07 件專屬，跟以前（權重 1/99）一樣。
#     這次之前 reward_weights { omen 30, currency 25, rare 15, essence 10, jewel 8, map 6, catalyst 4, unique 1 }，
#     prices 另外有 currency 40–160、rare 140–260、essence 110–190、jewel 180–320、map 150–260、catalyst 120–200、unique 520–880。
#   - 剩下的貢品不再浪費：地圖關閉時（人要在線上）存進帳號（tribute_bank），滿 threshold 換一張祭壇之鑰（ticket 的 currency），
#     用它在地圖裝置的「事件巔峰」開祭壇的巔峰 Boss——原作剩下的貢品累積去見迷霧之王，這裡沒有那隻 Boss，換成我們自己的祭壇巔峰。
#     一場祭壇大約拿 1300 貢品（每波平均約 100、每座 3.5 波、三座 ×1／1.25／1.5；點滿貢品天賦約 2300），全部存起來約 7.5 場（4.3 場）一張；
#     平常買完剩 300 左右，大約 33 場一張。
#     所以祭壇做完時直接掉券的機率 0.056 → 0.03，兩個加起來一張圖的券跟以前差不多（約 0.06）。
#   - 重擲（reroll）照舊。
ritual:
  chance: 0.3
  altars: 3
  radius: 9
  waves: [3, 4]
  wave: [4, 6]
  wave_seconds: 12                  # 一波最多幾秒（殺光就直接下一波）
  timeout: 150                      # 一座祭壇最多幾秒（時間到剩下的怪消失、算完成）
  tribute: { normal: 12, magic: 35, rare: 120, unique: 300 }
  altar_bonus: 0.25                 # 第二座 +25%、第三座 +50%…
  rewards: 7
  reroll: { cost: 0.2, growth: 1.5 }   # 重擲花「總共拿到的貢品」的幾成，每次乘 growth
  reward_weights: { omen: 65, unique: 35 }   # 2026-10-27 照 PoE2 0.5：只有星籤與傳奇（上面寫了這次之前的）
  prices: { omen: [260, 420], unique: [280, 520] }   # 2026-10-27：unique 是共通傳奇的價格（這次之前 520–880，那時候全是專屬）
  exclusive_chance: 0.03            # 2026-10-27：傳奇獎勵是祭壇專屬傳奇的機率（其他是共通傳奇）
  exclusive_price: [520, 880]       # 2026-10-27：專屬傳奇的價格（跟以前的傳奇一樣）
  tribute_bank: { threshold: 10000 }   # 2026-10-27：剩下的貢品存進帳號（0 = 不存）；2026-10-29 照站長：存下的貢品在任何祭壇都能直接拿來換獎勵、重擲，threshold 是在祭壇畫面換一把祭壇之鑰的價錢（這次之前存滿自動換）
  ticket: { currency: ticket_ritual, chance: 0.03 }       # 2026-10-18：入場券（祭壇全部完成時，這張圖裡的每個人各擲一次）；2026-10-27：0.056 → 0.03（貢品存起來也換得到）

# ---- 幻霧（PoE2 的 Delirium）----
# 地圖裡放一面鏡子（染色玻璃）。走過去，霧就跟著這張圖裡的每個人 duration 秒：越久越難（之後刷出來的怪與幻霧怪的生命、傷害
# 在 ramp_seconds 秒內升到 +max_difficulty%），每 spawn_seconds 秒在每個人附近刷 spawn 隻幻霧怪。殺怪累積獎勵進度（progress），
# 時間到照進度掉獎勵：每個人 rewards 條獎勵（種類照 reward_weights 抽），進度過 thresholds 的第幾個就拿幾份。
# emotions 是蒸餾情緒的通貨代號、照階級排（注入離天賦樹中心越遠的核心，要越後面的）；emotion_weights 是獎勵掉哪一階的權重。
delirium:
  chance: 0.3
  duration: 22.5          # 2026-11-02 照站長「時間加快兩倍」：45 → 22.5（刷怪快一倍，怪物總數、能到的層數不變）。2026-10：75 → 30 秒（常常 Boss 打完還在等霧結束）；2026-10-29 照站長「層數高一些、獎勵豐富一些」：30 → 45 秒（多出來的時間給高層）
  ramp_seconds: 20        # 2026-11-02：40 → 20（跟著加快）。60 → 25：照比例縮短；2026-10-29：25 → 40（跟著持續時間拉長）
  max_difficulty: 100     # 2026-10-29：60 → 100（層數變多，後面更難）
  spawn_seconds: 1        # 2026-11-02：2 → 1（跟著加快）。4 → 2
  spawn: [3, 4]           # [2, 3] → [3, 4]
  progress: { normal: 1, magic: 3, rare: 10, unique: 25 }
  rewards: 3              # 2026-10-29 照站長：每人 2 → 3 條獎勵
  thresholds: [20, 50, 100, 170, 260, 380, 520]   # 2026-10-29 照站長：4 層 → 7 層（這次之前 [20, 50, 100, 170]）
  reward_weights: { emotion: 40, currency: 25, essence: 10, jewel: 10, map: 10, catalyst: 5, unique: 1 }   # unique：幻霧的專屬傳奇（2026-10：2 → 1）
  # 2026-10-27 照 PoE2：十種蒸餾情緒（照 poe2db 的價值排序，便宜 → 稀有）；恐懼、苦難、孤寂照 currencies.yml 的 drop_level
  #   （69／73／77）只在夠高的地圖掉。權重 poe2db 沒有公開，照前四種的比例往下延伸（每一階約 ×0.6）。
  #   這次之前：emotions [distilled_ire, distilled_guilt, distilled_greed, distilled_paranoia]、emotion_weights [50, 30, 15, 5]
  emotions: [distilled_ire, distilled_guilt, distilled_greed, distilled_paranoia, distilled_envy, distilled_disgust, distilled_despair,
             distilled_fear, distilled_suffering, distilled_isolation, distilled_melancholy, distilled_ferocity, distilled_contempt]
  # 最後三種是強效情緒（塗油限定核心用，65 級起；poe2db 沒有權重，比孤寂再少一點）
  emotion_weights: [500, 300, 180, 108, 65, 39, 23, 14, 8, 5, 3, 3, 3]
  ticket: { currency: ticket_delirium, chance: 0.056 }     # 2026-10-18：入場券（幻霧結束時拿到獎勵的人各擲一次）

# 2026-11-04 照站長「波次引擎＋15 層迷霧」：迷霧回廊（地圖裝置用迷霧碎片開的獨立場地）。
#   一波一波打：休息 break_seconds → 刷怪（每個人附近每 spawn.every 秒一群 spawn.group 隻，刷滿 monsters 隻）→ 全部打完或 wave_seconds 到算過關。
#   怪物數量 = base + per_wave ×（波數 − 1），每多一個人 × (1 + per_player)；怪物生命、傷害從 0 一路加到 difficulty%（最後一波）。
#   magic／rare 是魔法、稀有怪的機率（第一波 → 最後一波；稀有怪從 rare.from_wave 開始）；elite.waves 多一隻生命 ×elite.life 的傳奇怪。
#   最後一波是 Boss（場地照一張隨機地圖的怪物與 Boss）。每過一波每個人各拿 rewards.per_wave 份（第一波 → 最後一波；吃物品數量），
#   種類照 rewards.weights（跟幻霧一樣的種類，沒有傳奇）。專屬獎勵之後再加。
fog_trial:
  name: 迷霧回廊
  splinter: fog_splinter
  cost: 50
  splinter_drop: [4, 8]   # 幻霧結束時拿到獎勵的人各拿幾個（吃物品數量）
  level_bonus: 2          # 怪物等級比你打過最高的地圖階級多幾級
  waves: 15
  break_seconds: 0        # 2026-11-04 照站長「殺完怪物馬上進下一階段」；這次之前 8
  wave_seconds: 90
  monsters: { base: 18, per_wave: 4, per_player: 0.5 }
  spawn: { every: 0.5, group: [3, 5] }   # 2026-11-04 照站長「怪物每 0.5 秒刷一輪」；這次之前 1.5
  difficulty: 200
  magic: { start: 0.15, end: 0.6 }
  rare: { from_wave: 4, start: 0.03, end: 0.15 }
  elite: { waves: [5, 10], life: 4.0 }
  rewards:
    per_wave: [1, 3]
    weights: { emotion: 40, currency: 25, essence: 10, jewel: 10, map: 10, catalyst: 5 }

# 2026-11-07 照站長「地心礦坑有辦法簡化嗎、新增一種深坑鑰匙、能組隊、排行不重置」：星脈深坑（PoE 的 Delve 簡化版）。
#   地圖裝置用 1 把深坑鑰匙開（一般地圖 Boss 照 key_chance 掉，每個有份的人各擲一次、吃物品數量）。一層一層往下打：
#   每層的怪物照一張隨機地圖換；怪物等級每層 +level_per_floor（最多 +max_level_bonus，上限 100 級），生命與傷害每層 +difficulty_per_floor%；
#   一層總共 monsters.base + per_floor×(層−1) 隻（人多再多）；魔法、稀有的機率在 ramp_floors 層之內從 start 漲到 end；
#   每 guardian.every 層一隻深坑守衛（傳奇怪，生命再 ×guardian.life）。殺光算過關（2026-11-07 照站長：floor_seconds 秒內沒殺光算失敗、這一場結束，紀錄只記到上一層），場地中間打開裂口，走進去就是下一層。
#   黑暗（每個人自己一條，0～100；2026-11-07 照站長只有打怪的時候漲，過關後到下一層開打之前暫停）：每秒漲 rise + rise_per_10×(層÷10)（燈芯升級每級少 8%），light_radius 格內殺怪回 light_per_kill
#   （魔法 ×2、稀有 ×5、傳奇 ×10；聚光升級每級 +15%），過關回 clear_light；80 以上畫面變暗，滿了每秒扣 damage% 的（最大生命＋能量護盾），每 25 層多一倍
#   （2026-11-07 照站長：生命最多扣到剩 1 點，黑暗不會殺死人，讓人有時間回營地不噴經驗；這次之前扣到 0 會死）。
#   每過一層每個人各拿 rewards.per_floor 份（第 1 層 → 第 1 + ramp_floors 層，守衛層兩倍）的獎勵與 azurite_drop 個藍晶。
#   角色記住最深過到第幾層，下次從「最深 − start_gap」開始（深掘升級每級少退 1 層、最少退 1 層）；
#   帳號最深的一層記在 plugins/ExileCore/delve_ladder.json（排行，清檔不重置）。每個人只能進去一次（死了、離開就出局，已經拿到的照拿）。
delve:
  name: 星脈深坑
  key: delve_key
  cost: 1
  azurite: azurite
  key_chance: 0.15
  level_bonus: 0          # 起始怪物等級比你打過最高的地圖階級多幾級
  start_gap: 5
  floor_seconds: 150
  monsters: { base: 16, per_floor: 0.6, per_player: 0.5 }
  spawn: { every: 0.5, group: [3, 5] }
  difficulty_per_floor: 5
  level_per_floor: 1
  max_level_bonus: 20
  ramp_floors: 50
  magic: { start: 0.15, end: 0.55 }
  rare: { start: 0.03, end: 0.18 }
  guardian: { every: 10, life: 8.0 }
  darkness: { rise: 1.2, rise_per_10: 0.4, light_per_kill: 1.5, light_radius: 20, clear_light: 25, damage: 5 }
  rewards:
    per_floor: [1, 4]
    weights: { currency: 35, essence: 15, jewel: 15, map: 15, catalyst: 10, rare: 10 }
  azurite_drop: { base: 2, per_10: 1, guardian: 10 }
  upgrades: { max: 5, costs: [20, 40, 80, 150, 250] }
  # 2026-11-07 照站長「守衛新增掉落星坑 BOSS 鑰匙，然後再做一隻 BOSS，把暮色瓣落、遺忘看守都放進這隻裡面」：
  #   boss_key：深坑守衛給每個有份的人各擲一次 chance%（不吃物品數量）掉 1 把 id（currencies.yml）；
  #   boss：cost 把在地圖裝置（或深坑按鈕右鍵的選單）開 name——只有一隻災厄級的首領（maps.yml 的 event_bosses.delve_boss）。
  boss_key: { id: delve_boss_key, chance: 20 }
  boss: { name: 晶淵王座, cost: 1 }
  # 2026-11-07 照站長「星脈深坑裡的怪物要會掉 PoE2 Fate of the Vaal 的通貨（不用獻祭法衣），掉落率照原作的稀有度」：
  #   每隻怪照稀有度擲 chance（%；第 N 層再乘 1 + (N−1)／per_floor，吃物品數量），中了照 weights 挑一種（currencies.yml 的代號）。
  #   原作沒公開掉落權重：照原作的行情與成交量估（灌注器最常見，雙蝕石最少；遠古魂核不會掉，只能用擾核石變）。
  #   深坑守衛擲 guardian_rolls 次（機率照 unique），再擲 guardian_unique% 掉一件守衛專屬傳奇（uniques.yml 的 sources 有 delve_guardian）。
  #   base：深坑小怪專屬的基底（祭紋華袍）。
  vaal_drops:
    chance: { normal: 0.6, magic: 1.5, rare: 6, unique: 100 }
    per_floor: 50
    guardian_rolls: 3
    guardian_unique: 5     # 2026-11-07 照站長「機率調到 5%」；同日稍早 1%（「阿茲里掉的 3 件傳奇改由守衛掉」），再之前 15
    # 2026-11-07 照站長「祭紋華袍改成會掉落，只在深坑小怪掉、不能賭博」：深坑守衛以外的怪每隻擲 chance%（吃物品數量），
    #   魔法或稀有、未鑑定，物品等級照怪物等級（要到基底的掉落等級 65）。
    base: { id: body_str_dex_int_01, chance: 0.2 }
    weights:
      vaal_infuser_armour: 100      # 蝕鎧灌注器
      vaal_infuser_weapon: 100      # 蝕鋒灌注器
      vaal_infuser_caster: 60       # 蝕杖灌注器
      vaal_siphoner: 50             # 蝕吸器
      vaal_infuser_jewellery: 40    # 蝕環灌注器
      core_destabiliser: 35         # 擾核石
      extraction_orb: 35            # 剝符石（2026-11-11 同日拿掉又照站長加回來）
      ancient_infuser: 30           # 古蝕灌注器
      vaal_cultivation_orb: 30      # 蝕培石
      crystal_corruption: 15        # 晶蝕石
      architect_orb: 8              # 雙蝕石

# 2026-11-04 照站長「先做絕境」：絕境（照 PoE 的 Ultimatum）。地圖裡照機率放一座審判之壇（佔一個房間當場地），右鍵開始：
#   每回合先從三個懲罰挑一個（挑過的整場都疊著），回合種類照 types 抽：kill 殲滅（seconds 秒內殺 base + per_round×(回合−1) 隻，人多再多）、
#   survive 生存（撐 base + per_round×(回合−1) 秒）、circle 守圈（站在光圈裡累積 base + per_round×(回合−1) 秒，圈每 move_seconds 秒換位置，時限兩倍）。
#   刷怪：每個人附近每 spawn.every 秒一群 spawn.group 隻，每回合 ×(1 + per_round×(回合−1))；場上最多 40 隻。
#   打完一回合累積 rewards.per_round 份（第一回合 → 最後一回合）的獎勵（種類照 weights 抽），可以收手拿走或續押；
#   失敗（時間到、離開場地超過 leave_seconds 秒、全員倒下）全部沒收；打完全部回合乘 final_multiplier。
#   懲罰（modifiers，權重 0 = 不出）：monster_damage 怪物狂怒 +40%、monster_life 怪物鐵壁 +60%、monster_speed 怪物疾行（極速的）、
#   monster_more 怪物增援 +50%、recovery 回復受阻（生命、魔力回復速度更少 50%）、slow 步履維艱 −25%、vulnerable 脆弱（受到的傷害 +25%）、
#   resist 抗性削弱 −20、cooldown 冷卻遲滯 +35%、fire_ground 烈焰地面、chill_ground 霜寒地面、shock_ground 感電地面。
ultimatum:
  chance: 0.2
  rounds: 5
  prepare_seconds: 1       # 2026-11-04 照站長；這次之前 5
  leave_seconds: 10   # 2026-11-14 照站長「把 4 秒改長」（原作「離開場地太久」才失敗，沒公布秒數）；這次之前 4
  kill: { base: 12, per_round: 6, seconds: 60 }
  survive: { base: 15, per_round: 5 }   # 2026-11-04 照站長「生存減半」；這次之前 30＋10
  circle: { base: 7.5, per_round: 2.5, radius: 5, move_seconds: 8 }   # 2026-11-04 照站長「守圈減半」；這次之前 15＋5。照站長「光圈大一點」半徑 3.5 → 5 格
  spawn: { every: 2, kill_every: 0.5, group: [2, 4], per_round: 0.25 }   # 2026-11-04 照站長：殲滅 0.5 秒一群（kill_every）；生存、守圈照舊 2 秒
  magic: { start: 0.2, end: 0.5 }
  rare: { start: 0.05, end: 0.15 }
  types: { kill: 40, survive: 30, circle: 30 }
  rewards:
    per_round: [1, 2]
    final_multiplier: 1      # 2026-11-04 照站長「收手 ×1」；這次之前 2
    boss_multiplier: 2        # 2026-11-04：打完全部回合再挑戰審判者（maps.yml 的 event_bosses.ultimatum），贏了再乘這個（照站長「贏了 ×2」：1 × 2；這次之前 2 × 2 = ×4）
    # 2026-11-04 照站長：＋core 魂核符文 12（runes.yml 的 core_＊，65 級以上的圖才有，不夠退回通貨）、wager 賭注通貨 6（一次一疊，照 PoE2 的 Wager；種類與數量在 MapRewards.WAGERS）；
    #   這次之前 { currency: 35, emotion: 15, essence: 15, jewel: 10, map: 10, catalyst: 10, omen: 5 }
    weights: { currency: 30, emotion: 13, essence: 12, jewel: 8, map: 8, catalyst: 8, omen: 3, core: 12, wager: 6 }
  modifiers: { monster_damage: 10, monster_life: 10, monster_speed: 10, monster_more: 10, recovery: 10, slow: 10, vulnerable: 10,
               resist: 10, cooldown: 10, fire_ground: 10, chill_ground: 10, shock_ground: 10 }

# 2026-11-04 照站長「軍團」：軍團（照 PoE 的 Legion）。地圖裡照機率放一座時沉石碑（佔一個房間），右鍵敲開：兩支軍隊凍在房間兩側，
#   freeze_seconds 秒內打到的才會醒來（沒打到的消失），醒來的殺了才掉東西；凍著的時候打死也算。兩軍合計 soldiers 隻（每多一個人 ×(1 + per_player)）：
#   reward_carriers 隻帶著 1 份獎勵（名字寫著種類）、sergeants 隻軍曹（稀有、sergeant_shares 份）、generals 隻將領（傳奇、general_shares 份、生命 ×general_life；
#   最多 2，一邊一隻）；其他是普通兵（只掉一般的東西）。獎勵種類照 rewards.weights。
legion:
  chance: 0.2
  freeze_seconds: 25
  soldiers: 24
  per_player: 0.5
  reward_carriers: 6
  sergeants: 2
  generals: 2
  general_life: 3.0
  rewards:
    sergeant_shares: 2
    general_shares: 3
    # 2026-11-04 照站長「這些放地圖內軍團掉落」：＋idol 魔偶符文 12（runes.yml 的 idol_＊，50 級以上的圖才有）；這次之前 { currency: 35, rare: 15, essence: 15, jewel: 10, map: 10, catalyst: 10, omen: 5 }
    weights: { currency: 31, rare: 13, essence: 13, jewel: 9, map: 9, catalyst: 9, omen: 4, idol: 12 }
  # 2026-11-04 照站長「軍團也要有 Boss」：時沉領域（地圖裝置用徽記開的 Boss 場；Boss 寫在 maps.yml 的 event_bosses.legion）
  domain:
    name: 時沉領域
    emblem: legion_emblem
    cost: 5
    general_drop: 1.0       # 將領掉徽記的機率（1 個）
    sergeant_drop: 0.3      # 軍曹掉徽記的機率（1 個）
    level_bonus: 2          # 怪物等級比你打過最高的地圖階級多幾級


# 地圖變化（2026-10）：讓同一張圖每次打起來不一樣。每一種各自照機率出現，機率寫 0 就關掉。
# 只放在一般的地圖（回響、試煉、極境、巔峰不放）；終局 Boss 不會有 Boss 變體與 Boss 房干擾。/ec map 的狀態會列出這張圖有哪些變化。
twists:
  # 房間主題：沒有事件的房間各自照機率變成某種主題（走進去畫面中間會提示）
  #   elite 精英巢穴（只有 2～3 隻稀有怪）、swarm 怪物潮（普通怪 × swarm_size）、dark 黑暗房（看不清楚，魔法 ×1.5、稀有 ×3）、
  #   vault 寶庫（沒有怪群，只有一個寶箱）
  room_theme_chance: 0.3
  room_themes: { elite: 30, swarm: 30, dark: 25, vault: 15 }
  swarm_size: 2.5
  # 怪物混搭：照機率從別張地圖借一個族群，每一群照 mix_share 的機率用借來的
  mix_chance: 0.5
  mix_share: 0.35
  # 流浪精英：一隻生命 ×life、傷害 ×damage 的稀有怪在房間之間遊蕩，打倒牠物品數量 +quantity%
  wanderer_chance: 0.35
  wanderer: { life: 4.0, damage: 1.3, quantity: 200 }
  # 事件疊加：每個放好的事件照機率在同一個房間多放一個不同種類的
  stack_chance: 0.12
  # Boss 變體：empowered 強化（生命 ×1.5、傷害 ×1.25、掉落 +50%）、twin 雙生（開打多一隻分身，兩隻生命各 ×0.6，掉落 +25%）
  boss_variant_chance: 0.15
  boss_variants: { empowered: 60, twin: 40 }
  # Boss 房干擾（開打後）：meteors 墜星、hands 冥河之手、embers 流火（場地危害）、reinforce 援軍（每 20 秒一波魔法怪）、
  #   pillar 守護之柱（開打先張護盾：40 秒內打掉兩根柱子，不然回 25% 生命）
  boss_room_chance: 0.25
  boss_rooms: { meteors: 25, hands: 25, embers: 20, reinforce: 15, pillar: 15 }
  # 命運岔路：兩根石碑二選一——血路（之後的怪物群 +50%、物品數量 +30%）或王道（Boss 生命傷害 +30%、Boss 掉落 +50%）
  fork_chance: 0.25
  # 詛咒寶匣：接受馬上拿一份好東西，之後刷的怪生命與傷害 +cursed_power%（Boss 一半）；拒絕就消失
  cursed_chance: 0.2
  cursed_power: 25
  # 限時挑戰：第一次走進普通房間時照機率觸發（一張圖最多 2 次），房間的怪一次全出來，timed_seconds 秒內殺光有獎勵
  timed_chance: 0.15
  timed_seconds: 50
  # 隱藏房：一間死路房間的入口被裂開的牆封住，左鍵敲 6 下打破，裡面有精英與寶箱
  hidden_chance: 0.25
