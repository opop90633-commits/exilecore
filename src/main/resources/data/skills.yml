  # 主要寶石本身不打人，用的是插在它裡面的所有法術（2026-10-22；以前是面板上「它後面那一格」；2026-10-26／27 照 PoE2 每一孔都能放）；其他孔的輔助都套在它們上面。
  # meta 區塊：kind（totem 法術圖騰；crit／ailment／dodge／barrier／minion_death／melee_kill／spell_cast 常駐、保留精魂）、
  #   energy 條件成立一次給的基礎能量（暴擊、元素異常、近戰擊殺再乘怪物強度：一般 1、魔法 2、稀有 5、傳奇 20；冰凍再 ×10；
  #   暴擊再乘打掉異常門檻的 %；翻滾乘格；barrier 乘扣掉的護盾）、max_energy（2026-10-26：寫了就是 PoE2 的 Invocation，存到這裡、按下去才觸發）、
