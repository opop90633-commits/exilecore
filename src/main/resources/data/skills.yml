    description: 主要寶石（常駐）：綁在上方按鍵格就開著，保留 60 精魂。你用近戰技能擊殺敵人時獲得 100 點能量（乘怪物強度），能量到插槽法術的上限就觸發它一次。插槽是技能面板上它後面那一格的法術，不花魔力。
