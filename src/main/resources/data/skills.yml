    type: attack
    tier: 3
    tags: [attack, projectile, area, fire, shapeshift, wyvern]
    weapons: [talisman]
    mechanic: projectile
    projectile: { speed: 0.9, range: 24, size: 0.5, gravity: 0.05, fuse: 1.6, explode: [2.2, 2.8] }
    convert: { fire: 1.0 }
    attack_speed: 0.85           # PoE2：攻擊速度 85%
    effectiveness: [1.3, 1.82]   # PoE2 218% × 0.6 = 131%，每次彈跳都打；我們只炸最後一下，抓 1.4 倍
    mana: [6, 14]
    visual: fireball
    modifiers:
      - { stat: ignite.chance, type: FLAT, value: 25 }
  devour:
    name: 噬咬
    description: 飛龍一口咬住前方的敵人，造成傷害的一部分偷取為生命。冷卻 2 秒。（飛龍形態）
    icon: LEATHER   # 2026-10：原本 COOKED_BEEF（原版右鍵有動作：放方塊、穿戴、吃、使用…會干擾施放）
