    mana: [5, 12]
    visual: whirl
    modifiers:
      - { stat: stun.buildup, type: MORE, value: 60 }
  rolling_magma:
    name: 熔球
    description: 飛龍吐出一團熔岩，在地上彈跳著往前滾，最後炸開，容易點燃。物理全部轉換為火焰。（飛龍形態）
