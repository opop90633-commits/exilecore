  # -- 飛龍（法術）--
  # 2026-10：飛龍技能照 PoE2 改成「攻擊」——吃獸魂符的武器傷害、攻擊速度、命中與攻擊類的輔助（以前是自帶基礎傷害的法術，
  #   拿獸魂符沒有法術詞綴可以撐）。火焰的三招物理全部轉換為火焰（PoE2 是 100%）。
  #   倍率對照 poe2db 的 20 級數值（鼓翼風 265%、熔球 218%、噬咬 235%、黏油 281%、熾息 109%），照熊技能的換算比例
  #   （PoE2 爪擊 290% ↔ 撼山爪 168%、狂暴重擊 254% ↔ 震野踏 154%，約 0.6 倍；1 級是 20 級 ÷ 1.4）：
  #   鼓翼風直接照換；熔球我們只有最後炸一下（PoE2 每次彈跳都打），所以抓高一點；噬咬我們是有冷卻的一口咬（PoE2 是吃屍體拿球，用途不同）；
  #   黑油雨、熾息 PoE2 有球／怒氣／10 秒冷卻限制，我們沒有，所以照「平均下來」的強度抓，不是直接乘 0.6。
