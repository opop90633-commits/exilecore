  # 焚心業火（2026-10，照 PoE 的正義之火）：開著的時候每半秒燒一下周圍的敵人（傷害是 damage，吃法術、火焰、範圍的加成，會暴擊、會點燃），
  # 自己每秒也受到最大生命＋能量護盾 burn.self% 的火焰傷害（火焰抗性減免；在營地不燒）。只對自己有效（allies 預設 false）。

  # ---- 捷光環（2026-10：拿掉 aura 標籤，自動加 herald；光環的輔助、光環效果不吃，保留效率的加成照吃）：擊殺時觸發效果的光環（效果是隱藏技能，用使者的等級與輔助）----
  # 2026-10（照 PoE2）觸發條件，寫在 on_kill 裡（都不寫 = 殺死就觸發）：
  #   attack: true     最後一擊要是你自己的攻擊擊中（法術、持續傷害、召喚物、捷自己的效果打死的不算）
  #   ailment: shock   死的時候身上要有這種異常：ignite、chill、freeze、shock、bleed、poison、stun、electrocute
  #   overkill: 20     過量擊殺：最後一擊多打出來的傷害至少是牠最大生命的 20%（一定要是你自己的攻擊擊中）
  #   燼使 = 攻擊過量擊殺 20%；雷使 = 攻擊殺死感電中的；霜使 = 攻擊殺死凍結中的；血宣 = 殺死流血中的；疫使 = 殺死中毒中的

