    meta: { kind: ailment, energy: 10, energy_more: [0, 57] }
    cast_time: 0.5
    cooldown: 1.5
    mana: 0
    visual: aura_purity

  meta_dodge:
    name: 翻滾引星
    description: 主要寶石（常駐）：綁在上方按鍵格就開著，保留 100 精魂。你每次翻滾獲得 12 點能量，能量到插槽法術的上限就觸發它一次。插槽是技能面板上它後面那一格的法術，不花魔力。
    icon: FEATHER
