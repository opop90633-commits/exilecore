  meta_damage_taken:
    name: 受創引星
    description: 主要寶石（常駐）：綁在上方按鍵格就開著，保留 100 精魂。你每次被敵人擊中獲得 30 點能量，能量到插槽法術的上限就觸發它一次。插槽是技能面板上它後面那一格的法術，不花魔力。
