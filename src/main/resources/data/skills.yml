  # ---- 2026-10：主要寶石（照 PoE2 的 Meta Gem：法術圖騰、Cast on X）----
  # 主要寶石本身不打人，用的是技能面板上「它後面那一格」的法術（那一格就是它的插槽，那個法術不能自己按）。
  # meta 區塊：kind（totem 法術圖騰；crit／ailment／dodge／damage_taken／minion_death／melee_kill 常駐、保留精魂）、
  #   energy 條件成立一次給的基礎能量（暴擊、元素異常、近戰擊殺再乘怪物強度：一般 1、魔法 2、稀有 5、傳奇 10；冰凍再 ×3）、
  #   energy_more 能量獲得量增加幾 %（隨寶石等級）、less_damage／more_damage 插槽法術更少／更多幾 % 傷害、
  #   法術圖騰的 charges（消耗幾顆銳星或磐星）、per_power、per_endurance、less_cast_speed、totems（隨寶石等級）。
  # 能量上限照插槽法術的基礎施法時間：每 0.1 秒 10 點（熾星彈 1.2 秒 = 120）。以前的觸發輔助（暴擊觸發…）、圖騰施法輔助已經拿掉。

  totem_casting:
    name: 星咒圖騰
    description: 主要寶石：技能面板上它後面那一格的法術就是插槽。放的時候消耗 3 顆銳星或磐星（銳星先用），放下一根圖騰替你施放插槽法術；每消耗一顆銳星插槽法術更多 10% 傷害，每消耗一顆磐星圖騰更多 20% 生命與持續時間。插槽法術施法速度更少 25%，不能插有冷卻的法術。圖騰持續 8 秒，最多 1 根（15 級起 2 根）。
    icon: NAUTILUS_SHELL
    type: spell
    tier: 7
    tags: [totem, duration]
    mechanic: meta
    meta: { kind: totem, charges: 3, per_power: 10, per_endurance: 20, less_cast_speed: 25, totems: [1, 2.4] }
    cast_time: 0.6
    mana: [10, 40]
    visual: aura_armour

  meta_crit:
    name: 暴擊引星
    description: 主要寶石（常駐）：綁在上方按鍵格就開著，保留 100 精魂。你用技能暴擊敵人時獲得能量（每次 10 點，乘怪物強度：一般 1、魔法 2、稀有 5、傳奇 10），能量到插槽法術的上限（基礎施法時間每 0.1 秒 10 點）就觸發它一次。插槽是技能面板上它後面那一格的法術，更少 20% 傷害、不花魔力。
    icon: ECHO_SHARD
    type: spell
    tier: 14
    tags: [persistent]
    mechanic: aura
    aura: { reserve: 100, radius: 8, allies: false }
    meta: { kind: crit, energy: 10, energy_more: [0, 57], less_damage: 20 }
    cast_time: 0.5
    cooldown: 1.5
    mana: 0
    visual: aura_haste

  meta_ailment:
    name: 異變引星
    description: 主要寶石（常駐）：綁在上方按鍵格就開著，保留 100 精魂。你讓敵人冰凍、感電或點燃時獲得能量（感電、點燃 10 點，冰凍 30 點，再乘怪物強度），能量到插槽法術的上限就觸發它一次。插槽是技能面板上它後面那一格的法術，不花魔力。
