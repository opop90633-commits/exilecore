  # 2026-10：連珠（照 PoE2 的 Barrage，名稱是自己的）。增益型：放了之後下一次「弓或矛的投射物攻擊」自動重複。
  #   barrage 區塊（只有 mechanic: guard 的技能能寫；增益撐幾秒寫在 guard.duration）：
  #     repeats               重複幾次（不含原本那一次）
  #     charge / per_charge   施放時用掉身上全部的這種戰星，每顆多重複幾次（最多總共 12 次）
  #     less                  每次重複少幾 % 傷害
  #     gap                   每次重複隔幾秒（重複的時候不能做別的）
  #     cooldown_attack_time  增益用掉之後，冷卻 = cooldown ＋ 被強化那一招攻擊時間的這個 %（1 級 → 20 級），最多 max_cooldown 秒
  #   每次重複都是重新射一次：不花魔力、可以再打到同一個敵人（跟「多一支投射物」不一樣）。
  #   有冷卻的攻擊、引導技能、自己就會重複的技能不能被強化。魔力照伺服器的尺度（PoE2 是 11～51）。
  linked_volley:
    name: 連珠
    description: 搭好連珠的架勢：五秒內你下一次弓或矛的投射物攻擊會自動重複兩次（不花魔力），每次重複少 50% 傷害，但都能再打到同一個敵人。施放時用掉身上全部的怒星，每顆多重複一次（最多 12 次）。有冷卻的攻擊、自己會複擊的攻擊不能強化。用掉之後冷卻＝2 秒＋那一招攻擊時間的 6 倍（20 級 4.1 倍），最多 30 秒。不能掛觸發輔助。
    icon: RABBIT_HIDE   # 2026-10：原本 SPECTRAL_ARROW（箭矢會被原版弓當成彈藥、望遠鏡右鍵會拉近，影響施放）
    type: spell
    tier: 5
    tags: [duration]
    weapons: [bow, spear]
    mechanic: guard
    guard:
      duration: 5
      slow: 0
    barrage:
      repeats: 2
      charge: frenzy
      per_charge: 1
      less: 50
      gap: 0.2
      cooldown_attack_time: [600, 410]
      max_cooldown: 30
    cast_time: 0.7
    cooldown: 2
    mana: [6, 14]
    visual: rapid_fire

