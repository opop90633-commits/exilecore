# 技能（階段 3）。改完在遊戲內 /ec reload。
#
# 技能等級 1–20。寫成 [等級 1 的值, 等級 20 的值] 的數值會線性內插（整數無條件捨去），只寫一個數字就是固定值。
# 2026-10-26：effectiveness、mana 也可以寫逐級表 [等級 1, 等級 2, …, 等級 40]（三個以上就是逐級，不內插；照 PoE2 的寶石表，
#   21～40 級是裝備「+技能等級」才到得了的）。法術的 damage 可以寫 [[最小, 最大], [最小, 最大], …]（從等級 1 開始每一級的實際傷害，
#   不乘 spell_damage_growth、也不乘 extra_level_damage）。照 poe2db 改的技能都是這種寫法，舊值留在行尾註解。
#
# type       attack：攻擊，用武器傷害 × effectiveness（傷害效益），吃攻擊速度，會擲命中
#            spell：法術，用自己的 damage（等級 1 的基礎傷害，再乘 spell_damage_growth；逐級表就是那一級的傷害），吃施法速度，必中；
#                   裝備的「法術附加」乘 effectiveness 加上去（沒寫是 100%；一次打很多下的法術低一點，例如游雷 50%）
#                   戰吼也寫 spell（吼的動作照施法時間、施法速度），但不算法術：不帶 spell 標籤，法術的輔助寶石掛不上去（2026-10）
# tags       標籤：修飾器靠它決定吃不吃得到（「增加 x% 投射物傷害」要有 projectile）；攻擊另外會加上武器的標籤
# weapons    需要的武器標籤（任一符合）：melee 近戰武器（含徒手）、bow 弓、crossbow 弩、wand 法杖、staff 長杖、
#            quarterstaff 長棍、spear 矛；沒寫 = 什麼武器都能用
# mechanic   運作方式，參數寫在同名的區塊：
#              strike      近戰打擊：reach 距離、angle 扇形角度、targets 最多幾個（0 = 全部）、knockback 擊退、
#                          execute: { below: 0.35, more: 150 } 處決（目標生命低於 35% 時更多 150% 傷害）
#              projectile  投射物：count 數量、spread 扇形角度（360 = 平均分一整圈）、speed 每 tick 幾格、range 射程、size 碰撞半徑、
#                          pierce 穿透、explode 爆炸半徑、wobble 亂竄角度、arrow 用原版箭矢（弓、弩）、
#                          gravity 每 tick 往下掉幾格（拋物線）、fuse 幾秒後自己炸（榴彈：不直接打敵人、碰到方塊會彈）、
#                          blink: true 停下來的地方施放者瞬移過去、
#                          splash: { targets: 3, radius: 5, damage: 50 } 打中時再電到附近幾個敵人（各 50% 傷害）、
#                          burst: { count: 4, interval: 2 } 一次施放分成幾波連續射出（每波間隔幾 tick）、
#                          scatter: { count: 4, spread: 360, damage: 60, range: 10 } 停下時往四周散射幾支小的
#                            （2026-10-26：count 可以隨等級 [8, 11]；on_hit: true 改成打中敵人時往前噴出；effectiveness 小的自己的傷害效益、
#                            convert 小的自己的轉換——凝霜箭的冰片）、
#                          vortex: { duration, radius, interval, pull, damage } 停下時留下把敵人吸進去的漩渦、
#                          ground: { duration, interval, radius, damage } 停下時留下地面效果（毒氣）
#              nova        以自己為中心：radius 半徑；aftershock: { delay: 0.9, radius: 1.6, more: 60 } 餘震（過一下再炸一次更大圈）
#              cone        前方扇形：length 長度、angle 角度
#              leap        跳躍：range 最遠幾格、radius 落地範圍
#              chain       連鎖：range 第一個目標最遠幾格、chains 連鎖次數、chain_range 每次連鎖最遠幾格
#              dash        位移：往面向的方向瞬移 range 格（被牆擋住就停，可以爬 1 格、下 3 格）；
#                          hit_width 順路打到離路線多近的敵人（0 = 不打）、knockback、start_radius／end_radius 起點與終點炸一圈、
#                          ground: {...} 沿路留下地面效果（燃燒地面）
#              impact      延遲落下：準心指的地方（最遠 range 格）delay 秒後落下，半徑 radius（萬箭齊落、隕星）
#              zone        地面效果：range（0 = 自己腳下）、shape: circle 或 line（面前橫向一道，length 長）、radius、
#                          duration 持續幾秒、interval 幾秒一波、damage 每波是技能傷害的幾 %、pull 每波往中心拉幾格、
#                          max 同時最多幾個（同一個玩家的同一個技能；超過的話最舊的先消失；0 或不寫 = 不另外限制）
#              mark        印記：range、duration 持續幾秒、taken 受到的傷害增加幾 %、self_only 只有你打它才增加（預設 true）
#              corpse      骸爆：range 準心最遠、search 準心附近多遠內找屍體、radius 爆炸半徑、percent 屍體最大生命的幾 % 當火焰傷害
#              desecrate   褻瀆：range 準心最遠、spread 屍體散開多遠、count 一次幾具、life 屍體大小（同等級一般怪最大生命的幾 %，照等級）
#              summon      召喚物：參數寫在 summon 區塊（技能自己不造成傷害，不寫 damage）：
#                          kind 原版生物（ZOMBIE、HUSK、SKELETON、STRAY、WITHER_SKELETON、VEX 會飛、IRON_GOLEM）、count 一次幾隻、
#                          max 同時最多幾隻（可以隨等級 [3, 5]）、fixed_max: true 不吃「+x 召喚物數量」、duration 活幾秒（0 = 永久）、
#                          life／damage 是「同等級普通怪」的幾倍（等級 = 技能等級的需求角色等級）、attack_speed 每秒幾下、
#                          speed 移動速度倍率、reach 攻擊距離、radius 打中時連目標周圍幾格一起打、
#                          corpse: true 要用附近（search 格內）一具屍體當材料、helmet／weapon 外觀、resists: { fire: 75 }、
#                          taunt 每隔幾秒吼一聲把 taunt_radius 內的怪引過來打它、buff: [...] 有一隻在的時候加在主人身上的
#                          ranged: 14 遠程（站在這麼多格內射擊，攻擊算投射物）、bolt 彈道外觀（arrow、fire、cold、lightning、chaos）
#                          召喚物只吃主人身上帶 minion 標籤的修飾器（「增加 x% 召喚物傷害」）與掛在技能上的輔助寶石
#              aura        光環：參數寫在 aura 區塊（技能自己不造成傷害、mana 寫 0）：綁在上方按鍵格就一直開著（2026-10，不用按）。
#                          reserve 保留多少精魂（2026-10 改版：光環改吃精魂，不再保留魔力；全部光環加起來不能超過你的最大精魂）、
#                          radius 隊友在幾格內有效、allies: false 只給自己（2026-10：召喚物也沒有；給隊友的光環才會給你的召喚物）、
#                          effects: [ { stat, type, value: [等級 1, 等級 20], tags } ] 效果（寫法跟輔助寶石一樣，value 可以隨等級）、
#                          on_kill: { skill: 隱藏技能代號, chance: 100 } 使者：擊殺時從屍體的位置放那個隱藏技能（用使者的等級與輔助）。
#                          開著的光環記在角色進度，重新登入會開回來；寶石拿出面板就關掉
#              warcry      戰吼：參數寫在 warcry 區塊（要有 cooldown）：radius 範圍、duration 增益與減益持續幾秒、taunt 敵人轉過來打你、
#                          heal: [8, 15] 立刻回復最大生命的 %、allies 隊友也拿到增益、buff: [...] 增益（隨等級）、
#                          debuff: { taken: [12, 25] } 範圍內的敵人受到的傷害增加（誰打都算）、
#                          exert: { count: 3, more: [30, 50] } 接下來幾次攻擊更多傷害、
#                          charges: { frenzy: 1, power: 1 } 立刻獲得幾顆戰星（charges.yml 的代號；只給自己，滿了就把最舊的那顆換新）；
#                          戰吼區塊外面可以寫 damage／damage_types（2026-10 PoE2）：吼的時候打半徑內的敵人一下（戰吼傷害，
#                          不算攻擊也不算法術，吃帶 warcry 標籤的加成，例如「戰吼增加 x% 傷害」）
#                          2026-10-26 照 PoE2 0.5：吼的時候算範圍內敵人的「強度」（普通 1、魔法 2、稀有 10、傳奇與 Boss 20），
#                          empower: { kind: attack／melee／slam／strike／shield, condition: heavy_stun／freeze, per: 10, cap: 50, ... }
#                            每 per 點強度強化一次那一類攻擊（最多算到 cap 點；有敵人至少 1 次，沒有敵人 0 次）；強化的內容：
#                            gain_fire 獲得 x% 傷害為額外火焰、cold_per_5_power: { min, max } 每 5 點強度附加冰冷、armour_break 破甲、
#                            extra_targets 打擊多打幾個、aftershocks 猛擊多幾次餘震、chilled_ground 猛擊留下冰緩地面、
#                            trigger 出手時觸發的隱藏技能、while_active 持續期間全部強化；
#                          guard: { per_5_power, power_cap, duration } 守護、ally_cold_per_5_power 隊友附加冰冷、combust 動搖的敵人死掉時燃爆、
#                          rage_per_power 每點強度給怒氣、glory 要幾點榮耀（沒有冷卻）、duration_per_endurance 用掉全部磐星每顆持續更多 x%、
#                          knockback 震退、volcanic: { steps, eruption } 火山步與火山噴發、minion_skills 增益只給這些召喚物；
#                          cry: false = 不是戰吼（戰旗、祭品、召歸令：不帶戰吼標籤，戰吼的輔助掛不上）。
#                          戰吼的使用時間只吃戰吼速度（warcry.speed），不吃施法速度；cooldown_bypass: endurance 冷卻中可以花磐星直接吼
#              flicker     瞬影：瞬移到準心指的敵人身旁打一下（沒指到就找 range 格內最近、看得到的），
#                          reach／angle／targets／knockback 跟 strike 一樣；只有玩家本人能放（圖騰、陷阱、雙詠不行）
#            另外可以寫 totem／trap／bell 其中一個區塊，技能就不是自己放，而是放下一個東西讓它放上面的運作方式：
#              totem: { duration: 8, interval: 1.0, range: 10, max: 1, head: TOTEM_OF_UNDYING, buff: [ {stat, type, value} ] }
#                     圖騰站著，每 interval 秒對 range 內最近的敵人放一次；max 同時幾根；buff 是圖騰在的時候加在你身上的
#              trap: { duration: 20, arm: 0.5, trigger: 2.0, max: 3, root: 0, head: TRIPWIRE_HOOK }
#                     陷阱丟到準心指的地方，arm 秒後可以觸發，敵人靠到 trigger 格內就放一次然後消失；root 把踩到的敵人定住幾秒
#              bell: { duration: 6, interval: 0.25, range: 4, rings: 8, head: BELL }
#                     鐘放在面前；你用攻擊打中離鐘 range 內的敵人它就響一次（最多 rings 次），每響一次照上面的運作方式打一次
# cooldown   冷卻時間（秒）：位移、榴彈、印記這類；放完要等，技能面板會顯示
# cooldown_bypass  冷卻中按下去可以消耗一顆這種戰星（charges.yml 的代號）直接放，冷卻重新算（瞬影擊：power 銳星）
# attack_speed  攻擊技能的攻速倍率（1 = 跟武器一樣）
# cast_time     法術的基礎施法時間（秒）；純位移、印記這種不造成傷害的法術可以不寫 damage
# convert       物理傷害轉換成其他類型的比例，例如 { fire: 0.5 }
# mana          魔力消耗
# visual        外觀（粒子與音效）：slash heavy_strike cleave slam leap arrow burning_arrow wand_bolt staff_bolt
#               fireball frost_nova spark arc crossbow_bolt explosive_bolt permafrost_bolt staff_sweep tempest
#               ice_cone spear_thrust lightning_spear whirl chaos_bolt blight_nova
#               dash whirling_blades flame_dash frostblink blink_arrow rain_of_arrows lightning_arrow tornado_shot ice_shot
#               earthquake comet blizzard flame_wall explosive_grenade gas_grenade rapid_fire storm_wave killing_palm
#               whirlwind_lance lunge hunters_mark void_rift
#               puncture viper_strike boneshatter caustic_arrow（異常狀態的技能）
#               ancestral_totem flame_totem shockwave_totem fire_trap lightning_trap bear_trap tempest_bell detonate_dead
#               raise_zombie summon_skeletons raging_spirits flame_golem
#               aura_cold aura_fire aura_lightning aura_armour aura_evasion aura_es aura_haste aura_purity aura_life aura_mana aura_precision
#               herald_ash herald_thunder herald_ice enduring_cry rallying_cry intimidating_cry
#               flicker star_cry（瞬影擊、聚星戰吼）
# starter       職業預設的起始技能。新角色的起始技能跟著建角色時選的新手武器（character.yml 的 starter.skills），
#               這裡只在沒有選武器時用。起始技能每個角色送一次，綁在右鍵
# hidden        普攻用（玩家看不到、不能加進面板）
# tier          技能階級：未切割技能寶石的等級要 ≥ 這個才雕得出來（PoE2；沒寫是 1）
# source        專屬的掉落來源（可省略）：寫了就雕不出來，只有那裡會掉（2026-10：awakener＝覺醒之主・虛星，
#               寫在 maps.yml 巔峰的 drops.extra：{ skill: 代號, chance: 機率 }，掉 20 級的）
# modifiers     技能自己帶的修飾器（寫法跟輔助寶石一樣，只對這個技能有效），例如熾星彈的點燃機率：
#               - { stat: ignite.chance, type: FLAT, value: 20 }   點燃機率 +20%（元素異常見 ailments.yml）
#
# 標籤自動補上：有 cooldown 的加 cooldown、dash／leap／flicker 加 movement（dash／leap 另外加 travel 突進）、有地面效果／漩渦／印記的加 duration、mark 加 mark、
# 有引信的投射物加 grenade、圖騰／鐘加 totem、陷阱加 trap（都加 duration）、骸爆加 corpse、
# 召喚加 minion 與 melee（召喚物用近戰打，近戰的輔助寶石可以掛；有持續時間的再加 duration）、
# 光環加 aura 與 area、戰吼加 warcry、area 與 duration（戰吼會拿掉 spell：戰吼不算法術）
# （輔助寶石的 requires 看這些：持久要 duration、速冷要 cooldown、兇猛召喚要 minion、強效光環要 aura、強勢戰吼要 warcry）。
#
# 技能是寶石（PoE2）：未切割技能寶石右鍵雕成技能寶石（等級 = 未切割寶石的等級），放進技能面板就學會；
# 升級也用未切割技能寶石：2026-10-27 照 PoE2 0.5，一顆直接把技能升到未切割寶石的等級（要比技能現在的等級高，角色等級也要夠新的等級）；
#   這次之前一顆升一級（寶石等級要 ≥ 新的等級）。
# 寶石等級比角色能用的高時，照角色能用的最高等級施放。輔助寶石寫在 supports.yml。

# 技能等級 → 需要的角色等級。2026-10-26 照 PoE2（poe2db：0, 3, 6, 10 … 84, 90；1 級的 0 寫 1）；
#   這次之前 [1, 2, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31, 34, 37, 40, 43, 46, 50, 64, 80]
level_requirements: [1, 3, 6, 10, 14, 18, 22, 26, 31, 36, 41, 46, 52, 58, 64, 66, 72, 78, 84, 90]
# 掉落用的等級：怪物等級到這裡就開始掉這一級的未切割技能寶石（也是沒寫逐級表的法術用的成長曲線）。
# 2026-10-26 需求等級改成 PoE2 後，掉落照原本的（19 級 T4 地圖起掉、20 級 T14 起掉；我們 T16 的怪是 84 級，照需求等級的話一般地圖就不掉 20 級）。
# 原作也是高階地圖掉 20 級寶石、角色要練到 90 級才用得了。
uncut_drop_levels: [1, 2, 4, 7, 10, 13, 16, 19, 22, 25, 28, 31, 34, 37, 40, 43, 46, 50, 64, 80]

# 怪物掉的未切割技能寶石是幾級：最高等級（＝這個怪物等級的角色能用的最高技能等級）、低 1 級、低 2 級…的權重（最多 5 個）。
# 2026-10：20/40/40（以前 60/30/10：T14 以上一張地圖就掉好幾顆 20 級，大家整疊丟垃圾桶）。
uncut_level_weights: [20, 40, 40]
# 某些等級只留幾成（等級: 0～1）：擲到這個等級時照這個機率留下，沒留下就整顆不掉（不會變成低一級的），其他等級不受影響。
# 2026-10：19、20 級降到三分之一（測試期一個終局玩家一天大約掉 30 顆 20 級，第一天打地圖就把所有技能補滿）
# 2026-10-18：18 級也降到三成（每一階地圖都掉、T4 起又是唯一沒打折的等級：一週 5 萬顆、是 17／19 級的 3.5 倍；補給商店照樣用金幣賣到 18 級）
# 2026-10-24（照市場報告：Lv.17～19 每個活躍帳號每週掉 70～115 顆、只用掉 6～10%，存量夠用 130～320 天）：17、18、19 再減半
uncut_level_scale: { 17: 0.5, 18: 0.15, 19: 0.165, 20: 0.33 }

# 法術的基礎傷害依「需求等級」放大的倍率（中間等比內插），讓法術跟得上武器與詞綴的成長。
# 照 balance.yml 算的：參考法術角色（熾星彈，法杖上有一條法術附加）的單體輸出約是參考攻擊角色（碎岩擊）的 8 成
# （熾星彈有範圍；每個寶石等級從拿到到下一級之前平均起來是 8 成）。/ec balance 會重算。錨點寫在寶石的需求等級上最準。
# 2026-10：法術成長拉高（80 級 ×1.8，中間照比例），20 級時法術跟攻擊一樣大約是 PoE2 係數的四成到一半（以前法術只有一到兩成）
# 2026-10-27 照站長「所有技能的魔力消耗砍半」：每個技能算好的魔力消耗再乘這個（輔助倍率、增加／減少、消耗效率照算，最後乘；0.1–10）
mana_cost_scale: 0.5
spell_damage_growth: { 1: 1.05, 10: 1.13, 20: 2.29, 30: 3.13, 40: 3.42, 50: 4.6, 64: 7.01, 80: 9.23 }

# 傳奇裝備的「+1 技能等級」可以讓技能超過 20 級（最高 40 級；照 PoE：21 級以上只有靠裝備）。
# 超過 20 級每多一級，法術的基礎傷害多幾 %（PoE 的 20 → 21 級大約 10%）；攻擊的傷害效益、範圍這些照 1 → 20 級的趨勢往上加。
# 2026-10：10 → 13。高裝的攻擊靠武器的本地詞綴、傳奇弓這些一路往上疊，法術在後期主要只靠「+技能等級」，
# 官網高裝角色直傷法術只有攻擊的三到五成（+10 級：×2.59 → ×3.39；+4 級：×1.46 → ×1.63）。
# balance 的參考法術角色 50 級會到攻擊的 2.07 倍（測試上限 2.1），再高要先重算 spell_damage_growth
extra_level_damage: 13
# 召喚物超過 20 級每多一級，生命與傷害多幾 %（2026-10：召喚流的「+召喚物技能等級」很好疊，比法術低；+8 級 ×1.48）。
minion_extra_level_damage: 5

