# 限定稱號（2026-10）：只有管理網頁「發放 → 時裝」或 /ec sponsor give <玩家> cosmetic title:<代號> 發得出來（抽不到、換不到）；
#   limited 寫來源，稱號選單上顯示「…限定」，沒有的人看不到。顏色可以是 "#rrggbb" 或 "gradient:#rrggbb:#rrggbb"（漸層）。stats：擁有就有的加成（寫法同登入天數稱號）。
limited_titles:
  s1_founder: { name: 創世拓荒者, color: "gradient:#39e7ff:#f2c14e", limited: "S1 贊助禮包",
                stats: [ { stat: drop.quantity, type: INCREASED, value: 5 } ] }   # 擁有就有：掉落物品數量 +5%

# 一組時裝（2026-10）：管理網頁「發放 → 時裝」選【整組】、或 /ec sponsor give <玩家> cosmetic bundle:<代號> 一次發整組（已經有的不重複給）；
