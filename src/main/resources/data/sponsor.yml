# 贊助（2026-10）：星幣、累積贊助的稱號與名字顏色、角色欄位、月卡、全服加倍、外觀特效、抽獎箱、登入天數稱號。
#
# 星幣：1 星幣 = 1 元。管理網頁「發放」選「星幣」，或主控台 /ec sponsor give <玩家> <數量> [bonus]
#   （贊助商城 Tebex 的指令也是這一行；bonus = 贈送的，不算進累積贊助）。離線的下次登入發。
# 戰鬥數值不賣：特效只是好看；全服加倍是全服一起吃的（買的人只有公告署名）。2026-10 起累積贊助各階有經驗、金幣 +5% 與死亡懲罰減免，
# S1 限定稱號有物品數量 +5%、物品稀有度 +5%（伺服器主決定的；跟下面的商業使用規範有衝突的風險，要注意）；
# 累積贊助的額外功能是方便性（倉庫、背包、上架格、排隊、聊天顏色、營地飛行），不加戰鬥數值。
# Minecraft 的商業使用規範（https://www.minecraft.net/usage-guidelines）不能賣影響遊戲的東西，新增東西時請注意。
# 改完 /ec reload。
#
# 抽獎箱的機率會寫在選單上（台灣的「機率型商品」要公開機率）：weights 是相對權重，選單照比例換算成百分比。

settings:
  enabled: true
  # 換日跟每日委託一樣（economy.yml 的時區）：月卡在換日的時候發
  # 一天在線多久才算「登入一天」（分鐘）
  login_minutes: 30

# 角色欄位：每次 +1，沒有上限（max 只是防手滑）
character_slot:
  price: 100
  max: 200

# 用星幣加的格子（整個帳號；跟累積贊助送的疊加）：每次 +1；max = 最多買幾次，0 = 沒有上限
stash_page: { price: 100, max: 0 }      # 倉庫頁（每頁 45 格）
bag_page:   { price: 300, max: 0 }      # 隨身背包頁（每頁 45 格，帳號裡每個角色都有）
# 2026-10：用星幣加大通貨袋（隨身背包的，每種通貨的上限 +step）與倉庫的地圖頁（+step 張）；max 是最多買幾次
pouch_upgrade: { price: 150, step: 2500, max: 4 }
map_upgrade: { price: 150, step: 500, max: 4 }
stash_currency_upgrade: { price: 150, step: 5000, max: 4 }   # 倉庫通貨頁：每次每種通貨的上限 +step（帳號共用）
listing:    { price: 50,  max: 0 }      # 市集商店頁的上架上限
rename_card: { price: 50 }            # 改名卡（2026-10）：一張改一次角色名字（/char rename；管理員不用卡）
# 公會（2026-10）
guild_rename_card: { price: 100 }     # 公會改名卡：一張改一次公會的名稱與標籤（會長用 /guild rename；管理員不用卡）
guild_stash_page: { price: 300, max: 0 }    # 公會倉庫頁：買給自己的公會（整個公會共用；頁是公會的，解散就沒了）。max = 一個公會最多買幾頁，0 = 沒有上限

# 月卡：買了之後每天（換日的時候，還沒上線的下次上線補發）發月卡幣、時裝幣到倉庫的「贊助頁」
monthly_card:
  price: 100
  days: 30
  daily_card_coins: 1
  daily_fashion_coins: 1
  # 2026-10 月卡福利（都不影響戰鬥）：
  welcome_fashion_coins: 5     # 開卡禮：買下就送
  welcome_card_coins: 10
  renewal_bonus: { second: 5, third: 10 }   # 連續續卡（還沒過期或昨天才到期就算連續）：第 2 個月、第 3 個月起多送的月卡幣
  daily_free_box: random       # 月卡每天送一箱免費開的箱子（boxes 的代號；空字串 = 沒有）；2026-10：沒開的會累積，贊助選單月卡旁邊開
  # 另外：有月卡名字前面有 ☾、傳送點免費、市集／交易所／面對面交易免手續費、5 組裝備、5 組天賦（含珠寶）切換、5 組星圖天賦切換（2026-10-21）、技能按鍵可以存多組、隨時更換昇華職業、天賦與昇華天賦退點免費（程式內建）

# 全服加倍：一罐 15 分鐘，全服一起加倍，公告是誰贊助的；同一種再買一次會接著延長（最多 max_minutes）
boosts:
  price: 10
  minutes: 15
  max_minutes: 240
  types:
    experience: { name: 全服經驗加倍,   label: 經驗,   icon: EXPERIENCE_BOTTLE, experience: 2.0 }
    quantity:   { name: 全服掉落數量加倍, label: 掉落數量, icon: CHEST,             quantity: 100 }
    rarity:     { name: 全服掉落稀有度加倍, label: 稀有度,  icon: AMETHYST_SHARD,    rarity: 100 }
    gold:       { name: 全服金幣加倍,   label: 金幣,   icon: GOLD_INGOT,        gold: 2.0 }
  # 2026-10 個人加倍藥：同樣四種、效果同上，只有買的人自己吃。
  # 2026-10-22：買了先存著，在贊助選單右鍵開、再右鍵關；下線自動關（剩的時間存回去）。存著的＋開著的最多 max_minutes；開著時再買接著延長
  # 跟全服加倍「加起來」不是乘起來：全服 2 倍＋個人 2 倍 = 3 倍（經驗、金幣各多 +100%；數量、稀有度各 +100%）
  personal:
    price: 10
    minutes: 20
    max_minutes: 240

# 累積贊助的稱號、名字顏色與額外功能（累積的星幣，花掉也算；贈送的不算）。用到過的最高一階（不是加起來）：
#   name_color：名字顏色，"#rrggbb" 或 "gradient:#rrggbb:#rrggbb"（漸層）
#   stash_pages：倉庫多幾頁　bag_pages：隨身背包多幾頁（每頁 45 格）　listings：市集商店頁最多上架幾件（一般玩家照 economy.yml 的 market.shop_slots）
#   bypass_full：伺服器滿了也進得來　chat_color：聊天可以用 &a、&l、&#rrggbb 上色　custom_title：自訂稱號（/sponsor title）
#   camp_fly：在營地可以飛（按兩下空白鍵）
#   experience、gold：經驗、金幣多幾 %（2026-10；到過的每一階疊加：6 階各 5% = 共 30%；只算這個人自己的：打怪的經驗、怪物掉給他的金幣）
#   （上面其他的照「用到過的最高一階」，只有 experience、gold 疊加；death_penalty 也是照最高一階）
#   death_penalty：死亡扣經驗改成幾 %（沒寫照 character.yml 的 map_death_penalty，10%；只會比原本輕）
# 2026-10-23 每一階的主打（都不影響戰鬥；照最高一階，cosmetics 是每一階到了都送）：
#   free_boosts: { per: day|week|month, count: N }  免費的全服加倍（贊助選單的加倍按右鍵用；自己選種類、公告照樣寫名字；不扣星幣）
#   character_slots: N   送幾個角色欄位（跟用星幣買的疊加）
#   weekly_boxes: N      每週送幾箱免費抽獎箱（跟月卡的免費箱一樣累積，/sponsor 開；要有 monthly_card.daily_free_box）
#   cosmetics: [代號]     到這一階就送的時裝（cosmetics 的代號；限定的也能送）
#   move_speed: N        移動速度 +N%（2026-10-24；到過的每一階疊加，跟 experience、gold 一樣：6 階各 5% = 共 30%）
#   login_message: true  自訂上線訊息（/sponsor login 一句話，最多 40 字，過髒話表）
#   level_fireworks: true 升級在頭上放一發煙火
#   all_cosmetics: true  所有非限定的時裝不用抽就能套（限定的：S1、S2、節慶、箱子限定的照舊）
#   lifetime_card: true  終身月卡（月卡的每日福利、免手續費、多組裝備等功能永遠有）
#   2026-10-23 晚（最高階再多的）：join_announce 上線全服公告＋音效；badge 名字前的徽章（最多兩個字）；
#   custom_name_color 名字顏色自選（/sponsor color #rrggbb… 或 rainbow）；monthly_rename_cards 每月送幾張改名卡；
#   guild_stash_pages 送公會幾頁倉庫（一個公會送一次，換公會再送）；raft_size 星骸之海的筏多蓋幾格；bed_stamina 吊床多回幾點；
#   boost_minutes 他放的全服加倍多幾分鐘；entry_aura 進營地、進地圖的金色進場特效
# TAB 的順序（2026-10-23）：管理員 → 贊助（階級高的在前）→ 一般玩家；同一群裡等級高的在前
tiers:
  - { amount: 1000,  id: patron_1, title: 星塵贊助者, color: "#9fd3ff", name_color: "#cfeaff",
      stash_pages: 1,  bag_pages: 0, listings: 7,  bypass_full: true, chat_color: true, camp_fly: true,
      experience: 5, gold: 5, move_speed: 5, death_penalty: 9,
      login_message: true, level_fireworks: true }
  - { amount: 3000,  id: patron_2, title: 星芒贊助者, color: "#7fe0c0", name_color: "#a8f5dc",
      stash_pages: 2,  bag_pages: 0, listings: 9,  bypass_full: true, chat_color: true, camp_fly: true,
      experience: 5, gold: 5, move_speed: 5, death_penalty: 8,
      free_boosts: { per: week, count: 1 }, character_slots: 1, cosmetics: [patron_halo] }
  - { amount: 5000,  id: patron_3, title: 星輝贊助者, color: "#f5d76e", name_color: "#ffe58a",
      stash_pages: 3,  bag_pages: 1, listings: 11, bypass_full: true, chat_color: true, camp_fly: true,
      experience: 5, gold: 5, move_speed: 5, death_penalty: 6,
      free_boosts: { per: week, count: 2 }, character_slots: 1, weekly_boxes: 1, cosmetics: [patron_wisp] }
  - { amount: 10000, id: patron_4, title: 星耀贊助者, color: "#ff9f5a", name_color: "#ffb98a",
      stash_pages: 5,  bag_pages: 2, listings: 13, bypass_full: true, chat_color: true, custom_title: true, camp_fly: true,
      experience: 5, gold: 5, move_speed: 5, death_penalty: 4,
      free_boosts: { per: week, count: 3 }, character_slots: 2, weekly_boxes: 2, cosmetics: [patron_wings_ember, patron_lantern] }
  - { amount: 15000, id: patron_5, title: 星曜守護者, color: "#d68cff", name_color: "gradient:#e3a8ff:#9fd3ff",
      stash_pages: 7,  bag_pages: 3, listings: 15, bypass_full: true, chat_color: true, custom_title: true, camp_fly: true,
      experience: 5, gold: 5, move_speed: 5, death_penalty: 2,
      free_boosts: { per: day, count: 1 }, character_slots: 3, weekly_boxes: 3, cosmetics: [patron_wings_galaxy, patron_crown] }
  - { amount: 25000, id: patron_6, title: 星骸至尊,   color: "#ffd24a", name_color: "gradient:#ffe27a:#ff8fe0",
      stash_pages: 10, bag_pages: 5, listings: 30, bypass_full: true, chat_color: true, custom_title: true, camp_fly: true,
      experience: 5, gold: 5, move_speed: 5, death_penalty: 0,
      free_boosts: { per: day, count: 2 }, character_slots: 5, weekly_boxes: 5, all_cosmetics: true, lifetime_card: true,
      cosmetics: [patron_star],
      join_announce: true, badge: "★", custom_name_color: true, monthly_rename_cards: 1, guild_stash_pages: 2,
      raft_size: 4, bed_stamina: 10, boost_minutes: 5, entry_aura: true }

# 登入天數的稱號（一天在線 settings.login_minutes 分鐘以上算一天；不用連續）。
# stats：擁有就有的小加成（2026-10；免費拿的才可以有加成，用錢買的稱號不能有），全部疊起來大約 +30 生命、+3% 生命、+15 魔力、各元素抗性 +3%
login_titles:
  - { days: 7,   id: login_7,   name: 星途旅人, color: "#c8c8c8", stats: [ { stat: life.max, value: 5 } ] }
  - { days: 14,  id: login_14,  name: 雙週行者, color: "#b5e3a1", stats: [ { stat: mana.max, value: 5 } ] }
  - { days: 21,  id: login_21,  name: 三週常客, color: "#8fdc8f", stats: [ { stat: life.regen, value: 1 } ] }
  - { days: 30,  id: login_30,  name: 月之常駐, color: "#7fd4ff", stats: [ { stat: life.max, value: 10 } ] }
  - { days: 60,  id: login_60,  name: 雙月守望, color: "#6fb8ff", stats: [ { stat: resist.fire, value: 3 } ] }
  - { days: 90,  id: login_90,  name: 季度老兵, color: "#8f9cff", stats: [ { stat: resist.cold, value: 3 } ] }
  - { days: 120, id: login_120, name: 星骸常客, color: "#a98cff", stats: [ { stat: resist.lightning, value: 3 } ] }
  - { days: 150, id: login_150, name: 五月星痕, color: "#c27dff", stats: [ { stat: flask.life_recovery, type: INCREASED, value: 5 } ] }
  - { days: 180, id: login_180, name: 半載星火, color: "#e07dff", stats: [ { stat: mana.max, value: 10 } ] }
  - { days: 210, id: login_210, name: 七月星河, color: "#ff7dd8", stats: [ { stat: accuracy, value: 30 } ] }
  - { days: 240, id: login_240, name: 八月星輝, color: "#ff7da0", stats: [ { stat: life.max, value: 15 } ] }
  - { days: 270, id: login_270, name: 九月星辰, color: "#ff9a6b", stats: [ { stat: drop.rarity, type: INCREASED, value: 2 } ] }
  - { days: 300, id: login_300, name: 三百日誌, color: "#ffb84d", stats: [ { stat: movement.speed, type: INCREASED, value: 2 } ] }
  - { days: 330, id: login_330, name: 星骸元老, color: "#ffd24a", stats: [ { stat: damage, type: INCREASED, value: 2 } ] }
  - { days: 360, id: login_360, name: 星骸周年, color: "#fff07a", stats: [ { stat: life.max, type: INCREASED, value: 3 } ] }

# 時裝（2026-10 全部換成 3D：tools/gen_models3d.py 自己堆的立體模型 → web/pack3d/；舊的粒子特效與平面幻化拿掉了）。
# 只改看起來的樣子，數值不變；在「贊助 → 裝備幻化」套上去。rarity：common 普通、rare 稀有、epic 史詩、legendary 傳說。
# slot：weapon 近戰武器、法杖；offhand 副手（盾、箭袋）；headgear 頭飾（套在「頭」，沒戴頭盔也看得到）；
#       back 背飾（翅膀、光輪，跟在背後）；pet 寵物（飄在左後方）；bow 弓、crossbow 弩（拉弓、上弦都有動作）；
#       armor 戰甲（頭、身、腿、腳一整套：頭盔是 3D，身、腿、腳是自己畫的戰甲貼圖）。art 是模型的代號（gen_models3d.py 裡的）。
