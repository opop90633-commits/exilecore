# 血脈輔助寶石（2026-10-27 照 PoE2 0.5 的 Lineage Support Gems；效果照 poe2db／RePoE，名稱是自己的）。改完在遊戲內 /ec reload。
#
# 跟 supports.yml 一樣的寫法（name、description、icon、tier、requires、excludes、mana_multiplier、modifiers、notes），SkillConfig 讀完
# supports.yml 之後再讀這個檔（代號不能跟 supports.yml 重複）。分開寫是為了跟一般輔助的修改不打架。
#
# 血脈輔助的規則：
#   - 切不出來（未切割輔助寶石切不出血脈輔助，照 PoE2）；只有怪物、Boss 會掉（下面的 drops）。
#   - 不算「一個技能只能掛一顆專屬輔助」的專屬輔助（PoE2 沒有這條限制）；同一顆血脈輔助照 once_per_character 的規則。
#   - source 寫掉落的等級：lineage（一般）、lineage_rare（稀有）、lineage_pinnacle（巔峰）。
#   - 有 I／II／III 的只留最高階（PoE2 的血脈輔助本來就只有一階）。
#   - 新的屬性鍵寫在 tw.exilecore.stats.LineageKeys（lineage.u. 不用擊中、lineage.h. 要擊中），機制在 LineageRules、LineageMechanics。
#
# ============================================================================================================
# 掉落的分級（2026-10-27 站長定：一般血脈 = 追逐級傳奇的 2 倍 ≈ 50 萬隻怪一顆；稀有的更難）
# ------------------------------------------------------------------------------------------------------------
#   追逐級傳奇：maps.yml 的 drops.chase_mob_chance = 0.000001（一般怪物每隻 1/1,000,000，T11 以上），地圖 Boss chase_chance = 0.00034。
#   怪物的稀有度照 monsters.yml 的 quantity 放大（跟其他掉落一樣：普通 ×1、魔法 ×5、稀有 ×20.8），
#   地圖裡怪物的組成（monsters.yml 的 weight 85／12／3）平均 ×2.074，所以「每隻怪平均」= 普通怪的機率 × 2.074。
#
#   等級         來源                          普通怪每隻         平均每隻（含魔法、稀有）   地圖 Boss 每次擊殺       終局／極境／巔峰 Boss
#   一般 lineage          地圖怪物、地圖 Boss    9.643e-7           2.0e-6（≈ 1/500,000）      0.00068（追逐級 ×2）     同左
#   稀有 lineage_rare     地圖怪物、地圖 Boss    2.411e-7           5.0e-7（≈ 1/2,000,000）    0.00017（追逐級 ×0.5）   同左
#   巔峰 lineage_pinnacle 地圖怪物、地圖 Boss    1.2055e-7          2.5e-7（≈ 1/4,000,000）    0.000085                 —（原本的 0.005 拿掉）
#   2026-10-27 站長：巔峰改成平均 400 萬隻怪一顆（這次之前只有終局、極境、巔峰 Boss 0.5%）
#
#   分級依據（poe2db 的掉落來源）：
#     一般：poe2db 寫 Global（哪裡都會掉）的。
#     稀有：只有特定 Boss（異常地圖的 Boss、深淵寶庫、時空裂隙、阿茲里神殿…）會掉的，或 poe2db 沒寫來源的。
#     巔峰：只有巔峰 Boss（阿茲里、奧洛斯、灰燼仲裁者、合眾者、時之札洛克）會掉、或改變整個玩法的
#           （三種增加技能等級的、混沌附加系列四顆、逆轉抗性、血契、焦血、萬封、燼裁、傲寒、血譽）。
#   一顆都要怪物等級 65 以上（地圖）；每個有份的人各擲一次；物品數量、稀有度、星圖天賦都不影響（跟追逐級一樣）。
# ============================================================================================================
drops:
  min_level: 65
  mob_chance: 9.643e-7          # 一般：普通怪每隻（魔法、稀有照 monsters.yml 的 quantity 放大；平均每隻 1/500,000）
  mob_rare_chance: 2.411e-7     # 稀有：普通怪每隻（平均每隻 1/2,000,000）
  boss_chance: 0.00068          # 一般：地圖 Boss（含具名、終局、極境、巔峰）每次擊殺
  boss_rare_chance: 0.00017     # 稀有：同上
  pinnacle_chance: 0            # 巔峰：終局、極境、巔峰 Boss 另外擲的機率（2026-10-27 站長：原本 0.005，拿掉）
  mob_pinnacle_chance: 1.2055e-7  # 巔峰：普通怪每隻（平均每隻 1/4,000,000；2026-10-27 站長）
  boss_pinnacle_chance: 0.000085  # 巔峰：地圖 Boss 每次擊殺（稀有的一半）

