  bhatairs_vengeance: lineage         # 霜仇嘯（Bhatair's Vengeance：Global）
  guatelitzi_ablation: lineage_rare   # 祭星（Guatelitzi's Ablation：阿茲里神殿）
  ailith_chimes: lineage_rare         # 鐘星（Ailith's Chimes：異常 Boss）
  morganas_tempest: lineage           # 掠嵐（Morgana's Tempest：Global）
  helbryms_hide: lineage              # 蟄甲（Helbrym's Hide：Global）

