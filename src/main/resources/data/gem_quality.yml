# 技能寶石的品質效果（2026-10-26 照 PoE2 0.5；資料來源 RePoE poe2 skills.json 的 quality_stats，琢星稜鏡加的品質用這個）：
# 每一行是「每 1% 品質給多少」：INCREASED／MORE 的 per 是百分點（1 = 每 1% 品質 1%），FLAT 照屬性本身的單位（投射物、連鎖是個數）。
# 只寫了 PoE2 的品質效果我們的引擎有對應屬性的技能（攻速、冷卻回復、施法速度、暴擊、投射物速度與數量、連鎖、範圍、點燃／冰緩／感電／中毒／凍結）；
# 沒寫在這裡的技能照舊（SkillService.qualityModifiers：光環、戰吼、詛咒每 1% 增加 0.5% 效果，召喚物每 1% 增加 1% 傷害，其他每 1% 增加 1% 傷害）。
# 範圍：PoE2 寫的是半徑 +x（0.1 格一單位），這裡照「+0.1 格 ≈ +10% 範圍」換算。
# 這次之前（2026-10-23～2026-10-25）所有技能都照上面的通用規則。
# 2026-10-27 照 PoE2 0.5：戰吼照 poe2db 寶石頁的 Quality 寫（每條 (0—x) 是 0%～20% 品質；屬性鍵見 stats/WarcryKeys.java，吼的時候 Warcries 讀）；
#   這次之前戰吼照通用規則每 1% 增加 0.5% 戰吼效果。神龕祝禱（原作沒有）照舊用通用規則。
# 2026-10-28 照 PoE2 0.5（站長「技能品質的部分也全部按照原作改」）：每顆有原作對應的技能寶石都照 RePoE quality_stats／poe2db 寫自己的品質效果
#   （對照工具 tools/audit_poe2_quality.py）；原作這顆寶石的品質沒有效果的寫 []（不再套通用規則）。
#   原作的效果我們的引擎沒有對應屬性的（列在 audit_poe2_quality.py 的 UNREP），才照舊用通用規則（平衡等效）。
# 2026-10-28（第二輪）：那時 UNREP 的 112 顆裡 111 顆都照原作接上了引擎（新的屬性鍵在 stats/GemQualityKeys.java；說明在 skill/GemQualityText.java）：
#   effect.＊ 是「增益本身的數值」（PoE2 的 *_to_apply、Buff grants x），加在光環／常駐增益／印記／守勢／狂暴原本同一條上（SkillBuild.withQualityEffects），
#   隊友、召喚物拿到的那份一樣有；做不到一模一樣的照平衡等效寫（audit 的 APPROX，列出原因）；原作的效果我們沒有那個機制的寫 []（說明寫原因）。
#   驚雷劈（falling_thunder）由另一輪接上（每顆銳星再更多）。
#   poe2db 寶石頁 Additional Effects From Quality 的第二條是額外的品質效果（進階奇術才有，RePoE quality_stats 沒有那條），寫在下面 advanced；
#   急裝、瞬影擊、寒夜嗥、銀月庇這次之前把第二條算在一般品質裡，這次移到 advanced。

alchemists_boon:   # Alchemist's Boon（2026-10-28 照 PoE2：每分鐘另外獲得 (0—2) 點藥劑充能（生命、魔力藥劑各一份，加在增益上）；這次之前照通用規則）
