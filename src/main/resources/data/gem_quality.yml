# 原作每顆寶石除了一般的品質效果，還有一條「額外的品質效果」（poe2db 寶石頁 Additional Effects From Quality 的第二條；
# poe2db.tw/us/Advanced_Thaumaturgy 列了每一顆的）。只有昇華・嵌晶的進階奇術（Gem Quality grants Socketed Skills an additional effect）才有，
# 寫法跟上面一樣（每 1% 品質給 per）。這裡只寫我們的引擎有對應屬性的技能；沒寫的技能（額外效果的機制還沒有：例如火球的環射、
# 連鎖剩幾次更多傷害）有進階奇術時照舊把一般的品質效果再算一次（平衡等效，AscBuild.advanced）。
# 這次之前（2026-10-26～2026-10-27）沒有這個區塊，進階奇術一律是品質效果再算一次；下面標「從一般品質移過來」的那幾條這次之前算在一般品質裡。
