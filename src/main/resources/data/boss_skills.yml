# Boss 招式（地圖 Boss、試煉 Boss、區域 Boss）
# 改完 /ec reload 即可（正在打的 Boss 下一招就用新的）。
#
# 每隻 Boss 有一組招式（kit）：maps.yml／zones.yml 的 boss 寫 skills: 就用寫的，沒寫就照 defaults 裡那種生物的，
# 再沒有就用 defaults.default。寫法：
#   skills: [slam, charge]                                  只寫代號
#   skills:
#     - slam
#     - { id: meteor_storm, phase: 1 }                       phase: 第幾階段起才會用（地圖 Boss 的 phases；0 = 一開始就會）
#     - { id: summon_drowned, cooldown: 15, damage: 2.0 }    這隻 Boss 用這招時的冷卻、傷害倍率（覆蓋下面的設定）
#
# 招式的欄位（沒寫的用預設）：
#   kind      slam 延遲落下（地上先畫圈再炸）、nova 以 Boss 為中心一圈、cone 前方扇形、volley 齊射魔法彈、
#             zone 留一塊會一直傷害的地面、charge 衝鋒、summon 召喚小怪、curse 詛咒（受到的傷害增加）、blink 閃現到目標背後
#   at 還可以寫 maze（count 圈同心的風暴牆、每圈 gaps 個 gap_angle 度的缺口、最外圈 reach 格）、walls（朝目標兩排平行的牆，左右各 scatter 格、長 reach 格）
#   damage    「這隻 Boss 普通一下的幾倍」（跟 Boss 的等級、稀有度、maps.yml 的 damage 倍率一起長）
#   type      physical／fire／cold／lightning／chaos：物理轉成這個類型，吃玩家的對應抗性
#   convert   2026-10：物理只轉一部分（{ lightning: 0.3, fire: 0.3 }，總和最多 1，剩下的還是物理吃護甲；type 要是 physical）
#   track     2026-10（只有 beam）：前搖時紅線跟著目標轉，放出來之後每秒最多再轉 angle 度、不掃——賽勒斯的「死」
#   solid     2026-10（只有 zone）：這塊是牆，站進去的人每 tick 被往外推，穿不過（迷宮、走廊）
#   ruin      2026-10：被打到的玩家幾秒內禁療（生命回復、偷取、護盾回充停掉；藥劑照喝）——賽勒斯的荒蕪（黑水）
#   cooldown  冷卻（秒）   range 目標在幾格內才會用   telegraph 前搖（秒，Boss 站著蓄力、地上畫紅色警告；
#             會直接打到身邊的招至少 0.8，撲擊 0.9，才不會一瞬間跳臉）
#   slam：delay 前搖結束後幾秒落下、radius 半徑、count 幾顆、stagger 每顆間隔、scatter 落點隨機偏移、at self／target／random
#   nova／cone：radius／angle＋length、count 幾波、stagger 每波間隔
#   volley：count 幾發、spread 扇形張角、speed 每 tick 幾格、reach 最遠幾格、size 碰撞半徑、explode 打中時爆炸的半徑
#   zone：radius、duration 留幾秒、interval 幾秒一波、count 幾塊、scatter、at
#   charge：speed 每 tick 衝幾格、reach 最遠衝幾格、width 路線左右幾格內會被撞到
#   summon：summon 原版生物、count 一次幾隻、summon_max 同時最多幾隻、duration 小怪活幾秒（0 = 不限）
#   curse：radius、duration、taken 受到的傷害增加幾 %
#   blink：前搖時目標腳下畫圈（圈跟著目標走）；damage > 0 就是「撲擊」：落地後 0.7 秒在腳下炸一圈（radius），落地那一下用走的躲
#   ---- 特殊機制（2026-10；放的時候 Boss 站著不動，地上會標出危險或安全的地方）----
#   beam      光束掃射：count 道光束從 Boss 射出（length 長、左右各 width 格；2 道 = 一前一後、4 道 = 十字），前搖指著目標，
#             之後 duration 秒內一起轉 angle 度（往哪邊轉隨機），掃到的人每 interval 秒挨一下——繞著 Boss 跑、跟著光束轉的方向走
#   ring      擴散環：從 Boss 腳下往外擴散的環（從 radius 長到 reach，每 tick 長 speed 格、厚 width 格），count 波、每波隔 stagger 秒；
#             環上有 gaps 個缺口（每個 gap_angle 度，地上畫綠色）——站進綠色的缺口；gaps: 0 的環要跑到 reach 外面
#   pull      引力漩渦：duration 秒內把 radius 格內的人往 Boss 吸（每 tick speed 格，最多 0.15：跑步逃得掉），時間到在 explode 格內爆炸
#   orbs      追蹤光球：叫出 count 顆光球，各自慢慢追一個玩家（每 tick speed 格，最多 0.25：比跑步慢），
#             碰到人（size）或 duration 秒到了就在 explode 格內爆炸——帶著跑，別讓它們碰到
#   sanctuary 全場大招（翻滾躲不掉）：前搖很長（預設 2.5 秒），radius 格內的人全部挨打；地上出現 count 個綠色安全區（半徑 safe、離 Boss 大約 scatter 格）
#             ——躲進綠色的圈就沒事（傷害通常很高，站在外面基本上是死）
#   mark      點名標記（2026-10）：點 count 個玩家，標記（半徑 explode 的紅圈）跟著那個人走，duration 秒後（至少 2.5）在他腳下爆炸，
#             圈裡的人都挨打——被點名的人要離開隊友
#   echoes    殘影（2026-10）：Boss 周圍 scatter 格的圈上出現 count 個殘影，每隔 stagger 秒一個殘影朝某個玩家標出一條紅線
#             （長 reach、左右各 width），delay 秒後（至少 0.8）射穿——看紅線往旁邊走；Boss 站著放到最後一槍
#   arena     場地收縮（2026-10）：以 Boss 為中心，安全的圈在 duration 秒內從 reach 格縮到 radius 格（至少 4），之後維持到這場打完
#             （重置才消失）；圈外的人每 interval 秒挨一下。能放的時候優先放（換階段一開始就收縮）
#   兩招同時放（2026-10）：maps.yml／ascendancy.yml 的 skills 寫 { id: 招式, with: [另一招] }，放這招時另一招一起落下；
#             with 只能用 slam、zone、orbs、mark（放出去之後自己跑的），最多 3 招
#   場地危害（maps.yml／ascendancy.yml 的 boss 底下寫 hazards:）只能用 slam、zone、orbs、mark：每隔幾秒自己落在某個玩家附近
#   Boss 一次只做一件事（2026-10）：場地危害等 Boss 手上這一招放完才落（放完後的 gap 空檔裡就會落），落下之前不出新的招；
#   齊射還在飛、擴散環還在擴散、光球放出去不到 2 秒也算這一招還沒完（留在地上的區域不算）。放招時 Boss 原版的動作
#   （近戰、射箭、伏守者的音波）暫停；掛了這些招式的伏守者整場不用原版音波（音爆請用招式）
#   同一招打到同一個人不會疊在一起（2026-10）：齊射的好幾發、重疊的落點 0.5 秒內只算第一下，光球一次只會被一顆打到，
#   好幾塊地面效果疊在腳下也只照一塊算——damage 寫的就是「被這招打到一次」有多痛
#   新星的前搖要夠從 Boss 身邊跑出去：telegraph ≥ (radius − 2) ÷ 5.6 + 0.5 秒（跑步每秒大約 5.6 格），不然打中一下不能太痛
#   （單元測試：終局 Boss 來不及躲的招，最後一個階段、身上有牠的詛咒時，一下打不死滿血的參考角色）
#   slow      打中的玩家緩速幾秒   visual 外觀（boss_physical／boss_fire／boss_cold／boss_lightning／boss_chaos，沒寫照 type）
#   shout     發動時 Boss 喊的話（附近玩家看得到）
#   hint      怎麼應對（終局與試煉 Boss 放「特殊招式」時，畫面中間的大字下面那行與聊天室的說明；最多 32 個字）。
#             沒寫照運作方式給一句；新星、擴散環、光球、光束、漩渦、全場大招、詛咒、召喚、衝鋒、閃現一定算特殊招式，
#             其他的（落下的紅圈、地面效果、扇形、齊射）寫了 hint 才算。場地危害第一次落下時也會說明一次

settings:
  # 2026-10：Boss 出招快一點（照模擬：近身時地圖 Boss 一分鐘約 14 招 → 18 招、終局約 15 → 17 招；前搖都沒動）。
  #   以前 Boss 跟一般怪物共用 gap、first_delay，現在 Boss 用下面的 boss_ 開頭那幾個，路上的怪不變。
  gap: 1.5             # 一般怪物（詞綴、種類給的招式）兩招之間至少隔幾秒
  first_delay: 2.0     # 一般怪物出現後幾秒才開始用招
  boss_gap: 1.0        # Boss 兩招之間至少隔幾秒（Boss 之間普攻照常；場地危害可以落在這段空檔裡）。2026-10：1.5 → 1.0
  boss_first_delay: 1.5  # Boss 出現、重置、一陣子沒人之後重新看到人，幾秒才開始用招。2026-10：2.0 → 1.5
  boss_min_telegraph: 1.0  # 2026-10：Boss 招式的前搖至少幾秒（寫得比較短的招照這個；不要有來不及反應的招）
  boss_cooldown: 0.8   # Boss 招式冷卻的倍率（下面寫的 cooldown 再乘這個；場地危害照 maps.yml 的 every，不吃這個）。2026-10：1 → 0.8
  # 2026-10：有翻滾之後，這幾種 Boss 出招再緊一點——兩招之間的空檔（boss_gap）與招式冷卻再乘這個倍率（1 = 不變，越小越快；0.3～2）。
  #   前搖（telegraph、boss_min_telegraph）、落下的延遲、彈道速度都沒動：每一招看得到、躲得掉的時間跟以前一樣，只是喘息變短。
  #   一般地圖 Boss、劇情 Boss 不在這裡，照上面的 boss_gap／boss_cooldown。
  #   2026-10-17：不普攻的 Boss（終局、極境、巔峰、金庫之主、世界 Boss、南瓜王）少了普攻的壓力，出招再快約 25%（倍率 ×0.8）
  tempo:
    final: 0.55        # 終局 Boss（不普攻；以前 0.7）
    uber: 0.5          # 極境（不普攻；以前 0.6）
    pinnacle: 0.5      # 巔峰（萬界之巔；不普攻；以前 0.6）
    trial: 0.7         # 昇華試煉的 Boss（照常普攻）
    vault: 0.55        # 金庫之主（大劫盜；不普攻；以前 0.7）
    world: 0.55        # 世界 Boss（不定時活動；2026-10-17 起不普攻；以前 0.7）
    invasion: 0.7      # 入侵怪潮的統帥（照常普攻；以前跟世界 Boss 共用 0.7）
    festival: 0.55     # 南瓜王（萬燈夜；2026-10-17 起不普攻；以前跟世界 Boss 共用 0.7）
  warn_range: 24       # 幾格內的玩家會聽到 Boss 的喊話
  # 換階段（maps.yml 的 phases）：先停 phase_pause 秒不出新招（喊話、召喚、護盾先出來），
  # 這個階段才會用的招（寫 phase: 的）換階段後 phase_unlock 秒才開始用，不會一換階段就接大招。2026-10：2 → 1.5、4 → 3
  phase_pause: 1.5
  phase_unlock: 3.0
  # 追擊：目標在 chase_distance 格外、連續 chase_seconds 秒都打不到（站遠射箭）→ 用 gap_closer 這招跳過去（none = 不追）。
  # 2026-10：12 格／2.5 秒 → 9 格／2 秒（地圖 Boss 的招多半 7 格內才用，以前站 8～12 格打幾乎沒有招）
  gap_closer: pounce
  chase_distance: 9
  chase_seconds: 2.0

