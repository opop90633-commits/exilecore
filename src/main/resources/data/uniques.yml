  # 2026-10-27 照站長，比照 poe2db 的頂級弓（Lioneye's Glare 增加 150–240% 物理、Splinterheart 120–160%）與頂級稀有弓
  #   （Warmonger Bow：增加物理 T1 170–179% ＋ 混合 75–79% ＋ 附加 26–39 到 44–66 ＋ 攻速 17–19% ＋ 暴擊 +4.41–5%，
