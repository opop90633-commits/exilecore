# retired: true  退役的傳奇（2026-10 PoE2 改版）：不會掉、不出現在圖鑑與兌換券的清單，玩家手上的登入時換成傳奇兌換券。
# 傳奇物品：固定的名字、基底與詞綴（數值在範圍裡擲），天啟石可以重擲數值，其他通貨不能改。
#   sources：誰會掉
#     final      終局 Boss（天穹熔爐的曜帝；機率見 maps.yml 的 drops.final_unique_chance）
#     map_boss   任何一張地圖的 Boss（機率見 maps.yml 的 drops.boss_unique_chance）
#     地圖代號   那張地圖的 Boss 另外掉（例如 royal_tomb）
#     chance     可以用僥倖石把同一個基底的普通物品做出來（照 PoE2：Boss 專屬的傳奇做不出來）
#     gamble     可以在商人那裡賭出來（機率見 economy.yml 的 gamble.rarity_weights：地圖 Boss 也會掉的用 boss_unique）
#     shrine、strongbox、breach、exile   地圖事件（神龕、寶箱、裂隙、流寇）的專屬（機率見 map_events.yml 各事件的 unique_chance，1%）
#     ritual、delirium                   祭壇的貢品獎勵、幻霧的獎勵裡的「傳奇」那一種（map_events.yml 的 reward_weights）
#     heist                              劫盜的大金庫（heist.yml 的 vault.unique_chance；大劫盜 ×3）
#   veiled: prefix／suffix  隱匿傳奇（照 PoE 的 Veiled Unique）：掉出來就帶隱匿前綴／後綴，找盜賊首領三選一揭露
#                           （揭露詞綴見 affixes/unveiled.yml；可以寫一串，例如 [prefix, prefix, suffix, suffix]，每條各自揭露）
#   local.unveiled_magnitude（INCREASED）：這件物品上揭露詞綴的數值增加 x%（骷印長杖）
#     uber_終局代號                       那隻極境 Boss 的專屬（maps.yml 的 uber.drops.exclusive_chance）
#     awakener                           巔峰 Boss 覺醒之主・虛星（萬界之巔）的專屬（maps.yml 巔峰的 drops.unique_chance）
#   weight：同一個來源裡的權重；drop_level：物品等級（= 怪物等級）至少多少
#     chase      追逐級的池子：所有地圖 Boss（一般、具名、終局、極境）每次擊殺、每個有份的人各擲一次 maps.yml 的 drops.chase_chance
#   chase: true  追逐級（極稀有）：物品上標「✦ 追逐級傳奇」、掉出來全服廣播。只寫 sources: [chase]（不放進 map_boss 這些池子），
#     機率固定 0.034%（約 3000 隻 Boss 一件，四件任一件），星圖天賦、物品數量、稀有度都不影響；
#     一般怪物每隻、僥倖石每次另外有 maps.yml 的 drops.chase_mob_chance（0.0001%，兩邊一樣）；
#     drop_level 75：T11 以上的地圖（終局 T10 以上、極境都算）才會掉。weight 只用在 chase 池裡選哪一件
#   mods：每條一行文字（{value} 或其他變數）＋ stats（跟詞綴的 mods 一樣）；沒有變數的是固定值
#   version：定義的版本（沒寫 = 1）。改了詞綴（增減、調順序、改範圍）就加一，已經掉出來的舊傳奇登入時會照新的定義補正：
#     對得上、數值還在範圍裡的留著，其他的重擲。順序有變的話寫 legacy：舊版本 → 新的每一條對應舊的第幾條（0 = 新的）
#     例如 legacy: { 1: [1, 0, 2, 3, 0, 4] }（第 1 版升上來：新的第 2、5 條是新的，第 3 條是舊的第 2 條…）
#
# 傳奇的特殊效果（stats 用 FLAT，數值是點數或百分比點數）：
#   skill.level          +x 技能等級（tags 照技能自己的標籤：[spell] 法術、[chaos] 混沌、[spell, fire] 火焰法術；
#                        沒寫 = 全部技能）。可以超過 20 級（最高 40），法術每多一級基礎傷害多 skills.yml 的 extra_level_damage
#   damage.double        擊中時 x% 機率造成雙倍傷害（暴擊之後再乘）
#   life.on_hit          每次擊中敵人回復 x 生命（tags [attack] = 只有攻擊）
#   life.on_kill         擊殺時回復最大生命的 x%（mana.on_kill、es.on_kill 一樣）
#   onslaught.on_kill    擊殺時 x% 機率獲得疾速（4 秒：增加 20% 攻擊、施法與移動速度）
#   kill.explode         你殺死的敵人爆炸，對周圍 3 格的敵人造成牠最大生命 x% 的火焰傷害（吃增加火焰、範圍傷害；會連鎖）
#   damage.from_mana     受到的傷害（扣生命的部分）有 x% 先從魔力扣（PoE 的心靈勝過物質；魔力不夠的照扣生命）
#   life.recoup          受到的傷害有 x% 之後慢慢回復為生命（跟生命偷取一起回，每秒最多回 10% 最大生命）
#   steal.mods           殺死稀有怪物時，獲得牠的詞綴 x 秒（追逐級傳奇「逐星者」）
#   flag.chaos_immune、flag.always_hit、flag.iron_reflexes：基石的效果（FLAT 1）
#   2026-10 新機制：
#   presence.resist.fire／cold／lightning／chaos  你身邊（臨在，6 格）的敵人抗性 -x%；presence.taken 受到的傷害增加 x%、
#     presence.weaken 造成的傷害更少 x%、presence.slow 變慢 x%、presence.burn 每秒受到你最大生命 x% 的火焰傷害；presence.area 範圍
#   flag.stun_full_life  擊中滿血的敵人直接重暈；kill.shatter  用擊中殺死完全破甲的敵人時碎裂爆開（牠最大生命 x% 的物理傷害）
#   屬性代號後面接 @hit／@nohit：最近 4 秒被擊中過／沒被擊中才有效（例如 evasion@nohit、life.regen_percent@hit）
#   rune_sockets: N  這件傳奇有幾個符文孔（蓋過基底的）；rune_effect: x  嵌在這件上的符文效果增加 x%
#   傳奇的基底數值固定在它那一階（基底的 base_level，或 stat_base 指的那一階）。2026-10：只有武器的基底傷害會照物品等級
#     從那一階再往上長（跟稀有武器同一條曲線，items.yml 的 damage_per_level；例如 72 級那一階的弓，物品等級 84 是 ×1.12、
#     91 是 ×1.19），不會比那一階低；需求、防禦、固定詞綴、詞綴的附加傷害都不跟著長
#   其他（skill.projectiles、skill.pierce、skill.chains、leech.life、damage.gain.閃電…）跟輔助寶石一樣，見 supports.yml

# =====================================================================================================
# 2026-10 PoE2 改版：新的傳奇（效果照 PoE2 的風格，名稱是自己的）。舊傳奇退役後，定義已經從這個檔案刪掉（2026-10-15）。
# 每一件新傳奇接手一件舊傳奇的掉落來源（sources、drop_level、weight、追逐級、隱匿都一樣）。
# =====================================================================================================

celestial_pivot:
  name: 天樞墜
  base: jamulet_09        # 2026-10：jade_amulet → PoE2 分階基底（照詞綴挑內建詞相近的）
  drop_level: 60
  sources: [final]
  weight: 100
  flavour:
    - "「群星繞著它轉，你也是。」"
  version: 2        # 2026-10：照 PoE2 同部位的傳奇重做（舊的登入時重擲）
  mods:
    - text: "+{value} 全部屬性"
      value: [60, 80]
      stats:
        - { stat: attr.str, type: FLAT, value: "{value}" }
        - { stat: attr.dex, type: FLAT, value: "{value}" }
        - { stat: attr.int, type: FLAT, value: "{value}" }
    - text: "+{value} 最大精魂"
      value: [20, 30]
      stats:
        - { stat: spirit.max, type: FLAT, value: "{value}" }
    - text: "+{value}% 全部元素抗性"
      value: [10, 15]
      stats:
        - { stat: resist.fire, type: FLAT, value: "{value}" }
        - { stat: resist.cold, type: FLAT, value: "{value}" }
        - { stat: resist.lightning, type: FLAT, value: "{value}" }

