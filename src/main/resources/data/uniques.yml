# =====================================================================================================
# 2026-10-28 照 PoE2 0.5：石拳之道（Way of the Stonefist）的「磐石之拳 Uniques」37 件手套傳奇裡，我們以前沒有的 21 件。
# 名稱、基底、數值照 poe2db（tw）與 RePoE；PoE2 的手套照這裡的慣例放在腿甲（base 是那一類的分階基底，stat_base 是原作基底那一階）。
# 掉落照 PoE2：全域掉落的寫 [map_boss, chance, gamble]；Boss 限定的寫那隻 Boss（無與倫比：灰燼仲裁者 → 巔峰 Boss awakener；
#   主宰之觸：被巫妖完整強化的骷髏馬克的容器 → 淵底之王・骨潮 abyss_lich；驚懼飛掠：渡鴉欺詐者 → 地圖 Boss，做不出來、賭不到）。
