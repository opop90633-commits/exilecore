      stats:
        - { stat: resist.fire, type: FLAT, value: 10 }
        - { stat: resist.cold, type: FLAT, value: 10 }
        - { stat: resist.lightning, type: FLAT, value: 10 }
    - text: "增加 50% 魔力再生速度"   # 2026-10-27 照 PoE2 Mana Regeneration Rate 用語「魔力再生速度」；這次之前寫「魔力回復速度」
      stats:
        - { stat: mana.regen, type: INCREASED, value: 50 }
    - text: "每 10 秒獲得一個隨機的非傷害神龕增益，持續 20 秒"
      stats:
        - { stat: shrine.periodic, type: FLAT, value: 10 }

