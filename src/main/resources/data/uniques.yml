# 這次之前沒有這 21 件（已經有的 16 件：風羽鐵手、攫金護腿、藍焰護腕、骸節鐵手、逃亡者脛甲、咒婦絲褲、堞衛脛甲、寒握皮褲、知行捲布、
#   憎鑄腿鎧、喝采手套、夜鱗手套、北爪護腕、蛇咬護腕、樹指鐵手、雷鉗鐵手）。
