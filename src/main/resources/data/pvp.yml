# PvP 競技場（/pvp，或主選單的「競技場」）：只有在競技場裡玩家才能互相攻擊，離開競技場就不行。
# 競技場在自己的世界（exilecore:arena），第一次啟動時自動蓋好：61×61 的場內、6 格高的圍牆，
# 八個方向對稱的掩體（中央高台、箱子、L 形牆、橋、柱子、出生點前的矮牆），柱子以外的掩體都有梯子可以爬上去。
# 場地的形狀改了版本會自動清掉重蓋；管理員也可以用 /ec pvp rebuild 重蓋。
# 同一隊的人不會互打；倒下不扣經驗、不掉東西、不算死亡次數。
# 改完 /ec reload 就生效。

enabled: true

# 專屬的 PvP 減傷：玩家打玩家的傷害減少幾 %（0–95）。
# 命中的傷害，還有這一下造成的元素異常、持續傷害（點燃、流血、中毒）、暈眩與凍結的累積都跟著變小；
# 召喚物、圖騰、陷阱、地雷打玩家也算。
damage_reduction: 70

# 進場要幾級（0 = 不限）
min_level: 0

# 擊倒一個玩家：擊倒的人藥劑充能幾次（擊殺一隻稀有怪是 5）
flask_charges_per_kill: 5

# 擊倒的訊息（只有競技場裡的人看得到）
kill_feed: true

# 在競技場裡倒下：true = 重生在競技場（離其他人最遠的出生點），false = 回營地
respawn_in_arena: true
