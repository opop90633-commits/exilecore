# PvP 競技場（/pvp，或主選單的「競技場」）：只有在競技場裡玩家才能互相攻擊，離開競技場就不行。
# 競技場在自己的世界（exilecore:arena），第一次啟動時自動蓋好：61×61 的場內、6 格高的圍牆，
# 八個方向對稱的掩體（中央高台、箱子、L 形牆、橋、柱子、出生點前的矮牆），柱子以外的掩體都有梯子可以爬上去。
# 場地的形狀改了版本會自動清掉重蓋；管理員也可以用 /ec pvp rebuild 重蓋。
# 同一隊的人不會互打；倒下不扣經驗、不掉東西、不算死亡次數。
# 改完 /ec reload 就生效。

enabled: true

# 專屬的 PvP 減傷：玩家打玩家的傷害減少幾 %（0–95）。
# 命中的傷害，還有這一下造成的元素異常、持續傷害（點燃、流血、中毒）、暈眩與凍結的累積都跟著變小；
# 召喚物、圖騰、陷阱、地雷打玩家也算。
# 2026-10：70 → 85。大家的血量 2,000～4,000，輸出卻從 1.5 萬到 20 萬／秒，70% 還是一秒就倒。
damage_reduction: 85

# 保底（2026-10）：不管對面輸出多高，一個人掉血的速度有上限——減傷之後、過完護甲與抗性，再套這兩條。
# 總血量 = 最大生命＋最大能量護盾（「受到的傷害先從魔力扣」的人把那一份最大魔力也算進去）。0 = 不限。
#   max_hit_percent         單一下最多打掉總血量的幾 %
#   max_per_second_percent  最近一秒加起來最多幾 %（好幾個人一起打同一個人也是加起來算；點燃、流血、中毒的持續傷害也算）
# 這一秒還沒被打過時第一下可以打到 max_hit_percent，接著要等這一秒過去；所以滿血的人最快大約 3 秒多才會倒（不算回血、藥劑）。
max_hit_percent: 30
max_per_second_percent: 25

# 召喚物、圖騰、陷阱打玩家的傷害再乘多少（0–1；1 = 跟本人打的一樣）。召喚流的輸出是一群召喚物加起來，又會自己追人。
minion_damage: 0.5

# 近戰補償：拿近戰武器（劍、斧、錘、矛、長棍、爪、匕首、獸魂符；權杖不算）的人在競技場受到的傷害再少幾 %（0–90）。
# 近戰要追著人打、遠程可以邊退邊打，補的是「打不到人的時間」。
melee_reduction: 20

# 進場要幾級（0 = 不限）
min_level: 0

# 擊倒一個玩家：擊倒的人藥劑充能幾次（擊殺一隻稀有怪是 5）
flask_charges_per_kill: 5

# 擊倒的訊息（只有競技場裡的人看得到）
kill_feed: true

# 在競技場裡倒下：true = 重生在競技場（離其他人最遠的出生點），false = 回營地
respawn_in_arena: true
