# 昇華（轉職）、試煉、分身獎勵。改完在遊戲內 /ec reload。
#
# 三百年前，曜朝的皇帝在熔爐前立了四道門，讓十二個星衛一道一道走過去，把星骸煉進身體——那叫「昇華」。
# 熔爐失控之後，門還在星骸的記憶裡，爐監殷燼也還守著。營地地圖裝置旁的星衛明夷（quests.yml 的 ming_yi）替你打開它們。
#
# 流程：打倒焚城廢墟的 Boss → 在明夷那裡（或 /ascend）開第一試煉 → 地圖裝置後面的傳送門進去，打倒爐監
#   → 第一次完成給昇華點，選一個昇華職業（每個職業兩個，選了不能換）→ 用昇華點配昇華天賦。
# 每個試煉第一次完成給 points 昇華點（四個一共 8 點）。試煉不用地圖物品就能開，所以不能拿來刷：
# 完成過的人不能再開（隊友開的可以跟著進去幫忙，不會再給點數），每個角色每週能開的次數也有上限。
# 隊友一起打也算：Boss 倒下時在裡面、而且自己也解鎖了這個試煉的人，都算完成。
# 試煉跟地圖一樣在地圖世界裡（在裡面死亡扣 10% 經驗），開新的試煉或地圖，舊的那張傳送門就關了。
#
# 存在角色進度裡：trial.試煉代號（完成時間）、asc（選的昇華職業）、asc.nodes（配的昇華天賦，照配的順序）、
# asc.week（這週開了幾次試煉）。

# 2026-10-26：昇華天賦的版本（比照天賦樹的 version）。改了昇華天賦就加 1：角色記的版本（asc.version）不一樣時，
# 已配的昇華天賦全部退回（昇華職業不變、點數拿回來）並通知玩家。這次之前沒有版本（= 1）。
# 2026-10-26：第 3 版（原本寫著（尚未生效）的機制都做出來了，有的多了壞處：鐵匠傑作只能穿普通胸甲、心宇和諧更少生命與魔力…；已配的全部退回重選）
version: 3

settings:
  cooldown_seconds: 60        # 開了一個試煉之後多久才能再開（每個人）
  weekly_opens: 0             # 2026-10-25 改不限次數。每個角色每週最多開幾次試煉（打倒前全倒了可以重開，算次數；每週一 0 點重置；0 = 不限）

# ---- 衝等活動（2026-10）----
# 每個昇華職業第一個升到 level 級的角色，帳號拿到那個昇華的專屬稱號（沒有加成）。每個稱號全服只有一個，拿了就沒了。
# 誰拿走了記在資料庫（清進度時一起清，新賽季重新搶）。先到 level 級才昇華的，昇華的那一刻算。
# titles：昇華代號 → 稱號名稱（沒寫的用「巔峰」＋昇華名稱）。改完 /ec reload。
level_race:
  enabled: true
  level: 100
  # 2026-10：全服第一個到 level 級的角色拿 first_title（全服只有一個，沒有加成）；
  # 任何角色到 level 級，帳號就拿到 reach_title（不限量；擁有就有效，經驗 +reach_experience%）。寫空字串 = 不發。
  first_title: 百星之首
  reach_title: 燃星者
  reach_experience: 5
  # 2026-10-22 燃星者進化：帳號裡每一隻到 level 級的角色各 +reach_experience%（第 2 隻 10%……），最多算 reach_max_characters 隻（7 隻 = 35%）
  reach_max_characters: 7
  # 升到這些等級時全服廣播（Discord 也發）
  announce_levels: [100, 110, 120]
  titles:
    ironwarden: 巔峰鐵衛
    berserker: 巔峰狂嘯
    forgesmith: 巔峰鑄星
    witchhunter: 巔峰斷咒
    legionnaire: 巔峰弩衛
    gemling: 巔峰嵌晶
    amazon: 巔峰獵姬
    ritualist: 巔峰儀祭
    stararrow: 巔峰星矢
    windwalker: 巔峰御風
    invoker: 巔峰喚雷
    voidwalker: 巔峰虛步
    starfire: 巔峰星焰
    voidrobe: 巔峰法袍
    sandsage: 巔峰沙靈
    blightcaller: 巔峰疫喚
    bloodmage: 巔峰血術
    lich: 巔峰骸主
    starseer: 巔峰觀星
    wildshaman: 巔峰獸巫
    spiritwalker: 巔峰靈狩   # 2026-10-27 照 PoE2 0.5 補上的三個昇華
    martialartist: 巔峰鳴鐘
    abysslich: 巔峰淵骸

# ---- 試煉 ----
#   name        名稱
#   requires    解鎖條件（都要符合；可以不寫）：
#                 trial: 試煉代號    先完成另一個試煉
#                 boss: 區域代號     這個角色打倒過那個區域的 Boss
#                 maps: 張數         完成過幾張不同的地圖
#                 level: 等級        角色等級
#   level       怪物等級（固定，不看角色等級）。2026-10 照 PoE2 的位置：36／48／60 跟著戰役，第四個 75 在終局
#   points      第一次完成給幾個昇華點
#   theme       版面主題（maps.yml 的主題：beach、forest、ruins、swamp、snow、cave、crypt、star）
#   rooms       版面大約幾個房間（含起點與 Boss 房，5–12）
#   quantity、rarity  Boss 的物品數量、稀有度加成（百分比；路上的怪照一般掉，試煉不掉地圖）
#   monsters    路上的怪（原版生物代號或 mythic:代號 → 權重）
#   boss        守門的 Boss（寫法同 maps.yml 的 boss：life／damage 是最後的倍率，已經扣掉生物本身的倍率；
#               skills 是 boss_skills.yml 的招式組，每場試煉的爐監各有一套照那道門元素的招式，phase 幾起才會用；
#               也可以寫 maps.yml 的特殊機制：phases 的 shield（護盾）、hazards（場地危害）、enrage（狂暴））
trials:
  ember:
    name: 第一試煉・餘燼
    requires: { boss: ruins }
    level: 36
    points: 2
    theme: ruins
    rooms: 7
    quantity: 50
    rarity: 30
    lore: 熔爐點火的前一夜，十二個星衛走進第一道門。門後是燒不完的曜京。
    monsters: { HUSK: 3, SKELETON: 3, ZOMBIE: 2, BLAZE: 1 }
    boss:
      name: 熾爐・殷燼                 # 2026-10：同一個守門人（爐監殷燼），四道門各一個稱號
      type: VINDICATOR
      named: true
      life: 2.4          # 2026-10：7 → 2.4（1–60 級 Boss 太硬，照 /ec balance 的建議調回目標秒數）
      damage: 1.4
      scale: 1.3
      mods: [armoured, fiery]
      skills:                       # 餘燼：火錘、餘燼路（走過留火）、爐息；一半血起灰雨、爐火環（擴散環：站進綠色的缺口）
        - warden_ember_hammer
        - warden_cinder_trail
        - warden_forge_breath
        - { id: warden_ash_rain, phase: 1 }
        - { id: warden_fire_ring, phase: 1 }
      intro: "「又一個想進熔爐的。陛下說過，火會挑人。」"
      defeat: "「……火挑中你了。第二道門在腐沼底下，別讓毒把你泡軟。」"
      phases:
        - at: 0.5
          name: 爐火
          message: "「熱起來了，對吧？」"
          summon: { type: SKELETON, count: 3 }
          speed: 0.1
          stats:
            - { stat: damage, type: INCREASED, value: 20 }

  venom:
    name: 第二試煉・沉毒
    requires: { trial: ember, boss: swamp }
    level: 48
    points: 2
    theme: swamp
    rooms: 8
    quantity: 60
    rarity: 40
    lore: 第二道門浸在毒裡。星骸會吃掉軟弱的那一半，剩下的才配往前走。
    monsters: { BOGGED: 3, ZOMBIE: 2, CAVE_SPIDER: 2, WITCH: 1, SLIME: 1 }
    boss:
      name: 沉瘴・殷燼                 # 2026-10：同一個守門人（爐監殷燼），四道門各一個稱號
      type: VINDICATOR
      named: true
      life: 2.4          # 2026-10：9 → 2.4（1–60 級 Boss 太硬，照 /ec balance 的建議調回目標秒數）
      damage: 1.45
      scale: 1.35
      mods: [armoured, resistant]
      skills:                       # 沉毒：毒錘、毒沼、孢雲；毒霧起瘟潮、沼底漩渦（往外跑）；腐心起受傷加深的詛咒、孢子球（追人的毒球）
        - warden_venom_hammer
        - warden_bog_pools
        - warden_spore_cloud
        - { id: warden_plague_nova, phase: 1 }
        - { id: warden_bog_vortex, phase: 1 }
        - { id: warden_rot_curse, phase: 2 }
        - { id: warden_spore_orbs, phase: 2 }
      intro: "「你身上有火的味道。好——讓毒試試，它是把火熄掉，還是讓它更旺。」"
      defeat: "「第三道門在山頂的冰裡。我在那裡發過誓。」"
      phases:
        - at: 0.6
          name: 毒霧
          message: "「三百年了，這沼裡的東西還認得我。」"
          summon: { type: BOGGED, count: 3 }
        - at: 0.3
          name: 腐心
          message: "「慢一點倒下。讓我看清楚你。」"
          speed: 0.15
          stats:
            - { stat: damage, type: INCREASED, value: 25 }

  frost:
    name: 第三試煉・霜誓
    requires: { trial: venom, boss: mountain }
    level: 60
    points: 2
    theme: snow
    rooms: 9
    quantity: 80
    rarity: 50
    lore: 第三道門在冰裡。走過去的人要先把自己凍住，忘掉怕。
    monsters: { STRAY: 4, SKELETON: 2, ZOMBIE: 2 }
    boss:
      name: 凜誓・殷燼                 # 2026-10：同一個守門人（爐監殷燼），四道門各一個稱號
      type: VINDICATOR
      named: true
      life: 3.0          # 2026-10：10 → 3.0（1–60 級 Boss 太硬，照 /ec balance 的建議調回目標秒數）
      damage: 1.5
      scale: 1.4
      mods: [armoured, frosty]
      skills:                       # 霜誓：霜錘、霜環（緩速）、冰槍陣；霜誓起冰崩、霜誓光束（兩道光束）；凝冰之核把腳下凍成冰地（還會張開護盾）
        - warden_frost_hammer
        - warden_oath_ring
        - warden_ice_lances
        - { id: warden_glacier_fall, phase: 1 }
        - { id: warden_frost_beam, phase: 1 }
        - { id: warden_frozen_heart, phase: 2 }
      intro: "「我在這裡發過誓：再也不讓任何人走進熔爐。可是規矩就是規矩。」"
      defeat: "「……最後一道門在星痕裡。我在那裡等你，最後一次。」"
      phases:
        - at: 0.6
          name: 霜誓
          message: "「冷嗎？當年他們也這樣問我。」"
          summon: { type: STRAY, count: 4 }
        - at: 0.3
          name: 凝冰之核
          message: "「我的心早就凍住了。所以我不會停。」"
          speed: 0.15
          stats:
            - { stat: damage, type: INCREASED, value: 30 }
          # 護盾：殷燼無敵，打掉兩座冰像才打得動（25 秒內沒打完，他回 20% 生命）
          shield: { count: 2, type: STRAY, name: 霜誓冰像, life: 3, duration: 25, heal: 20 }

  star:
    name: 第四試煉・星痕
    requires: { trial: frost, maps: 6 }
    level: 75            # 2026-10：65 → 75（照 PoE2：第四次昇華在終局 75 級；生命倍率在 65、75 級時跟 /ec balance 的建議差不多，不用改）
    points: 2
    theme: star
    rooms: 10
    quantity: 100
    rarity: 60
    lore: 最後一道門不在世上，在星痕裡：天穹之心墜落的那一刻。走過去，你就跟他們一樣了。
    monsters: { WITHER_SKELETON: 3, SKELETON: 3, ENDERMAN: 1, EVOKER: 1 }
    boss:
      name: 星蝕・殷燼                 # 2026-10：同一個守門人（爐監殷燼），四道門各一個稱號
      type: VINDICATOR
      named: true
      life: 2.8          # 2026-10：14 → 2.8（1–60 級 Boss 太硬，照 /ec balance 的建議調回目標秒數）
      damage: 1.6
      scale: 1.5
      mods: [armoured, deadly, resistant]
      # 2026-10：第四試煉是期末考（boss_skills.yml 的「期末考」那一段）：
      #   一開始：星錘、星墜、閃現追擊、星痕烙印（點名：被點的人離開隊友）
      #   星痕起：裂天、星痕環、星蝕十字（四道光束一起轉）、墜星引力（吸人的同時星墜落下：兩招同時放）、天穹之心碎片（追人）
      #   十二門起：三波推進、星痕審判（全場大招）、十二星衛（殘影輪流射槍）、
      #             四門回響——前三道門的火環（缺口更小）、沼底漩渦、霜誓光束（同時落下墜星雨）
      #   最後的火：腳下的火、天穹收攏（場地收縮，一進這個階段就放，圈外一直扣血）、無缺星環（沒有缺口：跑出去或翻滾）
      skills:
        - warden_star_hammer
        - warden_star_fall
        - warden_star_step
        - warden_star_brand
        - { id: warden_sky_rift, phase: 1 }
        - { id: warden_star_ring, phase: 1 }
        - { id: warden_star_cross, phase: 1 }
        - { id: warden_star_well, phase: 1, with: [warden_star_rain] }
        - { id: warden_heart_shards, phase: 1 }
        - { id: warden_twelve_gates, phase: 2 }
        - { id: warden_star_judgement, phase: 2 }
        - { id: warden_twelve_echoes, phase: 2 }
        - { id: warden_echo_fire_ring, phase: 2 }
        - { id: warden_echo_bog_vortex, phase: 2 }
        - { id: warden_echo_frost_beam, phase: 2, with: [warden_star_rain] }
        - { id: warden_last_fire, phase: 3 }
        - { id: warden_closing_sky, phase: 3 }
        - { id: warden_starless_ring, phase: 3 }
      hazards:                      # 星痕起，天上一直掉星痕殘片（每 10 秒落在某個人附近）
        - { skill: hazard_warden_star, every: 10, phase: 1 }
      intro: "「十二個走進去，四個走出來。陛下是第十三個——他出來的時候，已經不是人了。」"
      defeat: "「去吧。如果你在熔爐裡見到他，告訴他：十二門的人，都到齊了。」"
      phases:
        - at: 0.7
          name: 星痕
          message: "「看見了嗎？那一晚，天上裂開的樣子。」"
          summon: { type: SKELETON, count: 4 }
        - at: 0.4
          name: 十二門
          message: "「十二門的星衛，站起來！」"
          summon: { type: WITHER_SKELETON, count: 3 }
        - at: 0.15
          name: 最後的火
          message: "「這是我最後的火。天穹要收攏了——到我身邊來。」"
          speed: 0.2
          stats:
            - { stat: damage, type: INCREASED, value: 40 }

# ---- 昇華職業（2026-10-26 照 PoE2 0.5 換成原作的昇華天賦）----
# 2026-10-26 照 PoE2 0.5：每個昇華的天賦全部換成原作的（名稱照台服、相連、數值、說明行照原作）；這次之前是自己挑的 16 個、四條分支。
# 昇華職業本身（class、name、color、icon）沿用原本的；改版時 version 加 1，已配的昇華天賦全部退回（昇華職業不變、點數拿回來）。
# 樹會分岔（一個天賦後面可以接好幾個），跟 PoE2 一樣「跟已配的天賦相連」就能配（連線不分方向；Ritualist、Invoker 的環也是）。
# 每個天賦 1 點，四個試煉一共 8 點：只能配一小部分，要選。
#   class    哪個職業的（marauder 戰士、mercenary 傭兵、huntress 女獵手、ranger 遊俠、monk 武僧、sorceress 女巫師、witch 女巫、druid 德魯伊）
#   nodes    代號 → { name, requires, cost（預設 1）, icon, notable, choice, option_of, lines, stats, note }
#            requires：相連、比較靠近起點的天賦（一個或 [a, b]；不寫 = 直接接在起點；第一個是選單上畫在左邊的那個）
#            choice: true = 「選一個」的天賦：配了之後從 option_of 寫它的選項挑一個（選項不花點數、同一組只能一個）
#            unlock: [a, b] = 2026-10-27 照 PoE2（靈狩者「聖潔一統」）：這幾個都配了才能配；直接接在起點、可以寫 cost: 0、不當作連線的路
#            lines：說明行（照原作；後面寫著（尚未生效）的是還沒做出來的機制，stats 裡沒有它）
#            stats：{ stat, type: FLAT|INCREASED|MORE, value, tags }，INCREASED／MORE 的 value 是百分比；flag.* 這種寫死的效果說明在 stats/SignatureText，
#                   asc.* 是這次新做的（ascendancy/AscendancyMechanics）。
# 退掉昇華天賦要花金幣（跟天賦樹退點同一個價格 × 點數），退掉之後剩下的要都還接得到起點。
ascendancies:
  ironwarden:                # 原作：Titan
    class: marauder
    name: 鐵衛
    color: "#d4a24c"
    icon: SHIELD
    summary: 曜京十二道城門的守將：胸甲的護甲更多、最大生命更多、放大天賦小點、粉碎打擊與重擊。
    nodes:
      armour:
        name: 護甲          # Armour
        icon: IRON_CHESTPLATE
        lines:
          - 增加 20% 護甲
        stats:
          - { stat: armour, type: INCREASED, value: 20 }
      stone_skin:
        name: 岩膚鐵骨          # Stone Skin
        requires: armour
        notable: true
        icon: IRON_CHESTPLATE
        lines:
          - 更多 50% 已裝備胸甲的護甲
        stats:
          - { stat: flag.stone_skin, type: FLAT, value: 1 }
      slam_area_effect:
        name: 重擊效果範圍          # Slam Area of Effect
        icon: MACE
        lines:
          - 增加 8% 猛擊技能的範圍效果
        stats:
          - { stat: skill.area, type: INCREASED, value: 8, tags: [slam] }
      earthbreaker:
        name: 碎嶽崩天          # Earthbreaker
        requires: slam_area_effect
        notable: true
        icon: MACE
        lines:
          - 你親自使用的猛擊技能有 25% 機率額外造成 1 次餘震
        stats:
          - { stat: asc.slam_aftershock, type: FLAT, value: 25 }   # 2026-10-26 照 PoE2（這次之前沒有效果）
      slam_area_effect_2:
        name: 重擊效果範圍          # Slam Area of Effect
        requires: earthbreaker
        icon: MACE
        lines:
          - 增加 8% 猛擊技能的範圍效果
        stats:
          - { stat: skill.area, type: INCREASED, value: 8, tags: [slam] }
      ancestral:
        name: 祖靈之威          # Ancestral Empowerment
        requires: slam_area_effect_2
        notable: true
        icon: MACE
        lines:
          - 你親自使用的猛擊技能每第二次會獲得先祖強化
        stats:
