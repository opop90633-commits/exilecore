# 昇華（轉職）、試煉、分身獎勵。改完在遊戲內 /ec reload。
#
# 三百年前，曜朝的皇帝在熔爐前立了四道門，讓十二個星衛一道一道走過去，把星骸煉進身體——那叫「昇華」。
# 熔爐失控之後，門還在星骸的記憶裡，爐監殷燼也還守著。營地地圖裝置旁的星衛明夷（quests.yml 的 ming_yi）替你打開它們。
#
# 流程：打倒焚城廢墟的 Boss → 在明夷那裡（或 /ascend）開第一試煉 → 地圖裝置後面的傳送門進去，打倒爐監
#   → 第一次完成給昇華點，選一個昇華職業（每個職業兩個，選了不能換）→ 用昇華點配昇華天賦。
# 每個試煉第一次完成給 points 昇華點（四個一共 8 點）。試煉不用地圖物品就能開，所以不能拿來刷：
# 完成過的人不能再開（隊友開的可以跟著進去幫忙，不會再給點數），每個角色每週能開的次數也有上限。
# 隊友一起打也算：Boss 倒下時在裡面、而且自己也解鎖了這個試煉的人，都算完成。
# 試煉跟地圖一樣在地圖世界裡（在裡面死亡扣 10% 經驗），開新的試煉或地圖，舊的那張傳送門就關了。
#
# 存在角色進度裡：trial.試煉代號（完成時間）、asc（選的昇華職業）、asc.nodes（配的昇華天賦，照配的順序）、
# asc.week（這週開了幾次試煉）。

settings:
  cooldown_seconds: 60        # 開了一個試煉之後多久才能再開（每個人）
  weekly_opens: 8             # 每個角色每週最多開幾次試煉（打倒前全倒了可以重開，算次數；每週一 0 點重置；0 = 不限）

# ---- 試煉 ----
#   name        名稱
#   requires    解鎖條件（都要符合；可以不寫）：
#                 trial: 試煉代號    先完成另一個試煉
#                 boss: 區域代號     這個角色打倒過那個區域的 Boss
#                 maps: 張數         完成過幾張不同的地圖
#                 level: 等級        角色等級
#   level       怪物等級（固定，不看角色等級）。2026-10 照 PoE2 的位置：36／48／60 跟著戰役，第四個 75 在終局
#   points      第一次完成給幾個昇華點
#   theme       版面主題（maps.yml 的主題：beach、forest、ruins、swamp、snow、cave、crypt、star）
#   rooms       版面大約幾個房間（含起點與 Boss 房，5–12）
#   quantity、rarity  Boss 的物品數量、稀有度加成（百分比；路上的怪照一般掉，試煉不掉地圖）
#   monsters    路上的怪（原版生物代號或 mythic:代號 → 權重）
#   boss        守門的 Boss（寫法同 maps.yml 的 boss：life／damage 是最後的倍率，已經扣掉生物本身的倍率；
#               skills 是 boss_skills.yml 的招式組，每場試煉的爐監各有一套照那道門元素的招式，phase 幾起才會用；
#               也可以寫 maps.yml 的特殊機制：phases 的 shield（護盾）、hazards（場地危害）、enrage（狂暴））
trials:
  ember:
    name: 第一試煉・餘燼
    requires: { boss: ruins }
    level: 36
    points: 2
    theme: ruins
    rooms: 7
    quantity: 50
    rarity: 30
    lore: 熔爐點火的前一夜，十二個星衛走進第一道門。門後是燒不完的曜京。
    monsters: { HUSK: 3, SKELETON: 3, ZOMBIE: 2, BLAZE: 1 }
    boss:
      name: 熾爐・殷燼                 # 2026-10：同一個守門人（爐監殷燼），四道門各一個稱號
      type: VINDICATOR
      named: true
      life: 2.4          # 2026-10：7 → 2.4（1–60 級 Boss 太硬，照 /ec balance 的建議調回目標秒數）
      damage: 1.4
      scale: 1.3
      mods: [armoured, fiery]
      skills:                       # 餘燼：火錘、餘燼路（走過留火）、爐息；一半血起灰雨、爐火環（擴散環：站進綠色的缺口）
        - warden_ember_hammer
        - warden_cinder_trail
        - warden_forge_breath
        - { id: warden_ash_rain, phase: 1 }
        - { id: warden_fire_ring, phase: 1 }
      intro: "「又一個想進熔爐的。陛下說過，火會挑人。」"
      defeat: "「……火挑中你了。第二道門在腐沼底下，別讓毒把你泡軟。」"
      phases:
        - at: 0.5
          name: 爐火
          message: "「熱起來了，對吧？」"
          summon: { type: SKELETON, count: 3 }
          speed: 0.1
          stats:
            - { stat: damage, type: INCREASED, value: 20 }

  venom:
    name: 第二試煉・沉毒
    requires: { trial: ember, boss: swamp }
    level: 48
    points: 2
    theme: swamp
    rooms: 8
    quantity: 60
    rarity: 40
    lore: 第二道門浸在毒裡。星骸會吃掉軟弱的那一半，剩下的才配往前走。
    monsters: { BOGGED: 3, ZOMBIE: 2, CAVE_SPIDER: 2, WITCH: 1, SLIME: 1 }
    boss:
      name: 沉瘴・殷燼                 # 2026-10：同一個守門人（爐監殷燼），四道門各一個稱號
      type: VINDICATOR
      named: true
      life: 2.4          # 2026-10：9 → 2.4（1–60 級 Boss 太硬，照 /ec balance 的建議調回目標秒數）
      damage: 1.45
      scale: 1.35
      mods: [armoured, resistant]
      skills:                       # 沉毒：毒錘、毒沼、孢雲；毒霧起瘟潮、沼底漩渦（往外跑）；腐心起受傷加深的詛咒、孢子球（追人的毒球）
        - warden_venom_hammer
        - warden_bog_pools
        - warden_spore_cloud
        - { id: warden_plague_nova, phase: 1 }
        - { id: warden_bog_vortex, phase: 1 }
        - { id: warden_rot_curse, phase: 2 }
        - { id: warden_spore_orbs, phase: 2 }
      intro: "「你身上有火的味道。好——讓毒試試，它是把火熄掉，還是讓它更旺。」"
      defeat: "「第三道門在山頂的冰裡。我在那裡發過誓。」"
      phases:
        - at: 0.6
          name: 毒霧
          message: "「三百年了，這沼裡的東西還認得我。」"
          summon: { type: BOGGED, count: 3 }
        - at: 0.3
          name: 腐心
          message: "「慢一點倒下。讓我看清楚你。」"
          speed: 0.15
          stats:
            - { stat: damage, type: INCREASED, value: 25 }

  frost:
    name: 第三試煉・霜誓
    requires: { trial: venom, boss: mountain }
    level: 60
    points: 2
    theme: snow
    rooms: 9
    quantity: 80
    rarity: 50
    lore: 第三道門在冰裡。走過去的人要先把自己凍住，忘掉怕。
    monsters: { STRAY: 4, SKELETON: 2, ZOMBIE: 2 }
    boss:
      name: 凜誓・殷燼                 # 2026-10：同一個守門人（爐監殷燼），四道門各一個稱號
      type: VINDICATOR
      named: true
      life: 3.0          # 2026-10：10 → 3.0（1–60 級 Boss 太硬，照 /ec balance 的建議調回目標秒數）
      damage: 1.5
      scale: 1.4
      mods: [armoured, frosty]
      skills:                       # 霜誓：霜錘、霜環（緩速）、冰槍陣；霜誓起冰崩、霜誓光束（兩道光束）；凝冰之核把腳下凍成冰地（還會張開護盾）
        - warden_frost_hammer
        - warden_oath_ring
        - warden_ice_lances
        - { id: warden_glacier_fall, phase: 1 }
        - { id: warden_frost_beam, phase: 1 }
        - { id: warden_frozen_heart, phase: 2 }
      intro: "「我在這裡發過誓：再也不讓任何人走進熔爐。可是規矩就是規矩。」"
      defeat: "「……最後一道門在星痕裡。我在那裡等你，最後一次。」"
      phases:
        - at: 0.6
          name: 霜誓
          message: "「冷嗎？當年他們也這樣問我。」"
          summon: { type: STRAY, count: 4 }
        - at: 0.3
          name: 凝冰之核
          message: "「我的心早就凍住了。所以我不會停。」"
          speed: 0.15
          stats:
            - { stat: damage, type: INCREASED, value: 30 }
          # 護盾：殷燼無敵，打掉兩座冰像才打得動（25 秒內沒打完，他回 20% 生命）
          shield: { count: 2, type: STRAY, name: 霜誓冰像, life: 3, duration: 25, heal: 20 }

  star:
    name: 第四試煉・星痕
    requires: { trial: frost, maps: 6 }
    level: 75            # 2026-10：65 → 75（照 PoE2：第四次昇華在終局 75 級；生命倍率在 65、75 級時跟 /ec balance 的建議差不多，不用改）
    points: 2
    theme: star
    rooms: 10
    quantity: 100
    rarity: 60
    lore: 最後一道門不在世上，在星痕裡：天穹之心墜落的那一刻。走過去，你就跟他們一樣了。
    monsters: { WITHER_SKELETON: 3, SKELETON: 3, ENDERMAN: 1, EVOKER: 1 }
    boss:
      name: 星蝕・殷燼                 # 2026-10：同一個守門人（爐監殷燼），四道門各一個稱號
      type: VINDICATOR
      named: true
      life: 2.8          # 2026-10：14 → 2.8（1–60 級 Boss 太硬，照 /ec balance 的建議調回目標秒數）
      damage: 1.6
      scale: 1.5
      mods: [armoured, deadly, resistant]
      # 2026-10：第四試煉是期末考（boss_skills.yml 的「期末考」那一段）：
      #   一開始：星錘、星墜、閃現追擊、星痕烙印（點名：被點的人離開隊友）
      #   星痕起：裂天、星痕環、星蝕十字（四道光束一起轉）、墜星引力（吸人的同時星墜落下：兩招同時放）、天穹之心碎片（追人）
      #   十二門起：三波推進、星痕審判（全場大招）、十二星衛（殘影輪流射槍）、
      #             四門回響——前三道門的火環（缺口更小）、沼底漩渦、霜誓光束（同時落下墜星雨）
      #   最後的火：腳下的火、天穹收攏（場地收縮，一進這個階段就放，圈外一直扣血）、無缺星環（沒有缺口：跑出去或翻滾）
      skills:
        - warden_star_hammer
        - warden_star_fall
        - warden_star_step
        - warden_star_brand
        - { id: warden_sky_rift, phase: 1 }
        - { id: warden_star_ring, phase: 1 }
        - { id: warden_star_cross, phase: 1 }
        - { id: warden_star_well, phase: 1, with: [warden_star_rain] }
        - { id: warden_heart_shards, phase: 1 }
        - { id: warden_twelve_gates, phase: 2 }
        - { id: warden_star_judgement, phase: 2 }
        - { id: warden_twelve_echoes, phase: 2 }
        - { id: warden_echo_fire_ring, phase: 2 }
        - { id: warden_echo_bog_vortex, phase: 2 }
        - { id: warden_echo_frost_beam, phase: 2, with: [warden_star_rain] }
        - { id: warden_last_fire, phase: 3 }
        - { id: warden_closing_sky, phase: 3 }
        - { id: warden_starless_ring, phase: 3 }
      hazards:                      # 星痕起，天上一直掉星痕殘片（每 10 秒落在某個人附近）
        - { skill: hazard_warden_star, every: 10, phase: 1 }
      intro: "「十二個走進去，四個走出來。陛下是第十三個——他出來的時候，已經不是人了。」"
      defeat: "「去吧。如果你在熔爐裡見到他，告訴他：十二門的人，都到齊了。」"
      phases:
        - at: 0.7
          name: 星痕
          message: "「看見了嗎？那一晚，天上裂開的樣子。」"
          summon: { type: SKELETON, count: 4 }
        - at: 0.4
          name: 十二門
          message: "「十二門的星衛，站起來！」"
          summon: { type: WITHER_SKELETON, count: 3 }
        - at: 0.15
          name: 最後的火
          message: "「這是我最後的火。天穹要收攏了——到我身邊來。」"
          speed: 0.2
          stats:
            - { stat: damage, type: INCREASED, value: 40 }

# ---- 昇華職業（2026-10 PoE2 改版）----
# 照 PoE2 的昇華：每個昇華一棵小樹（四條分支、最多 16 個天賦），每個天賦都是 1 點，四個試煉一共 8 點：大約只能配一半，要選。名稱沿用原本的，效果照 PoE2
# （每個昇華取 PoE2 那個昇華裡我們的系統做得出來的核心；要連段、榮耀、元素灌注、護符、寶石顏色、夥伴的先不做）。
# 每條分支的第一個隨時能配，後面的要先配同一條前面那個（requires）。
#   class    哪個職業的（marauder 戰士、mercenary 傭兵、huntress 女獵手、ranger 遊俠、monk 武僧、sorceress 女巫師、witch 女巫）
#   nodes    代號 → { name, requires, cost（預設 1）, icon, stats, note }
#            stats：{ stat, type: FLAT|INCREASED|MORE, value, tags }，INCREASED／MORE 的 value 是百分比；flag.* 這種寫死的效果說明在 stats/SignatureText。
# 退掉昇華天賦要花金幣（跟天賦樹退點同一個價格 × 點數），要從分支的最後面退。
ascendancies:
  ironwarden:
    class: marauder
    name: 鐵衛
    color: "#d4a24c"
    icon: SHIELD
    summary: 曜京十二道城門的守將：更多生命、胸甲護甲、放大天賦小點、粉碎打擊。
    nodes:
      t_armour:
        name: 鐵壁
        cost: 1
        icon: IRON_CHESTPLATE
        stats:
          - { stat: armour, type: INCREASED, value: 20 }
      t_stone_skin:
        name: 岩膚
        requires: t_armour
        cost: 1
        icon: STONE
        stats:
          - { stat: flag.stone_skin, value: 1 }
      t_str:
        name: 巨力
        cost: 1
        icon: IRON_INGOT
        stats:
          - { stat: attr.str, type: INCREASED, value: 4 }
      t_lineage:
        name: 星脈
        requires: t_str
        cost: 1
        icon: RED_DYE
        stats:
          - { stat: life.max, type: MORE, value: 15 }
      t_stun:
        name: 震撼
        cost: 1
        icon: ANVIL
        stats:
          - { stat: stun.buildup, type: INCREASED, value: 18 }
      t_crushing:
        name: 裂勁
        requires: t_stun
        cost: 1
        icon: NETHERITE_INGOT
        stats:
          - { stat: flag.crush_primed, value: 1 }
          - { stat: damage.vs_stunned, value: 25 }
      t_str2:
        name: 巨力 II
        cost: 1
        icon: IRON_INGOT
        stats:
          - { stat: attr.str, type: INCREASED, value: 4 }
      t_hulking:
        name: 巨像化
        requires: t_str2
        cost: 1
        icon: GOLDEN_APPLE
        stats:
          - { stat: flag.hulking_form, value: 1 }
      t_armour2:
        name: 厚甲
        requires: t_stone_skin
        cost: 1
        icon: IRON_BLOCK
        stats:
          - { stat: armour, type: INCREASED, value: 20 }
      t_mountain:
        name: 山岳之軀
        requires: t_armour2
        cost: 1
        icon: DEEPSLATE
        stats:
          - { stat: stun.threshold, type: INCREASED, value: 30 }
          - { stat: life.max, type: INCREASED, value: 5 }
      t_str3:
        name: 巨力 III
        requires: t_lineage
        cost: 1
        icon: IRON_INGOT
        stats:
          - { stat: attr.str, type: INCREASED, value: 4 }
      t_laststand:
        name: 背水一戰
        requires: t_str3
        cost: 1
        icon: TOTEM_OF_UNDYING
        stats:
          - { stat: sig.last_stand, type: FLAT, value: 1 }
      t_quake:
        name: 撼地
        requires: t_crushing
        cost: 1
        icon: COBBLESTONE
        stats:
          - { stat: skill.area, type: INCREASED, value: 15, tags: [slam] }
      t_earthbreaker:
        name: 崩地者
        requires: t_quake
        cost: 1
        icon: MACE
        stats:
          - { stat: damage, type: MORE, value: 20, tags: [slam] }
      t_regen:
        name: 巨軀回春
        requires: t_hulking
        cost: 1
        icon: RED_DYE
        stats:
          - { stat: life.regen, type: INCREASED, value: 25 }
      t_colossal:
        name: 巨像之軀
        requires: t_regen
        cost: 1
        icon: IRON_CHESTPLATE
        stats:
          - { stat: life.max, type: INCREASED, value: 8 }
          - { stat: armour, type: INCREASED, value: 20 }

  berserker:
    class: marauder
    name: 狂嘯者
    color: "#ff5544"
    icon: NETHERITE_AXE
    summary: 熔爐失控那一夜衝出火裡的禁衛：破甲、圖騰、戰吼、格擋。
    nodes:
      w_break:
        name: 碎甲
        cost: 1
        icon: IRON_PICKAXE
        stats:
          - { stat: armour.break, type: INCREASED, value: 25 }
      w_anvil:
        name: 鐵砧之重
        requires: w_break
        cost: 1
        icon: ANVIL
        stats:
          - { stat: armour.break, value: 10 }
      w_imploding:
        name: 碎甲之怒
        requires: w_anvil
        cost: 1
        icon: TNT
        stats:
          - { stat: flag.imploding_impacts, value: 1 }
      w_totem:
        name: 圖騰之軀
        cost: 1
        icon: OAK_LOG
        stats:
          - { stat: totem.life, type: INCREASED, value: 20 }
      w_answered:
        name: 英靈應召
        requires: w_totem
        cost: 1
        icon: TOTEM_OF_UNDYING
        stats:
          - { stat: skill.totems, value: 1 }
      w_block:
        name: 盾衛
        cost: 1
        icon: SHIELD
        stats:
          - { stat: block.chance, type: INCREASED, value: 6 }
      w_renly:
        name: 盾術精修
        requires: w_block
        cost: 1
        icon: SHIELD
        stats:
          - { stat: flag.renly_training, value: 1 }
      w_turtle:
        name: 玄甲符
        requires: w_renly
        cost: 1
        icon: TURTLE_HELMET
        stats:
          - { stat: block.max, value: 25 }
          - { stat: block.taken, value: 20 }
      w_bellow:
        name: 戰吼咆哮
        cost: 1
        icon: GOAT_HORN
        stats:
          - { stat: skill.cooldown, type: MORE, value: -50, tags: [warcry] }
      w_shatter:
        name: 斷骨
        requires: w_imploding
        cost: 1
        icon: BONE
        stats:
          - { stat: damage, type: MORE, value: 15, tags: [physical] }
      w_totem2:
        name: 英靈之力
        requires: w_answered
        cost: 1
        icon: TOTEM_OF_UNDYING
        stats:
          - { stat: damage, type: INCREASED, value: 30, tags: [totem] }
      w_ancestral:
        name: 祖靈列陣
        requires: w_totem2
        cost: 1
        icon: OAK_LOG
        stats:
          - { stat: skill.totems, type: FLAT, value: 1 }
      w_bulwark:
        name: 鐵幕
        requires: w_turtle
        cost: 1
        icon: SHIELD
        stats:
          - { stat: armour, type: INCREASED, value: 30 }
      w_cry:
        name: 戰吼回響
        requires: w_bellow
        cost: 1
        icon: GOAT_HORN
        stats:
          - { stat: skill.area, type: INCREASED, value: 30, tags: [warcry] }
          - { stat: skill.cooldown, type: INCREASED, value: -15, tags: [warcry] }
