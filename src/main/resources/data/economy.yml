# 經濟：面對面交易、市集（商店頁）、通貨交易所、商人、賭博。改完在遊戲內 /ec reload。
# 玩家之間的交易一律用通貨當價格；金幣是帳號共用的（所有角色同一個餘額），不能交易，只用來付手續費（照 PoE2）。

# 每種通貨的參考價值（以金幣計）。只在後台用：算手續費、市集照價格排序與價格上限（不同通貨互相比較）、
# 通貨交易所的「參考價」、面對面交易的估價。遊戲裡看不到這些數字——價格一律顯示通貨，金幣只出現在手續費。
# 只有寫在這裡、而且大於 0 的通貨能拿來標價、能在通貨交易所買賣（鑑定卷軸免費領，不列）。
# 跟著市價走（下面的 reference）時，這裡是起始值與上下限的基準，實際的值每天照交易所的成交價重算。
values:
  # 2026-10 照兩天的實際掉落重排：至臻石（錨點）兩天掉 1339 顆，亂流 219、機會 23、湮滅 11、天啟 12、
  # 鑿星石 34、大鑿星石 1；再用 PoE2 的行情（崇高＝1：富豪 1/3、混沌 3–10、湮滅 10、神聖 100+）折衷。
  # 這些值只在後台用（手續費、市集排序、交易所參考價、交易估價），人少時交易所不會動，起始值就是大家看到的參考價。
