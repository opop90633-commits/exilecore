# 物品共用設定。
scaling:
  # 武器傷害與防具數值：物品等級每高 1 級 ×（1 + per_level）。等級 60 約為等級 1 的 3.1 倍。
  damage_per_level: 0.035
  defence_per_level: 0.035
  # 屬性需求（力量／敏捷／智慧）隨物品等級放大
  requirement_per_level: 0.02
  # 2026-10-18：基底數值（武器傷害、防禦、固定詞綴）與裝備需求最高照幾級的物品等級算（0 = 不限）。
  #   怪物最高 92 級（巔峰），但商人、賭博照角色等級（上限 120）；超過的照 92 算，物品上顯示的物品等級不變。
  #   數值是每次讀取時算的，已經有的裝備（含洗好的詞綴）重開伺服器就照這個，不用另外轉換。
  stat_level_cap: 92
  # 品質每 1% 的加成
  quality_weapon_percent: 1.0
  quality_armour_percent: 1.0
