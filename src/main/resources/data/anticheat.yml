# 防作弊（2026-10）：只管「改遊戲數值」那一類——移動速度、飛行、懸空、瞬移。腳本、連點那一類不管。改完 /ec reload。
#
# 怎麼查：每刻看每個人走了多遠（不信客戶端說的「在地上」）。
#   超速：最近一秒走的距離不能超過「伺服器自己算的移動速度 × 衝刺跳躍 × 冰面 × tolerance」；天賦、裝備、藥水給的加速都在
#         移動速度裡，技能、翻滾、擊退給的衝刺（伺服器設的速度）會照大小暫時加進上限，不會誤判。
#   飛行：沒踩在東西上卻連續 hover_ticks 刻不往下掉（懸空），或離開地面後升了超過 max_rise 格（原版跳最高約 1.25 格）。
#         能飛的（創造、營地飛行的贊助者）、滑翔、騎東西、漂浮或緩降效果、跳躍藥水、在水裡、爬梯子、史萊姆方塊附近都不查。
#   登入、傳送、重生、換世界、被打之後 grace_ticks 刻內不查。
# 抓到：拉回最後一個正常站過的位置（不會卡進方塊），動作列提示；strike_window_seconds 秒內拉回 strikes_to_kick 次就踢出。
# 管理員（exilecore.admin）在線會收到通知；有 exilecore.anticheat.bypass 權限的人完全不查。
# 看某個人的狀態：/ec anticheat 玩家
enabled: true
checks:
  speed: false            # 2026-10-26：關掉超速檢查（技能、坐騎、加速太多種，誤判多）；飛行照查
  flight: true
tolerance: 1.25            # 超速的放寬倍率（1.0 = 完全照理論值；太嚴會誤判，1.2～1.4 之間比較合適）
hover_ticks: 14            # 懸空幾刻（0.7 秒）算飛
max_rise: 1.9              # 一次跳升超過幾格算飛（原版 1.25；留一點給方塊邊緣）
decay_per_tick: 0.02       # 違規點數每刻消退多少（走正常一秒消 0.4）
strikes_to_kick: 8         # 幾次拉回之後踢出（0 = 只拉回、不踢）
strike_window_seconds: 120 # 幾秒內的拉回算在一起
notify_admins: true        # 通知在線的管理員
tell_player: true          # 拉回時在動作列告訴他
grace_ticks: 40            # 登入、傳送、重生之後幾刻內不查
