# 藥劑與護符的詞綴（2026-10，照 PoE2 0.5 的藥劑詞綴；資料來源 RePoE poe2 mods.json）。改完在遊戲內 /ec reload。
# 藥劑、護符的基底由 flasks.yml 合成（ItemRepository）：spawn_tags 寫 flask（生命與魔力都出）、life_flask、mana_flask、charm。
# 藥劑最多魔法（一前綴一後綴，PoE2）：只有鑑定、微光石、添輝石、重骰魔法、湮滅、洗白這幾種通貨能用（Crafting.problem）。
# flask.local.*、charm.local.* 只在那一瓶／那一顆上生效（FlaskService、CharmService 讀），角色屬性表不讀。
# 2026-10-22：高階更難出——每高一階的權重相對再 ×0.875（跟裝備詞綴的「×0.8 → ×0.7」同一個比例）；每條詞綴的權重總和不變（出現哪一條的機率不變，只改出哪一階）。
# 2026-10-22：只有一階的詞綴（立即回復）權重減半。

flask_charges_gained:
