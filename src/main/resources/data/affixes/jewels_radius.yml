# 遺時珠寶（半徑珠寶）的詞綴（2026-10，照 PoE2 0.5 的 Time-Lost 珠寶；資料來源 RePoE poe2 mods.json）。
# 基底：time_lost_ruby／emerald／sapphire／diamond（bases/jewels.yml），spawn_tags：radius（四種都出）、r_ruby、r_emerald、r_sapphire。
# radius:屬性 = 「範圍內的小天賦也各給」：珠寶孔周圍半徑內每一個已配置的小天賦都多給一次（JewelSockets.radiusModifiers）。
# radius_notable:屬性 = 「範圍內的核心天賦也各給」：範圍內每一個已配置的核心天賦都多給一次。
#   2026-10-26 照 PoE2：每條半徑詞綴照原作分成小天賦或核心天賦（audit jewels.tsv 的 poe2_node_type）；這次之前全部都是小天賦，
#   而且最多算 15 個小天賦（原作沒有上限，拿掉了）。
# 半徑（2026-10-26 照 PoE2，原作座標的距離）：小 1000、中 1150、大 1300（jewel.local.radius 加在 1000 上）；這次之前是 2 格、+1／+2 格。
# jewel.local.small_effect／notable_effect：範圍內已配置的小天賦／核心的數值再加 x%。
# unveiled_jr_*：PoE2 的褻瀆半徑珠寶詞綴 → 隱匿（揭露）。
# 2026-10-27 照 PoE2 原始資料：每一階權重一樣（1000）；poe2db 寫「Modifier weight information cannot be obtained from game files」，遊戲資料每階都是 1。
#   這次之前（2026-10-22）：高階更難出——每高一階的權重相對再 ×0.875（跟裝備詞綴的「×0.8 → ×0.7」同一個比例）；每條詞綴的權重總和不變（出現哪一條的機率不變，只改出哪一階）。

