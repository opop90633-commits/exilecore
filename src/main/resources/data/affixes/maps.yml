# 地圖詞綴（只出現在地圖上，標籤 map）。跟裝備同一套引擎：魔法地圖 1–2 條、稀有 4–6 條，通貨照常用。
# 屬性鍵的前綴決定作用在誰身上：
#   monster:屬性   這張圖裡所有怪物（含 Boss）       boss:屬性   只有 Boss
#   player:屬性    在這張圖裡的玩家                  map.xxx     地圖本身（下面）
#   map.quantity／map.rarity    物品數量／稀有度（百分比點數）：每條詞綴都帶一些，越難越肥（PoE 的做法）
#   map.pack_size              怪物群多幾 % 隻
#   map.magic_packs／map.rare_packs   魔法／稀有怪物群的權重多幾 %
# 地圖的物品等級 = 那一階的怪物等級（T1 = 61 … T16 = 84）：代號 1 的強度要物品等級 63（T3）以上，
# 代號 0（最強，等級 100 版本加的）要 75（T11）以上。names 依排名（最強在前），物品上存的是代號。
#
# 2026-10 PoE2 改版：可以擲出的詞綴全部照 PoE2（0.5）的換界石詞綴池（資料來源 RePoE poe2 mods.json，跟 poe2db 同一份遊戲檔案）。
# PoE2 一條詞綴 4 個階段，照換界石的階級分：T1–5、T6–10、T11–15、T16 → 這裡的 ilvl 1／66／75／84（代號 3／2／1／0）。
# 每條詞綴都附帶 PoE2 的獎勵：物品數量（map.quantity）加上 稀有度／怪物群大小／魔法與稀有怪物群 其中一種；
# PoE2 的「怪物威力」（monster potency）這裡沒有對應的東西，換成稀有怪物群（map.rare_packs）。
# PoE2 還有 3 條地面效果（燃燒／冰緩／感電地面）、「玩家獲得戰星機率減少」、「怪物受到的詛咒效果減少」，引擎沒有對應的屬性，先沒做。
# 原本自己設計的詞綴改成 spawn_tags: [retired]：不會再擲出來，已經在地圖上的照常生效。
# 2026-10-22：高階詞綴更難出——每高一階的權重相對再 ×0.875（跟裝備詞綴同一個比例）；每條詞綴的權重總和不變。


