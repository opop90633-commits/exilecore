# 地圖詞綴（只出現在地圖上，標籤 map）。跟裝備同一套引擎：魔法地圖 1–2 條、稀有 4–6 條，通貨照常用。
# 屬性鍵的前綴決定作用在誰身上：
#   monster:屬性   這張圖裡所有怪物（含 Boss）       boss:屬性   只有 Boss
#   player:屬性    在這張圖裡的玩家                  map.xxx     地圖本身（下面）
#   map.waystones              換界石（地圖）掉落更多 x%（相乘）　map.rarity 物品稀有度（百分比點數）
#   map.pack_size              怪物群多幾 % 隻　　map.magic_packs／map.rare_packs   魔法／稀有怪物群的權重多幾 %
#   map.rare_mod_chance        稀有怪帶更多詞綴的機率更多 x%（相乘）
#   map.curse_zone.enfeeble／temporal_chains／elemental_weakness   玩家週期性被詛咒（MapHazards）
#   map.ground.fire／chill／shock、map.ground.patches、map.ground.radius   一塊塊的地面效果（MapHazards）
# 地圖的物品等級 = 那一階的怪物等級（T1 = 61 … T16 = 84）。names 依排名（最強在前），物品上存的是代號。
#
# 2026-10-26 照 PoE2 0.5 重新產生（tools/gen_poe2_waystones.py；資料 tools/poe2_waystones.json，RePoE poe2 mods.json）：
# - PoE2 一條詞綴 4 個階段，照換界石的階級分：T1–5、T6–10、T11–15、T16 → ilvl 1／66／75／84（代號 3／2／1／0），
#   而且「只出那一段」（Affix.banded：T16 一定是最高那一階）。沒有階段的（重甲、迅影、星盾、週期詛咒）只有一階。
# - 每個家族權重一樣、各自一組（火、冰、電、混沌可以同時出；中毒、流血也可以）。
# - 獎勵照原作：換界石掉落更多 + 稀有度／怪物群大小／魔法與稀有怪物群（+稀有怪詞綴機率）／怪物效能其中一種。
#   之前把「換界石掉落更多」當成物品數量（map.quantity）；原作的換界石詞綴沒有物品數量，拿掉了。
# - 2026-10-26 新增原作有的：重甲、迅影、星盾（生命轉能量護盾）、怪物受到的詛咒效果更少、藥劑充能減少、
#   三種週期詛咒、三種地面效果（同一組）。
# - 還沒做：褻瀆（深淵）詞綴——原作要用深淵的褻瀆通貨加在換界石上，我們沒有那套系統。
# 原本自己設計的詞綴改成 spawn_tags: [retired]：不會再擲出來，已經在地圖上的照常生效。

# ---- 前綴：讓怪物變強（PoE2 0.5；tools/gen_poe2_waystones.py 產生）----

