# 腐化詞綴（2026-10-21，照 PoE2 0.5.5 的腐化附魔，資料來源 RePoE poe2 mods.json 的 generation_type corrupted；數值照 PoE2）：
# 蝕變石腐化一件裝備時，25% 機率加上一條（已經有就換一條）。spawn_tags 寫 [corruption, 出在哪些裝備…]（任一個符合，跟一般詞綴一樣），
# require_tags 全部都要有、exclude_tags 不能有；不會自然擲出、通貨也加不上。一件只會有一條；顯示在詞綴最前面（紅色「腐化：」），
# 不佔前綴、後綴的位子。這裡沒有手套（PoE2 的手套詞綴出在褲子）、沒有劍斧連枷匕首戰杖（出在錘、獸符、矛、長棍）。
# （PoE2 有、這裡沒有做）武器交換速度（沒有武器交換）；減益的緩速幅度（PoE2 自己也擲不出來：所有部位權重 0，引擎有 slow.magnitude 留給傳奇用）；
# 權杖「臨在內的盟友施法速度」（召喚物不會施法，同 suffixes.yml 停用的 minion_cast_speed）。
# 權杖的「臨在內的盟友…」照 prefixes.yml／suffixes.yml 一直以來的做法翻成「召喚物…」。
# 格式同 prefixes.yml（type 只是存檔用，寫 suffix）。

corrupt_es_delay:
  type: suffix
  group: corrupt_enchant
  spawn_tags: [corruption, armour, focus]
