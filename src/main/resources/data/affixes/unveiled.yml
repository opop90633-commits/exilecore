# 揭露詞綴（2026-10 改版：照 PoE2 的「褻瀆詞綴」重做）：代號一定要用 unveiled_ 開頭——
# 一般的掉落、通貨都擲不到，只能靠盜賊首領揭露隱匿詞綴（三選一），或用揭露石（只在劫盜掉）。
# 第一階（物品等級 60）＝PoE2 褻瀆詞綴的數值；第二階（物品等級 1）低一點。PoE2 的手套詞綴放到護腿上。
# 有條件的（「最近」「低血時」之類）拿掉條件時數值有往下調；引擎沒有的機制（灌注、執政官、同伴、餘燼……）不收。
# 舊的 33 條（unveiled_life_mana 等）在檔案最後，spawn_tags 改成 [retired]：已經有的物品照常生效，不會再揭露出來。
# 2026-10-27 照 PoE2 原始資料：每一階權重一樣（1000）；poe2db 寫「Modifier weight information cannot be obtained from game files」，遊戲資料每階都是 1。
#   這次之前（2026-10-22）：高階更難出——每高一階的權重相對再 ×0.875（跟裝備詞綴的「×0.8 → ×0.7」同一個比例）；每條詞綴的權重總和不變（出現哪一條的機率不變，只改出哪一階）。
#   這次之前（2026-10-22）：只有一階的揭露詞綴（全部技能等級、多連鎖、全部抗性上限）權重減半（150 → 75）。

# ---- 前綴 ----

