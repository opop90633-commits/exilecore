# 前綴詞綴。names 依排名 1（最強）→ N（遊戲裡顯示的 T 幾就是排名）。tiers 的 tier 是階級代號，越小越強。
# ilvl 是需要的最低物品等級，weight 是權重。text 裡的 {value} / {min} / {max} 是 tiers 裡的變數；mods 的 value 用同名變數。
#
# 2026-10 PoE2 改版：可以擲出的詞綴全部照 PoE2（0.5）的詞綴池、部位與數值（tools 產生，資料來源 RePoE poe2 mods.json）。
# 防具、盾身上的護甲／閃避／能量護盾詞綴是本地的（只加這件的防禦）；武器的物理、附加傷害、攻速、暴擊率是本地的。
# 同一族在不同部位的階級不一樣時拆成好幾條（同一個 group，一件物品只會有一條）。
# 原本的詞綴改成 spawn_tags: [retired]：不會再擲出來，已經在物品上的照常生效。

# ======== PoE2 詞綴 ========

