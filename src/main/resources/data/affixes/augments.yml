# 2026-11-08 照站長「增幅系統」：PoE2 0.5 的增幅（梅德偉、卡特拉、索魯德、沃拉娜、克洛爾、烏特雷）解鎖的專屬詞綴；spawn_tags 寫 augment_＜代號＞，只有嵌著那個增幅的裝備擲得到（ItemGenerator.eligible）
# 數值照 poe2db；2026-11-08 照站長「原作也是這樣的嗎」：原作增幅的專屬詞綴每條只有一階（物品等級 65，poe2db 一條一列），全部併成一階、範圍照原作；這次之前梅德偉的那批平均切成三階（45／65／75），其他的也有分階
# 卡特拉、克洛爾原作是手套，我們是護腿。權重一律 100。後綴名稱照本檔其他後綴寫成「之＜名稱＞」（接在基底名稱後面）。
# 原作有、這裡沒做的（引擎沒有對應的屬性）：沃拉娜「怒氣消耗效率」「使用戰吼時回復生命」、烏特雷「技能有機率不移除充能球但仍視為已消耗」。

