# 星魄專屬的詞綴（2026-10-26，照 PoE2 0.5 的完美精髓與腐化精髓 Essence of Hysteria；數值照 poe2db 的 Essence 頁）：
# spawn_tags 寫 [essence, 出在哪些裝備…]：不會自然擲出、一般通貨也加不上（ItemGenerator 的詞綴池排除 essence），只有 currencies.yml 的
# 完美星魄、狂亂星魄給得了（稀有物品隨機移除一條，再加這條）。一階、數值照 PoE2。格式同 prefixes.yml。
# 注意：PoE2 有、我們還沒有對應屬性的沒做：完美混抗（物理傷害的 x% 視為混沌）、完美火抗／冰抗／電抗（那種元素的傷害回復為生命）。
# 2026-10-27 照 PoE2：完美施速星魄是「增加 18～20%／28～32% 魔力消耗效率」（消耗 ÷ (1 + 效率)）；這次之前近似成技能魔力消耗減少同樣的數字。
#   完美統御星魄的「光環效果」照 PoE2 的 Aura Magnitudes；統御星魄的「召喚物傷害」是 PoE2「存在範圍內的友軍傷害」（跟權杖的詞綴同一個做法）。

# ---- 完美星魄 ----
ess_life_pct:
  type: prefix
  group: maximum_life_increased_percent
  spawn_tags: [essence, body]
  names: [星魄的]
  text: "增加 {value}% 最大生命"
  tiers:
    - { tier: 1, ilvl: 72, weight: 1, value: [8, 10] }
  mods:
    - { stat: life.max, type: INCREASED, value: "{value}" }

