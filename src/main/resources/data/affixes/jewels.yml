  group: j2_quarterstaff_hit_damage_freeze_multiplier
  spawn_tags: [emerald, sapphire]
  names: [之星骸, 之精煉, 之雕琢]
  text: "使用長棍時增加 {value}% 凍結累積"
  chips: [elemental, cold, ailment]   # PoE2 的標籤（QuarterstaffFreezeBuildup）
  tiers:
    - { tier: 0, ilvl: 75, weight: 150, value: [17, 20] }
    - { tier: 1, ilvl: 50, weight: 400, value: [14, 16] }
    - { tier: 2, ilvl: 1, weight: 1000, value: [10, 13] }
  mods:
    - { stat: freeze.buildup, type: INCREASED, value: "{value}", tags: [quarterstaff] }

