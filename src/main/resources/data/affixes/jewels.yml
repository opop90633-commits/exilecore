# 珠寶詞綴（只出現在珠寶上）：小幅的百分比加成，照 PoE2 的珠寶。顏色決定能出什麼：
#   spawn_tags: [ruby]      赤星晶（白星晶也會出）   spawn_tags: [emerald]  翠星晶   spawn_tags: [sapphire]  蒼星晶
#   spawn_tags: [jewel]     每一種珠寶都會出
# 三個階級：代號 2（物品等級 1 起）、代號 1（物品等級 50 起，比較少見）與代號 0（物品等級 75 起，最少見）。前綴、後綴各最多 2 條（引擎對珠寶的限制）。

