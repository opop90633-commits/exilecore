# 2026-10 PoE2 改版：可以擲出的詞綴全部照 PoE2（0.5）的詞綴池、部位與數值；原本的改成 [retired]（舊物品照常生效）。
# 2026-10-26：階數、需求等級、權重、數值全部改成 poe2db 的原值（權重就是 PoE2 的 spawn weight，不再用 ×0.7 等比）；PoE2 這個部位沒有的詞綴停用。
# 2026-10-22：只有一階的詞綴（能量護盾回充、投射物技能等級）權重減半。

