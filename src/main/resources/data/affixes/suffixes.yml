# 後綴詞綴。names 依階級 1（最強）→ N；tiers 的 ilvl 是需要的最低物品等級，weight 是權重。
# text 裡的 {value} / {min} / {max} 是 tiers 裡的變數；mods 的 value 用同名變數。

resist_fire:
  type: suffix
  group: resist_fire
  spawn_tags: [armour, shield, jewellery]
  names: [之炎神, 之火龍, 之烈焰, 之火焰, 之火花, 之餘燼]
  text: "+{value}% 火焰抗性"
  tiers:
    - { tier: 1, ilvl: 60, weight: 150, value: [42, 48] }
    - { tier: 2, ilvl: 48, weight: 300, value: [35, 41] }
    - { tier: 3, ilvl: 36, weight: 600, value: [28, 33] }
    - { tier: 4, ilvl: 24, weight: 900, value: [20, 26] }
    - { tier: 5, ilvl: 12, weight: 1000, value: [13, 18] }
    - { tier: 6, ilvl: 1, weight: 1000, value: [6, 11] }
  mods:
    - { stat: resist.fire, type: FLAT, value: "{value}" }

