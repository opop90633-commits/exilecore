# 組隊與多人遊戲：隊伍、掉落怎麼分、經驗怎麼分、人多時怪物變多硬。
#
# 指令：/party（隊伍選單）、/party invite 玩家、/party accept、/party leave、/party kick 玩家、/party leader 玩家、/p 訊息（隊伍聊天）
# 隊伍只存在記憶體裡：伺服器重開就散了；離線的隊員還留在隊伍裡。

party:
  max_size: 6                 # 一隊最多幾人
  invite_seconds: 60          # 邀請多久沒回應就作廢
  # 2026-10-26 照站長要求（PoE 的做法）：「在附近」的範圍，大概一間 Boss 房（地圖的 Boss 房半徑 20 格，直徑 40）。
  #   經驗只分給附近的隊員、隊伍經驗加成只算附近的人、小怪的掉落只有附近的人有份；地圖裡也一樣（不再是整張地圖都算）。
  #   附近＝同一個世界、水平距離在這個格數內（高度不管）、活著、不是旁觀／觀戰、不在城鎮（營地）；離線的當然不算。
  #   隊伍選單與左邊的隊伍框會標出誰「範圍外」。這次之前：經驗 64 格、掉落 128 格，地圖裡整張地圖都算
  nearby_radius: 40

# 掉落：有份的人（傷害有到門檻；Boss 再加上同隊在附近的）每個人各自擲一份（用自己的物品數量、稀有度），直接進自己的背包；別人看不到你的那份
loot:
  share_threshold: 0.05       # 傷害佔「玩家對這隻怪造成的總傷害」多少以上就有一份（0.05 = 5%）；只搶到最後一擊不算
  # 小怪：一定要自己打到傷害，而且怪物死的時候要在附近（上面 party.nearby_radius；2026-10-26 前是 share_radius 128 格、地圖裡整張地圖）
  # Boss（區域 Boss、地圖 Boss、終局）：同隊的隊友不用打到傷害也有一份；但不管是誰，Boss 倒下時都要在 Boss 旁邊 32 格內、
  # 活著、不是觀戰才算（掉落、經驗、完成地圖、擊殺稱號都一樣；固定 32 格，不在這裡設定）
  # 最多幾份：跟下面 monsters.max_players 一樣（傷害最高的那幾個人）

# 經驗：算給對這隻怪傷害最多的隊伍（沒隊伍的人自己一隊），附近（party.nearby_radius）的隊員照等級分（PoE 的做法：不在附近的拿不到）
# 2026-10-26 前是 share_radius 64 格、地圖裡整張地圖都算
experience:
  level_weight_exponent: 2.71 # 每個人的權重 = (等級 + 10) ^ 這個數；等級差越多，低等的分越少（防帶練）
  bonus_per_member: 0.1       # 每多一個分經驗的隊員（只有附近的），這隻怪的總經驗再 +10%
  # 怪物因為人多而變硬多少，總經驗就多多少（下面的 life_per_extra_player），組隊練等不會比單刷慢；
  # 2026-10-26 起最多只算怪物倒下時在附近的玩家人數（隊友留在別的房間、城鎮、死掉，經驗不會因為他變多）

# 人多時怪物變硬：刷怪的那一刻看附近有幾個玩家（隊友或路人都算；在地圖裡：整張地圖的玩家），之後不會再變
monsters:
  count_radius: 48            # 幾格內的玩家算進去
  max_players: 6              # 最多算幾人
  # 每多一個玩家，生命多幾 %（2 人 +1 份、6 人 +5 份；人數之間相加，不是相乘）
  # 2026-10-27 照 PoE2（poe2db Monster 表：所有怪物 maximum_life_+%_final_per_additional_player 50，
  #   魔法、稀有、傳奇的稀有度再加同一個屬性 10／30／85；同一個屬性所以相加，每多一人 +60%／+80%／+135%）。
  #   這次之前普通、魔法、稀有都 50、傳奇 100
  life_per_extra_player:
    normal: 50                # 普通：2 人 +50% … 6 人 +250%
    magic: 60                 # 魔法：50 + 10；6 人 +300%
    rare: 80                  # 稀有：50 + 30；6 人 +400%
    unique: 135               # 傳奇（區域 Boss、地圖 Boss、終局）：50 + 85；2 人 +135% … 6 人 +675%
