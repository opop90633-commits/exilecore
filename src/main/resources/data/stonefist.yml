# 2026-10-28 照 PoE2 0.5 的昇華「石拳之道」（Way of the Stonefist，武聖）：穿著的手套變成磐石之拳（Fists of Stone），
# 每條詞綴換成原作的強化版本（RePoE mods.json 的 HandWraps* 詞綴，一條換一條；poe2db「磐石之拳」）。
# 我們沒有手套欄，PoE2 的手套一律是腿甲（uniques.yml、bases 的慣例），所以這裡換的是腿甲（tw.exilecore.item.Stonefist）。
#
# 磐石之拳本身：需求等級 1、不需要能力值、沒有基礎防禦，固定詞綴「每一玩家等級 +3 閃避值」「每一玩家等級 +1 最大能量護盾」（寫在程式裡）。
# 原本那件的基底防禦、本地防禦詞綴、固定詞綴都不算；嵌著的符文照常。
#
# affixes：我們的詞綴代號 → 換成的那條。tiers 的 tier 跟原本那條的階級代號一樣（照原作同一階的 HandWraps 數值，原作那一族
#   以需求等級對上）。數值照原本那條在範圍裡的位置換到新的範圍。沒寫在這裡的（腐化詞綴、原作沒有對應的揭露詞綴）照原本的生效。
# uniques：見下面。
#
# 特別的屬性鍵：local.hand_wraps_evasion_per_level／local.hand_wraps_es_per_level（每一玩家等級 +x 閃避值／最大能量護盾，
#   原作 local_hand_wraps_*_per_level；換算時乘上角色等級）。
# 「低血時受到的傷害更少 x%」（原作 hand_wraps_damage_taken_+%_final_on_low_life，更少）用每一種傷害的 debuff.taken.*@lowlife 寫，
#   跟其他「受到的傷害增加／減少」相加（不是另外乘）。
# 「能量護盾提前 x% 開始回充」（原作 faster start of Energy Shield Recharge）跟腐化詞綴一樣用 es.delay 減少 x%。
#
# 這次之前（2026-10-27）：腿甲的防禦換成每角色等級 +3 閃避、+1 能量護盾，詞綴（固定詞綴、符文以外）的數值增加 50%。

