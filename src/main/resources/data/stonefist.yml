# ---- 37 件手套傳奇的磐石之拳版本（poe2db「磐石之拳 Uniques」；數值照 poe2db 與 RePoE 的 HandWraps 詞綴）----
# 每一行寫 from：接原本（uniques.yml）第幾行的擲骰（1 起算；0 = 原作多出來的一行，沒有對應）。原本的行沒有被任何一行接到的就是原作拿掉了。
# 原作的符文保護（Runic Ward）我們沒有，換成同樣數值的能量護盾（下面各自註明）。
uniques:
  fugitive_greaves:   # 致命一擊（Deathblow）
    - from: 1
      text: "全域閃避值和能量護盾更多 {value}%"
      value: [15, 20]
      stats:
        - { stat: evasion, type: MORE, value: "{value}" }
        - { stat: es.max, type: MORE, value: "{value}" }
    - from: 2   # 原作「最近撲殺過，則增加 (30—40)% 撲殺門檻」；我們撲殺之後的門檻加成是 20 秒（撲殺 II 那一套）
      text: "撲殺敵人後 20 秒內，增加 {value}% 撲殺門檻"
      value: [30, 40]
      stats:
        - { stat: culling.threshold_on_cull, type: FLAT, value: "{value}" }
    - from: 3
      text: "擊殺時回復 3% 最大生命"
      stats:
        - { stat: life.on_kill, type: FLAT, value: 3 }
    - from: 4
      text: "擊殺時回復 3% 最大魔力"
      stats:
        - { stat: mana.on_kill, type: FLAT, value: 3 }
    - from: 5
      text: "撲殺：擊中後生命太低的敵人直接倒下"
      stats:
        - { stat: flag.culling, type: FLAT, value: 1 }

  rampart_greaves:   # 帝國之掌（Empire's Grasp）
    - from: 1
      text: "全域閃避值和能量護盾更多 {value}%"
      value: [15, 20]
      stats:
        - { stat: evasion, type: MORE, value: "{value}" }
        - { stat: es.max, type: MORE, value: "{value}" }
    - from: 2
      text: "增加 {value}% 攻擊範圍效果"
      value: [18, 24]
      stats:
        - { stat: skill.area, type: INCREASED, value: "{value}", tags: [attack] }
    - from: 3
      text: "擊殺時回復 3% 最大生命"
      stats:
        - { stat: life.on_kill, type: FLAT, value: 3 }
    - from: 4
      text: "被包圍時，攻擊的擊中傷害幸運"
      stats:
        - { stat: flag.lucky_when_surrounded, type: FLAT, value: 1 }
    - from: 5
      text: "擊退的方向反過來（把敵人拉向你）"
      stats:
        - { stat: flag.knockback_reversed, type: FLAT, value: 1 }

  hateforge_greaves:   # 怨恨鍛造（Hateforge）
    - from: 1   # 原作「+(70—100) 最大符文保護」
      text: "+{value} 最大能量護盾"
      value: [70, 100]
      stats:
        - { stat: es.max, type: FLAT, value: "{value}" }
    - from: 2
      text: "擊中時獲得 {value} 點怒氣"
      value: [6, 8]
      stats:
        - { stat: rage.on_hit, type: FLAT, value: "{value}" }
    - from: 3   # 原作「怒氣滿時回復 (3—5)% 最大符文保護」
      text: "怒氣滿時回復 {value}% 最大能量護盾"
      value: [3, 5]
      stats:
        - { stat: es.on_max_rage, type: FLAT, value: "{value}" }
    - from: 4
      text: "怒氣滿時失去全部怒氣"
      stats:
        - { stat: flag.lose_rage_at_max, type: FLAT, value: 1 }

  wintergrasp_wraps:   # 凜冬之握（Grip of Winter）
    - from: 1
      text: "全域閃避值和能量護盾更多 {value}%"
      value: [10, 15]
      stats:
        - { stat: evasion, type: MORE, value: "{value}" }
        - { stat: es.max, type: MORE, value: "{value}" }
    - from: 2
      text: "攻擊獲得等同於傷害 {value}% 的額外冰冷傷害"
