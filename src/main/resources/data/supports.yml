# 輔助寶石（機制照 PoE2，名稱是自己的）。改完在遊戲內 /ec reload。
#
# 輔助寶石不插裝備：掛在技能面板上技能的輔助孔（每個技能先有 2 孔，用鑿星石開到最多 5 孔）。
# 同一種輔助可以掛在不同技能上（每個技能各用一顆）；同一個技能不能掛兩顆一樣的。
# 要照 PoE2「同一種輔助一個角色只能用一次」的話，把下面的 once_per_character 改成 true。
# 輔助寶石是從未切割輔助寶石切出來的（右鍵選要哪一種）。
#
# tier            階級 1–3：未切割輔助寶石的階級要 ≥ 這個才切得出來
# requires        技能要有其中一個標籤才能掛（attack 攻擊、spell 法術、melee 近戰、projectile 投射物、area 範圍、chain 連鎖、
#                 duration 有持續時間的、cooldown 有冷卻時間的、movement 位移、travel 突進（衝刺、跳躍）、grenade 榴彈、minion 召喚、
#                 aura 光環、warcry 戰吼；
#                 見 skills.yml 的「標籤自動補上」）
# excludes        技能有其中一個標籤就不能掛（可省略）
# mana_multiplier 魔力消耗倍率（1.2 = 120%，好幾個輔助的倍率相乘）
# modifiers       疊到被輔助的技能上的修飾器，寫法跟詞綴一樣：
#                   INCREASED／MORE 的 value 是百分比（25 = 25%，負的是減少／更少）
#                   FLAT 的 value 直接用（投射物 +2、偷取 5%）
#                 能用的屬性：
#                   damage                   傷害（tags 限定哪種：projectile、area、melee、physical、elemental、fire…）
#                   attack.speed、cast.speed 攻擊／施法速度
#                   skill.area               範圍效果（半徑 = √倍率）
#                   skill.projectiles        額外的投射物
#                   skill.projectile_speed   投射物速度
#                   skill.pierce             投射物穿透幾個敵人
#                   skill.chains             多連鎖幾次（投射物打中後跳到附近另一個敵人；鏈雷多跳幾次）
#                   damage.gain.fire         物理傷害的 x% 額外附加為火焰（也有 cold、lightning、chaos）
#                   leech.life               造成的物理傷害有 x% 偷取為生命（每秒最多回 10% 最大生命）
#                   leech.life_elemental     造成的元素傷害有 x% 偷取為生命；leech.instant FLAT：偷取有 x% 立即生效（一下最多 6% 最大生命）
#                   leech.rate INCREASED：最大偷取速度；leech.effect INCREASED：偷取的量
#                   life.on_hit              每次擊中回復 x 生命
#                   crit.chance、crit.multi  暴擊率（INCREASED）、暴擊傷害（FLAT 點數）
#                   skill.duration           持續時間（地面效果、漩渦、印記…）
#                   skill.cooldown           冷卻時間（負的 = 更短）
#                   skill.fork               FLAT 1：投射物第一次打中時分裂成兩發
#                   flag.returning           FLAT 1：投射物停下來之後飛回施放者身邊，路上再打一次
#                   flag.echo                FLAT 1：法術施放後 0.25 秒自動再放一次（不花魔力；位移、印記不行）
#                   skill.repeats            FLAT：近戰攻擊按一次之後自動再打幾下（複擊；照攻擊間隔一下一下打，魔力只扣一次，
#                                            全部打完才能做別的；只有自己放的打擊、扇形、繞身一圈的攻擊與瞬影擊，最多 4 下；
#                                            瞬影擊是再閃幾次，閃完才開始冷卻）
#                   flag.spell_totem         FLAT 1：法術改由圖騰施放（8 秒、一根、12 格）
#                   flag.trap                FLAT 1：法術改成丟出去的陷阱（16 秒、三個、2 格觸發）
#                   skill.totems             FLAT：同時最多多幾根圖騰（只有圖騰技能）
#                   skill.minions            FLAT：召喚技能同時最多多幾隻（魔像這種固定一尊的不吃）
#                   aura.effect              INCREASED／MORE：光環的每一條效果都乘
#                   aura.reservation         INCREASED：光環保留的魔力（負的 = 保留比較少）
#                   flag.generosity          FLAT 1：光環不影響自己，隊友與召喚物得到 1.4 倍效果
#                   warcry.exerts            FLAT：戰吼多強化幾次攻擊
#                   召喚物（tags 要寫 [minion]，不然會變成主人的）：damage、attack.speed、movement.speed、life.max（MORE／INCREASED）、
#                   life.regen_percent（FLAT：每秒回復最大生命的 x%）
#                   元素異常（批次 3，見 ailments.yml）：
#                   ignite.chance、shock.chance        FLAT：點燃／感電機率 +x%；INCREASED：增加 x% 機率
#                   ignite.magnitude                   點燃傷害
#                   chill.effect、shock.effect         冰緩、感電的效果
#                   freeze.buildup                     凍結累積
#                   ignite.duration、chill.duration、freeze.duration、shock.duration、ailment.duration（全部）  持續時間
#                   bleed.chance、poison.chance        FLAT：流血（只有攻擊）／中毒機率 +x%；bleed.magnitude、poison.magnitude 傷害；
#                   bleed.duration、poison.duration    持續時間（流血、中毒見 ailments.yml）
#                   stun.buildup                       暈眩累積（INCREASED／MORE）；electrocute.chance FLAT：電擊機率 +x%（閃電傷害才有用）
#                   electrocute.buildup、stun.duration、electrocute.duration
#                   flag.no_elemental_ailments         FLAT 1：不能造成元素異常
#                   charge.on_hit.frenzy               FLAT：擊中時 x% 機率獲得一顆怒星（power 銳星、endurance 磐星；見 charges.yml）
# description     說明；寫 {charge:frenzy} 會換成「怒星（每顆：增加 4% 攻擊速度、…）」（照 charges.yml 的名字與 per_charge，
#                 改了 charges.yml 說明跟著變；power 銳星、endurance 磐星）
# notes           額外的說明行（可省略）
# source          專屬的掉落來源（可省略）：寫了就不能從未切割輔助寶石切出來，只有那裡會掉。
#                 終局代號（sky_crucible、frost_throne…）＝那個終局 Boss 有 maps.yml 的 drops.final_support_chance 的機率掉；
#                 其他的（例如 uber）＝只有寫在 maps.yml 的極境 drops.extra 裡（{ support: 代號, chance: 機率 }）才會掉

# 各階級的未切割輔助寶石從幾級的怪物開始掉
tier_levels: { 1: 1, 2: 15, 3: 35 }

# true = 同一種輔助一個角色只能用一次（PoE2）；false = 不同技能可以各掛一顆（預設）
once_per_character: false

# 2026-10 PoE2 改版拿掉的輔助寶石：代號: 階級。玩家身上、面板上的這些輔助會換成同階的未切割輔助寶石（登入時自動換）。
retired:
  multistrike: 3
  multiple_totems: 3
  melee_physical: 2
  life_on_hit: 1
  trinity: 3
  aura_effect: 2
  aura_expanse: 2
  aura_resonance: 3
  aura_efficiency: 2
  generosity: 2
  trap: 2
  returning_projectiles: 3
  greater_multiple_projectiles: 3
  instant_leech: 2
  elemental_damage_with_attacks: 2
  melee_splash: 2
  physical_to_lightning: 2
  frenzy_on_hit: 2
  power_on_hit: 2
  endurance_on_hit: 2
  aura_reach: 1          # 2026-10：自己做的光環輔助，PoE2 沒有，刪掉
  aura_amplify: 2
  aura_thrift: 2
  aura_benevolence: 2
  # 2026-10（照 PoE2）：圖騰施法、觸發類改成主要寶石（skills.yml 的 totem_casting、meta_*）；掛著的會換成同階的未切割輔助寶石
  spell_totem: 2
  trigger_crit: 2
  trigger_hit_taken: 2
  trigger_kill: 2
  trigger_ailment: 3
  cast_on_dodge: 2
  cast_on_minion_death: 2
  aura_sanctum: 3
  efficiency: 1           # 2026-10：節流（魔力消耗）也刪掉

supports:

