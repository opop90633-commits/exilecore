      - { stat: damage, type: MORE, value: 15, tags: [projectile] }

  pierce:
    name: 貫穿
    description: 投射物穿過敵人繼續飛（會爆炸的在停下來時才爆炸）。
    icon: PRISMARINE_SHARD   # 2026-10：原本 TRIDENT（原版右鍵有動作：拉弓、投擲、舉盾、吃、穿戴、吹號角…會干擾施放）
    tier: 1
    requires: [projectile]
    mana_multiplier: 1.2
    modifiers:
      - { stat: skill.pierce, type: FLAT, value: 2 }
      - { stat: damage, type: MORE, value: 10, tags: [projectile] }

  faster_attacks:
    name: 迅擊
    description: 被輔助的攻擊打得更快，每一下輕一點。
    icon: SUGAR
    tier: 1
    requires: [attack]
    mana_multiplier: 1.15
    modifiers:
      - { stat: attack.speed, type: MORE, value: 25 }
      - { stat: damage, type: MORE, value: -10 }

  faster_casting:
    name: 疾詠
    description: 被輔助的法術施放得更快。
    icon: CLOCK
    tier: 1
    requires: [spell]
    excludes: [aura, herald]
    mana_multiplier: 1.2
    modifiers:
      - { stat: cast.speed, type: MORE, value: 20 }

  added_fire:
    name: 引火
    description: 物理傷害的一部分額外化為火焰（焚羽箭、近戰都適用；純法術沒有物理傷害）。
    icon: BLAZE_POWDER
    tier: 1
    requires: [attack, spell]
    mana_multiplier: 1.2
    modifiers:
