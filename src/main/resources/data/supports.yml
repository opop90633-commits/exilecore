    name: 持久
    description: 地面效果、漩渦、印記這些有持續時間的效果撐更久。
    icon: CLOCK
    tier: 1
    requires: [duration]
    mana_multiplier: 1.15
    modifiers:
      - { stat: skill.duration, type: INCREASED, value: 45 }

