# 星諭卡（2026-10-19）：集滿一套換獎勵。卡本身是通貨（currencies.yml 的 card_ 開頭，外觀與說明在那邊），這裡寫規則。
# 改完 /ec reload。
#
# 掉落：每殺一隻地圖怪（每個有份的人各擲一次）先照 chance 擲「有沒有卡」，有的話從「這個地點能掉的卡」照 weight 抽一張；
#   完成地圖事件時（每個有份的人）照 chance.event 擲一次，從那個事件的卡裡抽。卡走一般的掉落（物品數量、掉落過濾、掉落倍率都照算）。
# 撿到的卡（含星諭牌堆）直接進倉庫通貨頁的「星諭卡」那一組；倉庫滿了才進通貨袋、背包。
#
# 每張卡：
#   tier     common 常見／mid 中階／rare 稀有／chase 追逐（賭卡的金幣照這個；chase、rare 兌換時全服公告）
#   set      幾張換一次
#   weight   同一個地點能掉好幾種卡時的權重
#   sources  map:地圖代號（那張圖的任何怪）、boss:地圖或終局代號（那張圖的 Boss）、event:事件（shrine、strongbox、breach、exile、
#            ritual、delirium、abyss；完成事件時擲）、any（任何地圖的怪，配 min_tier）
#   min_tier 地圖至少幾階（沒寫 = 1）
#   reward   currency + amount／unique（指定一件）／unique_pool（某個來源的傳奇隨機一件：map_boss、final、chase、shrine…）／
#            essence（隨機星魄幾顆）
#
# 星諭牌堆（stacked_deck）：一般掉落表裡的通貨（currencies.yml 的 drop_weight），右鍵打開照 weight × settings.deck 的倍數隨機變成一張卡（任何卡都可能）。
# 賭卡（PoE 花園的「把一疊卡變成 0～2 倍」）：倉庫「星諭卡」那一組，對一種卡按 Q：花 gamble 的金幣 × 張數，
#   這一疊變成 0 到 2 倍（每個整數一樣機率）的同一種卡。

settings:
  chance:
    normal: 0.001       # 2026-10-19：整體約降到 1/3（以前 0.003／0.008／0.03／0.03／0.25；一張 T16 每人約 0.9 張 → 約 0.3 張）
    magic: 0.003
    rare: 0.01
    unique: 0.01
    boss: 0.1           # 一般地圖的 Boss
    final_boss: 0.4     # 終局、極境、巔峰、金庫之主（每人）
    event: 0.08         # 完成地圖事件（每人）
  item_level: 84        # 換到的傳奇的物品等級
  blank_weight: 1000    # 2026-10-19：殺怪的地方沒有自己的卡（王陵、觀星台、終局、巔峰路上的怪、Boss 叫的小怪）時補這麼重的「沒掉」，
                        #   不然擲到卡就幾乎一定是追逐卡；1000 = 跟一般地圖（自己的卡 1000）一樣稀有
  deck:                 # 2026-10-19 星諭牌堆：開出來的卡照 weight × 這個倍數抽（稀有卡不要跟常見卡一樣常見）
    common: 1           #   常見約 49%、中階約 37%、稀有約 14%；
    mid: 0.5            #   追逐 0.2（2026-10-19：0.47 → 0.2）：萬界的回音約 3,600 個牌堆一張，牌堆多出的共鳴石約 15%
    rare: 0.15
    chase: 0.2
  gamble:               # 賭卡：每張卡花多少金幣（照卡的等級）
    common: 600         # 2026-10-19：全部 ×2（原本 300／1500／6000／40000）
    mid: 3000
    rare: 12000
    chase: 80000

