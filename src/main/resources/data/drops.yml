# 掉落表。
# drops_per_rarity：各稀有度怪物的平均掉落件數（小數部分用機率），再乘（1 + 數量加成）。
# 2026-10：寶石、藥劑與四種低階通貨（微光石、添輝石、礪鋒石、甲冑殘片）掉少一點，裝備與其他通貨的掉率不變——
#   所以件數變成以前的 0.7 倍（0.35 → 0.244…），分類權重重新配。
#   未切割技能寶石是以前的 1/3、輔助寶石 3/8（分類權重 4 → 1.5 的比例）、藥劑一半；四種低階通貨的權重減半（currencies.yml）。
#   這個檔跟 currencies.yml 是一起調的：只更新其中一個（另一個自己改過、新版在 .new），通貨的掉率會差 1.6 倍，兩個要一起合併。
# 2026-10（第二次）：至臻石、豐饒石、小鑿星石的權重降低（currencies.yml），件數 × 0.926、通貨的分類權重 147 → 126，
#   讓裝備、寶石、藥劑與其他通貨的掉率都跟之前一樣，只有這三種變少。一樣要跟 currencies.yml 一起合併。
# 2026-10（第三次）：至臻石 400 → 250、神諭石 15 → 10（currencies.yml，通貨權重合計 5736 → 5581），件數 × 0.987、通貨的分類權重 126 → 122.6（全部 ×5 寫成整數：613），
#   讓裝備、寶石、藥劑與其他通貨的掉率都跟之前一樣，只有這兩種變少。一樣要跟 currencies.yml 一起合併。
# 2026-10（第四次）：通貨的分類權重 613 → 570（分類權重合計 1313 → 1270），件數 × 1270/1313，裝備、寶石、藥劑與其他通貨的掉率不變
drops_per_rarity:
  normal: 0.2158
  magic: 0.9241
  rare: 1.8482
  unique: 3.6964

# 每一件先抽分類：通貨、裝備、未切割技能寶石、未切割輔助寶石、藥劑
# （寶石的等級與階級、藥劑的基底依怪物等級決定，見 skills.yml、supports.yml、flasks.yml）
category_weights:
  # 2026-10：整數權重，全部 ×5（比例不變）；通貨 122.6 ×5 = 613
  # 2026-10（第四次）：照 100 人伺服器調高價通貨（currencies.yml：天啟石、湮滅石、至臻石、亂流石、僥倖石、恩澤石、鑿星石、小鑿星石變少，
  #   權重合計 5731 → 5329），通貨的分類權重 613 → 570，讓其他通貨的掉率跟之前一樣。一樣要跟 currencies.yml 一起合併。
  currency: 570
  equipment: 600
  skill_gem: 40
  support_gem: 30
  flask: 30

# 裝備的稀有度權重；魔法與稀有會再乘（1 + 稀有度加成）
# 2026-10：unique、boss_unique = 掉出來的裝備直接是傳奇的權重——只有那個基底有「能賭出來的傳奇」（uniques.yml 的 sources 寫 gamble、
#   物品等級夠）才算；那些傳奇裡有地圖 Boss 也會掉的用 boss_unique（比較低，跟 economy.yml 賭博的 unique : boss_unique 一樣的比例）。
#   也乘（1 + 稀有度加成）。0.5 大約是那種基底的裝備每 200 件有 1 件是傳奇。
# 稀有度加成也讓稀有的通貨比較常出現：最稀有的通貨相對乘（1 + 稀有度），最常見的不變，中間照權重的對數（見 DropTable.rollCurrency）。
rarity_weights:
  normal: 70
  magic: 25
  rare: 5
  unique: 0.5
  boss_unique: 0.16

# 全服掉落加成（活動用）：所有怪物與地圖寶箱的掉落多幾 %、金幣乘幾倍。管理網頁（/ec web）的「全服加成」可以直接改，
# 網頁改的值存在 plugins/ExileCore/admin-overrides.yml（蓋過這裡，這個檔不動）。
#   quantity  物品數量 +%（裝備、通貨、寶石、藥劑、地圖；跟其他物品數量加成相加，金幣不受影響）
#   rarity    物品稀有度 +%（魔法、稀有、能賭出來的傳奇的機會；稀有通貨比較常出現）
#   gold      怪物與寶箱掉的金幣 ×（商人、賭博、補給的價格照下面的金幣表算，不跟著變）
server_bonus:
  quantity: 0
  rarity: 0
  gold: 1.0

# 魔法與稀有裝備掉落時是否未鑑定。PoE2 做法：true，帶回城找鑑定師（NPC）免費鑑定，或用跟鑑定師領的鑑定卷軸。
unidentified: true

# 金幣：怪物死亡掉在地上，走過去自動撿進角色（退點、之後買東西與賭博用）。
# chance = 各稀有度掉金幣的機率，multiplier = 各稀有度的倍率，amount = 等級 → 金額範圍（線性內插），
# 再乘（1 + 掉落數量加成）。
gold:
  chance: { normal: 0.6, magic: 1.0, rare: 1.0, unique: 1.0 }
  multiplier: { normal: 1.0, magic: 3.0, rare: 8.0, unique: 25.0 }
  amount:
    1: [2, 6]
    10: [8, 20]
    20: [15, 40]
    30: [30, 70]
    40: [45, 100]
    50: [65, 140]
    60: [90, 200]
    70: [115, 255]
    80: [140, 310]
    90: [170, 370]
    100: [200, 440]

# 職業掉落權重（2026-10）：裝備的基底照撿的人的職業調整（傳奇不吃，照原本的權重擲）。
# 職業用的基底類（character.yml 的 starter.classes：推薦武器、防具、盾；拿弓的多算箭袋）×match，
# 屬性被職業包含的防具（例如武僧是閃避＋能量護盾：純閃避、純能量護盾的防具）×partial，其他 ×1。
# 只在同一個部位裡重新分配，各部位掉落的比例不變。商人的貨、地圖事件、劫盜、寶箱也照這個。
class_bias:
  enabled: true
  match: 3.0
  partial: 1.5
