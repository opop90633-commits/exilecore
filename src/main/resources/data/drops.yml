  # 2026-10：整數權重，全部 ×5（比例不變）；通貨 122.6 ×5 = 613
  # 2026-10（第四次）：照 100 人伺服器調高價通貨（currencies.yml：天啟石、湮滅石、至臻石、亂流石、僥倖石、恩澤石、鑿星石、小鑿星石變少，
