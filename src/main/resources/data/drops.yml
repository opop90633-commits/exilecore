# 掉落表。
# drops_per_rarity：各稀有度怪物的平均掉落件數（小數部分用機率），再乘（1 + 數量加成）。
# 2026-10：寶石、藥劑與四種低階通貨（微光石、添輝石、礪鋒石、甲冑殘片）掉少一點，裝備與其他通貨的掉率不變——
#   所以件數變成以前的 0.7 倍（0.35 → 0.244…），分類權重重新配。
#   未切割技能寶石是以前的 1/3、輔助寶石 3/8（分類權重 4 → 1.5 的比例）、藥劑一半；四種低階通貨的權重減半（currencies.yml）。
#   這個檔跟 currencies.yml 是一起調的：只更新其中一個（另一個自己改過、新版在 .new），通貨的掉率會差 1.6 倍，兩個要一起合併。
# 2026-10（第二次）：至臻石、豐饒石、小鑿星石的權重降低（currencies.yml），件數 × 0.926、通貨的分類權重 147 → 126，
#   讓裝備、寶石、藥劑與其他通貨的掉率都跟之前一樣，只有這三種變少。一樣要跟 currencies.yml 一起合併。
# 2026-10（第三次）：至臻石 400 → 250、神諭石 15 → 10（currencies.yml，通貨權重合計 5736 → 5581），件數 × 0.987、通貨的分類權重 126 → 122.6（全部 ×5 寫成整數：613），
#   讓裝備、寶石、藥劑與其他通貨的掉率都跟之前一樣，只有這兩種變少。一樣要跟 currencies.yml 一起合併。
# 2026-10（第四次）：通貨的分類權重 613 → 570（分類權重合計 1313 → 1270），件數 × 1270/1313，裝備、寶石、藥劑與其他通貨的掉率不變
# 2026-10（第五次，照市場報告）：天啟石、恩澤石、星盤刻刀、六種符文變少（currencies.yml，通貨權重合計 5329 → 5121，分類權重 570 → 548）；
#   未切割技能寶石 40 → 20、輔助寶石 30 → 12（第 3 階與 Lv.17～18 掉太多，整類減半／減到 2/5）；分類權重合計 1270 → 1210，件數 × 1210/1270，
#   裝備、藥劑與其他通貨的掉率不變。一樣要跟 currencies.yml 一起合併。
drops_per_rarity:
  # 2026-10-27 照 PoE2：殺怪的件數只用 normal（×（1 + monsters.yml 怪物稀有度的 quantity + 其他數量）），怪物稀有度不再乘這裡的倍數；
  #   magic／rare／unique 只給「照某個稀有度擲一份」的地方用（地圖事件的寶箱、獎勵箱、裂隙的獎勵這些），數值不變。
  # 2026-10-24（第七次，照市場報告）：下面 currency_scale 砍了七種通貨（豐饒、星火、僥倖、恩澤、鑿星、小鑿星、符文），
  #   通貨的分類權重 548 → 504（通貨權重合計 5115 → 4705），分類權重合計 1202 → 1158，件數 × 1158/1202——
  #   裝備、寶石、藥劑與其他通貨（至臻、亂流、天啟…）的掉率不變，只有這幾種變少。
  # 2026-10-26（照 PoE2 0.5 加通貨）：高階／完美的微光、添輝、豐饒、至臻、亂流石，星紋蝕刻器、工匠石、預見鎖（currencies.yml），
  #   通貨權重合計 4705 → 5493，通貨的分類權重 504 → 588，分類權重合計 1158 → 1242，件數 × 1242/1158——
  #   裝備、寶石、藥劑與原本的通貨掉率都不變，只是多了這幾種。這次之前 0.1967／0.8426／1.6853／3.3704
  # 2026-10-26（第二次）：拿掉工匠石，件數 × 1201/1242（其他通貨與裝備掉率不變）；這次之前 0.211／0.9037／1.8075／3.6149
