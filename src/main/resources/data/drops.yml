  currency: 592   # 2026-10-31 照站長：至臻石以上的通貨掉率 ×2（下面 currency_scale），其他通貨與裝備掉率不變：547 → 592（件數 × 1.0381）；這次之前 547 # 2026-10-26：拿掉工匠石 588 → 547（件數 × 1201/1242，其他通貨與裝備掉率不變）； 2026-10-26：504 → 588（照 PoE2 加了高階／完美通貨、蝕刻器、工匠石、預見鎖，其他通貨掉率不變）；2026-10-24：548 → 504
  equipment: 600
  skill_gem: 12                 # 2026-10-22（照市場報告）：20 → 12（Lv.16～19 只用掉 3～17%）；分類權重合計 1210 → 1202，件數 × 1202/1210，其他不變
  support_gem: 12
  flask: 30

# 裝備的稀有度權重；魔法與稀有會再乘（1 + 稀有度加成）
# 2026-10：unique、boss_unique = 掉出來的裝備直接是傳奇的權重——只有那個基底有「能賭出來的傳奇」（uniques.yml 的 sources 寫 gamble、
#   物品等級夠）才算；那些傳奇裡有地圖 Boss 也會掉的用 boss_unique（比較低，跟 economy.yml 賭博的 unique : boss_unique 一樣的比例）。
#   也乘（1 + 稀有度加成）。0.5 大約是那種基底的裝備每 200 件有 1 件是傳奇。
# 2026-10-27 照 PoE2：稀有度不影響掉哪一種通貨（通貨只吃數量）。這次之前稀有度加成也讓稀有的通貨比較常出現（最稀有的通貨相對乘（1 + 稀有度），最常見的不變，中間照權重的對數）。
rarity_weights:
  normal: 70
  magic: 25
  rare: 5
  unique: 0.5
  boss_unique: 0.16

