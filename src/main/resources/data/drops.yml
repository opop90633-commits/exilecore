# 全服掉落加成（活動用）：所有怪物與地圖寶箱的掉落多幾 %、金幣乘幾倍。管理網頁（/ec web）的「全服加成」可以直接改，
# 網頁改的值存在 plugins/ExileCore/admin-overrides.yml（蓋過這裡，這個檔不動）。
#   quantity  物品數量 +%（裝備、通貨、寶石、藥劑、地圖；跟其他物品數量加成相加，金幣不受影響）
#   rarity    物品稀有度 +%（魔法、稀有、能賭出來的傳奇的機會；稀有通貨比較常出現）
#   gold      怪物與寶箱掉的金幣 ×（商人、賭博、補給的價格照下面的金幣表算，不跟著變）
server_bonus:
  quantity: 0
  rarity: 0
  gold: 1.0

# 物品稀有度遞減（2026-10-19，像 PoE2：堆越多，每 1% 越不值）：只算玩家自己的（裝備、天賦、稱號；個人加倍藥不遞減），
# 地圖、全服、主題、怪物本身的稀有度照原本相加。每一段：超過 from %（自己的稀有度）的部分只算 rate。
#   例：自己 +100% → 75 + 25×0.5 = 實際 +87.5%；+150% → 75 + 75×0.5 = 實際 +112.5%；+200% → 75 + 100×0.5 + 25×0.25 = 實際 +131.25%
#   （2026-10-19 調重：原本從 100% 開始算一半、200% 以上四分之一）
# 寫 rarity_curve: [] = 不遞減。
rarity_curve:
  - { from: 75, rate: 0.5 }
  - { from: 175, rate: 0.25 }

# 全服的物品稀有度（server_bonus.rarity、贊助的全服加倍、在線人數、每月主題）跟自己的稀有度一律「相加」（2026-10-19）：
# 自己的先照上面的 rarity_curve 遞減，再加上全服的，最後才乘到機率上（1 + 合計）。全服的不遞減。

# 防「最後一下換裝」（2026-10-19）：自己的物品稀有度、物品數量變高之後，要連續維持這麼多秒才算數（變低馬上算）。
# 打 Boss 時穿輸出裝、快死時換上稀有度裝，那一下照換之前的數字掉。0 = 關掉。
swap_hold_seconds: 10

# 魔法與稀有裝備掉落時是否未鑑定。PoE2 做法：true，帶回城找鑑定師（NPC）免費鑑定，或用跟鑑定師領的鑑定卷軸。
unidentified: true

# 金幣：怪物死亡掉在地上，走過去自動撿進角色（退點、之後買東西與賭博用）。
# chance = 各稀有度掉金幣的機率，multiplier = 各稀有度的倍率，amount = 等級 → 金額範圍（線性內插），
# 再乘（1 + 掉落數量加成）。
gold:
  chance: { normal: 0.6, magic: 1.0, rare: 1.0, unique: 1.0 }
  # 2026-10-24（照市場報告：全服金幣 8 天從 21.7 億漲到 40.9 億，每個活躍帳號每天 370～690 萬）：倍率全部 ×0.7（原本 1 / 3 / 8 / 25）。
  #   只改掉落：商人、賭博、補給的價格與過濾換金幣照下面的 amount 算，不跟著變（所以賭一次要殺的怪變多 43%）
  multiplier: { normal: 0.7, magic: 2.1, rare: 5.6, unique: 17.5 }
  amount:
    1: [2, 6]
    10: [8, 20]
    20: [15, 40]
    30: [30, 70]
    40: [45, 100]
    50: [65, 140]
    60: [90, 200]
    70: [115, 255]
    80: [140, 310]
    90: [170, 370]
    100: [200, 440]

# 職業掉落權重（2026-10）：裝備的基底照撿的人的職業調整（傳奇不吃，照原本的權重擲）。
# 職業用的基底類（character.yml 的 starter.classes：推薦武器、防具、盾；拿弓的多算箭袋）×match，
# 屬性被職業包含的防具（例如武僧是閃避＋能量護盾：純閃避、純能量護盾的防具）×partial，其他 ×1。
# 只在同一個部位裡重新分配，各部位掉落的比例不變。商人的貨、地圖事件、劫盜、寶箱也照這個。
class_bias:
  enabled: true
  match: 3.0
  partial: 1.5
