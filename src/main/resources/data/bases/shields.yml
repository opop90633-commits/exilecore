# 盾牌基底（副手）。block 是格擋率（%），不隨等級縮放。

tower_shield:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
  name: 塔盾
  material: SHIELD
  model: exilecore:shield/tower_shield
  slot: OFF_HAND
  tags: [shield, str_armour, str_only, str_shield]
  drop_level: 1
  requirements: { level: 1, str: 18, dex: 0, int: 0 }
  armour: 40
  block: 28
  sockets: 3
  implicit:
    text: "+{value} 最大生命"
    value: [10, 20]
    mods:
      - { stat: life.max, type: FLAT, value: "{value}" }

buckler:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
  name: 圓盾
  material: SHIELD
  model: exilecore:shield/buckler
  slot: OFF_HAND
  tags: [shield, dex_armour, dex_only]
  drop_level: 1
  requirements: { level: 1, str: 0, dex: 18, int: 0 }
  evasion: 40
  block: 24
  sockets: 3
  implicit:
    text: "增加 {value}% 移動速度"
    value: [3, 3]
    mods:
      - { stat: movement.speed, type: INCREASED, value: "{value}" }

spirit_shield:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
  name: 法器   # 2026-10：靈盾 → 法器（照 PoE2 的 Focus：能量護盾、不能格擋；代號不變）
  material: SHIELD
  model: exilecore:shield/spirit_shield
  slot: OFF_HAND
  tags: [shield, int_armour, int_only, focus]
  drop_level: 1
  requirements: { level: 1, str: 0, dex: 0, int: 18 }
  es: 14
  block: 0
  sockets: 3
  implicit:
    text: "增加 {value}% 法術傷害"
    value: [5, 10]
    mods:
      - { stat: damage, type: INCREASED, value: "{value}", tags: [spell] }

kite_shield:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
  name: 鳶盾
  material: SHIELD
  model: exilecore:shield/kite_shield
  slot: OFF_HAND
  tags: [shield, str_armour, dex_armour, str_dex_armour, str_dex_shield]
  drop_level: 1
  requirements: { level: 1, str: 11, dex: 11, int: 0 }
  armour: 22
  evasion: 22
  block: 26
  sockets: 3

  implicit:
    text: "+{value}% 所有元素抗性"
    value: [4, 4]
    mods:
      - { stat: resist.fire, type: FLAT, value: "{value}" }
      - { stat: resist.cold, type: FLAT, value: "{value}" }
      - { stat: resist.lightning, type: FLAT, value: "{value}" }

