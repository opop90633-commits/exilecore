  slot: MAIN_HAND
  tags: [weapon, two_hand, quarterstaff, melee]
  drop_level: 1
  requirements: { level: 1, str: 0, dex: 12, int: 10 }
  damage: { physical: [9, 20] }
  aps: 1.6
  crit: 6.5
  sockets: 6
  implicit:
    text: "+{value}% 格擋率"
    value: [6, 10]
    mods:
      - { stat: block.chance, type: FLAT, value: "{value}" }

# 矛：單手近戰，刺得比較遠，也能投擲（投擲技能吃投射物傷害）。（外觀用原版的鐵矛，但不是原版的矛：沒有衝刺、長按這些動作）
