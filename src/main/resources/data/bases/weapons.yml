  requirements: { level: 1, str: 0, dex: 9, int: 7 }
  damage: { physical: [5, 13] }
  aps: 1.5
  crit: 6.0
  sockets: 3
  implicit:
    text: "增加 {value}% 攻擊速度"
    value: [8, 12]
    mods:
      - { stat: attack.speed, type: INCREASED, value: "{value}" }

wand:
  name: 法杖
  material: BLAZE_ROD
  model: exilecore:weapon/wand
  slot: MAIN_HAND
  tags: [weapon, one_hand, wand, melee]
  drop_level: 1
  requirements: { level: 1, str: 0, dex: 0, int: 14 }
  damage: { physical: [3, 8] }
  aps: 1.4
  crit: 7.0
  sockets: 3
  implicit:
    text: "增加 {value}% 法術傷害"
    value: [10, 16]
    mods:
      - { stat: damage, type: INCREASED, value: "{value}", tags: [spell] }

