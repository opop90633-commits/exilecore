# 武器基底。數值是物品等級 1 的值，依物品等級縮放（items.yml scaling）。
# tags：weapon 加上 one_hand/two_hand 與武器種類；melee 是近戰武器，ranged 是遠程武器（普攻是投射物：弓射箭，法杖與長杖射魔法彈）；
#       caster 是施法武器（法杖、長杖）：不出攻擊用的詞綴（攻擊附加、增加物理傷害、攻擊速度、命中；詞綴的 exclude_tags）。
# 2026-10：近戰武器的基礎傷害補到跟弓一樣的比例（對照 PoE2 的原值：弓、雙手錘約 0.69 倍，長矛原本只有 0.59、長棍 0.62、單手錘 0.63、獸魂符 0.64）：
#   長矛 ×1.17、長棍 ×1.11、單手錘 ×1.09、獸魂符 ×1.07——這幾類的每一個基底（含退役的舊基底）都乘過了，所以用 tools/gen_poe2_bases.py 重跑也是這個強度。
#   弩（原本 0.57）也補了：×1.21。權杖沒動。
# 2026-10-26：PoE2 分階基底（下面那一段）的傷害、攻速、暴擊全部改回 poe2db 的原值（行尾註解有原作名字與這次之前的值），
#   上面那幾個倍率不再適用。物品等級到 base_level 就是原值，再高也不往上長（原作的基底不跟物品等級走），比較低的照曲線往下縮。
#   法杖、長杖、權杖原作沒有攻擊傷害，沒動。

