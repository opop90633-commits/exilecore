# 武器基底。數值是物品等級 1 的值，依物品等級縮放（items.yml scaling）。
# tags：weapon 加上 one_hand/two_hand 與武器種類；melee 是近戰。弓與法杖在階段 3 才有遠程攻擊，現在先當近戰武器測試。

short_sword:
  name: 短劍
  material: IRON_SWORD
  model: exilecore:weapon/short_sword
  slot: MAIN_HAND
  tags: [weapon, one_hand, sword, melee]
  drop_level: 1
  requirements: { level: 1, str: 8, dex: 8, int: 0 }
  damage: { physical: [6, 14] }
  aps: 1.55
  crit: 5.0
  sockets: 3

hand_axe:
  name: 手斧
  material: IRON_AXE
  model: exilecore:weapon/hand_axe
  slot: MAIN_HAND
  tags: [weapon, one_hand, axe, melee]
  drop_level: 1
  requirements: { level: 1, str: 12, dex: 6, int: 0 }
  damage: { physical: [8, 16] }
  aps: 1.3
  crit: 5.0
  sockets: 3

war_hammer:
  name: 戰錘
  material: MACE
  model: exilecore:weapon/war_hammer
  slot: MAIN_HAND
  tags: [weapon, one_hand, mace, melee]
  drop_level: 1
  requirements: { level: 1, str: 16, dex: 0, int: 0 }
  damage: { physical: [10, 18] }
  aps: 1.15
