  sockets: 3

dagger:
  name: 匕首
  material: GOLDEN_SWORD
  model: exilecore:weapon/dagger
  slot: MAIN_HAND
  tags: [weapon, one_hand, dagger, melee]
  drop_level: 1
  requirements: { level: 1, str: 0, dex: 10, int: 6 }
  damage: { physical: [4, 12] }
  aps: 1.6
  crit: 7.5
  sockets: 3
  implicit:
    text: "增加 {value}% 暴擊率"
    value: [20, 30]
    mods:
      - { stat: crit.chance, type: INCREASED, value: "{value}" }

claw:
  name: 爪
  material: IRON_HOE
  model: exilecore:weapon/claw
  slot: MAIN_HAND
  tags: [weapon, one_hand, claw, melee]
