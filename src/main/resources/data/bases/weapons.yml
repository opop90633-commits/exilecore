# ---- PoE2 的新武器（重弩手、棍僧、長矛獵手）----
# 弩：雙手遠程，比弓慢、一發比較重；普攻射弩箭（原版箭矢）。
crossbow:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
  name: 弩
  material: CROSSBOW
  model: exilecore:weapon/crossbow
  slot: MAIN_HAND
  tags: [weapon, two_hand, crossbow, ranged]
  drop_level: 1
  requirements: { level: 1, str: 10, dex: 12, int: 0 }
  damage: { physical: [11, 25] }
  aps: 1.25          # 2026-10：1.15 → 1.25（弩的技能出手太慢）
  reload: 0.8   # 2026-10-26：舊的弩（退役）照 PoE2 一般弩的裝填時間
  crit: 5.5
  sockets: 6
  implicit:
    text: "增加 {value}% 投射物速度"
    value: [10, 20]
    mods:
      - { stat: skill.projectile_speed, type: INCREASED, value: "{value}" }

# 長棍：雙手近戰，出手快、打得到兩個；固定詞綴是格擋。（外觀用原版的竹子；不叫 staff：長杖是施法武器）
quarterstaff:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
