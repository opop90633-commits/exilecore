# ---- PoE2 的新武器（重弩手、棍僧、長矛獵手）----
# 弩：雙手遠程，比弓慢、一發比較重；普攻射弩箭（原版箭矢）。
crossbow:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
  name: 弩
  material: CROSSBOW
  model: exilecore:weapon/crossbow
  slot: MAIN_HAND
  tags: [weapon, two_hand, crossbow, ranged]
  drop_level: 1
  requirements: { level: 1, str: 10, dex: 12, int: 0 }
  damage: { physical: [11, 25] }
  aps: 1.25          # 2026-10：1.15 → 1.25（弩的技能出手太慢）
  crit: 5.5
  sockets: 6
  implicit:
    text: "增加 {value}% 投射物速度"
    value: [10, 20]
    mods:
      - { stat: skill.projectile_speed, type: INCREASED, value: "{value}" }

# 長棍：雙手近戰，出手快、打得到兩個；固定詞綴是格擋。（外觀用原版的竹子；不叫 staff：長杖是施法武器）
quarterstaff:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
  name: 長棍
  material: STICK
  model: minecraft:bamboo
  slot: MAIN_HAND
  tags: [weapon, two_hand, quarterstaff, melee]
  drop_level: 1
  requirements: { level: 1, str: 0, dex: 12, int: 10 }
  damage: { physical: [9, 20] }
  aps: 1.6
  crit: 6.5
  sockets: 6
  implicit:
    text: "+{value}% 格擋率"
    value: [6, 10]
    mods:
      - { stat: block.chance, type: FLAT, value: "{value}" }

# 矛：單手近戰，刺得比較遠，也能投擲（投擲技能吃投射物傷害）。（外觀用原版的鐵矛，但不是原版的矛：沒有衝刺、長按這些動作）
spear:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
  name: 矛
  material: STICK
  model: minecraft:iron_spear
  slot: MAIN_HAND
  tags: [weapon, one_hand, spear, melee]
  drop_level: 1
  requirements: { level: 1, str: 6, dex: 12, int: 0 }
  damage: { physical: [7, 16] }
  aps: 1.5
  crit: 6.5
  sockets: 3
  implicit:
    text: "增加 {value}% 近戰與投射物傷害"
    value: [10, 16]
    mods:
      - { stat: damage, type: INCREASED, value: "{value}", tags: [melee] }
      - { stat: damage, type: INCREASED, value: "{value}", tags: [projectile] }

# 獸魂符（2026-10，照 PoE2 的 Talisman）：雙手，德魯伊的變身武器（熊、狼人、飛龍的攻擊技能都要拿獸魂符）。
