# 地圖（星痕）的基底：基底 = 哪一張地圖（slot: MAP，標籤 map_t1 … map_t5 是在星圖的第幾圈）。
# 地圖物品的階級（T1–T16）寫在物品上，不在基底：同一張地圖每一階都能掉、都能開（maps.yml 的 settings.tiers）。
# drop_level 只是說明用（地圖不跟一般裝備一起掉）。
# 地圖不是裝備：不能穿、不會跟一般裝備一起掉；地圖的內容（主題、怪物、Boss、星圖位置）寫在 data/maps.yml，
# 用同一個代號對起來。詞綴池在 affixes/maps.yml（標籤 map），蛻變到點金一套通貨都能用。
# 材質用旗幟圖案（右鍵沒有作用、不會被原版用掉）；越外圈圖案越兇。

