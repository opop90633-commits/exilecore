# 飾品基底：戒指、項鍊、腰帶，戴在角色面板（/panel）的飾品欄位。

iron_ring:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
  name: 隕鐵指環
  material: IRON_NUGGET
  model: exilecore:jewellery/iron_ring
  slot: RING
  tags: [jewellery, ring]
  drop_level: 1
  requirements: { level: 1 }
  implicit:
    text: "攻擊附加 {min} 到 {max} 物理傷害"
    min: [1, 2]
    max: [3, 5]
    mods:
      - { stat: damage.added.min, type: FLAT, value: "{min}", tags: [attack, physical] }
      - { stat: damage.added.max, type: FLAT, value: "{max}", tags: [attack, physical] }

