# ---- 2026-10-26 照 PoE2 0.5 補上的飾品基底（手寫，不是 tools/gen_poe2_bases.py 產生的，重跑產生器不會動到這段）----
# 等級需求、掉落等級照原作（數值不跟物品等級縮放）。需要新機制的固定詞綴：
#   「可以多／少 x 條前綴／後綴」用 local.max_prefixes／local.max_suffixes（ItemGenerator 照這個算上限）；
#   還沒有的機制先略過那一行（見各基底的註解）：戒指的技能欄位、品質上限、深淵消蝕、當作手套／頭盔／鞋子的嵌入物、
#   項鍊賦予的技能。只剩略過那一行的基底一樣會掉（像原作沒有固定詞綴的戒指）；悲歌、兆示、空無墜飾只剩缺點，先停用（retired，不掉落、商人不賣）。

