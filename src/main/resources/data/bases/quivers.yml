# 箭袋基底（副手，2026-10）：只有主手拿弓的時候能裝（雙手武器不能拿盾，弓改配箭袋；弩不能裝箭袋，照 PoE2）。
# 詞綴：affixes 裡 spawn_tags 寫 quiver 的那些（生命、抗性、敏捷、攻擊附加傷害、攻速、暴擊、命中、投射物…）。
# 外觀用原版的皮革（箭、光靈箭會被原版的弓當成彈藥，不能用）。

serrated_quiver:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
  name: 鋸齒箭袋
  material: LEATHER
  slot: OFF_HAND
  tags: [quiver]
  drop_level: 1
  requirements: { level: 1, str: 0, dex: 10, int: 0 }
  implicit:
    text: "攻擊附加 {min} 到 {max} 物理傷害"
    min: [1, 2]
    max: [3, 4]
    mods:
      - { stat: damage.added.min, type: FLAT, value: "{min}", tags: [attack, physical] }
      - { stat: damage.added.max, type: FLAT, value: "{max}", tags: [attack, physical] }

fire_quiver:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
  name: 火紋箭袋
  material: LEATHER
  slot: OFF_HAND
  tags: [quiver]
  drop_level: 15
  requirements: { level: 15, str: 0, dex: 30, int: 0 }
  implicit:
    text: "攻擊附加 {min} 到 {max} 火焰傷害"
    min: [3, 5]
    max: [7, 10]
    mods:
      - { stat: damage.added.min, type: FLAT, value: "{min}", tags: [attack, fire] }
      - { stat: damage.added.max, type: FLAT, value: "{max}", tags: [attack, fire] }

piercing_quiver:
  retired: true        # 2026-10：換成照 PoE2 分階的基底（下面 PoE2 那一段）；舊物品照常能用
  name: 穿甲箭袋
