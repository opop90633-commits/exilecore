  # 2026-10-23：魚圖鑑的新魚（釣魚大賽、圖鑑看 fishing.fish 的 size）
  blue_mackerel: { name: 藍紋鯖, icon: SALMON }
  coral_fish: { name: 珊瑚蝶魚, icon: TROPICAL_FISH }
  moon_eel: { name: 月影鰻, icon: COD }
  fog_ghost: { name: 霧幽魚, icon: PUFFERFISH }
  storm_ray: { name: 雷鰩, icon: SALMON }
  star_koi: { name: 星鯉, icon: TROPICAL_FISH }
  glow_jelly: { name: 夜光水母, icon: PUFFERFISH }
