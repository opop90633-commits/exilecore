    - { id: soup, kind: food, need: algae_soup, amount: [2, 3], level: 10, xp: 60, gold: 300 }
    - { id: scrap, kind: material, need: scrap, amount: [5, 8], level: 10, xp: 45, gold: 240 }
    - { id: stew, kind: food, need: taro_stew, amount: [2, 3], level: 12, xp: 80, gold: 380 }
    - { id: steak, kind: food, need: shark_steak, amount: [1, 2], level: 12, xp: 80, gold: 400 }
    - { id: shard, kind: material, need: star_shard, amount: [3, 5], level: 15, xp: 70, gold: 360 }
    - { id: pie, kind: food, need: sunberry_pie, amount: [2, 3], level: 18, xp: 100, gold: 480 }
    - { id: sashimi, kind: food, need: lantern_sashimi, amount: [1, 2], level: 25, xp: 120, gold: 560 }
    - { id: coral, kind: material, need: coral, amount: [4, 6], level: 25, xp: 90, gold: 420 }
    - { id: relic, kind: material, need: relic, amount: [2, 4], level: 30, xp: 110, gold: 520 }
    - { id: feast, kind: food, need: star_feast, amount: [1, 1], level: 40, xp: 220, gold: 1200 }
    - { id: pearl, kind: material, need: abyss_pearl, amount: [1, 2], level: 45, xp: 200, gold: 1000 }

# 魚圖鑑：第一次釣到一種魚的生活經驗（圖鑑的紀錄記在帳號裡）；全部釣過 → 稱號 angler
dex:
  new_xp: 40

# 釣魚大賽（每週一到週日，時區照 settings）：比「這一週釣到的魚佔牠最大長度的比例」，週一結算（上線時領）；
#   rewards 第 1、2、3 名；第 1 名多拿稱號 fish_champion（下一週有人拿走就換人）
tournament:
  rewards:
    - { xp: 300, materials: { abyss_pearl: 3, star_shard: 10 } }
    - { xp: 200, materials: { abyss_pearl: 2, star_shard: 6 } }
    - { xp: 120, materials: { abyss_pearl: 1, star_shard: 4 } }

# 藏寶圖（材料）：瓶中信、漂流箱掉的機率；拿去海圖桌出航「藏寶島」
treasure:
  bottle: 0.1
  crate: 0.08

# 筏上設施的加成（在這塊筏上、是筏主或共用成員的人）
raft_bonus:
  lamp: { drift: 0.05, max: 4, night_fish: 0.25 }   # 晚上每盞筏燈漂流物 +5%（最多 4 盞）；晚上的魚權重每盞 +25%
  sail: { drift: 0.1 }                                # 有船帆漂流物 +10%
  bed: { stamina: 20 }                                # 右鍵吊床：每天一次回 20 點精力（不佔淡水、料理的每日上限）

# 魚籠：每 minutes 分鐘抓一條（不看在不在線；最多存 max 條；一塊筏最多 per_raft 個；收一條 xp 生活經驗）；fish 抓得到的魚與權重
fish_trap:
  minutes: 20
  max: 6
  per_raft: 4
  xp: 3
  fish: { silver_fish: 60, blue_mackerel: 25, star_fish: 12, lantern_fish: 3 }

# 按讚：拜訪別人的筏可以按讚（每人每天 per_day 次、同一塊筏一天一次）；每週人氣榜（選單看）
likes:
  per_day: 3

# 一起玩：筏主、共用成員在筏上撈東西的時候，筏上其他人（訪客、隊友）分到 xp 比例的生活經驗
crew:
  xp: 0.3

# 渦齒鯊王：拿鯊王血餌（配方 shark_bait）在自己的筏上右鍵用，鯊王從筏邊浮上來；筏變成戰鬥區；flee_seconds 秒沒打倒就游走（血餌沒了）。
#   life 生命倍率（照筏主等級的稀有怪）；drops 每樣各一次；currency 機率附通貨（不佔每日額度）；第一次打倒 → 稱號 shark_slayer
shark_king:
  name: 渦齒鯊王
  bait: 鯊王血餌
  life: 40
  scale: 3.2
  flee_seconds: 300
  drops: { abyss_pearl: [2, 3], shark_tooth: [4, 6], shark_skin: [3, 5], shark_meat: [6, 10], horn_shard: [1, 1] }
  horn_shard: 0
  currency: { chance: 1.0, ids: [zenith_orb, oracle_orb, sky_fragment, gemcutter_prism, glassblower_bauble] }
  xp: 400

# 深淵巨獸「淵鯨」：拿深淵號角（成品，可以交易）在自己的筏上右鍵吹，淵鯨從筏的東邊浮上來。
#   強度比照巔峰（萬界之巔的虛星；招式不跟虛星重複，boss_skills.yml 的 abyss_*）：等級、怪物屬性、玩家受到的巔峰詞綴、生命與傷害的寫法都照 maps.yml 的 like 那個巔峰；
#   每秒傷害上限、分段遞減跟終局一樣（maps.yml 的 final_dps）；掉落不吃物品數量、稀有度。
#   life／damage 跟 maps.yml 的 boss.life／damage 同一個寫法（生命再乘終局最高階的 tier_life）。
#   attempts：倒下幾次就算失敗（淵鯨回滿、號角沒了）；enrage：開打幾秒後狂暴（傷害更多 x%）
#   phases：生命低於 at 進下一個階段（傷害更多 damage%；shield 叫出幾顆潮核，打掉之前淵鯨無敵，時間到牠回 heal% 生命）
#   drops：每一樣各擲一次（unique 這裡的專屬傳奇、skill 專屬技能寶石 20 級、support 專屬輔助、currency 通貨、pool 傳奇池）
whale:
  name: 淵鯨
  type: HAPPY_GHAST
  like: awakener
  life: 1195.7      # 2026-10-21 晚：照打 Boss 每秒 200 萬、單人 3 分半（約 4.2 億生命）；400 萬起遞減（maps.yml 的 whale_dps）。早上 600 萬時是 3587
  damage: 2.9
  scale: 1.0
  mods: [resistant, swift]
  attempts: 2
  enrage: { after: 300, damage: 150 }   # 2026-10-18：360 → 300
  minutes: 10
  xp: 600
  horn: { name: 深淵號角, cost: { horn_shard: 5, shark_tooth: 2, star_shard: 10, abyss_pearl: 3 }, level: 40 }
  intro: "（海面下有什麼東西翻了個身。整片海，往上鼓了起來。）"
  defeat: "淵鯨沉回了深海。浪平了，海面上漂著牠留下來的東西。"
  skills:
    - abyss_tide_ring
    - abyss_breath
    - abyss_devour
    - { id: abyss_call_tide, with: [abyss_undertow] }
    - { id: abyss_ram, phase: 1 }
    - { id: abyss_roll, phase: 1 }
    - { id: abyss_tide_mark, phase: 1 }
    - { id: abyss_fury, phase: 2 }
    - { id: abyss_pressure, phase: 2 }
    - { id: abyss_sharks, phase: 2 }
    - abyss_bubbles                       # 2026-10-18：新招
    - abyss_whirlpool                     # 2026-10-18：新招
    - { id: abyss_breach, phase: 1 }      # 2026-10-18：新招
    - { id: abyss_whalefall, phase: 2 }   # 2026-10-18：新招
    - { id: abyss_tide_walls, phase: 2 }  # 2026-10-18：新招
    - abyss_maelstrom                     # 2026-10-18：獨有招（螺旋潮柱）
    - { id: abyss_tail_slap, phase: 1 }   # 2026-10-18：獨有招（一直線拍浪）
    - { id: abyss_tide_cage, phase: 1 }   # 2026-10-18：獨有招（潮籠）
    - { id: abyss_tsunami, phase: 2, with: [abyss_bubbles] }   # 2026-10-18：獨有招（海嘯，帶著潮泡一起來）
  hazards:
    - { skill: hazard_abyss_splash, every: 6, phase: 1 }   # 2026-10-18：9 → 6
  phases:
    - { at: 0.66, name: 深潛, message: "（淵鯨潛了下去，海面浮出幾顆發光的潮核）", damage: 30, shield: { count: 3, name: 潮核, life: 5, duration: 30, heal: 25 } }
    - { at: 0.33, name: 怒濤, message: "（淵鯨發狂了，整片海翻了過來）", damage: 40, shield: { count: 3, name: 潮核, life: 6, duration: 25, heal: 35 } }
  drops:
    - { unique: abyss_echo, chance: 0.01 }
    - { unique: tidewhisper_bow, chance: 0.01 }
    - { unique: tide_devourer, chance: 0.01 }
    - { skill: tide_call, chance: 0.01 }
    - { support: tidal_resonance, chance: 0.01 }
    - { unique: undertow_coil, chance: 0.01 }       # 2026-10-18：淵鯨再多 2 件傳奇（其中一顆珠寶）、1 顆技能、2 顆輔助
    - { unique: whalesong_pearl, chance: 0.01 }
    - { skill: abyssal_pull, chance: 0.01 }
    - { support: undertow_drag, chance: 0.01 }
    - { support: whale_breath, chance: 0.01 }
    - { pool: map_boss, chance: 0.03 }
    - { currency: sky_fragment, amount: 2, chance: 1 }
    - { currency: zenith_orb, amount: 4, chance: 1 }
    - { currency: oracle_orb, amount: 1, chance: 0.2 }
    - { currency: greater_socket_orb, amount: 1, chance: 0.2 }
    - { currency: abyss_core, amount: 1, chance: 0.5 }
    - { material: abyss_pearl, amount: 3, chance: 1 }
