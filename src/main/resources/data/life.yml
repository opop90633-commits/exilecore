# 釣魚：拿著星索鉤對著水面（沒有對到漂流物時）按右鍵拋線；wait_seconds 後咬鉤，bite_ticks 內再按右鍵就釣起來（花 stamina 精力）
fishing:
  wait_seconds: [3, 8]
  bite_ticks: 30
  stamina: 0                  # 2026-10-16：1 → 0，釣魚不花精力
  xp: 5
  # 2026-10-23：size 長度範圍（公分；圖鑑的紀錄、釣魚大賽比的是「佔最大長度的比例」）；weather 只在這種海象釣得到；zones 只在這些海域
  fish:
    - { material: silver_fish, weight: 70, level: 1, night_weight: 55, size: [12, 40] }
    - { material: blue_mackerel, weight: 30, level: 5, night_weight: 20, size: [20, 55] }
    - { material: star_fish, weight: 25, level: 10, night_weight: 25, size: [15, 45] }
    - { material: coral_fish, weight: 15, level: 15, night_weight: 0, size: [8, 25] }           # 只有白天
    - { material: moon_eel, weight: 0, level: 20, night_weight: 18, size: [40, 120] }           # 只有晚上（筏燈有加成）
    - { material: lantern_fish, weight: 5, level: 25, night_weight: 20, size: [10, 35] }        # 晚上比較好釣（筏燈有加成）
    - { material: fog_ghost, weight: 20, level: 30, night_weight: 20, size: [30, 80], weather: fog }
    - { material: storm_ray, weight: 20, level: 35, night_weight: 20, size: [60, 180], weather: storm }
    - { material: star_koi, weight: 20, level: 40, night_weight: 20, size: [30, 90], weather: star_tide }
    - { material: glow_jelly, weight: 0, level: 45, night_weight: 25, size: [15, 60], weather: glow_tide }
    - { material: abyss_angler, weight: 8, level: 50, night_weight: 12, size: [40, 110], zones: [deep, starfall] }
    - { material: starfall_trout, weight: 10, level: 60, night_weight: 10, size: [35, 95], zones: [starfall] }
    - { material: coelacanth, weight: 2, level: 70, night_weight: 3, size: [100, 200], zones: [deep, starfall] }

