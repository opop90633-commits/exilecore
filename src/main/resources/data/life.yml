  shallow: { name: 淺海, level: 1, description: "一開始的海" }
  deep: { name: 深海, level: 30, boost: { scrap: 2, star_shard: 2, crate: 1.5 }, shark_life: 1.6, shark_drops: 1.5, description: "廢鐵、星骸碎片多一倍，漂流箱 ×1.5；渦齒鯊更硬、掉得更多" }
  starfall: { name: 星墜海域, level: 55, boost: { star_shard: 4, crate: 2, bottle: 2 }, shark_life: 2.5, shark_drops: 2, description: "星骸碎片 ×4、漂流箱與瓶中信 ×2；渦齒鯊 ×2.5 生命、×2 掉落" }

# 營地的生活委託：每天 per_day 張（照帳號＋日期抽；只抽等級夠的）；交 kind food（背包裡的料理）或 material（帳號裡的材料）。
#   獎勵：生活經驗、金幣；currency_chance 機率附一顆通貨（佔每天海上通貨的額度）。只能在營地交（選單 /sea → 委託）
orders:
