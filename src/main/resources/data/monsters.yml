# 等級 → 普通怪的生命。這是平衡的第一個調整點。下面照 PoE2 逐級寫滿 1–100 級（只寫幾個錨點也可以，中間照上面說的等比內插）。
# 地圖的怪最高 84 級（T16），終局 T16 是 87 級（maps.yml 的 final.level_bonus），每週回響也最高 84 級。
# 遊戲內 /ec balance 會算目前裝備、技能、天賦打這張表的擊殺時間（參考用）。
# （2026-10-27 更新這段註解：這次之前寫的是 10-26 以前照 balance.yml 自己算的曲線，1 級 0.4 秒、60 級 1 秒、84 級 1.25 秒打死一隻）
