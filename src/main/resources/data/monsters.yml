  ZOMBIE_VILLAGER: { name: 殭屍村民, life: 1.0, damage: 1.0, skills: [{ id: slam, cooldown: 14 }], skill_chance: 0.2 }
  HUSK: { name: 屍殼, life: 1.1, damage: 1.0, skills: [{ id: slam, cooldown: 14 }], skill_chance: 0.3 }
  DROWNED: { name: 沉屍, life: 1.0, damage: 1.0, skills: [{ id: tide_slam, cooldown: 18 }], skill_chance: 0.25 }
  SKELETON: { name: 骷髏, life: 0.8, damage: 0.8 }
  STRAY: { name: 流髑, life: 0.8, damage: 0.8 }
  BOGGED: { name: 沼骸, life: 0.8, damage: 0.8, skills: [{ id: venom_pool, cooldown: 18 }], skill_chance: 0.25 }
  WITHER_SKELETON: { name: 凋零骷髏, life: 1.4, damage: 1.3, skills: [{ id: slam, cooldown: 12 }], skill_chance: 0.35 }
  SPIDER: { name: 蜘蛛, life: 0.9, damage: 0.9, skills: [{ id: pounce, cooldown: 12 }], skill_chance: 0.3 }
  CAVE_SPIDER: { name: 洞穴蜘蛛, life: 0.6, damage: 0.7, skills: [{ id: venom_pool, cooldown: 16 }], skill_chance: 0.25 }
  CREEPER: { name: 苦力怕, life: 0.8, damage: 2.5 }
  ENDERMAN: { name: 終界使者, life: 1.6, damage: 1.4, skills: [{ id: void_zone, cooldown: 18 }], skill_chance: 0.25 }
  WITCH: { name: 女巫, life: 1.2, damage: 1.0, skills: [{ id: venom_pool, cooldown: 16 }], skill_chance: 0.35 }
  SLIME: { name: 史萊姆, life: 0.7, damage: 0.6 }
  MAGMA_CUBE: { name: 熔岩史萊姆, life: 0.8, damage: 0.8 }
  PHANTOM: { name: 夜魅, life: 0.7, damage: 0.8 }
  SILVERFISH: { name: 蠹魚, life: 0.3, damage: 0.4 }
  ENDERMITE: { name: 終界蟎, life: 0.3, damage: 0.4 }
  PILLAGER: { name: 掠奪者, life: 1.0, damage: 1.0 }
  VINDICATOR: { name: 衛道士, life: 1.3, damage: 1.4, skills: [{ id: charge, cooldown: 14 }], skill_chance: 0.35 }
  EVOKER: { name: 喚魔者, life: 1.2, damage: 1.2, skills: [{ id: lightning_storm, cooldown: 16 }], skill_chance: 0.5 }
  RAVAGER: { name: 劫掠獸, life: 4.0, damage: 1.8, skills: [{ id: charge, cooldown: 12 }], skill_chance: 0.6 }
  BLAZE: { name: 烈焰使者, life: 0.9, damage: 1.0, skills: [{ id: meteor, cooldown: 16 }], skill_chance: 0.2 }
  GHAST: { name: 幽靈, life: 0.8, damage: 1.5 }
  HOGLIN: { name: 豬布獸, life: 1.5, damage: 1.2, skills: [{ id: charge, cooldown: 14 }], skill_chance: 0.3 }
  ZOGLIN: { name: 殭屍豬布獸, life: 1.5, damage: 1.2, skills: [{ id: charge, cooldown: 14 }], skill_chance: 0.3 }
  PIGLIN: { name: 豬布林, life: 0.9, damage: 0.9 }
  PIGLIN_BRUTE: { name: 豬布林蠻兵, life: 1.6, damage: 1.5, skills: [{ id: slam, cooldown: 12 }], skill_chance: 0.4 }
  ZOMBIFIED_PIGLIN: { name: 殭屍豬布林, life: 1.0, damage: 1.0 }
  GUARDIAN: { name: 深海守衛, life: 1.2, damage: 1.0 }
  ELDER_GUARDIAN: { name: 遠古深海守衛, life: 4.0, damage: 1.5 }
