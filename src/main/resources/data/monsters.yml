# 等級 → 擊殺一隻同等級普通怪的基礎經驗：PoE 的怪物經驗表（每一級都有寫；91 級以後不再增加）。
# 實際經驗 = 這個表 × experience_multiplier × 稀有度的 experience 倍率 × 等級差懲罰（character.yml）。
# 升級經驗（character.yml）是 PoE2 的表，所以每一級要殺的怪跟 PoE2 一樣越後面越多。
# experience_multiplier：我們一張地圖的怪大約是 PoE2 的三分之一，乘 2 讓練等花的時間接近 PoE2
#   （1 = 每隻怪跟 PoE 一樣，更難練；調大 = 比較好練）。改完 /ec reload，主控台會寫「60 級升一級要殺幾隻」。
# 2026-10-27 照 PoE2：1（每隻怪跟原作一樣）。「一張地圖的怪只有 PoE2 的三分之一」已經不成立（星圖天賦、換界石的怪物群大小），
#   加上 character.yml 的全服經驗 ×2，以前實際是原作的 4 倍。這次之前 2
