defence:
  accuracy_base: 10
  accuracy_per_level: 8
  # 怪物的閃避：命中公式是 PoE2 的「命中 × 1.25 ÷ (命中 + 閃避 × 0.3)」（2026-10），
  # 參考角色打同等級普通怪幾乎都打得中（PoE2 也是），閃避詞綴的怪才閃得掉一些
  evasion_base: 20
  evasion_per_level: 3
  armour_per_level: 8
  crit_chance: 5

# 稀有度：weight 出現權重、life/damage 倍率、mods 詞綴數、quantity/rarity 掉落加成（小數）、experience 經驗倍率
rarity:
  # 2026-10-26 照 PoE2（poe2db 的 monster_life_+%_final_from_rarity：魔法 +148%、稀有 +700%、傳奇 +2800%；傳奇 monster_rarity_damage_+%_final −35%；
  #   其他稀有度不加傷害）；resist = 元素抗性（PoE2 一般 Boss 30%，Path of Building 的設定）；curse_effect = 身上的詛咒效果更少（poe2db curse_effect_on_self_+%_final_from_rarity）。這次之前：魔法 1.8／1.2、稀有 3.5／1.5、傳奇 8／2
  # 2026-10-26 照 PoE2 0.5：poise = 暈眩門檻倍率（poise_threshold_+%_final_from_rarity 26／125／500）；slow_effect、exposure_effect = 身上的緩速、
  #   曝露效果更少（slow_potency／exposure_effect_on_self_+%_final_from_rarity）。這次之前沒有（暈眩門檻跟著生命走，緩速、曝露不分稀有度）
  # 2026-10-27 照 PoE2 0.5（poe2db／RePoE 的 MonsterMagic3／MonsterRare3／MonsterUnique3：monster_dropped_item_quantity_+% 400／1980／2400）：
  #   quantity 是怪物稀有度唯一的掉落件數加成——件數 = drops.yml 普通怪的件數 ×（1 + quantity + 地圖、自己、全服的數量），跟其他數量相加
  #   （PoE2 是加法還是乘法查不到，取比較保守的加法）。這次之前 0.5／1.5／3.0，而且件數又乘 drops_per_rarity 的稀有度倍數（算了兩次）。
  #   劫盜合約、地圖（換界石）的機率本身就分稀有度（heist.yml、maps.yml），不再吃這個。
  # 2026-10-27 照 PoE2 0.5（monster_slain_experience_+% 魔法 +250%、稀有 +400%）：experience 魔法 3.5、稀有 5；這次之前 3、12。
  #   傳奇（幾乎都是 Boss）維持 40：PoE2 一般傳奇怪 +750%（×8.5）、地圖 Boss 另外 +6000%（MonsterMapBossT1，合計約 ×68），取中間不動。
  normal: { weight: 85, life: 1.0, damage: 1.0, mods: [0, 0], quantity: 0.0, rarity: 0.0, experience: 1.0, poise: 1.0 }
  magic:  { weight: 12, life: 2.48, damage: 1.0, mods: [1, 1], quantity: 4.0, rarity: 0.3, experience: 3.5, curse_effect: -15, poise: 1.26, slow_effect: -15, exposure_effect: -15 }
  rare:   { weight: 3,  life: 8.0, damage: 1.0, mods: [2, 4], quantity: 19.8, rarity: 1.0, experience: 5.0, curse_effect: -30, poise: 2.25, slow_effect: -30, exposure_effect: -30 }
  unique: { weight: 0,  life: 29.0, damage: 0.65, mods: [0, 0], quantity: 24.0, rarity: 2.0, experience: 40.0, resist: 30, curse_effect: -50, poise: 6.0, slow_effect: -50, exposure_effect: -50 }

# 原版生物：中文名與倍率。沒列的用 default。
# skills：這種生物的招式（data/boss_skills.yml 的代號，可寫 { id, cooldown, damage } 覆蓋冷卻與傷害）；
# skill_chance：一般怪有幾成會帶（預設 0.25；魔法怪兩倍、稀有怪一定帶）；hand：帶招式時手上拿的原版物品（手上本來有東西的不換）。
# 一般怪的招式跟 Boss 一樣有地上的紅色警告，但不跳動作列、聲音小、不追擊；傷害是「這隻普通一下的幾倍」，所以小怪的招式自然比 Boss 輕。
types:
