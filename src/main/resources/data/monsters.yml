# 怪物設定（原版生物與 MythicMobs 怪物共用）。
# level：區域外（野外）自然生成的等級 = min + 每 ring_size 格加 per_ring 級，夾在 min 與 max 之間。
#        區域裡的等級由 zones.yml 決定（入口最低、Boss 場地最高）。
level:
  min: 1
  max: 60
  ring_size: 64
  per_ring: 2

# 生命與傷害表的錨點之間是「等比內插」：每一級照固定的比例成長（線性內插會每 10 級一輪忽快忽慢）。
#
# 等級 → 普通怪的生命。這是平衡的第一個調整點。
# 目前的數字是照 balance.yml 算的：中等裝備的參考攻擊角色打死一隻同等級普通怪，1 級 0.4 秒、60 級 1 秒、
# 84 級（T16 地圖）1.25 秒（生命 ÷ 每秒傷害的換算值；實際一下打不死也要揮完整下，平均 1.2 下到 4 下）。
# 60 級以後裝備最高到物品等級 84、寶石最高 20 級（80 級），所以 84 級以後怪物只比天賦的成長多硬一點點
# （地圖的怪最高 84 級，終局 T16 是 87 級，每週回響也最高 84 級；90、100 級的錨點只是讓曲線完整）。
# 改了裝備、技能、天賦之後，遊戲內 /ec balance 會重算擊殺時間與建議的錨點。
life:
  1: 17
  10: 31
  20: 107
  30: 253
  40: 552
  50: 964
  60: 1540
  70: 2319
  80: 3224
  90: 3671
  100: 4105

# 等級 → 每次攻擊的物理傷害範圍。照 balance.yml：同等級普通怪打一下扣參考角色 5%（1 級）、8%（60 級）、9%（84 級）最大生命。
damage:
  1: [2, 5]
  10: [8, 15]
  20: [18, 30]
  30: [33, 53]
  40: [52, 81]
  50: [74, 116]
  60: [103, 157]
  70: [135, 207]
  80: [171, 261]
  90: [209, 318]
  100: [255, 389]

# 等級 → 擊殺一隻同等級普通怪的基礎經驗：PoE 的怪物經驗表（每一級都有寫；91 級以後不再增加）。
# 實際經驗 = 這個表 × experience_multiplier × 稀有度的 experience 倍率 × 等級差懲罰（character.yml）。
# 升級經驗（character.yml）是 PoE2 的表，所以每一級要殺的怪跟 PoE2 一樣越後面越多。
# experience_multiplier：我們一張地圖的怪大約是 PoE2 的三分之一，乘 2 讓練等花的時間接近 PoE2
#   （1 = 每隻怪跟 PoE 一樣，更難練；調大 = 比較好練）。改完 /ec reload，主控台會寫「60 級升一級要殺幾隻」。
experience_multiplier: 2
