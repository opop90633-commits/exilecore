# 怪物詞綴：magic 怪 1 個、rare 怪 2 到 4 個。stats 是修飾器（INCREASED/MORE 的 value 是百分比；
# 燃焰、霜寒、帶電的另外比較容易點燃、凍結、感電玩家，見 ailments.yml）；
# added 是把物理傷害的多少比例額外加成元素傷害；vanilla_speed 是原版移動速度加成（小數）。
# skills 是招式（data/boss_skills.yml 的代號）、hand 是手上拿的原版物品；帶招式的詞綴一隻怪最多抽到兩條。
# 2026-10-23：照 PoE2 的稀有怪詞綴重調（Hasted、Armoured、Extra Fire Damage…），元素傷害與抗性拆成兩條；
#   PoE2 沒有、這裡自己的（抗性的、光環、招式）照留。數值是 PoE2 的（Headhunter 偷到的那份＝一般版）。
mods:
  swift:
    name: 極速的
    vanilla_speed: 0.3        # PoE2 Hasted：移動、攻擊、施法速度各 +30%
    stats:
      - { stat: skill.cooldown, type: INCREASED, value: -23 }   # 招式快 30%（冷卻 ÷1.3）
      - { stat: attack.speed, type: INCREASED, value: 30 }      # 2026-10-23：射箭間隔 ÷1.3；近戰（原版節奏固定）改成每一下 ×1.3
  sturdy:
    name: 壯碩的
    stats:
      - { stat: life.max, type: MORE, value: 50 }
  armoured:
    name: 鐵甲的
    stats:
      - { stat: armour, type: INCREASED, value: 100 }   # PoE2：+100%（以前 300）
  fiery:
    name: 燃焰的
    added: { fire: 0.4 }      # PoE2 Extra Fire Damage：40% 傷害額外加成火焰（抗性另外一條：耐火的）
    stats: []
  frosty:
    name: 霜寒的
    added: { cold: 0.4 }
    stats: []
  shocking:
    name: 帶電的
    added: { lightning: 0.4 }
    stats: []
  withering:
    name: 蝕魂的
    min_level: 10
    added: { chaos: 0.4 }     # PoE2 Extra Chaos Damage
    stats: []
  fire_resistant:
    name: 耐火的
    stats:
      - { stat: resist.fire, type: FLAT, value: 50 }
      - { stat: resist.max.fire, type: FLAT, value: 10 }
  cold_resistant:
    name: 耐寒的
    stats:
      - { stat: resist.cold, type: FLAT, value: 50 }
      - { stat: resist.max.cold, type: FLAT, value: 10 }
  lightning_resistant:
    name: 絕緣的
    stats:
      - { stat: resist.lightning, type: FLAT, value: 50 }
      - { stat: resist.max.lightning, type: FLAT, value: 10 }
  chaos_resistant:
    name: 抗蝕的
    stats:
      - { stat: resist.chaos, type: FLAT, value: 50 }
  pinnacle_resist:
    name: 巔峰抗性的          # 2026-10-26 照 PoE2：極境、巔峰級的 Boss 元素抗性 50%（傳奇本身 30% + 這個 20；Path of Building 的 Pinnacle 設定）
    stats:
      - { stat: resist.fire, type: FLAT, value: 20 }
      - { stat: resist.cold, type: FLAT, value: 20 }
      - { stat: resist.lightning, type: FLAT, value: 20 }
  resistant:
    name: 抗性的              # 這裡自己的（PoE2 拆成上面三條）：Boss、事件還在用
    stats:
      - { stat: resist.fire, type: FLAT, value: 40 }
      - { stat: resist.cold, type: FLAT, value: 40 }
      - { stat: resist.lightning, type: FLAT, value: 40 }
  deadly:
    name: 致命的
    stats:
      - { stat: crit.chance, type: INCREASED, value: 300 }   # PoE2 Extra Crits：+300%（以前 +200% 再加暴擊傷害）
  evasive:
    name: 飄忽的
    stats:
      - { stat: evasion, type: INCREASED, value: 100 }   # PoE2：+100%（以前 200）

  # ---- 2026-10-23：PoE2 的純數值詞綴 ----
  igniting:
    name: 烈焚的
    min_level: 12
    stats:                    # All Damage Ignites：擊中一定點燃，所有傷害都算進點燃
      - { stat: flag.all_damage_ignites, type: FLAT, value: 1 }
      - { stat: ignite.chance, type: FLAT, value: 100 }
  chilling:
    name: 凜冬的
    min_level: 12
    stats:                    # All Damage Chills：所有傷害都算進冰緩
      - { stat: flag.all_damage_chills, type: FLAT, value: 1 }
  electrifying:
    name: 雷殛的
    min_level: 12
    stats:                    # All Damage Shocks：擊中一定感電，所有傷害都算進感電
      - { stat: flag.all_damage_shocks, type: FLAT, value: 1 }
      - { stat: shock.chance, type: FLAT, value: 100 }
  accurate:
    name: 精準的
    stats:
      - { stat: accuracy, type: INCREASED, value: 200 }
  expansive:
    name: 擴域的
    min_level: 15
    stats:                    # Increased Area of Effect：招式範圍更多 100%（半徑 ×1.41）
      - { stat: skill.area, type: MORE, value: 100 }
  multishot:
    name: 多重的
    min_level: 15
    stats:                    # Additional Projectiles：齊射類的招式多 4 發
      - { stat: skill.projectiles, type: FLAT, value: 4 }
  regenerating:
    name: 再生的
    stats:                    # Regenerates Life：每秒回復 2% 最大生命
      - { stat: monster.regen_percent, type: FLAT, value: 2 }
  shielded:
    name: 護盾的
    min_level: 10
    stats:                    # Extra Energy Shield：多一層等於 25% 生命的護盾（先扣護盾；4 秒沒被打開始回充）
      - { stat: monster.shield_percent, type: FLAT, value: 25 }
  crit_resistant:
    name: 堅毅的
    stats:
      - { stat: crit.bonus_taken, type: INCREASED, value: -80 }   # 擊中牠的暴擊傷害加成減少 80%
  stun_resistant:
    name: 不屈的
    stats:
      - { stat: stun.threshold, type: INCREASED, value: 250 }
  slow_resistant:
    name: 不羈的
    stats:
      - { stat: slow.taken, type: INCREASED, value: -50 }        # 身上的減速（冰緩、詛咒、癱瘓…）效果減半

  # ---- 光環與召喚（min_level 以上的怪物才抽得到；地圖裡最常見） ----
  # aura：半徑內的怪物（含自己）都得到 stats，腳下有一圈 color 顏色的粒子。
  # summon：有目標玩家時每 interval 秒叫出 count 隻同種的普通怪，同時最多 max 隻；叫出來的不掉東西、不給經驗。
  warlord_aura:
    name: 督軍光環的
    min_level: 30
    stats: []
    aura:                     # PoE2 Extra Physical Damage Aura：物理傷害增加 20%
      radius: 10
      color: "e04040"
      stats:
        - { stat: damage, type: INCREASED, value: 20, tags: [physical] }
  anger_aura:
    name: 熾焰光環的
    min_level: 35
    stats: []
    aura:
      radius: 10
      color: "ff8020"
      stats:
        - { stat: damage.gain.fire, type: FLAT, value: 20 }
  determination_aura:
    name: 磐石光環的
    min_level: 40
    stats: []
    aura:
      radius: 10
      color: "c0c0c0"
      stats:                  # PoE2 Elemental Resistance Aura：三抗 +20%（這裡另外留著護甲）
        - { stat: armour, type: INCREASED, value: 100 }
        - { stat: resist.fire, type: FLAT, value: 20 }
        - { stat: resist.cold, type: FLAT, value: 20 }
        - { stat: resist.lightning, type: FLAT, value: 20 }
  haste_aura:
    name: 疾風光環的
    min_level: 30
    stats: []
    aura:                     # PoE2 Haste Aura：攻擊、施法、移動速度 +25%
      radius: 10
      color: "7fe0ff"
      stats:
        - { stat: movement.speed, type: INCREASED, value: 25 }
        - { stat: skill.cooldown, type: INCREASED, value: -20 }
        - { stat: attack.speed, type: INCREASED, value: 25 }
  shield_aura:
    name: 護盾光環的
    min_level: 35
    stats: []
    aura:                     # PoE2 Energy Shield Aura：多一層 12% 生命的護盾
      radius: 10
      color: "8fd3ff"
      stats:
        - { stat: monster.shield_percent, type: FLAT, value: 12 }
  summoner:
    name: 召喚的
    min_level: 25
    stats: []
    summon: { interval: 8, count: 2, max: 4 }

  # ---- 招式（技能第三部分之後）：魔法怪名字看得出來（猛擊的殭屍），稀有怪看手上拿的 ----
  slammer:
    name: 猛擊的
    min_level: 6
    stats: []
    skills: [{ id: slam, cooldown: 12 }]
    hand: MACE
  charger:
    name: 衝鋒的
    min_level: 10
    stats: []
    skills: [{ id: charge, cooldown: 14 }]
    hand: IRON_SPEAR
  volleyer:
    name: 齊射的
    min_level: 10
    stats: []
    skills: [{ id: arrow_volley, cooldown: 10 }]
    hand: BOW
  pouncer:
    name: 撲擊的
    min_level: 12
    stats: []
    skills: [{ id: pounce, cooldown: 10 }]
  venomous:
    name: 劇毒的
    min_level: 14
    stats:
      - { stat: poison.chance, type: FLAT, value: 100 }     # PoE2 Always Poisons：打中你一定中毒（可以疊加，見 ailments.yml）
    hand: SPIDER_EYE
  stunning:
    name: 震懾的
    min_level: 12
    stats:
      - { stat: stun.buildup, type: INCREASED, value: 100 }   # 打中你暈眩累積加倍（大招接連打到會暈）
    hand: STONE_AXE
  electrocuting:
    name: 電擊的
    min_level: 16
    added: { lightning: 0.3 }
    stats:
      - { stat: resist.lightning, type: FLAT, value: 40 }
      - { stat: electrocute.chance, type: FLAT, value: 35 }   # 閃電傷害打中你有機率累積電擊
    hand: LIGHTNING_ROD
  bleeder:
    name: 撕裂的
    min_level: 10
    stats:
      - { stat: bleed.chance, type: FLAT, value: 100, tags: [attack] }   # PoE2 Always Bleeds：攻擊打中你一定流血（移動時加倍：站著打）
    hand: IRON_AXE
  # 2026-10-23：PoE2 的殘廢、阻礙、致盲、腐化之血（打中你時；珠寶的腐化詞綴可以免疫，動作列寫 殘／阻／盲／腐血×層數）
  maiming:
    name: 致殘的
    min_level: 15
    stats:
      - { stat: maim.chance, type: FLAT, value: 30, tags: [attack] }   # 攻擊打中你有機率癱瘓：4 秒內移動速度慢 30%
    hand: IRON_SWORD
  # 2026-10-27 照 PoE2 稀有／魔法怪詞綴 of Shattering（MonsterArmourPenetration1）：擊中你時破甲，破甲量等同造成物理傷害的 1000%
  # （玩家完全破甲 4 秒沒有護甲；天賦「減少承受的破甲」減少，見 combat/PlayerArmourBreak）；這次之前怪物不會破玩家的護甲
  shattering:
    name: 粉碎的
    min_level: 30
    stats:
      - { stat: armour.break, type: FLAT, value: 1000 }
    hand: IRON_PICKAXE
  hindering:
    name: 阻礙的
    min_level: 20
    stats:                    # PoE2 Hinder Aura：8 格內的玩家一直被阻礙（移動速度慢 30%，跟癱瘓、冰緩相乘）
      - { stat: monster.hinder_aura, type: FLAT, value: 8 }
    hand: COBWEB
  blinding:
    name: 致盲的
    min_level: 18
    stats:
      - { stat: blind.chance, type: FLAT, value: 30 }    # 打中你有機率致盲：4 秒內命中與閃避更少 20%
    hand: INK_SAC
  corrupting:
    name: 腐血的
    min_level: 30
    stats:
      - { stat: corrupted_blood.chance, type: FLAT, value: 40 }   # 打中你有機率上一層腐化之血（物理持續傷害，最多 10 層，每層每秒那一下的 5%）
    hand: REDSTONE
  blinker:
    name: 閃現的
    min_level: 15
    stats: []
    skills: [{ id: blink, cooldown: 12 }]
    hand: ENDER_PEARL
  quaker:
    name: 震地的
    min_level: 18
    stats: []
    skills: [{ id: quake, cooldown: 16 }]
    hand: MACE
  fire_breather:
    name: 吐火的
    min_level: 20
    stats:
      - { stat: resist.fire, type: FLAT, value: 40 }
    skills: [{ id: flame_breath, cooldown: 14 }]
    hand: BLAZE_ROD
  frost_breather:
    name: 吐霜的
    min_level: 20
    stats:
      - { stat: resist.cold, type: FLAT, value: 40 }
    skills: [{ id: frost_breath, cooldown: 14 }]
    hand: PACKED_ICE
  cursing:
    name: 詛咒的
    min_level: 24
    stats: []
    skills: [{ id: curse_of_decay, cooldown: 20 }]
    hand: WITHER_ROSE
  meteor_caller:
    name: 隕石的
    min_level: 28
    stats: []
    skills: [{ id: meteor, cooldown: 15 }]
    hand: FIRE_CHARGE
  stormcaller:
    name: 雷暴的
    min_level: 32
    stats:
      - { stat: resist.lightning, type: FLAT, value: 40 }
    skills: [{ id: lightning_storm, cooldown: 16 }]
    hand: LIGHTNING_ROD

  # ---- 2026-10-23：PoE2 稀有怪的行為詞綴（招式在 boss_skills.yml 的 mod_ 開頭；特殊行為見 MonsterMechanics） ----
  fire_unleasher:
    name: 爆焰的
    min_level: 20
    stats: []
    skills: [{ id: mod_fire_nova, cooldown: 9 }]          # Periodically Unleashes Fire
  ice_unleasher:
    name: 爆寒的
    min_level: 20
    stats: []
    skills: [{ id: mod_ice_nova, cooldown: 9 }]
  lightning_unleasher:
    name: 爆雷的
    min_level: 20
    stats: []
    skills: [{ id: mod_lightning_nova, cooldown: 9 }]
  fire_bomber:
    name: 焰爆的
    min_level: 25
    stats: []
    skills: [{ id: mod_fire_blasts, cooldown: 10 }]       # Periodic Fire Explosions：地上先標記再炸
  cold_bomber:
    name: 冰爆的
    min_level: 25
    stats: []
    skills: [{ id: mod_cold_blasts, cooldown: 10 }]
  lightning_bomber:
    name: 雷爆的
    min_level: 25
    stats: []
