# 終局：最外圈兩張都完成後，在地圖裝置用兩片天穹碎片打開。沒有詞綴；開的時候選階級（最高到你完成過的最高階），
# 怪物等級 = 那一階 + level_bonus（T5 = 68 … T16 = 87），掉的地圖是那一階。
final:
  id: sky_crucible
  name: 天穹熔爐
  level_bonus: 3
  # Boss 的生命照開的階級再乘（所有終局都照這個，極境開在最高階也吃）：from 階（含）以下 ×1，往上每階等量增加，最高階 ×max。
  # 2026-10：伺服器的紀錄裡練好的角色 T16 終局 17～32 秒（多半 20 秒左右）、極境約 1 分鐘，跟最外圈的地圖 Boss 差不多快；
  #   原本的生命是照中等裝備的參考角色約 2 分鐘算的，練好的人輸出是那個的 5～6 倍。改成 T5 以下不變、T16 ×2.5：
  #   剛進終局的人照原本的時間打低階，練好的人 T16 大約 40～65 秒，中等裝備的人 T16 約 4.5～5 分鐘（狂暴在 6 分鐘）。
  # 2026-10：照人均單體 15 萬 DPS 重調：T16 終局約 40 秒（原 max 2.5；劫盜、極境也吃這個）
  tier_life: { from: 5, max: 11.7 }     # 2026-10：改回照頂裝單體 15 萬 DPS（T16 終局約 40 秒、極境約 2 分鐘；10 萬時是 7.8；劫盜終局、極境也吃這個；一般地圖 Boss 的 boss_tier_life 沒動）
  # 2026-10-21：一般終局（不含極境、巔峰、金庫之主——它們照上面的 tier_life）每一階的生命倍率，取代 tier_life（T1 … T16）：
  #   T10 以下跟 tier_life 一樣；T11 起照「單人 3 分半打完要打 Boss 每秒多少」等比例往上：
  #   T11 2.7 萬、T12 6 萬、T13 13.4 萬、T14 30 萬、T15 67 萬、T16 150 萬（T16 約 3.15 億生命）。
  #   不寫這一行 = 照 tier_life。
  tier_life_table: [1, 1, 1, 1, 1, 1.97, 2.95, 3.92, 4.89, 5.86, 12.27, 25.67, 56.64, 123.35, 268.63, 585]
  theme: star
  atlas: [8, 2]
  links: [starfall_tundra, observatory]
  lore: "三百年前，曜帝就是在這裡把自己丟進星骸的熔爐。"
  monsters: { BLAZE: 2, WITHER_SKELETON: 2, ENDERMAN: 1 }
  boss:
    name: 曜帝・星骸之軀
    type: WARDEN
    mythic: ExileCore_StarEmperor
    named: true
    life: 19.1       # 2026-10：照打白怪假人每秒 5 萬（打 Boss ×0.6 = 3 萬）單人打 3 分半鐘算的（T16 ×11.7 之後約 630 萬生命）
    damage: 2.2
    scale: 1.3
    mods: [armoured, resistant]
    intro: "「朕等了三百年，終於有人來看朕成神。」"
    defeat: "熔爐熄了。三百年來第一次，天穹之心安靜下來。"
    # 招式分三階段加：一開始音爆、兩波重踏、八顆星骸碎片、四塊裂隙、天穹環（擴散環，站進綠色缺口）；
    # 第一階段起多天穹墜落（大圈）、九發星槍、衝鋒、叫火靈、星骸光束（兩道光束掃大半圈），而且開始下墜星（場地危害）；
    # 第二階段起多超新星（半徑 14，前搖 2.2 秒）、十二顆隕落、全場詛咒、星核引力（漩渦，往外跑）、天穹審判（全場大招，躲進綠色安全區）。
    # 進入第一階段時張開護盾：25 秒內打掉三顆星骸結晶，不然回 25% 生命。開打 5 分鐘還沒打倒就狂暴（2026-10-21：全部 5 分鐘）
    skills:
      - emperor_sonic_boom
      - emperor_quake
      - star_shards
      - void_rifts
      - emperor_heaven_ring
      - { id: sky_fall, phase: 1 }
      - { id: star_lance_volley, phase: 1 }
      - { id: emperor_charge, phase: 1 }
      - { id: summon_star_fragments, phase: 1 }
      - { id: emperor_star_beam, phase: 1 }
      - { id: supernova, phase: 2 }
      - { id: meteor_apocalypse, phase: 2 }
      - { id: emperor_curse, phase: 2 }
      - { id: emperor_gravity_well, phase: 2 }
      - { id: emperor_judgement, phase: 2 }
    phases:
      - at: 0.66
        name: 星骸甦醒
        message: "「朕的碎片，回到朕身邊！」"
        summon: { type: BLAZE, count: 4 }
        shield: { count: 3, type: BLAZE, name: 星骸結晶, life: 4, duration: 25, heal: 25 }
      - at: 0.33
        name: 天穹墜落
        message: "「那就再墜落一次吧！」"
        speed: 0.3
        stats:
          - { stat: damage, type: MORE, value: 50 }
        summon: { type: WITHER_SKELETON, count: 3 }
    hazards:
      - { skill: hazard_star_meteor, every: 10, phase: 1 }
    enrage: { after: 300, damage: 100, speed: 0.3, message: "「夠了。朕不再陪你玩。」" }
  # 極境（Uber）：終局 Boss 的最強版本。用一般終局 Boss 掉的深淵星核開（地圖裝置的「極境」），要先打贏過一般的版本；
  # 固定開在最高階＋level_bonus 級，Boss 生命×life、傷害×damage，所有怪物的招式冷卻×cooldown；沒有路上的怪，直接打 Boss；
  # 每個人只能走進去一次（死了或離開就不能再進）。寫法：
  #   name／intro           極境 Boss 的名字與出場台詞（沒寫 = 原本的名字加「・極境」、原本的台詞）
  #   life／damage          生命、傷害再乘幾倍（比 T16 的一般版本；一般版本已經吃 tier_life 的 ×2.5）；cooldown 招式冷卻倍率（0.25–1.5）；
  #                         level_bonus 比終局最高階再高幾級
  #                         2026-10：life 3 → 4。伺服器的紀錄裡極境約 1 分鐘就打倒（狂暴在 4.5 分鐘）；加上 tier_life，
  #                         生命大約是以前的 3.3 倍，練好的人約 3 分鐘，差一點的會碰到狂暴
  #   skills／hazards       加在原本的後面；phases 寫了就整組換掉（一樣可以寫 shield；原本招式寫的 phase 1、2 照新的階段算）；
  #                         enrage 寫了就換掉；mods 多的怪物詞綴
  #   monster／player       這張圖的怪物、玩家額外的屬性（寫法同 monsters.yml 的 stats）
  #   key／key_cost         開門要哪種通貨幾個；key_chance、key_min_tier：一般版本開到第幾階以上，Boss 有多少機率掉一個（每個有份的人各擲）
  #   drops                 maps 掉幾張最高階的地圖、unique_chance 這個終局自己的傳奇每一件各自擲（追逐級照 drops.chase_chance，跟一般 Boss 一樣）、
  #                         exclusive_chance 極境專屬傳奇每一件各自擲（uniques.yml 的 sources 寫 uber_終局代號）、
  #                         common_chance 共通傳奇（map_boss 池）擲一次、中了抽一件（沒寫照 drops.final_common_chance）、
  #                         extra 額外掉落 [{ currency: 代號, amount: 幾個, chance: 機率 }、{ support: 輔助寶石代號, chance: 機率 }]
  uber:
    dps_cap: 6000000   # 2026-10-21：極境照「打 Boss 每秒 300 萬、3 分半」，上限是目標的 2 倍
    dps_over:
      - { from: 6000000, rate: 0.3 }   # 600 萬–1200 萬的部分算 30%
      - { from: 12000000, rate: 0.1 }   # 1200 萬–2400 萬的部分算 10%
      - { from: 24000000, rate: 0.03 }   # 2400 萬–4800 萬的部分算 3%
      - { from: 48000000, rate: 0.01 }   # 4800 萬以上的部分算 1%
    intro: "「又是你。這一次，朕不會留手。」"
    life: 95.1        # 2026-10-21：照打 Boss 每秒 300 萬、單人 3 分半算的（終局的 19.1 × 95.1 × T16 的 11.7，約 6.3 億生命；原 1.9 = 每秒 6 萬）
    damage: 1.5
    cooldown: 0.75
    level_bonus: 4
    skills:
      - uber_emperor_cross_beams
      - { id: uber_emperor_collapse, phase: 3 }
    phases:
      - at: 0.75
        name: 星骸甦醒
        message: "「朕的碎片，回到朕身邊！」"
        summon: { type: BLAZE, count: 5 }
        shield: { count: 3, type: BLAZE, name: 星骸結晶, life: 5, duration: 30, heal: 30 }
      - at: 0.5
        name: 天穹墜落
        message: "「那就再墜落一次吧！」"
        speed: 0.3
        stats:
          - { stat: damage, type: MORE, value: 40 }
        summon: { type: WITHER_SKELETON, count: 4 }
      - at: 0.25
        name: 熔爐崩塌
        message: "「三百年的火，全部給你！」"
        speed: 0.15
        stats:
          - { stat: damage, type: MORE, value: 30 }
        shield: { count: 3, type: BLAZE, name: 熔爐之心, life: 6, duration: 25, heal: 40 }
    hazards:
      - { skill: hazard_star_orbs, every: 14, phase: 1 }
    enrage: { after: 300, damage: 150, speed: 0.4, message: "「時間到了。熔爐要吞掉你。」" }
    key: abyss_core
    key_cost: 1
    key_chance: 0.25   # 2026-10：10% → 25%
    key_min_tier: 12
    drops:
      maps: 4
      unique_chance: 0.02   # 自己的傳奇每一件各自 2%（2026-10-16）
      common_chance: 0.02   # 共通傳奇（map_boss 池）擲一次 2%
      exclusive_chance: 0.01   # 極境專屬傳奇（uniques.yml 的 uber_sky_crucible）：每一件各自 1%（2026-10-16）
      extra:
        - { currency: sky_fragment, amount: 2, chance: 1 }
        - { currency: zenith_orb, amount: 5, chance: 1 }
        - { currency: oracle_orb, amount: 1, chance: 0.3 }
        - { currency: greater_socket_orb, amount: 1, chance: 0.2 }
        - { support: starfall_resonance, chance: 0.01 }       # 這個終局的專屬輔助（2026-10-16：每顆各自 1%）
        - { support: abyssal_touch, chance: 0.01 }        # 只有極境會掉的輔助（每顆各自 1%）
        - { support: myriad_stars, chance: 0.01 }

# 其他終局 Boss（PoE2 有好幾個巔峰 Boss）：寫法跟 final 一樣，多了
#   requires  要先打贏哪些終局（代號）才能開；沒寫 = 跟天穹熔爐一樣完成最外圈就能開
#   points    首殺的天賦點（沒寫 = first_kill.final_points）
# 開法一樣：地圖裝置的終局按鈕，選 Boss 與階級，花 fragment_cost 片天穹碎片。各自的傳奇寫在 uniques.yml（sources 寫這裡的代號）。
finals:
  frost_throne:
    name: 永凍王座
    requires: [sky_crucible]
    points: 1
    level_bonus: 3
    theme: snow
    atlas: [7, 1]
    lore: "曜帝的妹妹沒有進熔爐。她往北走，走到連時間都凍住的地方。"
    monsters: { STRAY: 3, SKELETON: 1, POLAR_BEAR: 1, ZOMBIE: 1 }
    boss:
      name: 永凍女王・霜心
      type: STRAY
      mythic: ExileCore_FrostQueen
      named: true
      life: 19.1       # 2026-10：照打白怪假人每秒 5 萬（打 Boss ×0.6 = 3 萬）單人打 3 分半鐘算的（T16 ×11.7 之後約 630 萬生命）
      damage: 2.1
      scale: 2.2
      mods: [resistant, swift]
      intro: "「哥哥選了火。我選了永恆。」"
