# 地圖（星痕）與終局（階段 4）。
# 世界觀：大塊星骸記得它落下前照過的地方；放進營地的地圖裝置，就能走進那段記憶。
#
# 階級（PoE2 換界石的做法）：地圖物品上寫著「哪一張」和「第幾階」，14 張地圖每一張都能開 T1–T16，
#   階級越高怪物等級越高（T1 = 61 … T16 = 84）、地圖本身多一點物品數量與稀有度、掉的地圖越常是魔法／稀有（詞綴越多）、
#   掉的裝備物品等級越高（高階詞綴要物品等級 68、78）。終局也分階：開的時候選，最高到你完成過的最高階。
#
# 流程：地圖物品（bases/maps.yml，詞綴在 affixes/maps.yml）→ 營地的地圖裝置（NPC）右鍵，選一張地圖、按開啟
#   → 地圖世界的一個空格子裡程式自動蓋出一張隨機的地圖（房間、走道、Boss 房）
#   → 裝置後面的傳送門亮起來：每個人（隊伍）有自己的傳送門、互不佔位，只有開圖的人和他的隊友看得到、走得進去
#     （每張圖一共 6 次，還能進幾次就亮幾道；開新的地圖，舊的那張的傳送門就關了）
#   → 殺死地圖 Boss 算完成（星圖點亮、解鎖相鄰的地圖）→ 裡面沒人 15 分鐘或次數用完後清掉格子
# 星圖（/atlas 或地圖裝置裡的按鈕）：地圖排成 5 圈，一開始只有第 1 圈三張能開，完成一張（哪一階都算）就解鎖跟它相連的；
#   最外圈（第 5 圈）兩張都完成後解鎖終局「天穹熔爐」（要兩片第 5 圈地圖 Boss 掉的天穹碎片）。
#   星圖每完成一張不同的地圖，掉落的地圖階級上限高一階（一開始 T4，完成 12 張不同的 = T16）。
# 在地圖裡死亡扣 10% 經驗（character.yml 的 map_death_penalty），回到營地，要再走傳送門進去（會用掉一次）。

settings:
  # 每一階的怪物等級（T1 … T16）。照 PoE：越高階等級差越大，T16 = 84（怪物等級的上限，100 級的角色也是打 84 級的怪）
  tiers: [61, 62, 63, 64, 65, 66, 68, 70, 71, 73, 75, 77, 78, 80, 82, 84]
  tier_quantity: 2            # T2 起每高一階，地圖本身多幾 % 物品數量（T16 = +30%）
  tier_rarity: 3              # T2 起每高一階，地圖本身多幾 % 物品稀有度（T16 = +45%）
  # 全伺服器同時最多幾個地圖實例（每個人或隊伍一次一張；試煉、劫盜、極境、回響也算在裡面）。到上限時下一個人開不了圖。
  # 2026-10：20 → 100（照 100 人伺服器：大部分人單刷，一個人一張，舊的那張人走光還要留 60 秒才關）。
  #   伺服器的負擔看的是「有幾個人在打」，不是這個數字——怪物走近才刷、區塊有人才載入；這個數字只是擋人，所以設成不會擋到。
  instance_cap: 100
  portals: 6                  # 每張地圖可以進入幾次（開圖的人和隊友走進去都算一次）
  idle_minutes: 15            # 裡面沒人超過這麼久就關閉、清掉格子
  empty_close_seconds: 60     # 進入次數用完、裡面也沒人：這麼久之後關閉
  pack_radius: 36             # 玩家走到離怪物群多近時刷出來
  boss_radius: 22             # 玩家走進 Boss 房多近時 Boss 出現
  # 一般地圖 Boss（不是終局）的生命照階級再乘（2026-10）：這一階（含）以下 ×1，到 T16 ×max，中間每階等量增加。
  #   伺服器紀錄：T14–T16 的地圖 Boss 中位數 22 秒就倒（T12–T13 約 40 秒），高階加厚一點、低階不動
  # 2026-10：照人均單體 15 萬 DPS 重調：T16 一般地圖 Boss 約 20 秒（原 from 12、max 1.6）
  boss_tier_life: { from: 10, max: 5.8 }      # 2026-10：改照人均單體 10 萬 DPS（15 萬時是 8.7）
  # 護盾結晶（終局、極境、劫盜終局的護盾階段）跟著階級變硬的程度（2026-10）：Boss 的階級倍率多出來的部分，結晶吃幾成。
  #   0 = 不變硬（T16 跟 T5 一樣，兩三秒就破）、1 = 跟 Boss 一樣（T16 終局大約要 2.4 萬 DPS 才來得及）、
  #   0.5 = 一半（T16 的 Boss ×7.8、結晶 ×4.4：終局大約要 1.3 萬 DPS、極境大約 2 萬）
  shield_tier_share: 0.5
  packs:                      # 地圖的怪物群（跟區域一樣是 PoE 的群，但比較大群）
    normal: { weight: 64, size: [4, 6] }
    magic: { weight: 28, size: [3, 5] }
    rare: { weight: 8, size: [2, 3] }      # 稀有怪＋幾隻普通小弟

drops:
  # 地圖裡的怪掉地圖的機率（再乘上物品數量加成：魔法怪本身 +50%、稀有怪 +150%，加上地圖的數量）；
  # 掉的是這張圖的階級，有機率 +1 階（終局掉開的那一階）
  # 掉哪一張：你已經解鎖的地圖（不會掉廢圖），解鎖了還沒完成的（星圖的前線）機率是 frontier_weight 倍
  # 2026-10：以前（普通 1.2%、魔法 3%、稀有 10%、Boss 必掉 2 張）一張 T16 平均掉 5～6 張地圖、點了星圖續航約 9 張，
  #   伺服器的紀錄裡每個人手上幾十張稀有 T16、沒有人洗地圖。改成約 1/5、Boss 必掉 1 張：
  #   沒洗的 T16 約掉 1.7 張、洗成稀有約 1.9 張、再加 20% 品質約 2 張、點了星圖續航約 3.2 張——
  #   想穩定刷高階就要洗地圖（星火石、至臻石、星盤刻刀）或點續航，PoE2 也是這樣用掉這些通貨。
  map_chance: { normal: 0.0025, magic: 0.006, rare: 0.02 }
  boss_maps: 1                   # 地圖 Boss 必掉幾張（含終局；星圖天賦「地圖續航」再多 1 張）
  tier_up_chance: 0.15           # 階級 +1 的機率
  tier_up_per_completed: 0.01    # 星圖每完成一張，再多 1%
  tier_cap_base: 4               # 掉落的地圖最高幾階：一開始 T4
  tier_cap_per_map: 1            # 星圖每完成一張不同的地圖，上限高一階（完成 12 張不同的 = T16）
  frontier_weight: 2
  rarity: { normal: 55, magic: 35, rare: 10 }       # T1 掉的地圖的稀有度權重
  # T16 的（中間照階級內插）。2026-10：高階地圖少掉現成的稀有圖（以前 15／35／50）——想要詞綴多、掉得多的地圖，
  # 用微光石 → 添輝石 → 豐饒石 → 至臻石自己洗（PoE2 也是靠洗換界石用掉這些通貨）
  rarity_top: { normal: 40, magic: 45, rare: 15 }
  # 傳奇的掉落機率（每個有份的人各擲一次）：地圖 Boss、具名 Boss 5%（2026-10 從 2% 調高）；地圖事件 1%（map_events.yml，2026-10 從 2% 調低）；終局另外算
  boss_unique_chance: 0.05       # 地圖 Boss 掉傳奇（uniques.yml 的 map_boss）的機率
  named_unique_chance: 0.05      # 具名 Boss 掉自己那件傳奇的機率
  final_unique_chance: 0.05      # 終局 Boss（曜帝與其他終局）掉自己專屬那件傳奇的機率（不是必掉：每個有份的人各擲一次）
  chase_chance: 0.00034          # 追逐級傳奇（uniques.yml 的 chase 池，四件任一件）：所有地圖 Boss（一般、具名、終局、極境）
                                 # 每次擊殺、每個有份的人各擲一次；固定 0.034%，星圖天賦、物品數量、稀有度都不影響
  chase_mob_chance: 0.000001     # 追逐級傳奇（2026-10）：一般怪物（不是 Boss）每隻、每個有份的人各擲一次（0.0001%，約 100 萬隻一件），
                                 # 怪物等級 75 以上才會掉（T11 以上的地圖）。僥倖石用在追逐級的基底（物品等級 75 以上）每次也是這個機率
                                 # （逐星者：鏈帶、曜帝的冠冕：絲綢頭冠、星骸之心：板甲、天穹裂痕：弓；沒中就照一般僥倖石）
  # 映星鏡（複製裝備的通貨；2026-10）：以前跟追逐級傳奇同機率，100 人伺服器大約一天一個；改成追逐級的十分之一
  #（地圖 Boss 大約 3 萬隻一個、一般怪物大約 1000 萬隻一個）。每個有份的人各擲一次，不吃任何加成
  mirror_chance: 0.000034        # 地圖 Boss（一般、具名、終局、極境）每次擊殺
  mirror_mob_chance: 0.0000001   # 一般怪物每隻（任何地方、任何等級）
  final_common_chance: 0.10      # 終局 Boss（與極境）另外掉一件共通傳奇（map_boss 池）的機率（2026-10：25% → 10%）
  final_support_chance: 0.01     # 2026-10：2% → 1%。終局 Boss 掉它自己專屬輔助寶石（supports.yml 寫 source: 這個終局的代號）的機率
  fragment: sky_fragment         # 天穹碎片（currencies.yml）
  fragment_maps: [starfall_tundra, observatory]   # 這些地圖的 Boss 必掉一片
  fragment_cost: 2               # 開終局要幾片
  campaign_boss_zone: mountain   # 劇情最後一個區域的 Boss（霜角撼地獸）掉 T1 地圖（照你的星圖）
  campaign_boss_maps: 1
  campaign_first_kill_maps: 3
  campaign_boss_daily_maps: 3    # 首殺以後，每個角色每天只有前幾次打倒它會掉地圖（Boss 90 秒就重生，不然可以站著一直刷）

# 一般終局 Boss（不含極境、巔峰）的每秒傷害上限（2026-10）：每個人對 Boss 每秒傷害超過 dps_cap 的部分照 dps_over 遞減
# （每秒傷害取打訓練假人的紀錄與這場實際打出來的較高者；極境、巔峰寫在自己的區塊；2026-10 起三種都是 15 萬）
final_dps:
  dps_cap: 150000   # 2026-10：上限統一 15 萬（血量照打白怪假人每秒 5 萬打 3 分半設定）
  dps_over:
    - { from: 150000, rate: 0.3 }   # 15–30 萬的部分算 30%
    - { from: 300000, rate: 0.1 }   # 30 萬以上算 10%

first_kill:                      # 首殺獎勵（存在角色資料裡）：天賦點
  map_points: 0
  named_points: 1
  final_points: 2

# 每張地圖：
#   base      bases/maps.yml 的基底（決定名稱與在星圖的第幾圈；舊的地圖物品沒寫階級時，當作圈數那一階）
#   theme     主題（方塊與裝飾）：beach 海岸、forest 森林、ruins 廢墟、swamp 沼澤、snow 雪原、cave 礦洞、crypt 墓穴、star 星殿、
#             desert 沙漠（紅沙、綠洲）、volcano 火山（玄武岩、岩漿池）、fungal 菌窟（蘑菇、菌光）
#   layout    版面樣式（不寫是 halls）：halls 廳堂（房間與走道）、open 曠野（大片空地，岩石樹叢擋路，有小水池）、
#             cavern 洞窟（不規則的洞室、S 形彎道、地下水池）、islands 群島（水上的島嶼，窄窄的堤道相連）、
#             city 城區（方形廣場與直街，好幾條路繞得到）。水池與湖照主題是水或岩漿（火山），走不進去
#   atlas     在星圖上的位置 [欄, 列]（9×5 的格子，欄 0–8、列 0–4）
#   links     相連的地圖（完成其中一張就解鎖另一張）；start: true 是一開始就能開
#   monsters  怪物（原版生物代號或 mythic:代號）與權重
#   （life 的預設值是 /ec balance 算的：參考角色站著打圈數那一階（第 1 圈開 T1），約 60 秒、越外圈越久、
#     具名 Boss 再久一些、終局（T5）約 2 分鐘；開更高階時 Boss 跟著怪物等級變硬，T16 大約再久兩成；
#     地圖詞綴的 Boss 生命、怪物生命會再加上去）
#   boss      Boss：type 原版生物、mythic 有裝 MythicMobs 就用它、life／damage 在傳奇稀有度上再乘（已經扣掉 monsters.yml
#             裡那種生物本身的倍率，所以伏守者、劫掠獸這種本來就很硬的也照寫的倍率）、scale 體型、
#             named: true 是具名 Boss（首殺多給天賦點、有自己的傳奇）、phases 血量門檻切換（summon 召喚小怪、
#             stats 加屬性、speed 移動速度加成）、skills 招式組（data/boss_skills.yml 的代號，沒寫照生物種類的預設；
#             可寫 { id: meteor_storm, phase: 1 } 表示進入第一個階段後才會用，cooldown／damage 可覆蓋）
#   Boss 的特殊機制（2026-10，終局與試煉用）：
#     phases 的某一個階段寫 shield: { count: 3, type: BLAZE, name: 星骸結晶, life: 4, duration: 25, heal: 25 }
#             → 進入這個階段時 Boss 無敵，Boss 房裡出現 count 顆結晶（type 原版生物、不會動不會打人，生命是同等級普通怪的 life 倍，
#               2026-10：再乘一部分的階級倍率——見 settings.shield_tier_share），
#               duration 秒內全部打掉護盾就破；來不及的話 Boss 回 heal% 最大生命、剩下的結晶消失
#     enrage: { after: 360, damage: 100, speed: 0.3, message: "…" }
#             → 開打 after 秒還沒打倒就狂暴：傷害更多 damage%、移動快 speed（一場一次；血條上有倒數）
#     hazards: [ { skill: hazard_star_meteor, every: 10, phase: 1 } ]
#             → 場地危害：每 every 秒在某個玩家附近落一次（boss_skills.yml 的 slam、zone、orbs），phase 幾起；
#               Boss 正在放招時等那一招放完才落，落下之前 Boss 也不出新的招（一次只做一件事）
maps:
  wreck_bay:
    base: map_wreck_bay
    theme: beach
    layout: islands
    atlas: [0, 2]
    start: true
    links: [ash_street, moss_grove, mist_ferry]
    lore: "押送船的前一艘，沒有靠岸。"
    monsters: { DROWNED: 4, ZOMBIE: 2, SKELETON: 1 }
    boss:
      name: 潮骨船長
      type: DROWNED
      life: 5
      damage: 1.4
      scale: 1.5
      mods: [sturdy]
      intro: "「船還沒到港，誰也不准下船。」"

  moss_grove:
    base: map_moss_grove
    theme: forest
    layout: open
    atlas: [0, 4]
    start: true
    links: [wreck_bay, frost_pines]
    lore: "星光曾經落在這片苔蘚上，讓它長得太快。"
    monsters: { SPIDER: 3, CAVE_SPIDER: 1, ZOMBIE: 2, BOGGED: 1 }
    boss:
      name: 苔母
      type: SPIDER
      life: 7.5
      damage: 1.3
      scale: 2.0
      mods: [swift]
      intro: "樹梢上的絲線全都繃緊了。"

  ash_street:
    base: map_ash_street
    theme: ruins
    layout: city
    atlas: [0, 0]
    start: true
    links: [wreck_bay, outer_city]
    lore: "曜京燒起來的第一條街。"
    monsters: { HUSK: 3, SKELETON: 2, VINDICATOR: 1, CREEPER: 1 }
    boss:
      name: 焦骨巡守
      type: HUSK
      life: 6.5
      damage: 1.4
      scale: 1.5
      mods: [fiery]
