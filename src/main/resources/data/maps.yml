  # ---- 巔峰（2026-10）：萬界之巔——終局之上的最終 Boss，招式照 PoE 的「萬界覺醒者」：死亡光束、風暴迷宮、殞星、分身、
  #   追人的風暴、末日（全場大招，躲進綠色安全區）、四道旋轉光束；場地是懸在星骸之上的黑石平台，風暴會慢慢把場地吃掉。
  #   不用天穹碎片、不選階級：要集齊 pinnacle.fragments 列的四種碎片各一個（四個終局 Boss 的一般版本、T12 以上，各 50%；2026-10：10% → 50%），
  #   在地圖裝置的「巔峰」按鈕打開，固定開在最高階＋level_bonus＋pinnacle.level_bonus 級；只有 Boss 房、每個人只能走進去一次。
  #   pinnacle 的欄位：
  #     fragments      [{ currency: 通貨代號, from: 終局代號, chance: 機率, min_tier: 那個終局開到幾階以上才掉 }]（每一種要各 1 個）
  #     level_bonus    比終局的最高階再高幾級（跟極境一樣）     cooldown  這張圖怪物的招式冷卻倍率（0.25–1.5）
  #     attempts       幾道門（一門一次挑戰，預設 2）　dps_cap  每個人對 Boss 每秒傷害的上限（0 = 不限）
  #     dps_over       超過上限的部分算幾成：[{ from: 每秒傷害, rate: 0–1 }]（由小排到大，第一段從 dps_cap 開始；沒寫 = 超過的全部不算）
  #     monster／player 這張圖的怪物、玩家額外的屬性（寫法同 monsters.yml 的 stats）
  #     drops          寫法同極境的 drops：maps 掉幾張最高階的地圖、unique_chance 自己的傳奇（uniques.yml 的 sources 寫 awakener；
  #                    沒有就用 final 池）、exclusive_chance 極境專屬池（uber_awakener，沒有就 uber）、extra 額外掉落
  #                    common_chance 共通傳奇（map_boss 池；沒寫照 drops.final_common_chance）
  #                    （extra 可以寫 currency、support 輔助寶石，或 skill 技能寶石：{ skill: 代號, chance: 機率 }，掉 20 級的）
  #   生命照 boss.life（跟其他終局一樣吃 tier_life 的最高階倍率；曜帝 T16 是 12）。
  awakener:
    name: 萬界之巔
    requires: [sky_crucible, frost_throne, bone_throne, ember_citadel]
    points: 2
    level_bonus: 3
    theme: void
    atlas: [5, 1]
    lore: "四個王都是祂放出來的。祂在星骸之上等著，看誰能一路走到這裡。"
    monsters: { ENDERMAN: 1 }
    boss:
      name: 覺醒之主・虛星
      type: WITHER_SKELETON
      mythic: ExileCore_Awakener
      named: true
      life: 53.8        # 2026-10：照打白怪假人每秒 15 萬（打 Boss 9 萬）單人打 3 分半鐘算的（T16 ×11.7 之後約 1,890 萬生命）
      damage: 2.4
      scale: 1.6
      mods: [resistant, swift]
      intro: "「四個王，你都打倒了？……傲慢。那就換我來——感受吧，虛空的戰慄。」"
      defeat: "虛星散了。星骸之上，第一次這麼安靜。"
      # 招式照 PoE 的萬界覺醒者：一開始死亡光束（一道、會轉）、風暴迷宮（場上留一堆風暴）、殞星（三顆落在腳邊）、瞬閃斬；
      # 第一階段起分身（三個殘影各射一條線）、風暴追擊（追人的風暴球）、走廊光束（前後兩道）、而且風暴開始自己落（場地危害）；
      # 第二階段起末日（全場大招，躲進綠色安全區）、場地收縮（風暴把場地吃掉，只剩中間）；第三階段起四道旋轉光束（「死」）。
      # 進入第一、三階段時張開護盾：限時打掉結晶。開打 5 分鐘還沒打倒就狂暴
      # 2026-10：更像 PoE1 的賽勒斯——不普攻（終局、極境、巔峰、金庫之主都是，只用招式）、不帶傷害的瞬移常換位置、
      # 殞星迷宮是真的迷宮（兩圈風暴牆、缺口錯開）、滅世殞星（一顆很大的）、風暴走廊是兩排牆＋走廊裡掃的光束
      # 2026-10 第二輪（更像賽勒斯）：不再瞬閃斬（祂不近戰）；迷宮每個階段多一圈（2 → 3 → 4 圈）、牆穿不過；
      # 死亡光束追著人；滅世殞星落點留荒蕪；傷害類型照 poedb（物理轉一部分元素）；前搖、冷卻照祂的施放時間
      skills:
        - awakener_die_beam
        - awakener_storm_maze
        - awakener_meteor
        - awakener_shift
        - { id: awakener_great_meteor, phase: 1, with: [awakener_desolation] }
        - { id: awakener_clones, phase: 1 }
        - { id: awakener_storm_chasers, phase: 1 }
        - { id: awakener_corridor, phase: 1, with: [awakener_corridor_walls] }
        - { id: awakener_storm_maze_3, phase: 1 }
        - { id: awakener_apocalypse, phase: 2 }
        - { id: awakener_collapse, phase: 2 }
        - { id: awakener_storm_maze_4, phase: 2 }
        - { id: awakener_quad_beam, phase: 3 }
      phases:
        - at: 0.75
          name: 星隕
          message: "「這才剛開始。死亡……在等你。」"
          speed: 0.1
          shield: { count: 3, type: ENDERMAN, name: 虛星結晶, life: 5, duration: 30, heal: 25 }
        - at: 0.5
          name: 萬界崩解
          message: "「看好了——你的世界，是怎麼碎掉的。」"
          speed: 0.1
          stats:
            - { stat: damage, type: MORE, value: 30 }
        - at: 0.25
          name: 終末
          message: "「真是浪費。全部——死。」"
          speed: 0.2
          stats:
            - { stat: damage, type: MORE, value: 40 }
          shield: { count: 3, type: ENDERMAN, name: 終末之核, life: 6, duration: 25, heal: 35 }
      hazards:
        - { skill: hazard_awakener_storm, every: 9, phase: 1 }
      enrage: { after: 360, damage: 150, speed: 0.4, message: "「時間到了。這個世界，不需要你。」" }   # 本體約 3 分半＋換階段、護盾
    pinnacle:
      attempts: 2        # 2026-10：幾道門（一門一次挑戰；全部倒下才能走下一門，Boss 回滿重來；打倒 Boss 門全部關掉）
      dps_cap: 150000    # 2026-10：每個人對 Boss 每秒傷害的上限（每秒傷害取打訓練假人的紀錄與實際打出來的較高者；0 = 不限）
      dps_over:          # 超過上限的部分大幅減傷（分段）：30 萬 → 等效 19.5 萬、50 萬 → 21.5 萬、100 萬 → 26.5 萬
        - { from: 150000, rate: 0.3 }   # 15–30 萬的部分算 30%
        - { from: 300000, rate: 0.1 }   # 30 萬以上算 10%
      level_bonus: 5
      cooldown: 0.65
      fragments:
        - { currency: fragment_crucible, from: sky_crucible,  chance: 0.50, min_tier: 12 }
        - { currency: fragment_frost,    from: frost_throne,  chance: 0.50, min_tier: 12 }
        - { currency: fragment_bone,     from: bone_throne,   chance: 0.50, min_tier: 12 }
        - { currency: fragment_ember,    from: ember_citadel, chance: 0.50, min_tier: 12 }
      drops:                     # 2026-10：沒有賽季重置，要保持稀缺 → 全部壓低（每個有份的人各擲一份）
        maps: 3
        unique_chance: 0.05      # 2026-10：3% → 5%。自己的傳奇（uniques.yml 的 sources 寫 awakener，10 件；沒有的話用終局共通的 final 池）
        exclusive_chance: 0.06   # 2026-10：3% → 6%。極境專屬池（uber_awakener；沒有就 uber）
        common_chance: 0.20      # 2026-10：共通傳奇（map_boss 池）20%（沒寫的照 drops.final_common_chance 10%，終局、極境還是 10%）
        extra:
          - { currency: abyss_core, amount: 1, chance: 0.5 }
          - { currency: sky_fragment, amount: 2, chance: 1 }
          - { currency: zenith_orb, amount: 4, chance: 1 }
          - { currency: oracle_orb, amount: 1, chance: 0.2 }
          - { currency: greater_socket_orb, amount: 1, chance: 0.2 }
          - { support: abyssal_touch, chance: 0.02 }       # 2026-10：1% → 2%
          - { support: myriad_stars, chance: 0.02 }        # 2026-10：1% → 2%
