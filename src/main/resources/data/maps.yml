      enrage: { after: 420, damage: 100, speed: 0.3, message: "「我累了。讓冬天結束這一切。」" }
    uber:
      dps_cap: 150000    # 2026-10：每個人對極境 Boss 每秒傷害的上限（終局、極境、巔峰統一 15 萬；血量照打白怪假人每秒 10 萬打 3 分半）；超過的部分照 dps_over 遞減
      dps_over:
        - { from: 150000, rate: 0.3 }   # 15–30 萬的部分算 30%
        - { from: 300000, rate: 0.1 }   # 30 萬以上算 10%
      intro: "「你把冬天弄醒了。現在，它不會再睡。」"
      life: 1.9         # 2026-10：照打白怪假人每秒 10 萬（打 Boss 6 萬）單人打 3 分半鐘算的（終局的 19.1 × 1.9，T16 之後約 1,260 萬生命）
      damage: 1.5
      cooldown: 0.75
      level_bonus: 4
      skills:
        - uber_queen_frozen_orbit
