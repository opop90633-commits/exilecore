# 戰星（球）：銳星、怒星、磐星。
#
# 球不是天生就有的：要靠裝備的詞綴、天賦給「獲得一顆的機率」（屬性鍵 charge.chance.代號，百分比點數）才會有。
# 獲得的時機照 trigger：
#   crit = 你自己的攻擊或法術暴擊時    kill = 你擊殺怪物時    hit = 你被敵人的攻擊打中時（持續傷害不算）
# 另外每一種都可以「擊中時」獲得（屬性鍵 charge.on_hit.代號：每打中一個敵人擲一次；Boss 戰沒有擊殺也拿得到）：
#   輔助寶石聚怒／聚銳／聚磐（只對被輔助的技能）、近戰武器／法杖長杖權杖／盾的詞綴、天賦樹的怒星之潮／銳星之芒／磐星之壁；
#   聚星戰吼直接給三種各一顆。瞬影擊冷卻中按下去會消耗一顆怒星直接放（skills.yml 的 cooldown_bypass）。
# 每顆球各自倒數（duration 秒）；已經滿了再獲得會刷新最舊那顆的時間。登出或死亡全部消失。
#
#   name       遊戲裡顯示的名字
#   symbol     動作列上的代表字（不寫就用名字第一個字）
#   color      顏色
#   max        基礎最多幾顆（屬性鍵 charge.max.代號 可以再加：「最大銳星 +1」）
#   duration   每顆撐幾秒（屬性鍵 charge.duration 可以拉長：「戰星的持續時間增加 x%」）
#   per_charge 每一顆給的屬性，數值是「一顆」的量（寫法跟詞綴的 mods 一樣，但數字直接寫、不能用 {變數}）；
#              引擎乘上顆數：3 顆 = 3 倍。可以用的屬性見 data/README.md。
#
# 加新種類：照下面的格式多寫一段，代號自己取（英文小寫）；詞綴與天賦用 charge.chance.代號、charge.max.代號 接上去。

power:
  name: 銳星
  symbol: 銳
  color: "#ff8fe8"
  trigger: crit
  max: 3
  duration: 10
  per_charge:
    - { stat: crit.chance, type: INCREASED, value: 40 }      # 每顆：增加 40% 暴擊率

frenzy:
  name: 怒星
  symbol: 怒
  color: "#8fff8f"
  trigger: kill
  max: 3
  duration: 10
  per_charge:
    - { stat: attack.speed, type: INCREASED, value: 4 }      # 每顆：增加 4% 攻擊速度
    - { stat: cast.speed, type: INCREASED, value: 4 }        #       增加 4% 施法速度
    - { stat: damage, type: MORE, value: 4 }                 #       更多 4% 傷害

endurance:
  name: 磐星
  symbol: 磐
  color: "#ffb86b"
  trigger: hit
  max: 3
  duration: 10
  per_charge:
    - { stat: resist.fire, type: FLAT, value: 4 }            # 每顆：+4% 火焰、冰冷、閃電抗性
    - { stat: resist.cold, type: FLAT, value: 4 }
    - { stat: resist.lightning, type: FLAT, value: 4 }
    - { stat: armour, type: INCREASED, value: 8 }            #       增加 8% 護甲
