# 2026-10-21：腐化（照 PoE2 的瓦爾寶珠，名稱是自己的）。用了就變成「已腐化」，之後只能鑑定、把符文嵌進空的符文孔。
#   2026-10-23 結果全部照 PoE2（各 25%）：
#     裝備：沒變化／隨機 1～3 條詞綴換成新的（傳奇改成重骰數值再乘 0.78～1.22）／加一條腐化詞綴（affixes/corrupted.yml）／
#           特殊：防具、盾、法器、武器多一個符文孔（可以超過上限），法杖、長杖品質 +1～5%（最多 23%），戒指、項鍊、腰帶沒有變化。
#     珠寶：沒變化／換 1～3 條詞綴／加一條腐化詞綴／多一條或少一條詞綴（可以超過上限）。
#     傳奇珠寶：沒變化（50%）／重骰數值再乘 0.78～1.22／加一條腐化詞綴。破裂的詞綴都不會變。
#     地圖：沒變化／階級 ±1（T1～T16）／詞綴全部變成前綴或全部變成後綴／稀有地圖多 1～2 條詞綴（前、後綴各最多 5 條）。
#     藥劑、護符：一半沒變化、一半品質 +1～5%（最多 23%；藥劑加回復量、護符加持續時間）。
#     技能寶石（技能面板上拿蝕變石點技能）：沒變化／等級 ±1（最高 21）／輔助孔 ±1／品質 −7～+3%（最多 23%）；之後不能再升級、開孔、加品質。
#   不會一般掉落（drop_weight 0）：星圖的腐化區第一次打倒 Boss 時掉（atlas.yml 的 corruption.vaal_chance）。
corrupt_orb:
  name: 蝕變石
  material: FERMENTED_SPIDER_EYE
  stack: 20
  operation: CORRUPT
  applies_to: { rarity: [NORMAL, MAGIC, RARE, UNIQUE] }
  drop_weight: 0
  drop_level: 20
  description: "腐化：直接點裝備、珠寶、地圖、藥劑、護符，技能寶石在技能面板點技能。隨機：沒變化、詞綴或數值變動、加腐化詞綴、孔／品質／地圖階級／寶石等級變動；腐化後不能再改造"
  flavor: "被深淵浸過的星骸，碰到的東西都回不去了。"

# 2026-10-21：破裂（照 PoE2 的破裂石，名稱是自己的）：4 條以上詞綴的稀有裝備，隨機一條詞綴變成「破裂」，
#   之後任何通貨都移除不了、重骰不了它；物品還能繼續改造。一件只能有一條。
#   不會一般掉落（drop_weight 0）：星圖的淨化區第一次打倒 Boss 時掉（atlas.yml 的 purification.fracture_chance）。
fracture_orb:
  name: 定星石
  material: QUARTZ
  stack: 20
  operation: FRACTURE
  applies_to: { rarity: [RARE] }
  drop_weight: 0
  drop_level: 40
