# 星籤（流寇掉）：拿它點一件魔法／稀有物品掛上去，下一顆對應的通貨照星籤的規則用，用完星籤就消失（換一個星籤會蓋掉舊的）。
#   omen.triggers：哪些操作會觸發；omen.effect：FORCE_PREFIX 只加前綴、FORCE_SUFFIX 只加後綴、DOUBLE_ADD 加兩條、
#   REMOVE_LOWEST 移除階級最差的、KEEP_PREFIXES 移除時不動前綴、KEEP_SUFFIXES 移除時不動後綴。
omen_sinistral:
  name: 加前綴籤
  material: BOOK
  stack: 10
  operation: OMEN
  omen: { triggers: [ADD_AFFIX_MAGIC, MAGIC_TO_RARE, ADD_AFFIX_RARE, REMOVE_AND_ADD], effect: FORCE_PREFIX }
  applies_to: { rarity: [MAGIC, RARE] }
  drop_weight: 0
  description: "下一顆加詞綴的通貨（添輝、豐饒、至臻、亂流）加的一定是前綴"
  flavor: "流寇留下的筆記，字都往左歪。"
omen_dextral:
  name: 加後綴籤
  material: BOOK
  stack: 10
  operation: OMEN
  omen: { triggers: [ADD_AFFIX_MAGIC, MAGIC_TO_RARE, ADD_AFFIX_RARE, REMOVE_AND_ADD], effect: FORCE_SUFFIX }
  applies_to: { rarity: [MAGIC, RARE] }
  drop_weight: 0
  description: "下一顆加詞綴的通貨（添輝、豐饒、至臻、亂流）加的一定是後綴"
  flavor: "流寇留下的筆記，字都往右歪。"
omen_abundance:
  name: 雙詞綴籤
  material: BOOK
  stack: 10
  operation: OMEN
  omen: { triggers: [ADD_AFFIX_RARE], effect: DOUBLE_ADD }
  applies_to: { rarity: [RARE] }
  drop_weight: 0
  description: "下一顆至臻石加兩條詞綴（有空位的話）"
  flavor: "寫了兩遍的願望。"
omen_whittling:
  name: 去劣籤
  material: BOOK
  stack: 10
  operation: OMEN
  omen: { triggers: [REMOVE_AFFIX, REMOVE_AND_ADD], effect: REMOVE_LOWEST, weight: 12 }   # 2026-10：流寇、祭壇抽到的權重（其他星籤 100）——去劣籤：最好用、消耗 72%；2026-10-19：25 → 12（市場價只剩設定的 1/4、消耗 80%）
  applies_to: { rarity: [MAGIC, RARE] }
  drop_weight: 0
  description: "下一顆湮滅石／亂流石移除的是階級最差的那條"
  flavor: "把最不喜歡的那一行劃掉。"
omen_sinistral_guard:
  name: 保前綴籤
  material: BOOK
  stack: 10
  operation: OMEN
  omen: { triggers: [REMOVE_AFFIX, REMOVE_AND_ADD], effect: KEEP_PREFIXES, weight: 25 }   # 2026-10：流寇、祭壇抽到的權重（其他星籤 100）——保前綴籤；2026-10-19：40 → 25（市場價只剩設定的 1/3、消耗 63%）
  applies_to: { rarity: [MAGIC, RARE] }
  drop_weight: 0
  description: "下一顆湮滅石／亂流石不動前綴（只拿後綴）"
  flavor: "用手蓋住左半邊。"
omen_dextral_guard:
  name: 保後綴籤
  material: BOOK
  stack: 10
  operation: OMEN
  omen: { triggers: [REMOVE_AFFIX, REMOVE_AND_ADD], effect: KEEP_SUFFIXES, weight: 25 }   # 2026-10：流寇、祭壇抽到的權重（其他星籤 100）——保後綴籤；2026-10-19：40 → 25（市場價只剩設定的 1/3、消耗 60%）
  applies_to: { rarity: [MAGIC, RARE] }
  drop_weight: 0
  description: "下一顆湮滅石／亂流石不動後綴（只拿前綴）"
  flavor: "用手蓋住右半邊。"

# ---- 蒸餾情緒（PoE2 的 Delirium 獎勵；怪物不掉，幻霧的獎勵掉）----
# 拿著它點一條項鍊會打開「注入」的選單：選一個天賦樹的核心，花 3 顆同一種情緒把那個核心的效果注入項鍊（一條項鍊一個，再注入就換掉）。
# 哪一種情緒看核心離天賦樹中心多遠：≤7 格怒火、≤11 愧疚、≤15 貪婪、更遠妄想（越外圍的核心越強、情緒越稀有）。順序在 map_events.yml 的 delirium.emotions。
