  applies_to: { rarity: [MAGIC, RARE, UNIQUE] }
  drop_weight: 15
  description: "重新隨機所有詞綴的數值，階級不變"

blessing_orb:
  name: 賜福石
  material: GOLD_INGOT
  model: exilecore:currency/blessing_orb
  stack: 20
  operation: REROLL_IMPLICIT
  applies_to: { rarity: [] }
  drop_weight: 100
  description: "重新隨機固定詞綴的數值"

whetstone:
  name: 磨刀石
  material: FLINT
  model: exilecore:currency/whetstone
  stack: 20
  operation: QUALITY_WEAPON
  applies_to: { rarity: [] }
  drop_weight: 1500
  description: "提升武器品質（普通 +5%、魔法 +2%、稀有 +1%，上限 20%）"

armour_scrap:
  name: 護甲碎片
  material: IRON_NUGGET
  model: exilecore:currency/armour_scrap
  stack: 20
  operation: QUALITY_ARMOUR
  applies_to: { rarity: [] }
  drop_weight: 1500
  description: "提升防具品質（普通 +5%、魔法 +2%、稀有 +1%，上限 20%）"
