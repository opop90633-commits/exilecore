# 催化劑（裂隙的怪掉）：只能打在戒指、項鍊上（2026-10-26 照 PoE2：腰帶不行；這次之前腰帶也可以），品質照稀有度 +5／+2／+1（普通／魔法／稀有、傳奇，上限 20；2026-10-27 照 PoE2，這次之前一律 +5），
#   品質變成那一類詞綴的數值加成（例如火焰催化劑 20%：火焰詞綴 ×1.2）。打不同種類的催化劑會換掉原本的，品質從那一顆加的量重新開始（2026-10-27 之前從 5）。
