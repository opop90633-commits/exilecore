# ---- 地圖機制掉的特殊通貨（照 PoE2：星魄、催化劑、星籤；怪物不掉，drop_weight 0） ----
# 星魄（寶箱、精髓怪掉）：2026-10-26 照 PoE2 0.5 分四階（essence_tier；這次之前不分階：普通→魔法、魔法→稀有，階級照物品等級抽、不會是最差的）：
#   次級（lesser）、一般（normal）、高階（greater）：魔法 → 稀有，一定加這顆的那條詞綴，而且是固定的那一階——
#     需求等級 ≤ essence_level 的最好那一階（不管物品等級；essence_level 照 poe2db 各精髓給的數值對到我們的階級）。
#   完美（perfect）、腐化（corrupted）：稀有物品隨機移除一條（同一類的那條優先；那一型滿了只拿那一型），再加星魄專屬的那條（affixes/essences.yml）。
#   普通物品不能用（PoE2 的精髓只把魔法變稀有）。affix 寫好幾條時照基底挑第一個出得了的；affix_random 是隨機挑一條出得了的。
#   掉落：寶箱、精髓怪照 pick_weight 抽（沒寫照階級：次級 100、一般 60、高階 25、完美 4、腐化 2），drop_level 是地區等級（PoE2：20／40／60／72）。
#   分組（通貨袋一頁 36 格放不下）：防禦類、攻擊類、法術與腐化各一頁。
#   這次之前的 16 種星魄（代號不變）現在是「一般」那一階；速度星魄改成只給攻擊武器的攻擊速度（PoE2 的 Haste；施法速度改到施速星魄），
#   屬性星魄改成力量、敏捷或智慧隨機一種（PoE2 的 Infinite）；移速、能盾星魄是我們自己的（PoE2 沒有），只有一般階。

