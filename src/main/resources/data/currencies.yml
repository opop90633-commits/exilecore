# ---- 蒸餾情緒（PoE2 的 Delirium 獎勵；怪物不掉，幻霧的獎勵掉）----
# 拿著它點一條項鍊會打開「注入」的選單：選一個天賦樹的核心，照那個核心的配方花三顆情緒把效果注入項鍊（一條項鍊一個，再注入就換掉）。
# 2026-10-27 照 PoE2 0.5：十種情緒（便宜 → 稀有：怒火、愧疚、貪婪、妄想、嫉妒、厭惡、絕望、恐懼、苦難、孤寂），每個核心固定三種的配方
#   （data/instil.yml，照官方天賦樹的 recipe；沒有配方的核心不能注入）；drop_level 照 poe2db（恐懼 69、苦難 73、孤寂 77，其他 1）。
#   這次之前只有前四種，3 顆同一種、看核心離天賦樹中心多遠（≤7 格怒火、≤11 愧疚、≤15 貪婪、更遠妄想）。
#   另外三種強效情緒（憂鬱、兇猛、輕蔑，PoE2 0.5 的 Potent Liquid，drop_level 65）只用在塗油限定核心（data/passives/anoint_only.yml）。
#   手上的舊情緒（前四種）代號不變，照樣能用（配方裡用得到）。順序在 map_events.yml 的 delirium.emotions。
distilled_ire:
  name: 蒸餾怒火
  material: GLASS_BOTTLE
  model: exilecore:currency/distilled_ire
  stack: 20
  operation: INSTIL
  drop_weight: 0
  description: "注入項鍊：三顆情緒照某個核心的配方放（每個核心固定三種，注入選單看得到），注入後核心的效果加在項鍊上"   # 2026-10-27 照 PoE2 配方；這次之前「選一個靠近天賦樹中心（7 格內）的核心，3 顆注入」
  flavor: "瓶子裡的東西還在發抖。"
