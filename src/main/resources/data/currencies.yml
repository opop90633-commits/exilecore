# 星籤（流寇、祭壇掉）：拿它點一件物品掛上去，下一顆對應的通貨照星籤的規則用，用完星籤就消失（換一個星籤會蓋掉舊的）。
#   omen.triggers：哪些操作會觸發（ESSENCE 只有完美、腐化星魄觸發）；omen.effect：
#     FORCE_PREFIX／FORCE_SUFFIX 只加前綴／後綴、DOUBLE_ADD 加兩條、REMOVE_LOWEST 移除階級最差（T 數字最大）的（2026-10-27 照站長；這次之前需求等級最低）、KEEP_PREFIXES／KEEP_SUFFIXES 只移除後綴／前綴、
#     2026-10-26 新增：REMOVE_TWO 移除兩條、MAX_PREFIXES／MAX_SUFFIXES 星火石前綴／後綴最多、HOMOGENISE 加同一類的、ALWAYS_CHANGE 蝕變石一定有變化、
#     IMPLICIT_ONLY 天啟石只重骰固定詞綴、SANCTIFY 聖化、NO_DESTROY 僥倖石不碎、ANCIENTS 僥倖石變同部位隨機傳奇、CATALYSING 用掉催化劑品質、REMOVE_VEILED 只拿隱匿／揭露詞綴。
#   omen.weight：流寇、祭壇抽到的權重（沒寫 100）；drop_level：地區等級（照 PoE2 的 DropLevel：75／80 的是終局才掉）。
#   2026-10-26 照站長：權重照 poe2db 的市價（Economy_Ritual／Economy_Abyss 的 24h 價格，只用金幣兌換的算最便宜）重配，越貴越難抽：
#     10 Divine 以上（湮滅／亂流去前後綴、去劣、不碎）3～4、光明 6、聖化 12、0.1～0.3 Divine 的 25～45、幾個 Exalted 的 60、金幣兌換的 70～100。
#     怪物一樣不掉（drop_weight 0；PoE2 的星籤也只有祭壇等機制給），所以 drops.yml 的通貨權重合計不變。這次之前 3～100，貴的跟便宜的差不多（例如去劣 12、光明 60、不碎 30）。
#   2026-10-26 照 PoE2 0.5 每一種通貨分開（這次之前一顆星籤管好幾種通貨）。
#   PoE2 還有、我們沒做的（不是改造裝備的、或要的機制我們沒有）：Abyssal Echoes、Sovereign／Liege／Blackblooded、Putrefaction、
#   Chaotic Rarity／Quantity／Monsters／Effectiveness（換界石）、Refreshment、Resurgence、Amelioration、Answered Prayers、Secret Compartments、
#   the Hunt、Reinforcements、Gambling、Bartering、Recombination。
