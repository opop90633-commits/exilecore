  name: 蒸餾愧疚
  material: GLASS_BOTTLE
  model: exilecore:currency/distilled_guilt
  stack: 20
  operation: INSTIL
  drop_weight: 0
  description: "注入項鍊：選一個離天賦樹中心 8–11 格的核心，3 顆注入"
  flavor: "打開的時候會聽見有人道歉。"
distilled_greed:
  name: 蒸餾貪婪
  material: GLASS_BOTTLE
  model: exilecore:currency/distilled_greed
  stack: 20
  operation: INSTIL
  drop_weight: 0
  description: "注入項鍊：選一個離天賦樹中心 12–15 格的核心，3 顆注入"
  flavor: "怎麼倒都倒不完。"
distilled_paranoia:
  name: 蒸餾妄想
  material: GLASS_BOTTLE
