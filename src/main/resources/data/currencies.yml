# 映星鏡（2026-10；PoE2 的卡蘭德的魔鏡）：複製一件裝備。原本那件不變，多出來的是「鏡像複製品」——
#   不能再改造（通貨、符文、注入、揭露都不行）、也不能再被複製；可以穿、交易、拆解。
#   不能複製：地圖、藥劑與護符、新手裝備、已腐化的、未鑑定的、已經是複製品的（2026-10-26 照 PoE2：傳奇可以；這次之前不行）。
#   用法：裝備放在自己的背包，拿著它點裝備，確認之後複製品放進背包的空位。
# 掉落（不走掉落表，所以 drop_weight 是 0；不吃物品數量、稀有度、全服加成，掉落過濾也藏不掉）：
#   全域——任何地方的任何怪物，每個有份的人各擲一次（maps.yml 的 drops；2026-10 跟追逐級傳奇分開，是它的十分之一）：
#   一般怪物 mirror_mob_chance（0.00001%，約 1000 萬隻一顆）、地圖 Boss 另外再擲 mirror_chance（0.0034%，約 3 萬隻一顆）。
#   掉出來全服廣播。
star_mirror:
  name: 映星鏡
  material: NAUTILUS_SHELL
  model: exilecore:currency/star_mirror
  stack: 10
  operation: MIRROR
  applies_to: { rarity: [NORMAL, MAGIC, RARE, UNIQUE] }   # 2026-10-26 照 PoE2：傳奇也可以；這次之前 [NORMAL, MAGIC, RARE]
  drop_weight: 0
  description: "複製一件裝備（傳奇也可以）；複製品不能再改造、不能再複製"
  flavor: "照過它的東西，世上就多了一件。星骸裡最稀有的一種。"

# 2026-10-18：共鳴石——用在一顆「專屬掉落的輔助寶石」上，那顆就共鳴：不佔一個技能只能掛一顆專屬輔助的名額
#   （沒共鳴的專屬輔助一個技能還是只能有一顆生效，共鳴過的可以再掛好幾顆）。背包裡的寶石直接點，或在技能面板點掛著的那顆。
#   掉率：drop_weight 0（掉落表的整數權重做不到這麼低），改用跟映星鏡一樣的「另外擲一次」：maps.yml 的 drops.resonance_mob_chance
#   （一般怪物、等級 75 以上、每隻每個有份的人 1/5,000,000，約 500 萬隻一顆）與 drops.resonance_chance（地圖 Boss 每次擊殺 0.0068%），
#   Boss 與一般怪物都是追逐級傳奇的 1/5（2026-10-18 擁有者定：約 500 萬隻一顆）；不吃數量、稀有度、全服加成。掉落時全服公告（LootService.broadcastResonance）。
