# 通貨定義（機制照 PoE2，名稱是自己的）。世界觀裡每一種通貨都是不同純度的星骸，flavor 是物品說明裡那句斜體字。
# operation 指到程式裡的操作（CurrencyOperation），
# applies_to.rarity 空白 = 不限稀有度。drop_weight 是掉落權重（相對值），0 = 不掉落。
# 掉落的魔法／稀有裝備未鑑定：帶回城找鑑定師（NPC）右鍵免費鑑定，或跟鑑定師免費領鑑定卷軸帶去野外用
# （補滿到一疊；drop_weight 0 = 怪物不掉）。沒有「重骰魔法」與「洗白」——改造是一步一步往上疊：
#   微光石（普→魔法 1 條）→ 添輝石（+1 條）→ 豐饒石（魔法→稀有 +1 條）→ 至臻石（稀有 +1 條）
#   星火石（普→稀有 4 條）、亂流石（稀有：移除 1 條再加 1 條）、湮滅石（移除 1 條）
#   天啟石（重骰數值）、恩澤石（重骰固定詞綴）、礪鋒石／甲冑殘片（品質 +5，上限 20）
# 鑿星石（PoE2 的珠寶匠寶珠）不是用在裝備上：打開技能面板（/skills），拿著它點技能，開一個輔助孔。
#   技能先有 2 孔：小鑿星石開第 3 孔、鑿星石開第 4 孔、大鑿星石開第 5 孔（sockets 寫開到第幾孔）。
# drop_level：幾級以上的怪物才會掉（沒寫是 1）。
# 掉落率照 PoE2（2026-10 查的）：PoE2 的通貨掉落權重不公開，相對多寡用社群在 0.2 版地圖實測的計數
#   （以崇高石＝100：富豪 57、點金 19–33、混沌 14–21、次級珠寶匠 16、機會 2.2、神聖 1.3–1.6、剝離 0.7–1.9、
#    完美珠寶匠約 90 張圖 1 顆），沒有計數的照公開的稀有度分級；掉落等級照 poe2db 的 DropLevel。
#   這裡以至臻石（＝崇高石）＝1000：微光石 3000、添輝石 2500（蛻變、增幅：非常常見）、礪鋒石／甲冑殘片各 1500（常見）、
#   豐饒石 570、星火石 260、亂流石 170、小鑿星石 160、鑿星石 30、僥倖石 22、天啟石 15、湮滅石 13、大鑿星石 1。
#   PoE2 沒有的：恩澤石照工匠石那一級（55）、星盤刻刀照舊（160，50 級起）。
#   2026-10：微光石、添輝石、礪鋒石、甲冑殘片減半（1500、1250、750、750）——伺服器的紀錄裡幾乎沒人用、整疊丟掉；
#   drops.yml 的件數與分類權重一起調過，其他通貨的掉率不變。
#   2026-10（第二次）：至臻石 1000 → 400、豐饒石 570 → 300、小鑿星石 160 → 60。伺服器四天的紀錄：至臻石掉 5,537 顆只用掉 240、
#   豐饒石 3,140 顆用掉 4、小鑿星石 844 顆用掉 32（每個技能只要一顆）——人少沒有交易，通貨只剩自己做裝備、洗地圖。
#   洗過的 T16 每張從約 10 顆至臻石變約 4 顆（洗一張圖用 2 顆）。drops.yml 的件數與分類權重又一起調過：
#   裝備、寶石、藥劑與其他通貨的掉率不變（只有 1～4 級的微光石、添輝石少約 15%，那時候還沒有至臻石可以扣）。
#   掉落等級：崇高、富豪、點金、礪鋒、甲冑 5 級起；混沌、僥倖、恩澤 12；小鑿星石 25；天啟、湮滅 35；鑿星石 45；
#   大鑿星石只在地圖（61 級起；PoE2 的完美珠寶匠是 65 級＝地圖）。
# 地圖：蛻變到點金這一套通貨都能用在地圖上（詞綴池在 affixes/maps.yml）；星盤刻刀加地圖品質（每 1% = 1% 物品數量）。
# 僥倖石（operation: CHANCE）：普通物品有機率變成那個基底的傳奇，不然就碎掉。2026-10：機率跟商人賭博賭到傳奇一樣
#   （economy.yml 的 gamble.rarity_weights：一般 2%，那個基底的傳奇有地圖 Boss 也會掉的約 0.66%）；success 只在經濟模組沒啟用時用。
#   只能用在有「能用僥倖石做出來的傳奇」的基底（uniques.yml 的 sources 寫 chance，物品等級也要夠），新手裝備不行。
# 天穹碎片（operation: NONE）不改物品：星圖最外圈的地圖（星墜冰原、天文台遺跡，哪一階都會掉）Boss 掉，兩片在地圖裝置打開終局「天穹熔爐」。

