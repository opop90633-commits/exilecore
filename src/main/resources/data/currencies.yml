# 星籤（流寇掉）：拿它點一件魔法／稀有物品掛上去，下一顆對應的通貨照星籤的規則用，用完星籤就消失（換一個星籤會蓋掉舊的）。
#   omen.triggers：哪些操作會觸發；omen.effect：FORCE_PREFIX 只加前綴、FORCE_SUFFIX 只加後綴、DOUBLE_ADD 加兩條、
#   REMOVE_LOWEST 移除階級最差的、KEEP_PREFIXES 移除時不動前綴、KEEP_SUFFIXES 移除時不動後綴。
omen_sinistral:
  name: 加前綴籤
  material: BOOK
  stack: 10
  operation: OMEN
  omen: { triggers: [ADD_AFFIX_MAGIC, MAGIC_TO_RARE, ADD_AFFIX_RARE, REMOVE_AND_ADD], effect: FORCE_PREFIX }
  applies_to: { rarity: [MAGIC, RARE] }
  drop_weight: 0
  description: "下一顆加詞綴的通貨（添輝、豐饒、至臻、亂流）加的一定是前綴"
  flavor: "流寇留下的筆記，字都往左歪。"
omen_dextral:
  name: 加後綴籤
  material: BOOK
  stack: 10
  operation: OMEN
  omen: { triggers: [ADD_AFFIX_MAGIC, MAGIC_TO_RARE, ADD_AFFIX_RARE, REMOVE_AND_ADD], effect: FORCE_SUFFIX }
  applies_to: { rarity: [MAGIC, RARE] }
  drop_weight: 0
  description: "下一顆加詞綴的通貨（添輝、豐饒、至臻、亂流）加的一定是後綴"
  flavor: "流寇留下的筆記，字都往右歪。"
