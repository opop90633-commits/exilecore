# 等級差懲罰（與 PoE 相同）：安全範圍 = safe_base + 玩家等級 ÷ safe_per_levels（取整），
# 超出安全範圍的等級差 d 會讓經驗乘 ((等級+5) ÷ (等級+5+d^2.5))^1.5，最低 1%。
# monster_level_cap：算等級差的時候，怪物等級最高算幾級（0 = 不限）。PoE2 的地圖最高 80 級，我們的地圖最高 84 級
#   （終局 87、極境更高）；設 80 讓高等級打 T16 的懲罰跟 PoE2 一樣：90 級剩 92%、92 級剩 65%、94 級剩 38%。
#   怪物給的經驗還是照牠自己的等級（T16 的怪比 T14 多給 4%），所以最高階的地圖還是最划算。
# high_level：高等級另外再乘的倍率（等級 → 倍率；從寫的那一級起都乘，到下一個寫的等級為止；寫 {} = 不乘）。
#   照 PoE：95 級 ×0.854、96 級 ×0.748、97 級 ×0.648、98 級 ×0.562、99 級 ×0.476。
#   兩個加起來，打 T16：95 級剩 25%、97 級剩 14%、99 級剩 6%（地圖裝置選好地圖時會寫你的經驗剩多少）。
# player_level_cap（2026-10，等級上限 120）：算懲罰時玩家等級最高算 99——100 級以後打怪的經驗跟 99 級一樣，
#   升級的難度全看上面的經驗表（不寫的話 100 級以後等級差懲罰一路掉到 1%，根本練不動）。
level_penalty:
  enabled: true
  safe_base: 3
  safe_per_levels: 16
  monster_level_cap: 80
  player_level_cap: 99
  high_level:
    95: 0.854
    96: 0.748
    97: 0.648
    98: 0.562
    99: 0.476

# 死亡懲罰（2026-10 統一）：death_penalty_from_level 等以上，在哪裡死都扣「目前等級升級所需經驗」的 map_death_penalty
# （劇情區域、地圖、劫盜、試煉、世界 Boss 都一樣；不會降級）；以下都不扣。PvP 競技場不扣。
# death_penalty：舊的設定（照等級的比例），已經不用了，留著沒關係。
death_penalty:
  1: 0.0
death_penalty_from_level: 60
map_death_penalty: 0.10
# 2026-10：高等級的死亡懲罰（從這一級起改扣幾成；累積贊助的減免是固定值：贊助把 10% 減成 6% = 少 4%，20% 變 16%、30% 變 26%）
death_penalty_tiers:
  100: 0.20
  110: 0.30

# 天賦退點（PoE2 做法）：花金幣，在天賦樹裡右鍵節點直接退。
# free_until_level：未滿這個等級退點免費；gold_per_point：等級 → 每退一點的金幣（線性內插）。
respec:
  free_until_level: 20
  gold_per_point:
    20: 60
    40: 400
    60: 1500
    80: 2800
    100: 4500

# 新手裝備（建角色時選完職業接著選武器，全部是普通物品、物品等級 1）
# 能選的武器 = 物品等級 1 就能掉、需求等級 1、職業起始屬性（力量／敏捷／智慧）就夠用的所有武器（bases/weapons.yml）。
# classes.<職業>.recommended：這個職業推薦的武器，照順序排在選單第一列、標 ★；其他能選的照 weapons.yml 的順序排在後面。
# classes.<職業>.armour：一起送的防具，直接穿上。shield：選單手武器時送的盾，放副手。
# skills：起始技能跟著武器走，由上往下找第一個武器標籤符合的（標籤見 weapons.yml 的 tags）；
#         寫了 class 的只給那個職業（混沌術士拿法杖、長杖送汲魂彈，其他職業送熾星彈）。
starter:
  classes:
    marauder:
      recommended: [mace1_01, mace2_01]   # 2026-10 PoE2：拿掉斧、劍、匕首、爪
      armour: [helm_str_01, body_str_01, legs_str_01, boots_str_01]
      shield: tshield_01
    mercenary:
      recommended: [xbow_01]
      armour: [helm_str_dex_01, body_str_dex_01, legs_str_dex_01, boots_str_dex_01]
      shield: kshield_01
    huntress:
      recommended: [spear_01]
      armour: [helm_dex_01, body_dex_01, legs_dex_01, boots_dex_01]
      shield: buckler_01
    ranger:
      recommended: [bow_01]
      armour: [helm_dex_01, body_dex_01, legs_dex_01, boots_dex_01]
      shield: buckler_01
    monk:
      recommended: [qstaff_01]
      armour: [helm_dex_int_01, body_dex_int_01, legs_dex_int_01, boots_dex_int_01]
      shield: buckler_01
    sorceress:
      recommended: [staff_01, wand_01]
      armour: [helm_int_01, body_int_01, legs_int_01, boots_int_01]
      shield: focus_01
    witch:
      recommended: [wand_01, staff_01]
      armour: [helm_int_01, body_int_01, legs_int_01, boots_int_01]
      shield: focus_01
    druid:                         # 2026-10：德魯伊（獸魂符，雙手：不送副手）
      recommended: [talis_01]
      armour: [helm_str_01, body_str_01, legs_str_01, boots_str_01]
      shield: tshield_01
  skills:
    - { weapon: bow, skill: lightning_arrow }
    - { weapon: crossbow, skill: explosive_bolt }
    - { weapon: quarterstaff, skill: tempest_flurry }
    - { weapon: spear, skill: lightning_spear }
    - { weapon: wand, skill: essence_drain, class: witch }
    - { weapon: staff, skill: essence_drain, class: witch }
    - { weapon: wand, skill: fireball }
    - { weapon: staff, skill: fireball }
    - { weapon: talisman, skill: bear_maul }   # 2026-10：德魯伊
    - { weapon: mace, skill: boneshatter }
    - { weapon: melee, skill: earthquake }
