# 角色與進程設定（階段 2；新手裝備在最下面）。改完 /ec reload。

# 等級上限（2026-10：100 → 120）
level_cap: 120
# 每個帳號的角色格數（基本；軍需官的功勳兌換還能多換 bounties.yml 的 shop.character_slots 個，兩個加起來最多 18）
character_slots: 5
# 角色名稱長度（字元數）
name_length: [2, 12]
# 角色名稱的過濾（2026-10）：內建一份辱罵、色情、種族歧視、仇恨的字，與冒充管理員的開頭（admin、GM、管理員、官方…），這裡可以再加。
# 比對時不分大小寫、全形半形、簡繁（常見字），也會拿掉底線、把數字代字母還原（f_u_c_k、sh1t 都抓得到）。
#   blocked   名字裡出現就不行的字
#   reserved  名字開頭是這些就不行
#   allow     誤擋的名字：整個名字一樣就放行（例如 Dickens）
# 只擋新取的名字與改名；已經存在的角色名字不受影響（要改用 /ec 的改名）。
name_filter:
  blocked: []
  reserved: []
  allow: []

# 天賦點：從 2 級起每升一級 1 點；Boss 首殺等額外點數記在角色的 bonus_points
passive_points_per_level: 1

# 全服經驗加倍（常駐）：打怪（組隊分的也算）、委託拿到的經驗都再乘這個倍數；1 = 不加倍（0.1 到 10）。
# 下面寫的「每一級要殺幾隻」是沒加倍的數字（×2 = 一半）。登入時、/stats、委託的獎勵、debug 的經驗都會寫「全服經驗 ×2」。
experience_bonus: 2

# 升到下一級需要的經驗（等級 → 經驗）：跟 PoE2 一樣的經驗表，1 到 100 級總共 4,250,334,444。
# 每隻怪給的經驗在 monsters.yml（PoE 的怪物經驗表 × 2），所以每一級要殺的同等級普通怪（魔法怪算 3 隻、稀有怪算 12 隻）：
#   1 級 13 隻、10 級 70 隻、30 級約 210 隻、60 級約 870 隻、80 級約 2,900 隻；
#   85 級以後地圖的怪最高 84 級（T16），再加上下面的等級差懲罰：90 級約 6,600 隻、95 級約 3.6 萬隻、99 級約 20 萬隻。
# 超過一半的總經驗在 90 級以後；純算打怪的時間，練到 90 級大約只佔練到 100 級的七分之一。
