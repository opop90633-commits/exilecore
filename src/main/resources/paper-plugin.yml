name: ExileCore
version: '${version}'
main: tw.exilecore.ExileCore
loader: tw.exilecore.bootstrap.ExileCoreLoader
description: 類 PoE 的 Minecraft 伺服器核心插件
api-version: '26.2'

# 第三方插件都是「可選」：沒裝也能啟動，裝了就會在 ExileCore 之前載入。
dependencies:
  server:
    MythicMobs:
      load: BEFORE
      required: false
      join-classpath: true
    FastAsyncWorldEdit:
      load: BEFORE
      required: false
      join-classpath: true
