# ExileCore 設定檔
# 改完存檔後，在遊戲內或主控台輸入 /ec reload 重新載入（資料檔 data/ 也會一起重載）。

storage:
  # h2      = 單機檔案資料庫，開發期預設，不用另外安裝任何東西
  # mariadb = 正式環境；先在專案資料夾執行 docker compose up -d 啟動 MariaDB
  type: h2

  h2:
    # 相對於 plugins/ExileCore/ 的檔名，會產生 exilecore.mv.db
    file: exilecore

  mariadb:
    host: 127.0.0.1
    port: 3306
    database: exilecore
    user: exilecore
    password: exilecore
    pool-size: 8

messages:
  # 所有訊息前面的字樣（MiniMessage 格式）。伺服器列表的說明與世界觀文字在 data/world.yml。
  prefix: "<gradient:#9fd3ff:#f5b942>星骸</gradient> <dark_gray>»</dark_gray> "

backup:
  # 每天幾點自動備份一次（伺服器時間，24 小時制）；空字串 "" = 不自動備份。/ec backup 隨時可以手動備份。
  # 資料庫寫成 plugins/ExileCore/backups/db-時間.json.gz，劇情世界壓成 world-時間.zip。
  # 舊的 config.yml 沒有這一段時就用這裡的預設值。
  daily-time: "05:00"
  # 保留幾天，超過的自動刪掉
  keep-days: 14
  # 要不要連劇情世界的資料夾一起備份（地圖世界每次都重新產生，不用備份）
  worlds: true

# 2026-10-23：3D 背飾（翅膀、光輪）騎在玩家身上（客戶端自己畫在身上，倒退、衝刺都黏得住）；false = 舊的每 tick 傳送（會稍微跟不上）
cosmetics:
  ride: true

startup:
  # 2026-10-23：開機完成後幾秒內，登入的人先在登入那一步等（不踢；等待室的人照樣會被送回來），時間到再一個一個放進來（每人錯開 0.1 秒）。
  # 重啟後大家同時重連時伺服器還很忙，容易連線逾時；0 = 不等，最多 300（每個人最多等 20 秒，等滿就直接放進來，不會被踢）。沒有這一段時預設 5。
  # 2026-10-25：15 → 5（以前排到 20 秒以後的人會被踢掉，看起來像重連不回來）
  login-delay-seconds: 5

# TAB 列表最上面的伺服器名稱（MiniMessage 寫法，可以用顏色）；下面自動列出在線人數、PING、TPS
tab:
  title: "<#7fd4ff>《 <#f5b942><b>星骸</b> <#7fd4ff>》"

# 選單的 Discord、贊助商城、新手教學按鈕（也可以打 /discord、/store、/tutorial）。空字串 = 按鈕寫「即將開放」。改完 /ec reload
links:
  discord: "https://discord.gg/wKpcGqzJYa"   # 2026-10-20 換新的邀請連結
  store: ""
  tutorial: "https://drive.google.com/file/d/1NhlPB1UTjmRL-8fXUdklSOpURGw2aJs2/view?usp=drivesdk"

# NPC 的外觀（2026-10）：寫正版玩家名稱，NPC 就換成那個人的皮膚。改完 /ec reload（已經放好的 NPC 會跟著換）。
# 功能 NPC 寫種類代號：identifier 鑑定師、stash 倉庫管理員、salvage 拆解師、waypoint 傳送師、map_device 地圖裝置、
#   vendor 商人、market 市集掌櫃、heist 盜賊首領（沒名字的擺設也可以）
# 劇情人物寫 quests.yml 的人物代號：ming_yi 明夷、ji_heng（沒名字的擺設）…
# 沒寫的：上面四個用程式內建的，其他隨機一個原版皮膚
# 單獨一個人（同種類的其中一個、沒有名字的擺設、用原版指令放的假人）：看著他打 /ec npc skin <正版玩家名稱>，reset 還原；記在那個人身上，蓋過這裡的設定
npc_skins:
  identifier: G22332004
  map_device: UTro_
  vendor: ss9319622
  heist: Penguin0c0
  ming_yi: Raincoat_OwO
  stash: Truffle_26
  ji_heng: winter_Re3

# 在線人數加成（2026-10）：同時在線、真的在玩的人數到門檻，全服就有加成；人數掉下來超過 1 分鐘就收回。改完 /ec reload
# 只算在玩的人：有角色、不是旁觀模式、idle-minutes 分鐘內按過移動鍵或說過話；one-per-ip = 同一個 IP 只算一個（擋分身灌人數）。
#   前面有 Velocity／BungeeCord 代理卻沒有轉送真實 IP 時，所有人看起來是同一個 IP：要改成 false。
# 每一階寫「總共」加多少 %（不是跟上一階的差）：experience 經驗、quantity 掉落數量、rarity 掉落稀有度、gold 金幣。
# 跟管理網頁的全服加成、贊助的全服加倍一起算：經驗、金幣相乘，數量、稀有度相加。
online_bonus:
  enabled: true
  tiers:
  # 2026-10-21：改成每 10 人一階，每階四種各 +2%（100 人 20%，跟以前一樣；滿 120 人 24%）
    - { players: 10, experience: 2, quantity: 2, rarity: 2, gold: 2 }
    - { players: 20, experience: 4, quantity: 4, rarity: 4, gold: 4 }
    - { players: 30, experience: 6, quantity: 6, rarity: 6, gold: 6 }
    - { players: 40, experience: 8, quantity: 8, rarity: 8, gold: 8 }
    - { players: 50, experience: 10, quantity: 10, rarity: 10, gold: 10 }
    - { players: 60, experience: 12, quantity: 12, rarity: 12, gold: 12 }
    - { players: 70, experience: 14, quantity: 14, rarity: 14, gold: 14 }
    - { players: 80, experience: 16, quantity: 16, rarity: 16, gold: 16 }
    - { players: 90, experience: 18, quantity: 18, rarity: 18, gold: 18 }
    - { players: 100, experience: 20, quantity: 20, rarity: 20, gold: 20 }
    - { players: 110, experience: 22, quantity: 22, rarity: 22, gold: 22 }
    - { players: 120, experience: 24, quantity: 24, rarity: 24, gold: 24 }

resource-pack:
  # 介面資源包（星盤式的天賦樹、傳奇裝備的專屬外觀）：插件自己產生、透過下面的 web 網頁伺服器提供下載，玩家登入時會被問要不要套用。
  # 不套用的人看到一般的箱子介面，下次登入會再問一次。web 沒開時不會送。
  send: true
  # true = 不套用就不能進伺服器
  required: false
  # 資源包放在外部空間（2026-10：主機拿不到第二個埠、內建網頁伺服器開不了時用）：填直接下載的網址，例如
  #   https://github.com/你的帳號/你的倉庫/releases/download/pack/exilecore-ui.zip
  # 插件每次啟動會把資源包寫到 plugins/ExileCore/exilecore-ui.zip，把這個檔案上傳到上面的網址（覆蓋舊的）。
  # 資源包有更新（換了新版插件）時主控台會提醒重新上傳；沒重傳的話玩家會下載失敗。空白 = 用下面 web 的網頁伺服器。
  external-url: ""
  # 背景音樂那包的外部網址（2026-10-21）：音樂（約 6 MB）拆成另一包，各自有雜湊、客戶端各自記住，更新插件時玩家只重新下載介面那包。
  #   用內建網頁伺服器時自動拆開，不用填。用外部空間時：填了就拆開（把 plugins/ExileCore/exilecore-music.zip 上傳到這個網址）；
  #   沒填 = 音樂併回介面那包（跟以前一樣只有一包、一個網址）。
  external-music-url: ""
  # 資料檔裡自己指定的物品模型（基底、寶石、藥劑的 model 欄位）：這些美術還沒做，保持 false
  # （true 時沒有對應資源包的客戶端會看到紫黑方塊）。
  # 傳奇與通貨的專屬貼圖不用這個開關：照上面的資源包（send）套用就看得到，沒套用的人看到原本的物品。
  enabled: false

web:
  # 插件內建的小型網頁伺服器：提供介面資源包的下載與網頁天賦規劃器（/tree web 給連結）
  enabled: true
  # 聽哪個埠；在自己電腦測試不用改。正式開服要在防火牆／主機商的面板開放這個埠（TCP）
  port: 25580
  # 綁定的位址；空白 = 全部
  bind: ""
  # 玩家連得到的網址（資源包與規劃器的連結用），例如 http://你的網域或IP:25580
  # 空白 = 只給在這台電腦上連線的玩家（http://localhost:埠），別台電腦的玩家不會被問要不要套用資源包、也看不到規劃器的連結；
  #        server.properties 有填對外的 server-ip 時改用那個位址。
  # 前面有 Velocity／BungeeCord 代理時一定要填（不然所有玩家看起來都是從本機連進來的）
  public-url: ""
  # 市場報告（網址/economy）：全服通貨與金幣每天的產出、消耗、存量、參考價值（只有加總，沒有個人資料；開了就誰都看得到）。
  # 2026-10 預設不提供（首頁也不會列出來）；管理員用 /ec economy 看。想公開再改成 true。
  economy-page: false
  # 管理網頁（網址/admin）：發放物資、改全服加成與經濟設定、公告、維護模式。管理員在遊戲裡打 /ec web 拿一次性的登入連結
  # （10 分鐘內有效、只能用一次）；沒有連結的人打開只會看到「請在遊戲裡打 /ec web」。
  # 網頁伺服器是 http：從別台電腦連線時，登入後的 Cookie 在網路上看得到——放在 https 的反向代理後面（public-url 填 https://…）最安全。
  # false = 不提供（網址 404、/ec web 不給連結）。舊的 config.yml 沒有這一行時用預設值（提供）。
  admin-page: true
  # 贊助商店（網址/shop，2026-10）：金流（PayUni）審核要的「商店網址」——儲值方案（新台幣）、星幣能換的東西（照 data/sponsor.yml 現在的價格自動列）、
  # 抽獎箱的機率、累積贊助、商家資料、退款與隱私權條款。merchant 沒填的欄位頁面上會寫「（未填寫）」：送審前全部填好。改完 /ec reload
  shop:
    enabled: true
    merchant:
      name: ""        # 商店名稱（跟金流申請的一樣）
      owner: ""       # 負責人
      tax-id: ""      # 統一編號（個人賣家可以空白，頁面就不顯示這一行）
      email: ""       # 客服信箱
      phone: ""       # 客服電話
      address: ""     # 營業地址（個人賣家照金流的要求填）
      hours: "週一至週五 10:00–18:00（Discord 隨時可以留言）"
    payments: "信用卡、ATM 轉帳、超商代碼（PayUni 統一金流）"
    # 儲值方案：stars = 拿到多少星幣，price = 新台幣，bonus = 加送的星幣（不算進累積贊助），name = 方案名稱（可以空白）
    packages:
      - { stars: 100,  price: 100 }
      - { stars: 300,  price: 300 }
      - { stars: 500,  price: 500 }
      - { stars: 1000, price: 1000 }
      - { stars: 3000, price: 3000 }
      - { stars: 5000, price: 5000 }
    # 線上付款（統一金流 PAYUNi 整合式支付頁）：在 PAYUNi 後台「商店串接資訊」拿商店代號、Hash Key、Hash IV。
    # 背景通知只送到 80、443 埠：上面的 public-url 要是 https 的網址（https://web.你的網域），反向代理要把 /shop/ 轉給這個網頁伺服器。
    # 付款成功（含 ATM、超商代碼繳費完成）自動發星幣到填的遊戲名稱（離線的下次登入發），同一筆訂單只會發一次；訂單記在資料表 shop_orders。
    # 先用 sandbox: true 在測試區試（測試卡號 4147631000000001，到期日、末三碼隨便填），沒問題再換正式區的代號與金鑰、sandbox: false。
    # Hash Key／Hash IV 等同密碼：不要外流、不要貼到 Discord。
    payuni:
      enabled: false
      sandbox: true
      mer-id: ""
      hash-key: ""    # 32 個字
      hash-iv: ""     # 16 個字
      # 測試區（sandbox: true）只有這些遊戲名稱可以下單：測試卡付的款不是真的錢，卻會發真的星幣，不能讓一般玩家用
      test-players: []
    # 網頁伺服器前面有反向代理（nginx、Cloudflare）時看代理給的真實 IP（CF-Connecting-IP、X-Forwarded-For），下單次數限制才不會全部算成同一個人
    trust-proxy: true
    # 2026-10-18：前面是哪種代理。空白或 cloudflare = 相信 CF-Connecting-IP；只有 nginx／Caddy、沒有 Cloudflare 的請寫 nginx（或 none），
    # 不然玩家可以自己帶一個假的 CF-Connecting-IP 繞過下單次數限制
    proxy: ""

items:
  # 玩家能不能把東西丟在地上（Q 鍵、拖到視窗外面）。false = 不能：免得直接丟給別人、繞過面對面交易的手續費，也不會手滑丟掉；
  # 不要的東西用選單（Shift＋F）的「垃圾桶」刪掉。管理員（exilecore.admin）在創造模式不受限制。
  # 不管能不能丟，丟出去（或掉出來）的東西都只有丟的人看得到、撿得到，隊友也看不到。
  # 背包滿了、伺服器放不回去的東西（例如關掉視窗時游標上拿著的）會收進隨身背包；隨身背包也滿了才掉在腳下。
  # 舊的 config.yml 沒有這一段時用預設值（不能丟）。
  allow-drop: false

combat:
  # 怪物打中玩家時要不要擊退（原版有、PoE 沒有）。false = 不擊退：近戰、箭、爆炸、怪物技能都一樣；玩家之間照原版。
  monster-knockback: false
  # 按住左鍵連續施放（左鍵綁的技能或普攻，跟右鍵一樣）。原版按住左鍵不會一直送封包，所以在戰鬥區域裡
  # 把方塊互動距離拉到 64 格、挖方塊速度變 0，讓客戶端把按住左鍵當成一直在「挖」準星指著的方塊（挖不動、沒有裂痕）。
  # 副作用：準星指著的遠處方塊有原版的黑色外框，按住時那裡冒一點碎屑（敲擊聲由介面資源包消掉）。
  # false = 關掉，左鍵回到一下一下點。舊的 config.yml 沒有這一行時用預設值（開）。
  hold-left-click: true
  # 原版環境傷害 → 我們的傷害類型。
  # 實際傷害 = 原版數字 × multiplier × 最大生命 ÷ 40（原版 20 點 = 滿血）。
  # periodic: true 的原因（火、岩漿）最多每 0.5 秒套用一次；ignore_mitigation: true 不吃護甲／抗性。
  environment:
    FALL:      { type: physical, multiplier: 0.5, ignore_mitigation: true }
    FIRE:      { type: fire, multiplier: 0.4, periodic: true }
    FIRE_TICK: { type: fire, multiplier: 0.25, periodic: true }
    LAVA:      { type: fire, multiplier: 1.0, periodic: true }
    DROWNING:  { type: physical, multiplier: 0.5, periodic: true, ignore_mitigation: true }
    VOID:      { type: chaos, multiplier: 100, ignore_mitigation: true }

# 聊天與 Discord 同步（2026-10）。設定步驟：
#   1. Discord 頻道設定 → 整合 → Webhook → 新 Webhook，複製網址貼到 webhook-url（遊戲 → Discord：名字是角色名稱、頭像是玩家的頭）。
#   2. https://discord.com/developers/applications 建一個應用程式 → Bot：重設 Token 貼到 bot-token；
#      同一頁打開「MESSAGE CONTENT INTENT」（不開讀不到訊息內容）。OAuth2 → URL Generator 勾 bot，權限勾
#      View Channels、Send Messages、Read Message History、Embed Links、Attach Files、Manage Channels、Manage Roles
#      （後兩個是客服單開頻道用），用產生的網址把機器人拉進你的 Discord 伺服器。
#   3. Discord 設定 → 進階 → 打開開發者模式，在頻道上按右鍵「複製頻道 ID」貼到 channel-id。
#   4. enabled 改成 true，/ec reload。
# 只填 webhook-url = 只有遊戲 → Discord；bot-token＋channel-id 才會把 Discord 的訊息轉進遊戲。Token 不要給別人看。
discord:
  enabled: false
  webhook-url: ""
  bot-token: ""
  channel-id: ""
  # Discord 上公告（上下線、世界事件、成就、開關服）顯示的名字
  server-name: "星骸"
  # Discord 的訊息在遊戲裡的樣子（MiniMessage；{name} 是 Discord 名字、{message} 是內容）
  in-game-format: "<#5865f2>[DC]</#5865f2> <white>{name}</white><gray>: </gray>{message}"
  sync:
    chat: true          # 雙向聊天
    join-leave: true    # 上線、下線
    world-events: true  # 開天者、星潮入侵的預告、開始、結束
    achievements: true  # 昇華、極境 Boss／金庫之主打倒、追逐級傳奇、滿級、每月挑戰全部完成
    server: true        # 伺服器開啟、關閉
  # Discord 帳號連結與伺服器加成（2026-10）：在遊戲裡打 /discord panel 頻道ID 把「連結遊戲帳號」面板發到 Discord，
  # 玩家按按鈕拿代碼、遊戲裡 /discord link 代碼。連結的 Discord 帳號在這個 Discord 伺服器加成（Server Boost）期間，
  # 遊戲帳號就有月卡的功能（不含月卡每天發的月卡幣、時裝幣、免費抽獎箱）。加成開始、結束即時生效
  # （開發者平台的 Bot 頁要打開 SERVER MEMBERS INTENT；沒開的話只在登入時確認）。要有 bot-token。
  boost:
    enabled: true
    guild-id: ""            # Discord 伺服器 ID（空白 = 用下面客服單的 guild-id）
  # 客服單（2026-10，不用 Ticket Tool）：Discord 上按按鈕開單，遊戲裡 /ticket 內容 也能開（自動附上角色、位置、贊助狀況），
  # 客服在單裡說的話會轉到遊戲給那個玩家。設定好之後在遊戲裡打 /ticket panel general 頻道ID 把面板發到 Discord 頻道。
  # ID 都是在 Discord 開發者模式下按右鍵「複製 ID」：伺服器 ID、分類 ID、頻道 ID、身分組 ID（伺服器設定 → 身分組 → 右鍵）。
  tickets:
    enabled: false
    guild-id: ""            # Discord 伺服器 ID
    category-id: ""         # 客服單頻道開在哪個分類（空白 = 最外面）
    log-channel-id: ""      # 關單時整段對話存成文字檔送到這個頻道（建議只有管理員看得到）
    staff-role-ids: []      # 客服身分組（看得到全部客服單、能認領、關閉），例如 ["123456789012345678"]
    max-open-per-user: 1    # 一個人同時最多開幾張
    game-panel: general     # 遊戲裡 /ticket 開的單算哪一種
    panels:
      general:
        title: "一般諮詢"
        description: "遇到遊戲問題或發現 Bug 了嗎？請點擊下方按鈕開啟客服單。\n為了加快處理速度，請提供您的遊戲 ID 與問題描述。\n\n👇 點擊下方開啟客服單 👇"
