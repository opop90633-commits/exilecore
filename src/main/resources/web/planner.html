<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>星骸 天賦規劃器</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230a0d1a'/%3E%3Cpolygon points='32,6 38,25 58,25 42,37 48,57 32,45 16,57 22,37 6,25 26,25' fill='%23f5b942'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0d1a;
    --panel: #121628;
    --panel-2: #1a1f36;
    --line: #2b3150;
    --text: #e6e6f0;
    --quiet: #9a9cb4;
    --gold: #f5c04a;
    --gold-edge: #e6a82e;
    --bright: #e8e8f2;
    --lit: #9c9cb8;
    --dim: #5e5e74;
    --dim-edge: #33354a;
    --blue: #6fa8ff;
    --red: #ff6a6a;
    --cyan: #55ffff;
    --keystone: #ff77ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Noto Sans TC", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif; font-size: 14px; }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { margin: 0; font-size: 17px; font-weight: 600; color: var(--gold); white-space: nowrap; }
  .classes { display: flex; gap: 6px; }
  .classes button { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 5px 12px;
    border-radius: 6px; cursor: pointer; font: inherit; }
  .classes button.active { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); color: var(--c); }
  .points { color: var(--quiet); white-space: nowrap; }
  .points b { color: var(--text); }
  .points .over { color: var(--red); }
  main { flex: 1; display: flex; min-height: 0; }
  #canvas { flex: 1; position: relative; min-width: 0; touch-action: none; cursor: grab; }
  #canvas.dragging { cursor: grabbing; }
  svg { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  aside { width: 320px; max-width: 42vw; background: var(--panel); border-left: 1px solid var(--line); display: flex;
    flex-direction: column; min-height: 0; }
  aside section { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  aside h2 { margin: 0 0 8px; font-size: 13px; font-weight: 600; color: var(--gold); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .actions button, .tools button { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 7px 8px;
    border-radius: 6px; cursor: pointer; font: inherit; }
  .actions button:hover, .tools button:hover, .classes button:hover { border-color: var(--quiet); }
  .actions button.primary { border-color: var(--gold); color: var(--gold); }
  input[type=search] { width: 100%; padding: 7px 9px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg);
    color: var(--text); font: inherit; }
  .hint { color: var(--quiet); font-size: 12px; margin-top: 6px; line-height: 1.5; }
  #totals { flex: 1; overflow: auto; padding: 12px 14px; }
  #totals ul { list-style: none; margin: 0; padding: 0; }
  #totals li { padding: 3px 0; border-bottom: 1px dashed #1f2440; line-height: 1.45; }
  #totals li.keystone { color: var(--keystone); }
  #totals .empty { color: var(--dim); }
  .tools { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 6px; }
  #tip { position: fixed; pointer-events: none; max-width: 300px; background: rgba(14, 17, 32, 0.96); border: 1px solid var(--line);
    border-radius: 8px; padding: 9px 11px; line-height: 1.5; font-size: 13px; display: none; z-index: 10;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.5); }
  #tip .name { font-weight: 600; font-size: 14px; }
  #tip .type { color: var(--quiet); font-size: 12px; }
  #tip .line { color: var(--text); }
  #tip .action { margin-top: 5px; font-size: 12px; }
  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--gold);
    color: var(--text); padding: 9px 14px; border-radius: 8px; display: none; z-index: 20; }
  #codebox { width: 100%; margin-top: 8px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: var(--bg);
    color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px; display: none; resize: vertical; }
  .label { font-size: 11px; fill: var(--quiet); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px;
    stroke-linejoin: round; }
  .zoomed-out .label { display: none; }
  .node { cursor: pointer; }
  /* 裝備（2026-10） */
  .gear { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .gear button { position: relative; height: 46px; border: 1px solid var(--line); background: var(--bg); color: var(--quiet); border-radius: 6px;
    cursor: pointer; font: inherit; font-size: 11px; padding: 2px; line-height: 1.2; overflow: hidden; }
  .gear button:hover { border-color: var(--quiet); }
  .gear button.normal { border-color: #8a8a8a; color: #e0e0e0; } .gear button.magic { border-color: #6f8fff; color: #9db4ff; }
  .gear button.rare { border-color: #e8d34a; color: #ffff77; } .gear button.unique { border-color: #c96b2c; color: #e0884a; }
  .gear button img { width: 24px; height: 24px; image-rendering: pixelated; display: block; margin: 0 auto 1px; }
  dialog#itemDialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 0;
    width: min(560px, calc(100vw - 24px)); max-height: calc(100vh - 32px); }
  dialog#itemDialog::backdrop { background: rgba(0, 0, 0, 0.55); }
  .dlg { padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
  .dlg h3 { margin: 0; font-size: 15px; color: var(--gold); }
  .dlg .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .dlg select, .dlg input { font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }
  .dlg select { max-width: 100%; }
  .dlg .mod { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px dashed #1f2440; }
  .dlg .mod input { width: 76px; }
  .dlg .mod .t { flex: 1 1 200px; font-size: 13px; }
  .dlg .seg button { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 5px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  .dlg .seg button.on { border-color: var(--gold); color: var(--gold); }
  .dlg .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .dlg .btns button, .dlg .small { border: 1px solid var(--line); background: var(--panel-2); color: var(--text); padding: 6px 12px; border-radius: 6px; cursor: pointer; font: inherit; }
  .dlg .btns .primary { border-color: var(--gold); color: var(--gold); }
  .itemcard { background: #100c18; border: 2px solid #3a2a5a; border-radius: 6px; padding: 8px 10px; font-size: 13px; line-height: 1.5; }
  .itemcard .nm { font-weight: 600; font-size: 15px; }
  .itemcard .sep { border-top: 1px solid #2c2440; margin: 4px 0; }
  .itemcard .fl { color: #af6025; font-style: italic; }
  #gearTotals li { color: #9db4ff; }
  @media (max-width: 720px) {
    main { flex-direction: column; }
    aside { width: 100%; max-width: none; border-left: 0; border-top: 1px solid var(--line); max-height: 42vh; }
    .points { white-space: normal; }
  }
</style>
</head>
<body>
<header>
  <h1>星骸・天賦規劃器</h1>
  <div class="classes" id="classes"></div>
  <div class="points" id="points">載入中…</div>
</header>
<main>
  <div id="canvas">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="glowGold"><stop offset="0" stop-color="#f5c04a" stop-opacity="0.55"/><stop offset="1" stop-color="#f5c04a" stop-opacity="0"/></radialGradient>
        <radialGradient id="glowBlue"><stop offset="0" stop-color="#6fa8ff" stop-opacity="0.5"/><stop offset="1" stop-color="#6fa8ff" stop-opacity="0"/></radialGradient>
        <radialGradient id="glowRed"><stop offset="0" stop-color="#ff6a6a" stop-opacity="0.5"/><stop offset="1" stop-color="#ff6a6a" stop-opacity="0"/></radialGradient>
      </defs>
      <g id="world">
        <g id="stars"></g>
        <g id="edges"></g>
        <g id="glows"></g>
        <g id="nodes"></g>
        <g id="labels"></g>
      </g>
    </svg>
    <div class="tools">
      <button id="fit" title="整棵樹放進畫面">全部</button>
      <button id="home" title="回到職業起點">起點</button>
      <button id="zoomIn" title="放大">＋</button>
      <button id="zoomOut" title="縮小">－</button>
    </div>
  </div>
  <aside>
    <section>
      <h2>規劃</h2>
      <div class="actions">
        <button id="copyCode" class="primary">複製代碼</button>
        <button id="copyLink">複製連結</button>
        <button id="paste">貼上代碼</button>
        <button id="reset">全部重來</button>
      </div>
      <textarea id="codebox" rows="2" readonly></textarea>
      <div class="hint">點節點：配到那裡（自動走最短的路）。點已配的節點：退掉（連帶退掉因此斷線的）。<br>
        <span style="color:#c77dff">六角形</span>是珠寶孔：配了之後在遊戲裡把珠寶放進去（這裡只能規劃孔位）。<br>
        複製代碼後，遊戲裡打 <b>/tree import</b> 貼上，或在天賦總覽按「匯入規劃代碼」。</div>
    </section>
    <section>
      <h2>搜尋</h2>
      <input type="search" id="search" placeholder="例如：生命、暴擊、火焰">
      <div class="hint" id="searchHint"></div>
    </section>
    <section>
      <h2>裝備</h2>
      <div class="gear" id="gear"></div>
      <div class="hint">點格子挑基底、詞綴與數值（或選傳奇）。裝備存在「複製連結」的網址裡，一起分享；遊戲裡的 /tree import 只看天賦。</div>
    </section>
    <div id="totals"><h2 style="margin:0 0 8px;font-size:13px;color:var(--gold)">天賦加起來</h2><ul id="totalList"></ul>
      <h2 style="margin:14px 0 8px;font-size:13px;color:var(--gold)">裝備加起來</h2><ul id="gearTotals"></ul></div>
  </aside>
</main>
<dialog id="itemDialog"><div class="dlg" id="dlg"></div></dialog>
<div id="tip"></div>
<div id="toast"></div>
<script>
"use strict";
(function () {
  const SPACING = 56;
  const svg = document.getElementById("svg");
  const world = document.getElementById("world");
  const layers = {
    stars: document.getElementById("stars"), edges: document.getElementById("edges"), glows: document.getElementById("glows"),
    nodes: document.getElementById("nodes"), labels: document.getElementById("labels")
  };
  const tip = document.getElementById("tip");
  const toast = document.getElementById("toast");
  const NS = "http://www.w3.org/2000/svg";

  let data = null;
  let byId = new Map();
  let byPos = new Map();
  let order = [];
  let classId = null;
  let start = null;
  let allocated = new Set();
  let hover = null;
  let preview = { add: new Set(), remove: new Set() };
  let search = new Set();
  const view = { x: 0, y: 0, scale: 1 };

  // ---- 資料 ----
  fetch("tree/data.json", { cache: "no-cache" }).then(r => r.json()).then(json => {
    if (json.error) { document.getElementById("points").textContent = json.error; return; }
    data = json;
    order = data.nodes;
    for (const node of order) { byId.set(node.id, node); byPos.set(node.x + "," + node.y, node); }
    buildClasses();
    drawStars();
    renderGear();
    const fromHash = decodeCode(hashText());
    if (fromHash) { load(fromHash); }
    else { setClass(data.classes[0].id, false); }
    render();
    centerOn(start, 1);
  }).catch(err => { document.getElementById("points").textContent = "讀不到天賦樹資料：" + err; });

  // ---- 裝備（2026-10）----
  const GEAR_SLOTS = [["ring", "戒指"], ["ring", "戒指"], ["amulet", "項鍊"], ["belt", "腰帶"], ["main_hand", "主手"],
    ["off_hand", "副手"], ["head", "頭盔"], ["chest", "胸甲"], ["legs", "褲子"], ["feet", "鞋子"]];
  const RARITY_NAME = { normal: "普通", magic: "魔法", rare: "稀有", unique: "傳奇" };
  const RARITY_COLOR = { normal: "#e0e0e0", magic: "#8888ff", rare: "#ffff77", unique: "#af6025" };
  const AFFIX_LIMIT = { normal: 0, magic: 1, rare: 3 };
  let items = null;
  let gear = new Array(GEAR_SLOTS.length).fill(null);
  let pendingGear = null;
  fetch("tree/items.json", { cache: "no-cache" }).then(r => r.json()).then(json => {
    items = json;
    items.baseById = new Map(json.bases.map(b => [b.id, b]));
    items.affixById = new Map(json.affixes.map(a => [a.id, a]));
    items.uniqueById = new Map(json.uniques.map(u => [u.id, u]));
    const text = pendingGear !== null ? pendingGear : gearText(hashText());
    pendingGear = null;
    gear = decodeGear(text);
    renderGear();
    if (data) updatePanel();
  }).catch(() => { /* 沒有裝備資料：只有天賦 */ });

  function gearText(hash) {
    const i = hash.indexOf("~");
    return i < 0 ? "" : hash.slice(i + 1);
  }
  function b64urlEncode(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = "";
    for (const b of bytes) binary += String.fromCharCode(b);
    return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }
  function b64urlDecode(text) {
    const binary = atob(text.replace(/-/g, "+").replace(/_/g, "/"));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }
  /** 裝備存成 [基底, 稀有度, 傳奇, [[詞綴, 階, [值…]]…], [[傳奇第幾條的值…]…]]，JSON 之後 base64url。 */
  function gearSuffix() {
    if (!gear.some(Boolean)) return "";
    const packed = gear.map(g => {
      if (!g) return 0;
      if (g.rarity === "unique") return [0, "u", g.unique, 0, g.uvals.map(v => v || [])];
      return [g.base, g.rarity[0], 0, g.affixes.map(a => [a.id, a.tier, a.vals])];
    });
    return "~" + b64urlEncode(JSON.stringify(packed));
  }
  function decodeGear(text) {
    const out = new Array(GEAR_SLOTS.length).fill(null);
    if (!text || !items) return out;
    let packed;
    try { packed = JSON.parse(b64urlDecode(text)); } catch (e) { return out; }
    if (!Array.isArray(packed)) return out;
    packed.forEach((p, i) => {
      if (!Array.isArray(p) || i >= out.length) return;
      if (p[1] === "u") {
        const u = items.uniqueById.get(p[2]);
        if (!u || u.slot !== GEAR_SLOTS[i][0]) return;
        out[i] = { rarity: "unique", unique: u.id, base: u.base, uvals: u.mods.map((m, k) => Array.isArray(p[4] && p[4][k]) ? p[4][k] : []) };
        return;
      }
      const base = items.baseById.get(p[0]);
      if (!base || base.slot !== GEAR_SLOTS[i][0]) return;
      const rarity = { n: "normal", m: "magic", r: "rare" }[p[1]] || "normal";
      const affixes = (Array.isArray(p[3]) ? p[3] : []).filter(a => Array.isArray(a) && items.affixById.has(a[0]))
        .map(a => ({ id: a[0], tier: a[1], vals: Array.isArray(a[2]) ? a[2] : [] }));
      out[i] = { rarity, base: base.id, affixes };
    });
    return out;
  }
  function varNames(vars) { return Object.keys(vars || {}); }
  function fmtVar(raw, div) { return div > 1 ? format(raw / div) : String(raw); }
  function fill(text, div, names, values) {
    return text.replace(/\{([A-Za-z0-9_]+)(?:\/\d+)?\}/g, (m, name) => {
      const i = names.indexOf(name);
      const v = i >= 0 ? values[i] : undefined;
      return v === undefined || v === null || v === "" ? "?" : fmtVar(Number(v), (div && div[name]) || 1);
    });
  }
  function tierOf(affix, tier) { return affix.tiers.find(t => t.tier === tier) || affix.tiers[0]; }
  /** 這件裝備的說明行（不含名稱）。 */
  function itemLines(g) {
    const lines = [];
    const base = items.baseById.get(g.base);
    if (base && base.implicit) {
      const names = varNames(base.implicitVars);
      lines.push({ text: fill(base.implicit, base.implicitDiv, names, names.map(n => base.implicitVars[n][1])), implicit: true });
    }
    if (g.rarity === "unique") {
      const u = items.uniqueById.get(g.unique);
      if (u) u.mods.forEach((m, k) => {
        const names = varNames(m.vars);
        const vals = names.map((n, j) => (g.uvals[k] && g.uvals[k][j] !== undefined && g.uvals[k][j] !== null) ? g.uvals[k][j] : m.vars[n][1]);
        lines.push({ text: fill(m.text, m.div, names, vals) });
      });
    } else {
      for (const a of g.affixes) {
        const affix = items.affixById.get(a.id);
        if (!affix) continue;
        const t = tierOf(affix, a.tier);
        const names = varNames(t.vars);
        const vals = names.map((n, j) => a.vals[j] !== undefined && a.vals[j] !== null ? a.vals[j] : t.vars[n][1]);
        lines.push({ text: fill(affix.text, affix.div, names, vals), type: affix.type });
      }
    }
    return lines;
  }
  function itemName(g) {
    const base = items.baseById.get(g.base);
    if (g.rarity === "unique") { const u = items.uniqueById.get(g.unique); return u ? u.name : "?"; }
    return (g.rarity === "normal" ? "" : RARITY_NAME[g.rarity] + " ") + (base ? base.name : "?");
  }
  function renderGear() {
    const box = document.getElementById("gear");
    box.replaceChildren();
    GEAR_SLOTS.forEach(([slot, label], i) => {
      const g = gear[i];
      const b = document.createElement("button");
      b.type = "button";
      if (g && items) {
        b.className = g.rarity;
        if (g.rarity === "unique" && items.uniqueById.get(g.unique) && items.uniqueById.get(g.unique).icon) {
          const img = document.createElement("img");
          img.src = "builds/icon.png?id=" + encodeURIComponent(g.unique);
          img.alt = "";
          img.onerror = () => img.remove();
          b.appendChild(img);
        }
        b.appendChild(document.createTextNode(itemName(g)));
        b.title = itemName(g);
      } else {
        b.textContent = label;
      }
      b.setAttribute("aria-label", label + (g && items ? "：" + itemName(g) : "：空"));
      b.addEventListener("click", () => openEditor(i));
      if (g && items) {
        b.addEventListener("mouseenter", e => showItemTip(g, e.clientX, e.clientY));
        b.addEventListener("mousemove", e => showItemTip(g, e.clientX, e.clientY));
        b.addEventListener("mouseleave", hideTip);
      }
      box.appendChild(b);
    });
  }
  function itemCard(g) {
    const card = document.createElement("div");
    card.className = "itemcard";
    const nm = document.createElement("div");
    nm.className = "nm";
    nm.style.color = RARITY_COLOR[g.rarity];
    nm.textContent = itemName(g);
    card.appendChild(nm);
    const base = items.baseById.get(g.base);
    if (g.rarity === "unique" && base) { const d = document.createElement("div"); d.style.color = "#c8c8c8"; d.textContent = base.name; card.appendChild(d); }
    const lines = itemLines(g);
    let sep = false;
    for (const l of lines) {
      if (!l.implicit && !sep) { const s = document.createElement("div"); s.className = "sep"; card.appendChild(s); sep = true; }
      const d = document.createElement("div");
      d.style.color = l.implicit ? "#c8c8c8" : "#8888ff";
      d.textContent = l.text;
      card.appendChild(d);
    }
    if (g.rarity === "unique") {
      const u = items.uniqueById.get(g.unique);
      if (u && u.flavour.length) {
        const s = document.createElement("div"); s.className = "sep"; card.appendChild(s);
        for (const f of u.flavour) { const d = document.createElement("div"); d.className = "fl"; d.textContent = f; card.appendChild(d); }
      }
    }
    return card;
  }
  function showItemTip(g, x, y) {
    tip.replaceChildren(itemCard(g));
    tip.style.display = "block";
    tip.style.padding = "0";
    tip.style.border = "none";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w - 12)) + "px";
    tip.style.top = Math.max(8, Math.min(window.innerHeight - h - 8, y + 12)) + "px";
  }
  function renderGearTotals() {
    const list = document.getElementById("gearTotals");
    if (!list) return;
    list.replaceChildren();
    const lines = [];
    if (items) for (const g of gear) if (g) lines.push(...itemLines(g).map(l => l.text).filter(t => !t.includes("?")));
    const sums = sumLines(lines);
    if (!sums.length) { const li = document.createElement("li"); li.className = "empty"; li.textContent = "還沒有配裝備"; list.appendChild(li); }
    for (const line of sums) { const li = document.createElement("li"); li.textContent = line; list.appendChild(li); }

    for (const node of order) {
      for (const n of neighbours(node)) {
        if (n.x < node.x || (n.x === node.x && n.y < node.y)) continue; // 每條線只畫一次
        el("line", { x1: node.x * SPACING, y1: node.y * SPACING, x2: n.x * SPACING, y2: n.y * SPACING,
          stroke: edgeColor(node, n), "stroke-width": 5, "stroke-linecap": "round" }, layers.edges);
      }
    }
    for (const node of order) {
      const state = node.type === "start" && node.id !== start.id ? "locked" : nodeState(node);
      if (state === "owned" || state === "path" || state === "remove") {
        el("circle", { cx: node.x * SPACING, cy: node.y * SPACING, r: node.type === "small" ? 20 : 30,
          fill: state === "owned" ? "url(#glowGold)" : state === "path" ? "url(#glowBlue)" : "url(#glowRed)" }, layers.glows);
      }
      const g = el("g", { class: "node" }, layers.nodes);
      g.dataset.id = node.id;
      shape(node, g, NODE_FILL[state]);
      if (search.has(node.id)) {
        el("circle", { cx: node.x * SPACING, cy: node.y * SPACING, r: node.type === "small" ? 15 : 26, fill: "none",
          stroke: "#55ffff", "stroke-width": 2.5 }, g);
      }
      if (node.type === "notable" || node.type === "keystone" || node.type === "start" || node.type === "socket") {
        const t = el("text", { x: node.x * SPACING, y: node.y * SPACING + (node.type === "small" ? 22 : 34), "text-anchor": "middle", class: "label" }, layers.labels);
        t.textContent = node.name;
        if (node.type === "keystone") t.setAttribute("style", "fill:#ff99ff");
        if (node.type === "socket") t.setAttribute("style", "fill:#c77dff");
      }
    }
    updatePanel();
  }

  function updatePanel() {
    const used = allocated.size;
    const ppl = data.pointsPerLevel || 1;
    const maxPoints = (data.levelCap - 1) * ppl + data.bonusPoints;
    const levelNoBonus = Math.ceil(used / ppl) + 1;
    const levelBonus = Math.max(1, Math.ceil(Math.max(0, used - data.bonusPoints) / ppl) + 1);
    const over = used > maxPoints;
    document.getElementById("points").innerHTML =
      "已用 <b" + (over ? " class=over" : "") + ">" + used + "</b> / " + maxPoints + " 點　" +
      "需要 Lv." + Math.min(levelNoBonus, 999) + (data.bonusPoints ? "（算上 " + data.bonusPoints + " 點首殺獎勵 Lv." + levelBonus + "）" : "");
    const list = document.getElementById("totalList");
    list.replaceChildren();
    const nodes = order.filter(n => allocated.has(n.id)); // 照樹的順序加總，跟遊戲裡的天賦總覽一樣
    const lines = summarize(nodes);
    if (!lines.length) {
      const li = document.createElement("li"); li.className = "empty"; li.textContent = "還沒有配任何天賦"; list.appendChild(li);
    }
    const keystoneLines = new Set(nodes.filter(n => n.type === "keystone").flatMap(n => n.lines));
    for (const line of lines) {
      const li = document.createElement("li");
      li.textContent = line;
      if (keystoneLines.has(line)) li.className = "keystone";
      list.appendChild(li);
    }
    renderGearTotals();
    try { history.replaceState(null, "", "#" + encodeCode() + gearSuffix()); } catch (e) { /* file:// 之類的不能改 */ }
  }

  // ---- 視野：拖曳、縮放 ----
  function applyView() {
    world.setAttribute("transform", "translate(" + view.x.toFixed(1) + "," + view.y.toFixed(1) + ") scale(" + view.scale.toFixed(3) + ")");
    svg.classList.toggle("zoomed-out", view.scale < 0.75);
  }
  function centerOn(node, scale) {
    const rect = svg.getBoundingClientRect();
    view.scale = scale;
    view.x = rect.width / 2 - node.x * SPACING * scale;
    view.y = rect.height / 2 - node.y * SPACING * scale;
    applyView();
  }
  function fit() {
    const rect = svg.getBoundingClientRect();
    let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
    for (const n of order) { minX = Math.min(minX, n.x); maxX = Math.max(maxX, n.x); minY = Math.min(minY, n.y); maxY = Math.max(maxY, n.y); }
    const w = (maxX - minX + 2) * SPACING, h = (maxY - minY + 2) * SPACING;
    view.scale = Math.min(rect.width / w, rect.height / h);
    view.x = rect.width / 2 - (minX + maxX) / 2 * SPACING * view.scale;
    view.y = rect.height / 2 - (minY + maxY) / 2 * SPACING * view.scale;
    applyView();
  }
  function zoomAt(factor, cx, cy) {
    const next = Math.max(0.25, Math.min(3, view.scale * factor));
    const k = next / view.scale;
    view.x = cx - (cx - view.x) * k;
    view.y = cy - (cy - view.y) * k;
    view.scale = next;
    applyView();
  }
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = svg.getBoundingClientRect();
    zoomAt(e.deltaY < 0 ? 1.15 : 1 / 1.15, e.clientX - rect.left, e.clientY - rect.top);
  }, { passive: false });

  const pointers = new Map();
  let drag = null;
  let pinch = null;
  svg.addEventListener("pointerdown", e => {
    svg.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 1) {
      drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, target: e.target };
    } else if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinch = { dist: Math.hypot(a.x - b.x, a.y - b.y), scale: view.scale };
      drag = null;
    }
  });
  svg.addEventListener("pointermove", e => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const rect = svg.getBoundingClientRect();
      const dist = Math.hypot(a.x - b.x, a.y - b.y);
      zoomAt((pinch.scale * dist / pinch.dist) / view.scale, (a.x + b.x) / 2 - rect.left, (a.y + b.y) / 2 - rect.top);
      return;
    }
    if (drag) {
      const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) > 5) { drag.moved = true; document.getElementById("canvas").classList.add("dragging"); hideTip(); }
      if (drag.moved) { view.x = drag.vx + dx; view.y = drag.vy + dy; applyView(); return; }
    }
    hoverAt(e);
  });
  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinch = null;
    if (drag && !drag.moved && pointers.size === 0) clickAt(e);
    if (pointers.size === 0) { drag = null; document.getElementById("canvas").classList.remove("dragging"); }
  }
  svg.addEventListener("pointerup", endPointer);
  svg.addEventListener("pointercancel", e => { pointers.delete(e.pointerId); drag = null; pinch = null; });
  // 觸控放開手指也會「離開」：那時不要清掉剛畫好的路線
  svg.addEventListener("pointerleave", e => { if (e.pointerType !== "touch" && !drag) { setHover(null); hideTip(); } });

  function nodeAt(e) {
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const g = hit && hit.closest ? hit.closest(".node") : null;
    return g ? byId.get(g.dataset.id) : null;
  }
  function hoverAt(e) {
    const node = nodeAt(e);
    setHover(node);
    if (node) showTip(node, e.clientX, e.clientY); else hideTip();
  }
  function setHover(node) {
    if (node === hover) return;
    hover = node;
    preview = { add: new Set(), remove: new Set() };
    if (node && node.type !== "start") {
      if (allocated.has(node.id)) preview.remove = removal(node);
      else preview.add = new Set(pathTo(node).map(n => n.id));
    }
    render();
  }
  let armed = null;
  function clickAt(e) {
    const node = nodeAt(e);
    if (!node || node.type === "start") {
      armed = null;
      if (e.pointerType === "touch") { setHover(node && node.type === "start" ? node : null); if (node) showTip(node, e.clientX, e.clientY); else hideTip(); }
      return;
    }
    // 觸控沒有「滑過去先看」：會動到不只一點時，第一下先畫出路線，再點一下才配／退
    if (e.pointerType !== "mouse" && armed !== node.id) {
      const many = allocated.has(node.id) ? removal(node).size > 1 : pathTo(node).length > 1;
      if (many) {
        armed = node.id;
        hover = null;
        setHover(node);
        showTip(node, e.clientX, e.clientY);
        return;
      }
    }
    armed = null;
    if (allocated.has(node.id)) {
      for (const id of removal(node)) allocated.delete(id);
    } else {
      const path = pathTo(node);
      if (!path.length) { flash("走不到那裡"); return; }
      for (const n of path) allocated.add(n.id);
    }
    hover = null;
    setHover(node);
    showTip(node, e.clientX, e.clientY);
  }

  function showTip(node, x, y) {
    const typeName = { small: "小點", notable: "核心", keystone: "基石", start: "起點", socket: "珠寶孔" }[node.type] || node.type;
    let action = "";
    const verb = armed === node.id ? "再點一下" : "點一下";
    if (node.type === "start") action = node.id === start.id ? "你的職業起點" : "別的職業的起點";
    else if (allocated.has(node.id)) {
      const n = preview.remove.size;
      action = "<span style='color:var(--red)'>" + verb + "退掉" + (n > 1 ? "（連帶 " + (n - 1) + " 點斷線的）" : "") + "</span>";
    } else {
      const path = [...preview.add].map(id => byId.get(id));
      action = path.length ? "<span style='color:var(--blue)'>" + verb + "配上（" + path.length + " 點）</span>"
        : "<span style='color:var(--quiet)'>從起點連不過來</span>";
      if (path.length > 1) {
        action += "<div style='margin-top:4px;color:var(--quiet)'>整條路加起來：</div>" +
          summarize(path).slice(0, 8).map(l => "<div class='line'>" + escapeHtml(l) + "</div>").join("");
      }
    }
    const color = node.type === "keystone" ? "var(--keystone)" : node.type === "notable" ? "var(--gold)" : node.type === "socket" ? "#c77dff" : "var(--text)";
    tip.style.padding = "";
    tip.style.border = "";
    tip.innerHTML = "<div class='name' style='color:" + color + "'>" + escapeHtml(node.name) + "</div>" +
      "<div class='type'>" + typeName + "</div>" +
      node.lines.map(l => "<div class='line'>" + escapeHtml(l) + "</div>").join("") +
      "<div class='action'>" + action + "</div>";
    tip.style.display = "block";
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.min(window.innerWidth - w - 8, x + 16) + "px";
    tip.style.top = Math.min(window.innerHeight - h - 8, y + 16) + "px";
  }
  function hideTip() { tip.style.display = "none"; }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
  function flash(text) {
    toast.textContent = text;
    toast.style.display = "block";
    clearTimeout(flash.timer);
    flash.timer = setTimeout(() => { toast.style.display = "none"; }, 2400);
  }

  // ---- 按鈕 ----
  async function copy(text, what) {
    const box = document.getElementById("codebox");
    try {
      await navigator.clipboard.writeText(text);
      flash(what + "已複製");
      box.style.display = "none";
    } catch (e) {
      // http 的網址沒辦法用剪貼簿 API：顯示出來讓玩家自己複製
      box.value = text;
      box.style.display = "block";
      box.focus();
      box.select();
      try { document.execCommand("copy"); flash(what + "已複製"); } catch (ignored) { flash("請自己複製下面的文字"); }
    }
  }
  document.getElementById("copyCode").addEventListener("click", () => copy(encodeCode(), "代碼"));
  document.getElementById("copyLink").addEventListener("click", () => copy(location.href.split("#")[0] + "#" + encodeCode() + gearSuffix(), "連結（含裝備）"));
  document.getElementById("paste").addEventListener("click", () => {
    const text = prompt("貼上代碼（或整個網址）");
    if (!text) return;
    const decoded = decodeCode(text.trim());
    if (!decoded) { flash("看不懂這個代碼"); return; }
    load(decoded);
    render();
    centerOn(start, view.scale);
  });
  document.getElementById("reset").addEventListener("click", () => {
    if (allocated.size && !confirm("清掉目前的規劃？")) return;
    allocated = new Set();
    render();
  });
  document.getElementById("fit").addEventListener("click", fit);
  document.getElementById("home").addEventListener("click", () => centerOn(start, Math.max(view.scale, 0.9)));
  document.getElementById("zoomIn").addEventListener("click", () => { const r = svg.getBoundingClientRect(); zoomAt(1.25, r.width / 2, r.height / 2); });
  document.getElementById("zoomOut").addEventListener("click", () => { const r = svg.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); });
  document.getElementById("search").addEventListener("input", e => {
    const q = e.target.value.trim().toLowerCase();
    search = new Set();
    if (q) for (const n of order) if (n.name.toLowerCase().includes(q) || n.lines.some(l => l.toLowerCase().includes(q))) search.add(n.id);
    document.getElementById("searchHint").textContent = q ? "找到 " + search.size + " 個（青色圈起來的）" : "";
    render();
  });
  window.addEventListener("hashchange", () => {
    if (items) { const next = gearText(hashText()); if (next !== gearSuffix().slice(1)) { gear = decodeGear(next); renderGear(); renderGearTotals(); } }
    const decoded = decodeCode(hashText());
    if (decoded && (decoded.classId !== classId || decoded.nodes.size !== allocated.size || [...decoded.nodes].some(id => !allocated.has(id)))) {
      load(decoded);
      render();
    }
  });
})();
</script>
</body>
</html>
